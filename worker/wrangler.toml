name = "provea-mistral-proxy"
main = "src/worker.js"
compatibility_date = "2024-06-01"

# Variables públicas — pueden ir aquí sin problema
[vars]
FIREBASE_PROJECT_ID = "pedidos-835a1"
# La Web API key de Firebase NO es secreta — ya está en el cliente.
# La usamos para verificar los ID tokens contra el endpoint accounts:lookup.
FIREBASE_API_KEY = "PON_AQUI_TU_WEB_API_KEY"
# Origen permitido por CORS — cámbialo si mueves el hosting.
ALLOWED_ORIGIN = "https://josuefunte-web.github.io"

# MISTRAL_API_KEY se añade como SECRET (NO aquí en claro):
#   wrangler secret put MISTRAL_API_KEY
# Cuando te lo pida, pega la clave. Queda cifrada en Cloudflare, invisible
# para todos incluyendo tú (solo se ve al Worker en runtime).
