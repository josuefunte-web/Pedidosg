<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="O'Carro">
<link rel="manifest" id="pwa-manifest">
<title>O'Carro — Pedidos</title>
<!-- Firebase -->
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.js"></script>
<!-- Charts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<!-- Excel export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --pri:#1a1a2e;--acc:#e94560;--grn:#25D366;--grnd:#1da851;
  --bg:#f0f2f5;--card:#fff;--brd:#e0e0e0;
  --txt:#222;--mut:#888;--r:12px;--sh:0 2px 14px rgba(0,0,0,.08);
  --srf:#f8fafc;
}
body.dark{
  --pri:#e94560;--acc:#ff6b8a;
  --bg:#0f0f1a;--card:#1a1a2e;--brd:#2d2d4e;
  --txt:#e8e8f0;--mut:#8888aa;--sh:0 2px 14px rgba(0,0,0,.4);
  --srf:#242442;
}
body.dark .hdr{background:#0a0a14}
body.dark .tab.act{background:#2d2d4e;color:#e8e8f0}
body.dark .tabs{background:#0f0f1a}
body.dark input,body.dark select,body.dark textarea{background:#2d2d4e;color:#e8e8f0;border-color:#3d3d5e}
body.dark .stab{background:#2d2d4e;color:#e8e8f0}
body.dark .stab.act{background:var(--pri);color:#fff}
body.dark .pi{background:#1a1a2e;border-color:#2d2d4e}
body.dark .pi.ic{border-color:var(--pri)}
body.dark .sidebar{background:#0a0a14;border-color:#2d2d4e}
body.dark .oc{background:#1a1a2e;border-color:#2d2d4e}
body.dark .stat{background:#1a1a2e;border-color:#2d2d4e}
body.dark .btn-ghost{border-color:#2d2d4e;color:#e8e8f0}
body.dark .banner{background:#2d2d4e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.hdr{background:var(--pri);color:#fff;height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:90;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo{font-size:17px;font-weight:800;letter-spacing:.3px;cursor:pointer}
.logo span{color:var(--acc)}
.hdr-r{display:flex;align-items:center;gap:6px}
.hbtn{background:rgba(255,255,255,.1);border:none;color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.hbtn:hover{background:rgba(255,255,255,.22)}
.hbtn.act{background:var(--acc)}
.ses-info{font-size:12px;opacity:.7;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;margin-right:4px;transition:.3s}
.fb-dot.on{background:#4ade80}
.main{max-width:860px;margin:0 auto;padding:18px 14px 90px}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.card-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:14px}
.tabs{display:flex;gap:3px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{flex:1;padding:8px 10px;border:none;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--mut);white-space:nowrap;min-width:fit-content;transition:.2s}
.tab.act{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:10px;padding:14px 10px;text-align:center;border:1.5px solid var(--brd)}
.sv{font-size:24px;font-weight:800;color:var(--pri)}
.sl{font-size:10px;color:var(--mut);margin-top:3px;text-transform:uppercase;letter-spacing:.3px}
.btn{padding:9px 15px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:.2s;white-space:nowrap}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:hover{background:#2d2d4e}
.btn-acc{background:var(--acc);color:#fff}.btn-acc:hover{opacity:.9}
.btn-ok{background:#dcfce7;color:#16a34a}.btn-ok:hover{background:#bbf7d0}
.btn-no{background:#fee2e2;color:#dc2626}.btn-no:hover{background:#fecaca}
.btn-wa{background:var(--grn);color:#fff}.btn-wa:hover{background:var(--grnd)}
.btn-ghost{background:transparent;border:1.5px solid var(--brd);color:var(--txt)}.btn-ghost:hover{background:var(--bg)}
.btn-blue{background:#dbeafe;color:#1d4ed8}.btn-blue:hover{background:#bfdbfe}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:6px}
.oc{border:1.5px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:10px}
.oc-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.oc-rest{font-size:15px;font-weight:700;color:var(--pri)}
.oc-sub{font-size:12px;color:var(--mut);margin-top:2px}
.oc-acts{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.b-p{background:#fef3c7;color:#d97706}.b-a{background:#dcfce7;color:#16a34a}.b-r{background:#fee2e2;color:#dc2626}.b-f{background:#dbeafe;color:#1d4ed8}.b-recv{background:#f3e8ff;color:#7c3aed}.b-urg{background:#dc2626;color:#fff;animation:urgpulse 1.2s ease-in-out infinite}
@keyframes urgpulse{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes spin{to{transform:rotate(360deg)}}
.pl{font-size:13px;border-top:1px solid var(--brd);padding-top:8px}
.pr{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #f0f0f0}
.pr:last-child{border:none}
.pn{flex:1;color:var(--txt)}.pq{font-weight:700;color:var(--pri);margin-left:10px}.pp{color:var(--mut);margin-left:8px;min-width:72px;text-align:right}
.ptot{display:flex;justify-content:flex-end;margin-top:8px;padding-top:7px;border-top:1.5px solid var(--brd);font-weight:800;font-size:15px;color:var(--pri)}
.fg{margin-bottom:13px}
label{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
select,input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date]{width:100%;padding:9px 12px;border:1.5px solid var(--brd);border-radius:8px;font-size:14px;background:#fff;color:var(--txt);outline:none;transition:border-color .2s}
select:focus,input:focus{border-color:var(--pri)}
.sup-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.stab{padding:7px 13px;border-radius:20px;border:1.5px solid var(--brd);background:#fff;font-size:13px;cursor:pointer;font-weight:600;transition:.2s}
.stab.act{background:var(--pri);color:#fff;border-color:var(--pri)}
.pgrid{display:grid;gap:7px}
.pi{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:11px 13px;border:1.5px solid var(--brd);border-radius:8px;background:#fff;gap:10px;transition:border-color .2s}
.pi.ic{border-color:var(--pri);background:#f5f5ff}
.pi-i{flex:1;min-width:0}.pi-n{font-size:14px;font-weight:500}.pi-p{font-size:12px;color:var(--mut);margin-top:2px}
.qc{display:flex;align-items:center;gap:8px}
.urow{width:100%;display:flex;gap:5px;margin-top:4px}
.ubt{padding:3px 9px;border-radius:6px;border:1.5px solid var(--brd);background:#fff;font-size:11px;font-weight:600;cursor:pointer;color:var(--mut);transition:.15s}
.ubt:hover{border-color:var(--pri);color:var(--pri)}
.ubt-on{border-color:var(--pri)!important;background:var(--pri)!important;color:#fff!important}
.qb{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--brd);background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--pri);transition:.2s;line-height:1}
.qb:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
.qd{min-width:28px;text-align:center;font-weight:800;font-size:15px}
.cbar{position:fixed;bottom:0;left:0;right:0;background:var(--pri);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;transform:translateY(100%);transition:transform .3s;z-index:200;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.cbar.up{transform:translateY(0)}
.cb-v{font-weight:700;font-size:16px}.cb-s{opacity:.7;font-size:12px;margin-top:1px}
.cc{border:1.5px solid #d1fae5;background:#f0fdf4;border-radius:10px;padding:14px;margin-bottom:10px}
.cc-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.cc-name{font-size:15px;font-weight:800;color:#166534}
.ch-wrap{position:relative;height:260px}
.sh{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
.empty{text-align:center;padding:48px 20px;color:var(--mut)}
.ei{font-size:44px;margin-bottom:10px}.et{font-size:14px}
.toast{position:fixed;top:62px;right:14px;background:#222;color:#fff;padding:10px 15px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:tin .3s ease;max-width:300px}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.pin-box{background:#fff;border-radius:18px;padding:28px 24px;width:100%;max-width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.pin-title{font-size:17px;font-weight:800;color:var(--pri);margin-bottom:4px}
.pin-sub{font-size:13px;color:var(--mut);margin-bottom:20px}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:20px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--brd);transition:.2s}
.dot.fill{background:var(--pri);border-color:var(--pri)}
.pin-err{color:#dc2626;font-size:13px;margin-bottom:12px;font-weight:600;display:none}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nk{background:var(--bg);border:none;border-radius:12px;height:52px;font-size:20px;font-weight:700;cursor:pointer;color:var(--pri);transition:.15s}
.nk:hover,.nk:active{background:#dde0e8;transform:scale(.95)}
.nk.ok{background:var(--pri);color:#fff}.nk.ok:hover{background:#2d2d4e}
.login-wrap{max-width:860px;margin:0 auto;padding:24px 14px}
.login-title{text-align:center;font-size:22px;font-weight:800;color:var(--pri);margin-bottom:4px}
.login-sub{text-align:center;font-size:14px;color:var(--mut);margin-bottom:24px}
.rest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.rest-card{background:#fff;border-radius:var(--r);padding:18px 14px;cursor:pointer;border:2px solid var(--brd);transition:.2s;text-align:center;box-shadow:var(--sh)}
.rest-card:hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.rest-emoji{font-size:28px;margin-bottom:8px}
.rest-name{font-size:13px;font-weight:700;color:var(--pri);line-height:1.3}
.admin-row{display:flex;justify-content:center;margin-top:10px}
.admin-btn{background:transparent;border:2px solid var(--pri);color:var(--pri);padding:10px 28px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;transition:.2s}
.admin-btn:hover{background:var(--pri);color:#fff}
.user-card,.sup-card{border:1.5px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff}
.uc-hd,.sc-hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.uc-name,.sc-name{font-size:15px;font-weight:700;color:var(--pri)}
.uc-info,.sc-info{font-size:12px;color:var(--mut);margin-top:2px}
.uc-acts,.sc-acts{display:flex;gap:6px}
.perm-editor{margin-top:12px;padding-top:12px;border-top:1px solid var(--brd)}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px;margin:10px 0}
.perm-check{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1.5px solid var(--brd);border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;user-select:none}
.perm-check input{width:15px;height:15px;accent-color:var(--pri);cursor:pointer;flex-shrink:0}
.perm-check:has(input:checked){border-color:var(--pri);background:#f5f5ff}
body.dark .user-card{background:var(--card)}
body.dark .perm-check:has(input:checked){background:#1a1a40}
.rest-pill{display:inline-block;background:var(--bg);border:1px solid var(--brd);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;margin:2px 2px 0 0}
.rest-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--srf);border-radius:10px;border:1.5px solid var(--brd)}
.rest-picker-lbl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;width:100%;margin-bottom:4px}
.uc-body,.sc-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--brd)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three-col{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.prod-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--brd);border-radius:7px;margin-bottom:6px;background:var(--bg)}
.prod-info{flex:1}.prod-name-t{font-size:13px;font-weight:600}.prod-meta{font-size:11px;color:var(--mut)}
.banner{background:#fffbeb;border:1.5px solid #fcd34d;border-radius:10px;padding:11px 14px;margin-bottom:12px;font-size:13px;color:#92400e;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.banner.blue{background:#eff6ff;border-color:#93c5fd;color:#1e40af}
.banner.red{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
.banner.green{background:#f0fdf4;border-color:#86efac;color:#166534}
.wa-ic{width:14px;height:14px;fill:currentColor;flex-shrink:0;margin-top:1px}
.wa-modal{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.wa-modal h3{font-size:17px;font-weight:800;color:var(--pri);margin-bottom:8px}
.wa-modal p{font-size:13px;color:var(--mut);margin-bottom:16px;line-height:1.5}
.wa-msg{background:var(--bg);border-radius:8px;padding:12px;font-size:12px;font-family:monospace;white-space:pre-wrap;margin-bottom:16px;max-height:200px;overflow-y:auto;color:var(--txt)}
.wa-modal-btns{display:flex;gap:8px;flex-wrap:wrap}
.alb-card{border:1.5px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff}
.alb-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.alb-rest{font-size:15px;font-weight:700;color:var(--pri)}
.alb-info{font-size:12px;color:var(--mut);margin-top:2px}
.alb-photo{width:100%;max-height:200px;object-fit:contain;border-radius:8px;margin-bottom:10px;border:1px solid var(--brd)}
.cmp-cell{padding:8px;border-radius:7px;font-size:12px;margin-bottom:6px}
.cmp-ok{background:#f0fdf4;border:1px solid #86efac}
.cmp-warn{background:#fef3c7;border:1px solid #fcd34d}
.cmp-err{background:#fef2f2;border:1px solid #fca5a5}
.cmp-name{font-weight:600;color:var(--pri)}.cmp-val{color:var(--mut);margin-top:2px}
.img-preview{width:100%;border-radius:10px;margin-bottom:12px;display:none;border:1px solid var(--brd)}
.ocr-progress{font-size:13px;color:var(--mut);text-align:center;padding:10px;display:none}
.item-entry{border:1.5px solid var(--brd);border-radius:8px;padding:12px;margin-bottom:8px;background:var(--bg);position:relative}
.item-del{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;font-size:16px;color:var(--mut)}
.item-del:hover{color:#dc2626}
.spend-table{width:100%;border-collapse:collapse;font-size:13px}
.spend-table th{background:var(--pri);color:#fff;padding:8px 10px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.spend-table td{padding:8px 10px;border-bottom:1px solid var(--brd)}
.spend-table tr:hover td{background:var(--bg)}
.diff-ok{color:#16a34a;font-weight:700}.diff-warn{color:#d97706;font-weight:700}.diff-err{color:#dc2626;font-weight:700}
.file-input-wrap{position:relative}
.file-input-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.file-input-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border:2px dashed var(--brd);border-radius:10px;color:var(--mut);font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.file-input-btn:hover{border-color:var(--pri);color:var(--pri);background:#f9f9ff}
/* Live indicator */
.live-badge{display:inline-flex;align-items:center;gap:5px;background:#dcfce7;color:#16a34a;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.pulse{width:7px;height:7px;border-radius:50%;background:#16a34a;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(max-width:480px){
  .two-col,.three-col{grid-template-columns:1fr}
  .ses-info{display:none}
}
/* ── SIDEBAR ADMIN LAYOUT ── */
.adm-layout{display:flex;height:calc(100vh - 56px);overflow:hidden}
.sidebar{width:210px;flex-shrink:0;background:var(--pri);color:#fff;overflow-y:auto;display:flex;flex-direction:column;z-index:88}
.sb-mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:6px}
.sb-ms{padding:10px 12px;text-align:center}
.sb-msv{font-size:18px;font-weight:800;line-height:1}
.sb-msl{font-size:10px;opacity:.6;text-transform:uppercase;letter-spacing:.3px;margin-top:3px}
.sg-hd{padding:10px 14px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;opacity:.55;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;transition:.15s}
.sg-hd:hover,.sg-hd.has-act{opacity:.9;background:rgba(255,255,255,.05)}
.sg-arrow{font-size:9px;transition:.2s}
.sg-direct{padding:11px 14px;font-size:13px;font-weight:600;cursor:pointer;opacity:.75;transition:.15s;display:flex;align-items:center;gap:8px}
.sg-direct:hover{opacity:1;background:rgba(255,255,255,.08)}
.sg-direct.act{opacity:1;background:rgba(255,255,255,.15);border-left:3px solid var(--acc);padding-left:11px}
.sg-item{padding:9px 14px 9px 32px;font-size:13px;cursor:pointer;opacity:.7;transition:.15s;display:flex;align-items:center;justify-content:space-between}
.sg-item:hover{opacity:1;background:rgba(255,255,255,.07)}
.sg-item.act{opacity:1;background:rgba(255,255,255,.15);font-weight:700;border-left:3px solid var(--acc);padding-left:29px}
.sb-badge{background:var(--acc);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800}
.adm-content{flex:1;overflow-y:auto;padding:16px;min-width:0;background:var(--bg)}
.sb-overlay{display:none;position:fixed;inset:0;top:56px;background:rgba(0,0,0,.45);z-index:87}
.hbtn-menu{display:none;background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:18px;align-items:center;justify-content:center}
@media(max-width:700px){
  .hbtn-menu{display:flex}

/* ═══════════════ FIREBASE LISTENERS ═══════════════ */
function initFirebaseListeners(){
  if(!fbDb) return;

  // Connection status
  fbDb.ref('.info/connected').on('value', snap => {
    fbConnected = snap.val() === true;
    const dot = document.getElementById('fb-dot');
    if(dot) dot.className = 'fb-dot' + (fbConnected ? ' on' : '');
  });

  // Orders — real-time sync
  let _lastOrderIds=null;
  fbDb.ref('orders').on('value', snap => {
    const val = snap.val();
    const newOrders = val ? Object.values(val).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)) : [];
    // Push notifications for new orders (admin) and status changes (restaurant)
    try{
      if(_lastOrderIds!==null){
        const oldIds=_lastOrderIds;
        newOrders.forEach(o=>{
          if(!oldIds.has(o.id)){
            if(S.session?.isAdmin) pushNotify(`Nuevo pedido — ${o.restaurant}`,`${(suppliers[o.supId]||{name:o.supId}).name} · ${fmt(total(o))}${o.urgent?' 🚨 URGENTE':''}`,o.urgent?'🚨':'🛒');
          } else {
            const old=orders.find(x=>x.id===o.id);
            const myRests=S.session?.restaurants||[S.session?.restaurant];
            if(old&&old.status!==o.status&&S.session&&!S.session.isAdmin&&myRests.includes(o.restaurant)){
              if(o.status==='approved') pushNotify('Pedido aprobado ✅',`Tu pedido a ${(suppliers[o.supId]||{name:o.supId}).name} ha sido aprobado`,'✅');
              else if(o.status==='rejected') pushNotify('Pedido rechazado ✗',o.rejectReason||'Contacta con el administrador','❌');
            }
          }
        });
      }
    }catch(e){ console.warn('Push notify error:',e); }
    _lastOrderIds=new Set(newOrders.map(o=>o.id));
    orders = newOrders;
    if(S.view==='admin') renderAdminContent();
    if(S.view==='order' && S.orderTab==='history') render();
  });

  // Suppliers — real-time sync
  fbDb.ref('suppliers').on('value', snap => {
    const val = snap.val();
    if(val){
      suppliers = val;
      localStorage.setItem('oc_suppliers', JSON.stringify(suppliers));
    }
    if(S.view==='order'||S.view==='albaran-new'){const _sv=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,_sv));}
  });

  // Albaranes — real-time sync
  fbDb.ref('albaranes').on('value', snap => {
    const val = snap.val();
    albNotes = val ? Object.values(val).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)) : [];
    if(S.view==='admin' && S.adminTab==='albaranes') renderAdminContent();
  });

  // Push default suppliers if DB is empty
  fbDb.ref('suppliers').once('value', snap => {
    if(!snap.val()){
      fbDb.ref('suppliers').set(DEFAULT_SUPS);
    }
  });

  // Revenue — food cost
  fbDb.ref('revenue').on('value', snap => {
    revenue = snap.val() || {};
    if(S.view==='admin' && S.adminTab==='foodcost') renderAdminContent();
  });
  // Budgets
  fbDb.ref('budgets').on('value', snap => {
    budgets = snap.val() || {};
    if(S.view==='admin' && S.adminTab==='budgets') renderAdminContent();
  });
  // Extra expenses (gastos manuales)
  fbDb.ref('extraExpenses').on('value', snap => {
    extraExpenses = snap.val() || {};
    if(S.view==='admin' && (S.adminTab==='spending'||S.adminTab==='monthly'||S.adminTab==='foodcost'||S.adminTab==='budgets')) renderAdminContent();
  });
  // Price history
  fbDb.ref('priceHistory').on('value', snap => {
    const val = snap.val();
    priceHistory = val ? Object.values(val).sort((a,b)=>new Date(b.changedAt)-new Date(a.changedAt)) : [];
  });
  // Templates
  fbDb.ref('templates').on('value', snap => {
    templates = snap.val() || {};
    if(S.view==='order'){const _sv=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,_sv));}
  });

  // Recetas — real-time sync
  fbDb.ref('recetas').on('value', snap => {
    _recAllData = snap.val() || {};
    if(S.view==='admin' && S.adminTab==='recetas') renderAdminContent();
  });

  // Auth users (registrations)
  fbDb.ref('authUsers').on('value', snap => {
    authUsers = snap.val() || {};
    if(S.view==='admin' && S.adminTab==='solicitudes') renderAdminContent();
    // Update sidebar badge
    const badge=document.getElementById('sb-sol-badge');
    if(badge){ const n=Object.values(authUsers).filter(u=>u.status==='pending').length; badge.textContent=n; badge.style.display=n?'':'none'; }
    // If current user just got approved/rejected, update their session
    if(S.session?.uid && !S.session?.isAdmin){
      const me=authUsers[S.session.uid];
      if(me && me.status==='approved' && S.view==='pending-approval'){
        const myRests=me.restaurants||[me.restaurant];
        S.session={uid:me.uid,email:me.email,name:me.name||me.restaurant,restaurant:myRests[0]||me.restaurant,restaurants:myRests,isAdmin:false,needsApproval:me.needsApproval!==false};
        goOrder();
        toast('✅ Tu acceso ha sido aprobado. ¡Bienvenido!','#16a34a',5000);
      } else if(me && me.status==='approved' && S.view==='order'){
        // Actualización en tiempo real de permisos (admin cambió accesos)
        const myRests=me.restaurants||[me.restaurant];
        const changed=JSON.stringify(myRests)!==JSON.stringify(S.session.restaurants||[]);
        if(changed){
          S.session.restaurants=myRests;
          // Si el restaurante activo ya no está permitido, cambiar al primero
          if(!myRests.includes(S.session.restaurant)) S.session.restaurant=myRests[0];
          S.session.needsApproval=me.needsApproval!==false;
          render();
        }
      } else if(me && me.status==='rejected' && S.view!=='pending-approval'){
        S.session={...S.session,pendingStatus:'rejected'};
        S.view='pending-approval';
        document.getElementById('hdr').style.display='none';
        render();
      }
    }
  });
}

/* ═══════════════ AUTH FUNCTIONS ═══════════════ */
async function loginWithEmail(){
  // Lazy init: si Firebase cargó pero fbAuth no se asignó, intentar de nuevo
  if(!fbAuth && typeof firebase !== 'undefined'){
    try{ fbApp=fbApp||firebase.initializeApp(FB_CONFIG); fbAuth=firebase.auth(); fbDb=fbDb||firebase.database(); }catch(e){}
  }
  if(!fbAuth){
    toast('Sin conexión. Comprueba tu internet y recarga la página.','#dc2626',7000);return;
  }
  const email=(document.getElementById('login-email')?.value||'').trim();
  const pass=document.getElementById('login-pass')?.value||'';
  const errEl=document.getElementById('login-err');
  const showErr=msg=>{if(errEl){errEl.textContent=msg;errEl.style.display='block';}else toast(msg,'#dc2626');};
  if(!email||!pass){showErr('Introduce email y contraseña');return;}
  // Disable button to prevent double-click
  const btn=document.querySelector('#app .btn-pri');
  if(btn){btn.disabled=true;btn.textContent='Entrando...';}
  try{
    await fbAuth.signInWithEmailAndPassword(email,pass);
    // onAuthStateChanged handles navigation
  }catch(e){
    const msgs={'auth/user-not-found':'Usuario no encontrado','auth/wrong-password':'Contraseña incorrecta','auth/invalid-email':'Email no válido','auth/too-many-requests':'Demasiados intentos. Espera unos minutos.','auth/invalid-credential':'Email o contraseña incorrectos'};
    showErr(msgs[e.code]||e.message);
    if(btn){btn.disabled=false;btn.textContent='Entrar →';}
  }
}

async function registerUser(){
  if(!fbAuth && typeof firebase !== 'undefined'){
    try{ fbApp=fbApp||firebase.initializeApp(FB_CONFIG); fbAuth=firebase.auth(); fbDb=fbDb||firebase.database(); }catch(e){}
  }
  if(!fbAuth){toast('Sin conexión. Comprueba tu internet y recarga la página.','#dc2626',7000);return;}
  const email=(document.getElementById('reg-email')?.value||'').trim();
  const pass=document.getElementById('reg-pass')?.value||'';
  const pass2=document.getElementById('reg-pass2')?.value||'';
  const rest=document.getElementById('reg-rest')?.value||'';
  const name=(document.getElementById('reg-name')?.value||'').trim();
  const errEl=document.getElementById('reg-err');
  const showErr=msg=>{if(errEl){errEl.textContent=msg;errEl.style.display='block';}else toast(msg,'#dc2626');};
  if(errEl) errEl.style.display='none';
  if(!email||!pass){showErr('Rellena todos los campos obligatorios');return;}
  if(pass.length<6){showErr('La contraseña debe tener al menos 6 caracteres');return;}
  if(pass!==pass2){showErr('Las contraseñas no coinciden');return;}
  if(!rest){showErr('Selecciona tu restaurante');return;}
  const btn=document.querySelector('#app .btn-pri');
  if(btn){btn.disabled=true;btn.textContent='Enviando...';}
  try{
    const cred=await fbAuth.createUserWithEmailAndPassword(email,pass);
    await fbDb.ref('authUsers/'+cred.user.uid).set({
      uid:cred.user.uid,email,name:name||email,restaurant:rest,
      status:'pending',needsApproval:true,
      createdAt:new Date().toISOString()
    });
    toast('✅ Solicitud enviada. '+cfg.adminName+' la revisará pronto.','#16a34a',6000);
    // onAuthStateChanged → pending-approval screen
  }catch(e){
    const msgs={'auth/email-already-in-use':'Este email ya está registrado','auth/invalid-email':'Email no válido','auth/weak-password':'Contraseña demasiado débil (mín. 6 caracteres)'};
    showErr(msgs[e.code]||e.message);
    if(btn){btn.disabled=false;btn.textContent='Solicitar acceso';}
  }
}

function doResetPassword(){
  const email=(document.getElementById('login-email')?.value||'').trim();
  if(!email){toast('Introduce tu email primero en el campo de arriba','#dc2626');return;}
  if(!fbAuth){toast('Sin conexión','#dc2626');return;}
  fbAuth.sendPasswordResetEmail(email)
    .then(()=>toast('📧 Email de recuperación enviado a '+email,'#16a34a',5000))
    .catch(e=>toast('Error: '+e.message,'#dc2626'));
}

function vSolicitudes(){
  const all=Object.values(authUsers);
  const pending=all.filter(u=>u.status==='pending').sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  const approved=all.filter(u=>u.status==='approved').sort((a,b)=>(a.restaurant||'').localeCompare(b.restaurant||'','es'));
  const rejected=all.filter(u=>u.status==='rejected');
  const allRests=cfg.users.map(u=>u.restaurant);

  const pendHtml=pending.length?pending.map(u=>`
    <div class="user-card">
      <div class="uc-hd">
        <div>
          <div class="uc-name">📧 ${u.email}</div>
          <div class="uc-info">🏪 ${u.restaurant}${u.name&&u.name!==u.email?' · '+u.name:''} · ${fmtD(u.createdAt)}</div>
        </div>
        <div class="uc-acts" style="flex-wrap:wrap;gap:4px">
          <button class="btn btn-ok btn-sm" onclick="approveRegistration('${u.uid}')">✅ Aprobar</button>
          <button class="btn btn-no btn-sm" onclick="rejectRegistration('${u.uid}')">✗ Rechazar</button>
        </div>
      </div>
    </div>`).join('')
    :`<div class="empty" style="padding:28px 20px"><div class="ei">✅</div><div class="et">Sin solicitudes pendientes</div></div>`;

  function permEditor(u){
    const curRests=u.restaurants||[u.restaurant];
    const checks=allRests.map(r=>`
      <label class="perm-check">
        <input type="checkbox" class="perm-cb-${u.uid}" value="${r}" ${curRests.includes(r)?'checked':''}>
        ${r}
      </label>`).join('');
    return `<div class="perm-editor">
      <div style="font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">🏪 Locales con acceso</div>
      <div class="perm-grid">${checks}</div>
      <div style="display:flex;gap:8px;margin-top:6px">
        <button class="btn btn-pri btn-sm" onclick="saveUserRestaurants('${u.uid}')">💾 Guardar permisos</button>
        <button class="btn btn-ghost btn-sm" onclick="S.editingPermsUid=null;render()">Cancelar</button>
      </div>
    </div>`;
  }

  function restBadges(u){
    const rests=u.restaurants||[u.restaurant];
    return rests.map(r=>`<span class="rest-pill">${r}</span>`).join('');
  }

  const apprHtml=approved.length?`
    <div class="sh" style="margin-top:20px">Usuarios activos (${approved.length})</div>
    ${approved.map(u=>{
      const isEditing=S.editingPermsUid===u.uid;
      return `
      <div class="user-card" style="${isEditing?'border-color:var(--pri);box-shadow:0 0 0 2px rgba(26,26,46,.12)':''}">
        <div class="uc-hd">
          <div style="flex:1;min-width:0">
            <div class="uc-name">📧 ${u.email}${u.name&&u.name!==u.email?` <span style="font-weight:400;font-size:13px;color:var(--mut)">· ${u.name}</span>`:''}</div>
            <div class="uc-info" style="margin-top:4px">${restBadges(u)} · ${u.needsApproval?'🔒 Aprobación manual':'🔓 Auto-aprobado'}</div>
          </div>
          <div class="uc-acts" style="flex-wrap:wrap;gap:4px">
            <button class="btn btn-blue btn-sm" onclick="S.editingPermsUid='${isEditing?'':u.uid}';render()">✏️ ${isEditing?'Cerrar':'Permisos'}</button>
            <button class="btn btn-ghost btn-sm" title="${u.needsApproval?'Cambiar a auto-aprobado':'Cambiar a requiere aprobación'}" onclick="toggleNeedsApprovalAuth('${u.uid}',${!u.needsApproval})">${u.needsApproval?'🔓 Auto':'🔒 Manual'}</button>
            <button class="btn btn-no btn-xs" title="Revocar acceso" onclick="revokeUser('${u.uid}')">🚫</button>
          </div>
        </div>
        ${isEditing?permEditor(u):''}
      </div>`}).join('')}`:'';

  const rejHtml=rejected.length?`
    <div class="sh" style="margin-top:20px">Rechazados (${rejected.length})</div>
    ${rejected.map(u=>`
    <div class="user-card" style="opacity:.55">
      <div class="uc-hd">
        <div>
          <div class="uc-name" style="text-decoration:line-through">📧 ${u.email}</div>
          <div class="uc-info">🏪 ${u.restaurant}</div>
        </div>
        <div class="uc-acts">
          <button class="btn btn-ok btn-xs" onclick="approveRegistration('${u.uid}')">↩ Re-aprobar</button>
        </div>
      </div>
    </div>`).join('')}`:'';

  const pendingBadge=pending.length?`<span style="background:var(--acc);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:800;margin-left:6px">${pending.length}</span>`:'';
  return `<div class="sh">Solicitudes de acceso${pendingBadge}</div>${pendHtml}${apprHtml}${rejHtml}`;
}

function approveRegistration(uid){
  const u=authUsers[uid]; if(!u)return;
  const updates={status:'approved',approvedAt:new Date().toISOString(),approvedBy:cfg.adminName};
  if(!u.restaurants||!u.restaurants.length) updates.restaurants=[u.restaurant];
  fbDb.ref('authUsers/'+uid).update(updates)
    .then(()=>toast('✅ Acceso concedido: '+u.email,'#16a34a'));
}
function rejectRegistration(uid){
  const u=authUsers[uid]; if(!u)return;
  const reason=prompt('Motivo del rechazo (opcional):');
  if(reason===null)return;
  fbDb.ref('authUsers/'+uid).update({status:'rejected',rejectedAt:new Date().toISOString(),rejectReason:reason||''})
    .then(()=>toast('Usuario rechazado','#888'));
}
function toggleNeedsApprovalAuth(uid,val){
  fbDb.ref('authUsers/'+uid).update({needsApproval:val})
    .then(()=>toast(val?'Ahora requiere aprobación manual':'Ahora se aprueba automáticamente','#16a34a'));
}
function revokeUser(uid){
  const u=authUsers[uid]; if(!u)return;
  if(!confirm('¿Revocar acceso a '+u.email+'? El usuario no podrá entrar.'))return;
  fbDb.ref('authUsers/'+uid).update({status:'rejected',revokedAt:new Date().toISOString()})
    .then(()=>toast('Acceso revocado','#888'));
}
function saveUserRestaurants(uid){
  const boxes=document.querySelectorAll(`.perm-cb-${uid}`);

  const u=authUsers[uid]; if(!u)return;
  // Primary restaurant = first checked (or keep original if still in list)
  const primary=selected.includes(u.restaurant)?u.restaurant:selected[0];

}

function openPIN(type,userId){
  S.pinTarget={type,userId};S.pinBuf='';
  const u=type==='user'?cfg.users.find(u=>u.id===userId):null;
  document.getElementById('pin-title').textContent=type==='admin'?'Administrador':(u?u.restaurant:'PIN');
  document.getElementById('pin-sub').textContent=type==='admin'?'PIN de administrador':'Introduce tu PIN';
  document.getElementById('pin-err').style.display='none';
  updateDots();
  document.getElementById('pin-ov').style.display='flex';
}
function closePIN(){ document.getElementById('pin-ov').style.display='none';S.pinBuf=''; }
function addPIN(d){ if(S.pinBuf.length>=4)return;S.pinBuf+=d;updateDots();if(S.pinBuf.length===4)setTimeout(confirmPIN,120); }
function delPIN(){ S.pinBuf=S.pinBuf.slice(0,-1);updateDots(); }
function updateDots(){
  for(let i=0;i<4;i++) document.getElementById('d'+i).className='dot'+(i<S.pinBuf.length?' fill':'');
  document.getElementById('pin-err').style.display='none';
}
function confirmPIN(){
  const {type,userId}=S.pinTarget;
  if(type==='admin'){
    if(S.pinBuf===cfg.adminPIN){closePIN();S.session={isAdmin:true,name:cfg.adminName};goAdmin();}
    else wrong();
  } else {
    const u=cfg.users.find(u=>u.id===userId);
    if(u&&S.pinBuf===u.pin){closePIN();S.session={userId:u.id,name:u.name,restaurant:u.restaurant,isAdmin:false,needsApproval:u.needsApproval};goOrder();}
    else wrong();
  }
}
function wrong(){ S.pinBuf='';updateDots();const e=document.getElementById('pin-err');e.style.display='block';setTimeout(()=>e.style.display='none',2000); }
document.addEventListener('keydown',e=>{
  if(document.getElementById('pin-ov').style.display==='none') return;
  if(e.key>='0'&&e.key<='9') addPIN(e.key);
  else if(e.key==='Backspace') delPIN();
  else if(e.key==='Enter') confirmPIN();
});

  const vacBanner=_vacUser&&_vacUser.vacaciones?'<div class="banner" style="background:#fef3c7;border-color:#f59e0b;color:#92400e">🌴 Modo vacaciones activo — los pedidos están desactivados temporalmente</div>':'';
  const stabs=sups.map(s=>{const sc2=S.cart[s.id]||{};const n=Object.values(sc2).reduce((a,v)=>a+v,0);return `<button class="stab ${S.supId===s.id?'act':''}" onclick="setSup('${s.id}')">${s.emoji} ${s.name}${n>0?` <span style="background:#3b82f6;color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;font-weight:700">${n}</span>`:''}</button>`;}).join('');
  const searchTerm=(S.prodSearch||'').toLowerCase().trim();

  myHistory.forEach(o=>(o.items||[]).forEach(it=>{if(!autoSuggest[it.id])autoSuggest[it.id]={...it,count:0,totalQty:0};autoSuggest[it.id].count++;autoSuggest[it.id].totalQty+=it.qty;}));
  const topProds=Object.values(autoSuggest).sort((a,b)=>b.count-a.count).slice(0,5);
  const autoBtn=topProds.length&&!Object.keys(S.cart[S.supId]||{}).length?`<button class="btn btn-blue btn-sm" onclick="loadAutoSuggest()" style="white-space:nowrap">🤖 Pedido típico</button>`:'';
  // Recurring templates
  const _today=new Date();
  const _todayWD=_today.getDay();
  const _todayDOM=_today.getDate();
  const _todayKey=_today.toISOString().split('T')[0];
  const _myTplsAll=Object.values(templates[S.session.userId]||{});
  const _recurringDue=_myTplsAll.filter(t=>{
    if(!t.recurrence||t.recurrence.type==='none') return false;
    if(t.lastAutoDate===_todayKey) return false;
    if(t.recurrence.type==='weekly') return _todayWD===t.recurrence.weekday;
    if(t.recurrence.type==='monthly') return _todayDOM===t.recurrence.dayOfMonth;
    return false;
  });
  const recurringBanner=_recurringDue.length?`<div class="banner blue" style="margin-bottom:10px">

    </div>`).join('')}

  const tplSection=`<div class="sh" style="margin-top:4px">Plantillas</div>

      <div style="display:flex;gap:6px"><input type="text" id="tpl-name" placeholder="Nombre de la plantilla..." style="flex:1;padding:6px 10px;border:1px solid var(--brd);border-radius:6px;font-size:13px"/></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <select id="tpl-recur" style="padding:6px;border:1px solid var(--brd);border-radius:6px;font-size:13px;background:var(--card);color:var(--txt)">

        <select id="tpl-recur-day" style="padding:6px;border:1px solid var(--brd);border-radius:6px;font-size:13px;background:var(--card);color:var(--txt)">

          ${Array.from({length:28},(_,i)=>`<option value="d${i+1}">${i+1} de cada mes</option>`).join('')}
        </select>
        <button class="btn btn-pri btn-sm" onclick="saveTpl()">Guardar</button>
      </div>
    </div>`:''}`;
  return `<div class="main">
    ${tabsHtml}${restPickerHtml}${note}
    ${vacBanner}
    ${recurringBanner}
    ${tplSection}
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 0 6px">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 14px;border-radius:10px;border:2px solid ${S.orderUrgent?'#dc2626':'var(--brd)'};background:${S.orderUrgent?'#fff1f2':'var(--card)'};transition:.2s">
        <input type="checkbox" id="ord-urg" ${S.orderUrgent?'checked':''} onchange="S.orderUrgent=this.checked;render()" style="width:16px;height:16px;accent-color:#dc2626">
        <span style="font-weight:700;font-size:13px;color:${S.orderUrgent?'#dc2626':'var(--txt)'}">🚨 Urgente</span>
      </label>
      <div style="flex:1;min-width:160px">
        <label style="font-size:11px;color:var(--mut);display:block;margin-bottom:3px">📅 Entrega deseada</label>
        <input type="date" value="${S.orderDeliveryDate||''}" onchange="S.orderDeliveryDate=this.value" style="padding:7px 10px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;width:100%;background:var(--card);color:var(--txt)">
      </div>
    </div>
    <div class="sh">Proveedor</div>
    <div class="sup-tabs">${stabs}</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <div class="sh" style="margin:0;flex:1">Productos — ${sup.emoji} ${sup.name}</div>
      <input type="text" id="prod-search-inp" placeholder="🔍 Buscar producto..." value="${S.prodSearch||''}" oninput="filterProds(this.value)" style="padding:6px 10px;border:1.5px solid var(--brd);border-radius:8px;font-size:12px;width:180px;background:var(--card);color:var(--txt)">
    </div>
    <div id="prod-grid-wrap">${filteredProds.length?`<div class="pgrid">${prods}</div>`:`<div class="empty"><div class="ei">🔍</div><div class="et">Sin resultados para "${S.prodSearch}"</div></div>`}</div>
    <div style="margin-top:10px">
      <button class="btn btn-ghost btn-sm" onclick="S.showAddProd=!S.showAddProd;render()" style="width:100%;justify-content:center">
        ${S.showAddProd?'✕ Cancelar':'➕ Añadir producto que falta'}
      </button>
      ${S.showAddProd?`<div style="background:var(--srf);border:1.5px solid var(--brd);border-radius:10px;padding:14px;margin-top:8px">
        <div style="font-size:12px;font-weight:600;color:var(--mut);margin-bottom:10px">Nuevo producto para ${sup.emoji} ${sup.name}</div>
        <div style="display:grid;grid-template-columns:1fr 80px 90px;gap:8px;margin-bottom:10px">
          <div><label style="font-size:11px;color:var(--mut);display:block;margin-bottom:3px">Nombre</label>
            <input type="text" id="lp-name" placeholder="Ej: Lomo ibérico" style="width:100%;padding:7px 10px;border:1.5px solid var(--brd);border-radius:7px;font-size:13px;background:var(--card);color:var(--txt);box-sizing:border-box"/></div>

            <select id="lp-unit" style="width:100%;padding:7px 6px;border:1.5px solid var(--brd);border-radius:7px;font-size:13px;background:var(--card);color:var(--txt)">

function vMyOrders(){
  const myRests=S.session.restaurants||[S.session.restaurant];
  // When filtering history: show orders for the active restaurant (if picker used) or all allowed restaurants
  const filterRest=myRests.length>1?S.session.restaurant:S.session.restaurant;
  const mine=orders.filter(o=>o.restaurant===filterRest)
    .sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(!mine.length) return `<div class="empty"><div class="ei">📋</div><div class="et">Aún no has hecho ningún pedido</div></div>`;
  return mine.map(o=>{
    const sup=suppliers[o.supId]||{name:'?',emoji:'?'};
    const tot=total(o);
    const sMap={
      pending: {cls:'b-p', lbl:'⏳ Pendiente de aprobación'},
      approved:{cls:'b-a', lbl:'✅ Aprobado'},
      rejected:{cls:'b-r', lbl:'✗ Rechazado'},
      received:{cls:'b-recv',lbl:'📦 Recibido'}
    };
    const s=sMap[o.status]||{cls:'b-p',lbl:o.status};
    const modTag=o.modifiedByAdmin?`<span class="badge b-f" style="margin-left:6px">✏️ Modificado</span>`:'';
    const urgTag=o.urgent?`<span class="badge b-urg" style="margin-left:6px">🚨 URGENTE</span>`:'';
    const delTag=o.deliveryDate?`<span style="font-size:11px;color:var(--mut);margin-left:6px">📅 Entrega: ${o.deliveryDate}</span>`:'';
    const rows=(o.items||[]).map(it=>`<div class="pr"><span class="pn">${it.name||'?'}</span><span class="pq">${it.qty} ${it.unit||''}</span><span class="pp">${fmt((it.qty||0)*(it.price||0))}</span></div>`).join('');
    const rejNote=o.status==='rejected'&&o.rejectReason?`<div class="banner red" style="margin-top:8px">💬 ${o.rejectReason}</div>`:'';
    const recvBtn=o.status==='approved'?`<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="markReceived('${o.id}')">📦 Confirmar recepción</button>`:'';
    return `<div class="oc" ${o.urgent?'style="border-color:#dc2626"':''}>
      <div class="oc-hd">
        <div>
          <div class="oc-rest">${sup.emoji} ${sup.name}${modTag}${urgTag}</div>
          <div class="oc-sub">${fmtD(o.createdAt||'')} · <span class="badge ${s.cls}">${s.lbl}</span>${delTag}</div>
        </div>
      </div>
      <div class="pl">${rows}<div class="ptot">Total: ${fmt(tot)}</div></div>
      ${rejNote}${recvBtn}
    </div>`;
  }).join('');
}

/* ═══════════════ LOCAL GASTOS ═══════════════ */
function vLocalGastos(){
  const rest=S.session.restaurant;
  const now=new Date();
  const curKey=now.toISOString().slice(0,7); // 'YYYY-MM'
  const monthName=now.toLocaleString('es-ES',{month:'long',year:'numeric'});

  // Pedidos del mes (aprobados + recibidos)
  const monthOrders=orders.filter(o=>o.restaurant===rest&&(o.status==='approved'||o.status==='received')&&(o.createdAt||'').startsWith(curKey));
  const monthTotal=monthOrders.reduce((s,o)=>s+total(o),0);

  // Desglose por proveedor con productos
  const bySupMap={};
  monthOrders.forEach(o=>{
    if(!bySupMap[o.supId]){const sup=suppliers[o.supId]||{};bySupMap[o.supId]={name:sup.name||o.supId,emoji:sup.emoji||'🏭',total:0,orders:0,prods:{}};}
    bySupMap[o.supId].total+=total(o);
    bySupMap[o.supId].orders++;
    (o.items||[]).forEach(it=>{
      if(!bySupMap[o.supId].prods[it.id]) bySupMap[o.supId].prods[it.id]={name:it.name,unit:it.unit,price:it.price,qty:0,cost:0};
      bySupMap[o.supId].prods[it.id].qty+=it.qty;
      bySupMap[o.supId].prods[it.id].cost+=(it.qty||0)*(it.price||0);
    });
  });
  const bySupList=Object.values(bySupMap).sort((a,b)=>b.total-a.total);
  if(!S.gastoExpanded) S.gastoExpanded={};

  const gastoHtml=monthTotal>0?`
    <div style="background:linear-gradient(135deg,var(--pri),#3b82f6);color:#fff;border-radius:14px;padding:20px;margin-bottom:16px;text-align:center">
      <div style="font-size:13px;opacity:.85;margin-bottom:4px">Gasto en ${monthName}</div>
      <div style="font-size:32px;font-weight:800">${fmt(monthTotal)}</div>
      <div style="font-size:12px;opacity:.75;margin-top:4px">${monthOrders.length} pedido${monthOrders.length!==1?'s':''}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">
      ${bySupList.map(s=>{
        const pct=monthTotal>0?Math.round(s.total/monthTotal*100):0;
        const supId=Object.keys(bySupMap).find(k=>bySupMap[k]===s);
        const expanded=S.gastoExpanded[supId];
        const prodRows=Object.values(s.prods).sort((a,b)=>b.cost-a.cost).map(p=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--brd);font-size:12px">
            <span style="color:var(--txt)">${p.name} <span style="color:var(--mut)">(${p.qty} ${p.unit})</span></span>
            <span style="font-weight:600">${fmt(p.cost)}</span>
          </div>`).join('');
        return `<div style="background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px 14px;cursor:pointer" onclick="S.gastoExpanded['${supId}']=!S.gastoExpanded['${supId}'];render()">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-weight:600">${s.emoji} ${s.name}</span>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-weight:700;color:var(--pri)">${fmt(s.total)}</span>
              <span style="font-size:12px;color:var(--mut)">${expanded?'▲':'▼'}</span>
            </div>
          </div>
          <div style="background:var(--brd);border-radius:4px;height:6px">
            <div style="background:var(--pri);border-radius:4px;height:6px;width:${pct}%"></div>
          </div>
          <div style="font-size:11px;color:var(--mut);margin-top:4px">${pct}% del total · ${s.orders} pedido${s.orders!==1?'s':''}</div>
          ${expanded?`<div style="margin-top:8px">${prodRows}</div>`:''}
        </div>`;
      }).join('')}
    </div>`
  :`<div class="empty" style="margin-bottom:20px"><div class="ei">📊</div><div class="et">Sin pedidos aprobados en ${monthName}</div></div>`;

  // Comparador de precios
  const sups=visibleSups();
  const search=(S.precioSearch||'').toLowerCase().trim();

  // Colectar todos los productos de todos los proveedores visibles
  const prodMap={}; // normName -> [{supId, supName, supEmoji, price, unit, origName}]
  sups.forEach(s=>{
    (s.products||[]).forEach(p=>{
      const norm=p.name.toLowerCase().trim();
      if(!prodMap[norm]) prodMap[norm]=[];
      prodMap[norm].push({supId:s.id,supName:s.name,supEmoji:s.emoji,price:p.price,unit:p.unit,origName:p.name});
    });
  });

  // Solo mostrar productos que aparecen en >1 proveedor O que coincidan con búsqueda
  let entries=Object.entries(prodMap);
  if(search) entries=entries.filter(([norm])=>norm.includes(search));
  else entries=entries.filter(([,list])=>list.length>1);
  entries.sort(([a],[b])=>a.localeCompare(b,'es'));

  const comparadorHtml=`
    <div class="sh">Comparador de precios</div>
    <div style="font-size:12px;color:var(--mut);margin-bottom:10px">Productos disponibles en varios proveedores. El más barato aparece destacado.</div>
    <div style="position:relative;margin-bottom:12px">
      <input type="text" placeholder="🔍 Buscar producto..." value="${S.precioSearch||''}"
        oninput="S.precioSearch=this.value;render()"
        style="width:100%;padding:9px 12px;border:1.5px solid var(--brd);border-radius:8px;font-size:14px;background:var(--card);color:var(--txt);box-sizing:border-box"/>
    </div>
    ${entries.length?entries.map(([norm,list])=>{
      const sorted=[...list].sort((a,b)=>a.price-b.price);
      const minPrice=sorted[0].price;
      return `<div style="background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px 14px;margin-bottom:8px">
        <div style="font-weight:600;margin-bottom:8px;text-transform:capitalize">${sorted[0].origName}</div>
        ${sorted.map((p,i)=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;${i<sorted.length-1?'border-bottom:1px solid var(--brd)':''}">
            <span style="font-size:13px">${p.supEmoji} ${p.supName}</span>
            <span style="display:flex;align-items:center;gap:6px">
              <span style="font-weight:700;color:${p.price===minPrice?'#16a34a':'var(--txt)'}">${fmt(p.price)}<span style="font-size:11px;font-weight:400;color:var(--mut)"> / ${p.unit}</span></span>
              ${p.price===minPrice&&list.length>1?'<span style="background:#dcfce7;color:#15803d;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px">🏆 MEJOR PRECIO</span>':''}
            </span>
          </div>`).join('')}
      </div>`;
    }).join(''):`<div class="empty"><div class="ei">🔍</div><div class="et">${search?'Sin resultados para "'+search+'"':'Sin productos en varios proveedores'}</div></div>`}`;

  return gastoHtml+comparadorHtml;
}

  const appr=orders.filter(o=>o.status==='approved');

  const pendingSol=Object.values(authUsers).filter(u=>u.status==='pending').length;

      ? `<span class="sb-badge" id="sb-pend-badge" style="${pend.length?'':'display:none'}">${pend.length}</span>`
      : badgeId==='sb-sol-badge'
      ? `<span class="sb-badge" id="sb-sol-badge" style="${pendingSol?'':'display:none'}">${pendingSol}</span>`

    return `<div class="sg-item${act?' act':''}" onclick="setTabSb('${id}')"><span>${lbl}</span>${badge}</div>`;
  }
  function grpHd(g,emoji,lbl){
    const open=S.sbGroups[g];

    return `<div class="sg-hd${hasAct&&!open?' has-act':''}" onclick="toggleSbGroup('${g}')"><span>${emoji} ${lbl}</span><span class="sg-arrow">${open?'▲':'▼'}</span></div>`;
  }

  const sidebar=`<div class="sidebar${S.sidebarOpen?' sb-open':''}">
    <div class="sb-mini-stats" id="sb-stats">${buildSbStats(pend,appr)}</div>
    ${grpHd('pedidos','📦','Pedidos')}
    ${S.sbGroups.pedidos?`
      ${sbItem('pending','Pendientes','sb-pend-badge')}
      ${sbItem('approved','Aprobados')}
      ${sbItem('consolidated','Consolidado')}
      ${sbItem('received','📦 Recibidos')}
    `:''}
    ${grpHd('analisis','📊','Análisis')}
    ${S.sbGroups.analisis?`
      ${sbItem('spending','Gasto por local')}
      ${sbItem('monthly','Comparativa mensual')}
      ${sbItem('foodcost','Food Cost')}
      ${sbItem('budgets','Presupuestos')}
      ${sbItem('compare','Comparar precios')}
      ${sbItem('prices','Historial precios')}
      ${sbItem('sup-history','Por proveedor')}
    `:''}
    <div class="sg-direct${S.adminTab==='albaranes'?' act':''}" onclick="setTabSb('albaranes')">📋 Albaranes</div>
    ${grpHd('gestion','⚙️','Gestión')}
    ${S.sbGroups.gestion?`
      ${sbItem('solicitudes','👥 Solicitudes','sb-sol-badge')}
      ${sbItem('users','Usuarios')}
      ${sbItem('suppliers','Proveedores')}
      ${sbItem('settings','Configuración')}
      ${sbItem('escandallos','🧮 Escandallos')}
      ${sbItem('recetas','📋 Recetas')}
    `:''}
  </div>`;

  let content='';
  if(S.adminTab==='pending')        content=vPending();
  else if(S.adminTab==='approved')  content=vApproved();
  else if(S.adminTab==='consolidated') content=vConsolidated();
  else if(S.adminTab==='received')  content=vReceived();
  else if(S.adminTab==='spending')  content=`<div class="card"><div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn btn-ghost btn-sm" onclick="window.print()">🖨️ Imprimir</button></div><div class="ch-wrap"><canvas id="chart"></canvas></div></div>`;
  else if(S.adminTab==='monthly')   content=vMonthly();
  else if(S.adminTab==='foodcost')  content=vFoodCost();
  else if(S.adminTab==='budgets')   content=vBudgets();
  else if(S.adminTab==='compare')   content=vCompare();
  else if(S.adminTab==='prices')    content=vPriceHistory();
  else if(S.adminTab==='albaranes') content=vAlbaranes();
  else if(S.adminTab==='solicitudes') content=vSolicitudes();
  else if(S.adminTab==='users')     content=vUsers();
  else if(S.adminTab==='suppliers') content=vSuppliers();
  else if(S.adminTab==='settings')  content=vSettings();
  else if(S.adminTab==='escandallos') content=vEscandallos();
  else if(S.adminTab==='recetas') content=vRecetas();
  else if(S.adminTab==='sup-history') content=vSupHistory();

  const liveTag=fbConnected?`<span class="live-badge"><span class="pulse"></span>EN VIVO</span>`:'';

  return `<div class="adm-layout">
    ${sidebar}
    <div class="sb-overlay${S.sidebarOpen?' sb-open':''}" onclick="S.sidebarOpen=false;render()"></div>
    <div class="adm-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:13px;font-weight:700;color:var(--pri)">Panel de compras</div>${liveTag}
      </div>
      <div id="tc">${content}</div>
    </div>
  </div>`;
}

function orderCard(o,showActions){
  const sup=suppliers[o.supId]||{name:'?',emoji:'?',phone:''};
  const isEditing=S.editOrderId===o.id;
  const editItems=isEditing?S.editItems:(o.items||[]);
  const tot=(editItems||[]).reduce((s,it)=>s+(parseFloat(it.qty)||0)*(parseFloat(it.price)||0),0);
  const bc={pending:'b-p',approved:'b-a',rejected:'b-r',received:'b-recv'}[o.status]||'b-p';
  const bl={pending:'Pendiente',approved:'Aprobado',rejected:'Rechazado',received:'✔ Recibido'}[o.status]||o.status;
  const modTag=o.modifiedByAdmin?` <span class="badge b-f">✏️ Modificado</span>`:'';
  const urgTag=o.urgent?` <span class="badge b-urg">🚨 URGENTE</span>`:'';
  const issuesTag=o.receivedIssues?` <span class="badge" style="background:#fef3c7;color:#92400e">⚠️ Con incidencias</span>`:'';
  const delTag=o.deliveryDate?` <span style="font-size:11px;color:var(--mut);font-weight:600">📅 Entrega: ${o.deliveryDate}</span>`:'';
  const recvBtn=showActions&&o.status==='approved'?`<button class="btn btn-ghost btn-sm" onclick="markReceived('${o.id}')">📦 Marcar recibido</button>`:'';
  const restRecvBtn=!showActions&&o.status==='approved'&&S.session?`<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="markReceived('${o.id}')">📦 Confirmar recepción</button>`:'';

  let itemsHtml='';
  if(isEditing){
    itemsHtml=S.editItems.map((it,i)=>`
      <div class="pr" style="align-items:center;flex-wrap:nowrap">
        <span class="pn" style="flex:1">${it.name}</span>
        <div class="qc" style="margin-left:8px">
          <button class="qb" onclick="editItemQty(${i},-1)">−</button>
          <span class="qd" id="eiq-${i}" style="min-width:32px;text-align:center">${it.qty}</span>
          <button class="qb" onclick="editItemQty(${i},1)">+</button>
        </div>
        <span class="pp" id="eip-${i}" style="margin-left:8px">${fmt(it.qty*it.price)}</span>
      </div>`).join('');
  } else {
    itemsHtml=(o.items||[]).map(it=>`<div class="pr"><span class="pn">${it.name||'?'}</span><span class="pq">${it.qty} ${it.unit||''}</span><span class="pp">${fmt((it.qty||0)*(it.price||0))}</span></div>`).join('');
  }
  let acts='';
  if(showActions&&o.status==='pending'){
    if(isEditing){
      acts=`<div style="width:100%">
        <textarea id="approve-note-${o.id}" placeholder="Comentario al aprobar (opcional)..." rows="2" style="width:100%;padding:6px 8px;border:1px solid var(--brd);border-radius:6px;font-size:12px;background:var(--card);color:var(--txt);resize:none;box-sizing:border-box;margin-bottom:6px"></textarea>
        <div class="oc-acts" style="flex-wrap:wrap">
          <button class="btn btn-ok btn-sm" onclick="approveWithEdits('${o.id}')">✅ Aprobar</button>
          <button class="btn btn-ghost btn-sm" onclick="S.editOrderId=null;S.editItems=[];renderAdminContent()">✕ Cancelar</button>
        </div>
      </div>`;
    } else {
      acts=`<div style="width:100%">
        <textarea id="approve-note-${o.id}" placeholder="Comentario al aprobar (opcional)..." rows="2" style="width:100%;padding:6px 8px;border:1px solid var(--brd);border-radius:6px;font-size:12px;background:var(--card);color:var(--txt);resize:none;box-sizing:border-box;margin-bottom:6px"></textarea>
        <div class="oc-acts">
          <button class="btn btn-ok btn-sm" onclick="approve('${o.id}')">✅ Aprobar</button>
          <button class="btn btn-blue btn-sm" onclick="startEditOrder('${o.id}')">✏️ Modificar</button>
          <button class="btn btn-no btn-sm" onclick="rejectWithReason('${o.id}')">✗ Rechazar</button>
        </div>
      </div>`;
    }
  } else if(o.status==='approved'){
    acts=`<div class="oc-acts">
      <button class="btn btn-wa btn-sm" onclick="showWA('${sup.phone||''}',msgSupplier(orders.find(x=>x.id==='${o.id}')),'Envía el pedido aprobado al proveedor')">${WA_SVG} ${sup.name}</button>
    </div>`;
  }
  const totLabel=isEditing?`<div class="ptot" id="edit-tot">Total: ${fmt(tot)}</div>`:`<div class="ptot">Total: ${fmt(tot)}</div>`;
  const threshold=cfg.alertThreshold||300;
  const isLargeOrder=showActions&&tot>=threshold;
  const largeAlert=isLargeOrder?`<div class="banner red" style="margin:6px 0 2px">⚠️ Pedido grande — supera ${fmt(threshold)}</div>`:'';
  // Budget warning
  const oUser=cfg.users.find(u=>u.restaurant===o.restaurant);
  const oCreatedAt=o.createdAt||'';
  const bKey=oUser?oUser.id+'_'+oCreatedAt.slice(0,7):null;
  const bLimit=bKey?(budgets[bKey]||0):0;
  const bSpent=bKey?orders.filter(x=>(x.status==='approved'||x.status==='received')&&x.restaurant===o.restaurant&&(x.createdAt||'').startsWith(oCreatedAt.slice(0,7))).reduce((s,x)=>s+total(x),0):0;
  const budgetAlert=bLimit>0&&bSpent>bLimit?`<div class="banner red" style="margin:4px 0 2px">💳 Presupuesto superado — ${fmt(bSpent)} de ${fmt(bLimit)}</div>`:'';
  return `<div class="oc" ${isEditing?'style="border-color:var(--pri);box-shadow:0 0 0 2px rgba(26,26,46,.15)"':o.urgent?'style="border-color:#dc2626"':''}>
    <div class="oc-hd">
      <div><div class="oc-rest">${o.restaurant}${o.autoApproved?` <span class="badge b-f">Auto</span>`:''}${modTag}${urgTag}${issuesTag}</div>
      <div class="oc-sub">${sup.emoji} ${sup.name} · ${fmtD(o.createdAt)} · <span class="badge ${bc}">${bl}</span>${delTag}</div></div>
      ${acts}
    </div>
    ${largeAlert}${budgetAlert}
    ${o.approvalNote?`<div style="background:#f0fdf4;border-left:3px solid #16a34a;border-radius:0 6px 6px 0;padding:6px 10px;margin:4px 0 6px;font-size:12px;color:#166534">💬 Admin: ${o.approvalNote}</div>`:''}
    ${o.notes?`<div style="background:var(--bg);border-left:3px solid var(--pri);border-radius:0 6px 6px 0;padding:6px 10px;margin:4px 0 6px;font-size:12px;color:var(--txt)">📝 <em>${o.notes}</em></div>`:''}
    ${isEditing?`<div class="banner blue" style="margin-bottom:10px">✏️ Modifica las cantidades y pulsa <strong>Aprobar</strong></div>`:''}
    <div class="pl">${itemsHtml}${totLabel}</div>
    ${recvBtn||restRecvBtn}
  </div>`;
}

function vPending(){ const p=orders.filter(o=>o.status==='pending');return p.length?p.map(o=>orderCard(o,true)).join(''):`<div class="empty"><div class="ei">🎉</div><div class="et">Sin pedidos pendientes</div></div>`; }
function vApproved(){ const a=orders.filter(o=>o.status==='approved');return a.length?a.map(o=>orderCard(o,false)).join(''):`<div class="empty"><div class="ei">📋</div><div class="et">Sin pedidos aprobados</div></div>`; }

function vConsolidated(){
  const pend=orders.filter(o=>o.status==='pending');
  if(!pend.length) return `<div class="empty"><div class="ei">📦</div><div class="et">No hay pedidos pendientes</div></div>`;
  const bySup={};
  pend.forEach(o=>{ if(!bySup[o.supId])bySup[o.supId]={}; (o.items||[]).forEach(it=>{ if(!bySup[o.supId][it.id])bySup[o.supId][it.id]={...it,qty:0,rests:[]}; bySup[o.supId][it.id].qty+=it.qty; bySup[o.supId][it.id].rests.push((o.restaurant||'').replace("O'Carro ",'')); }); });
  return Object.entries(bySup).map(([sid,items])=>{
    const sup=suppliers[sid]||{name:sid,emoji:'📦',phone:''};
    const arr=Object.values(items);
    const tot=arr.reduce((s,it)=>s+(parseFloat(it.qty)||0)*(parseFloat(it.price)||0),0);
    const co={supId:sid,restaurant:`Consolidado`,items:arr,createdAt:new Date().toISOString()};
    const rows=arr.map(it=>`<div class="pr"><span class="pn">${it.name} <small style="color:var(--mut)">(${[...new Set(it.rests)].length}r)</small></span><span class="pq">${it.qty} ${it.unit}</span><span class="pp">${fmt(it.qty*it.price)}</span></div>`).join('');
    return `<div class="cc"><div class="cc-hd"><div class="cc-name">${sup.emoji} ${sup.name}</div>
      <button class="btn btn-wa btn-sm" onclick="showWA('${sup.phone||''}',msgSupplier(${JSON.stringify(co).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}), 'Pedido consolidado')">${WA_SVG} Enviar</button>
    </div><div class="pl">${rows}<div class="ptot">Total: ${fmt(tot)}</div></div></div>`;
  }).join('');
}

function renderChart(){
  const ctx=document.getElementById('chart');if(!ctx)return;
  if(chartInst){chartInst.destroy();chartInst=null;}
  const byR={};
  orders.filter(o=>o.status==='approved'||o.status==='received').forEach(o=>{ const k=(o.restaurant||'Sin nombre').replace("O'Carro ",'');byR[k]=(byR[k]||0)+total(o); });
  // Sumar gastos manuales
  Object.values(extraExpenses).forEach(e=>{ const k=(e.restaurant||'Sin nombre').replace("O'Carro ",'');byR[k]=(byR[k]||0)+(parseFloat(e.amount)||0); });
  const ent=Object.entries(byR).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a);
  if(!ent.length){ ctx.parentNode.innerHTML=`<div class="empty" style="height:260px;display:flex;flex-direction:column;justify-content:center"><div class="ei">📊</div><div class="et">Aprueba pedidos para ver el gasto</div></div>`;return; }
  chartInst=new Chart(ctx,{type:'bar',data:{labels:ent.map(([k])=>k),datasets:[{data:ent.map(([,v])=>v),backgroundColor:'#1a1a2e',borderRadius:6,hoverBackgroundColor:'#e94560'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fmt(c.raw)}}},scales:{y:{ticks:{callback:v=>v.toLocaleString('es-ES',{maximumFractionDigits:0})+' €'},grid:{color:'#f0f0f0'}},x:{grid:{display:false}}}}});
}
function vExtraExpenses(){

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <div><label style="font-size:11px;color:var(--mut);display:block;margin-bottom:3px">Local</label>
        <select id="eg-rest" style="width:100%;padding:7px 8px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;background:var(--card);color:var(--txt)">${restOpts}</select></div>
      <div><label style="font-size:11px;color:var(--mut);display:block;margin-bottom:3px">Importe (€)</label>
        <input type="number" id="eg-amt" min="0" step="0.01" placeholder="0.00" style="width:100%;padding:7px 8px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;background:var(--card);color:var(--txt);box-sizing:border-box"></div>
      <div><label style="font-size:11px;color:var(--mut);display:block;margin-bottom:3px">Concepto</label>
        <input type="text" id="eg-concept" placeholder="Ej: Compra directa mercado…" style="width:100%;padding:7px 8px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;background:var(--card);color:var(--txt);box-sizing:border-box"></div>
      <div><label style="font-size:11px;color:var(--mut);display:block;margin-bottom:3px">Fecha</label>
        <input type="date" id="eg-date" value="${new Date().toISOString().split('T')[0]}" style="width:100%;padding:7px 8px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;background:var(--card);color:var(--txt);box-sizing:border-box"></div>
    </div>
    <button class="btn btn-pri btn-sm" onclick="saveExtraExpense()">Añadir gasto</button>

  </div>`;
}
function saveExtraExpense(){
  const restaurant=document.getElementById('eg-rest')?.value;
  const amount=parseFloat(document.getElementById('eg-amt')?.value);
  const concept=document.getElementById('eg-concept')?.value.trim()||'';
  const date=document.getElementById('eg-date')?.value||new Date().toISOString().split('T')[0];
  if(!restaurant||isNaN(amount)||amount<=0){toast('Indica local e importe válido','#dc2626');return;}
  const id='ex'+uid();
  const entry={id,restaurant,amount,concept,date,createdAt:new Date().toISOString()};
  extraExpenses[id]=entry;
  if(fbDb) fbDb.ref('extraExpenses/'+id).set(entry);
  renderAdminContent();
  if(S.adminTab==='spending') setTimeout(renderChart,50);
  toast('Gasto registrado','#16a34a');
}
function delExtraExpense(id){
  if(!confirm('¿Eliminar este gasto manual?'))return;
  delete extraExpenses[id];
  if(fbDb) fbDb.ref('extraExpenses/'+id).remove();
  renderAdminContent();
  if(S.adminTab==='spending') setTimeout(renderChart,50);
  toast('Gasto eliminado','#dc2626');
}

/* ═══════════════ ALBARANES ═══════════════ */
function vAlbaranes(){
  const btn=`<button class="btn btn-pri btn-sm" onclick="goAlbaranAdmin()" style="margin-bottom:14px">+ Nuevo albarán</button>`;
  const byRest={};
  orders.filter(o=>o.status==='approved'||o.status==='received').forEach(o=>{ if(!byRest[o.restaurant])byRest[o.restaurant]={ordered:0,received:0}; byRest[o.restaurant].ordered+=total(o); });
  albNotes.forEach(a=>{ if(!byRest[a.restaurant])byRest[a.restaurant]={ordered:0,received:0}; byRest[a.restaurant].received+=(a.items||[]).reduce((s,it)=>s+(parseFloat(it.qty)||0)*(parseFloat(it.price)||0),0); });
  const tableRows=Object.entries(byRest).map(([rest,d])=>{
    const diff=d.received-d.ordered;
    const pct=d.ordered>0?((diff/d.ordered)*100).toFixed(1):'-';
    const cls=Math.abs(diff)<1?'diff-ok':diff>0?'diff-err':'diff-warn';
    return `<tr><td>${(rest||'').replace("O'Carro ",'')}</td><td>${fmt(d.ordered)}</td><td>${fmt(d.received)}</td><td class="${cls}">${diff>=0?'+':''}${fmt(diff)}${pct!=='-'?' ('+pct+'%)':''}</td></tr>`;
  }).join('');
  const table=tableRows?`<div class="card"><div class="card-t">📊 Pedido vs Recibido por local</div><div style="overflow-x:auto"><table class="spend-table"><tr><th>Local</th><th>Pedido</th><th>Recibido</th><th>Diferencia</th></tr>${tableRows}</table></div></div>`:'';
  const notes=albNotes.length?albNotes.map(a=>albCard(a)).join(''):`<div class="empty"><div class="ei">📋</div><div class="et">Sin albaranes registrados</div></div>`;
  return btn+table+`<div class="sh">Albaranes</div>`+notes;
}

function goAlbaranAdmin(){ S.view='albaran-new';S.albItems=[];S.albRestaurant='';S.albSupId=supList()[0]?.id||'';S.albPhoto=null;S.albDate=new Date().toISOString().split('T')[0];render(); }

function albCard(a){
  const sup=suppliers[a.supId]||{name:'?',emoji:'?'};
  const tot=(a.items||[]).reduce((s,it)=>s+(parseFloat(it.qty)||0)*(parseFloat(it.price)||0),0);
  const matchOrder=orders.find(o=>o.restaurant===a.restaurant&&o.supId===a.supId&&o.status==='approved');
  const matchingOrders=orders.filter(o=>(o.status==='approved'||o.status==='received')&&o.restaurant===a.restaurant&&o.supId===a.supId);
  const linkedOrder=a.orderId?orders.find(o=>o.id===a.orderId):null;
  const linkSection=a.orderId
    ? `<div style="font-size:12px;color:#16a34a;margin-top:6px">🔗 Vinculado a pedido del ${fmtD(linkedOrder?linkedOrder.createdAt:'')}</div>`
    : matchingOrders.length
      ? `<select onchange="linkAlbToOrder('${a.id}',this.value)" style="font-size:12px;padding:4px 6px;border:1px solid var(--brd);border-radius:6px;background:var(--card);color:var(--txt);margin-top:6px;width:100%"><option value="">🔗 Vincular a pedido…</option>${matchingOrders.map(o=>`<option value="${o.id}">Pedido ${fmtD(o.createdAt)} — ${fmt(total(o))}</option>`).join('')}</select>`
      : '';
  const hasIncidents=(a.items||[]).some(it=>it.incident);
  const rows=(a.items||[]).map(it=>`<div class="pr" style="${it.incident?'background:#fff5f5;border-radius:6px;padding:4px 6px;margin-bottom:2px':''}"><span class="pn">${it.code?`<small style="color:var(--mut)">[${it.code}]</small> `:''} ${it.name}${it.incident?`<div style="font-size:11px;color:#dc2626;margin-top:2px">⚠️ ${it.incident}</div>`:''}</span><span class="pq">${it.qty} ${it.unit}</span><span class="pp">${fmt((parseFloat(it.qty)||0)*(parseFloat(it.price)||0))}</span></div>`).join('');
  let cmp='';
  if(matchOrder){
    const cmpRows=(a.items||[]).map(ai=>{
      const oi=(matchOrder.items||[]).find(x=>x.name.toLowerCase()===ai.name.toLowerCase());
      if(!oi) return `<div class="cmp-cell cmp-warn"><div class="cmp-name">${ai.name}</div><div class="cmp-val">⚠️ No estaba en el pedido</div></div>`;
      const qDiff=ai.qty-oi.qty;
      const cls=qDiff===0?'cmp-ok':Math.abs(qDiff/oi.qty)<0.05?'cmp-warn':'cmp-err';

function showCropUI(){
  S.albCropping=true;
  render();
  setTimeout(initCropCanvas,80);
}
function cancelCrop(){ S.albCropping=false; render(); }
function initCropCanvas(){
  const canvas=document.getElementById('crop-canvas');
  if(!canvas)return;
  const img=new Image();
  img.src=S.albPhoto;
  img.onload=()=>{
    const maxW=canvas.parentElement.clientWidth-4;
    const scale=Math.min(1,maxW/img.naturalWidth);
    canvas.width=img.naturalWidth*scale;
    canvas.height=img.naturalHeight*scale;
    canvas._scale=scale; canvas._img=img;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    cropState={dragging:false,startX:0,startY:0,endX:0,endY:0};
    const pos=(e)=>{
      const r=canvas.getBoundingClientRect();
      const t=e.touches?e.touches[0]:e;
      return{x:Math.max(0,Math.min(canvas.width,t.clientX-r.left)),y:Math.max(0,Math.min(canvas.height,t.clientY-r.top))};
    };
    canvas.onmousedown=canvas.ontouchstart=(e)=>{e.preventDefault();const p=pos(e);cropState={dragging:true,startX:p.x,startY:p.y,endX:p.x,endY:p.y};};
    canvas.onmousemove=canvas.ontouchmove=(e)=>{if(!cropState.dragging)return;e.preventDefault();const p=pos(e);cropState.endX=p.x;cropState.endY=p.y;drawOverlay(ctx,img,canvas.width,canvas.height);};
    canvas.onmouseup=canvas.ontouchend=()=>{cropState.dragging=false;};
  };
}
function drawOverlay(ctx,img,w,h){
  ctx.drawImage(img,0,0,w,h);
  const x1=Math.min(cropState.startX,cropState.endX),y1=Math.min(cropState.startY,cropState.endY);
  const x2=Math.max(cropState.startX,cropState.endX),y2=Math.max(cropState.startY,cropState.endY);
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillRect(0,0,w,h);
  if(x2>x1&&y2>y1){
    ctx.clearRect(x1,y1,x2-x1,y2-y1);
    ctx.drawImage(img,x1,y1,x2-x1,y2-y1,x1,y1,x2-x1,y2-y1);
    ctx.strokeStyle='#e94560';ctx.lineWidth=2;
    ctx.strokeRect(x1,y1,x2-x1,y2-y1);
  }
}
function applyCrop(){
  const canvas=document.getElementById('crop-canvas');
  if(!canvas){toast('Error al recortar','#dc2626');return;}
  const sc=canvas._scale||1;
  const x1=Math.min(cropState.startX,cropState.endX),y1=Math.min(cropState.startY,cropState.endY);
  const w=Math.abs(cropState.endX-cropState.startX),h=Math.abs(cropState.endY-cropState.startY);
  if(w<20||h<20){toast('Selecciona un área más grande arrastrando','#dc2626');return;}
  const out=document.createElement('canvas');
  out.width=Math.round(w/sc); out.height=Math.round(h/sc);
  out.getContext('2d').drawImage(canvas._img,x1/sc,y1/sc,w/sc,h/sc,0,0,out.width,out.height);
  S.albPhoto=out.toDataURL('image/jpeg',0.95);
  S.albCropping=false;
  render();
  toast('✂️ Recorte aplicado — ahora pulsa Reconocer','#16a34a');
}

async function runOCR(){
  if(!S.albPhoto){toast('Añade una foto primero','#dc2626');return;}
  const prog=document.getElementById('ocr-progress');
  if(prog){prog.style.display='block';prog.textContent=cfg.geminiKey?'🤖 Analizando con IA...':'🔍 Reconociendo texto...';}
  try{
    if(cfg.geminiKey){
      // Gemini Vision
      const base64=S.albPhoto.split(',')[1];
      const mime=S.albPhoto.split(';')[0].split(':')[1]||'image/jpeg';
      const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${cfg.geminiKey}`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{parts:[
          {inline_data:{mime_type:mime,data:base64}},
          {text:`Eres un asistente que lee albaranes de restaurante. Extrae TODOS los productos con sus cantidades y precios unitarios. Responde ÚNICAMENTE con un JSON array, sin ningún texto adicional antes ni después:\n[{"name":"Entrecot de ternera","qty":5.5,"unit":"KG","price":28.50}]\nUnidades posibles: KG, UN, L, Caja. Si no hay precio usa 0. Solo el JSON array.`}
        ]}]})
      });
      const data=await resp.json();
      if(data.error){toast('Error Gemini: '+data.error.message,'#dc2626');return;}
      const text=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
      const match=text.match(/\[[\s\S]*\]/);
      if(match){
        const parsed=JSON.parse(match[0]);
        if(parsed.length>0){
          S.albItems=[...S.albItems,...parsed.map(p=>({code:'',name:p.name||'',unit:p.unit||'KG',qty:parseFloat(p.qty)||1,price:parseFloat(p.price)||0}))];
          toast(`🤖 Gemini reconoció ${parsed.length} productos. Revisa y corrige.`,'#16a34a');return;
        }
      }
      toast('Gemini no encontró productos. Prueba con mejor foto o añade manualmente.','#d97706');
    } else {
      // Tesseract fallback
      try{
        if(!window.Tesseract){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
        const worker=await Tesseract.createWorker('spa+eng');
        const {data:{text}}=await worker.recognize(S.albPhoto);
        await worker.terminate();
        const parsed=parseOCRText(text);
        if(parsed.length>0){S.albItems=[...S.albItems,...parsed];toast(`✅ ${parsed.length} líneas reconocidas. Revisa y corrige.`,'#16a34a');}
        else toast('No se reconocieron productos. Añádelos manualmente.','#d97706');
      }catch(te){
        console.warn('Tesseract error:',te);
        toast('OCR básico no disponible aquí. Configura Gemini IA en ⚙️ Config para reconocimiento con IA gratuita.','#d97706');
      }
    }
  }catch(e){console.error(e);toast('Error al analizar la imagen.','#dc2626');}
  finally{if(prog)prog.style.display='none';render();}
}

function parseOCRText(text){
  // Patterns to skip: headers, footers, totals, addresses, legal text
  const SKIP=/base\s*impon|i\.v\.a|importe\s*(total|bruto)|telf[eé]?f?|fax\.?:|www\.|n\.i\.f|c\.i\.f|f\.pedido|f\.entrega|referencia\s*del|preparado|firma|ruta\s*\d|caixe|informaci[oó]n|responsable|alergen|legitimaci|finalidad|mercabarna|import.export|direcci[oó]n|albar[aá]n\s*n|art\.\s*ref|mercancia|n\.\s*cient|kg\.\s*\/?\s*ca|08[0-9]{3}|cliente|c\.i\.f|nif:|10,00\s*%|%\s*de\s*r|sidoro|cami\s*de|palamos|girona\s*\)|barcelona\s*\)|llogitud|francesc|longitud/i;

  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>3);
  const items=[];

  lines.forEach(line=>{
    if(SKIP.test(line)) return;

    // Extract all decimal numbers from line
    const nums=[...line.matchAll(/(\d+[,\.]\d{1,2})/g)].map(m=>parseFloat(m[1].replace(',','.')));
    if(!nums.length) return;

    // Look for article code (3-5 digit number at start of line or after pipe)
    const codeMatch=line.match(/(?:^|\|)\s*(\d{3,5})\b/);
    const code=codeMatch?codeMatch[1]:'';

    // Remove pipe chars, leading code, and scientific names (2+ consecutive ALL_CAPS words ≥4 chars each)
    let name=line
      .replace(/\|/g,' ')
      .replace(/^\s*\d{3,5}\s*/,'')
      .replace(/\b([A-ZÁÉÍÓÚ]{4,})(\s+[A-ZÁÉÍÓÚ]{3,}){1,}\b/g,'')
      .replace(/\d+[,\.]\d+/g,'')
      .replace(/\s+/g,' ')
      .trim();

    // Require meaningful text (at least 3 alpha chars)
    if(name.replace(/[^a-zA-ZáéíóúñÁÉÍÓÚÑ]/g,'').length < 3) return;

    // Determine qty and unit_price using qty*price=total relationship
    let qty=1, price=0, found=false;
    if(nums.length>=3){
      // Try all triplets: a*b≈c or a*c≈b or b*c≈a
      outer: for(let i=0;i<nums.length;i++){
        for(let j=i+1;j<nums.length;j++){
          const prod=nums[i]*nums[j];
          for(let k=0;k<nums.length;k++){
            if(k!==i&&k!==j&&Math.abs(nums[k]-prod)/Math.max(nums[k],0.01)<0.06){
              // nums[i]*nums[j]≈nums[k]: smallest of i,j is qty, other is price
              qty=Math.min(nums[i],nums[j]);
              price=Math.max(nums[i],nums[j]);
              // If qty looks like a price (>50) swap
              if(qty>50&&price<qty){[qty,price]=[price,qty];}
              found=true;
              break outer;
            }
          }
        }
      }
    }
    if(!found){
      if(nums.length>=2){ qty=nums[0]; price=nums[1]; }
      else { price=nums[0]; qty=1; }
    }

    // Sanity: skip totals/taxes (importe bruto etc)
    if(price<=0||price>5000||qty<=0||qty>2000) return;
    // Skip if name contains total-like words
    if(/importe|total|bruto|iva|i\.v\.a/i.test(name)) return;

    // Unit: decimal qty = KG, otherwise check line or default UN
    const unit=qty%1!==0?'KG':/\bkg\b|\bkgs\b|\bkilo/i.test(line)?'KG':'UN';

    items.push({
      code,
      name:name.slice(0,60),
      unit,
      qty:Math.round(qty*100)/100,
      price:Math.round(price*100)/100
    });
  });

  return items.slice(0,50);
}
