<!-- Content-Security-Policy: defensa en profundidad frente a XSS.
     Permitimos scripts inline (la app usa muchos onclick=""), pero

     con la URL de tu Cloudflare Worker cuando lo tengas desplegado. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.firebaseio.com https://*.firebasedatabase.app https://*.googleapis.com https://*.gstatic.com https://apis.google.com; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://apis.google.com https://*.workers.dev https://api.ntfy.sh https://ntfy.sh; worker-src 'self' blob:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';">

<!-- Chequeo activo de versión al arrancar: pide version.json al servidor
     (sin caché) y, si la versión que trae no coincide con la que este
     index.html tiene grabada, recarga forzando URL nueva. Segunda capa de
     defensa aparte del service worker network-first — cubre el caso de
     navegadores que aún sirven un index.html viejo desde su propia caché. -->
<script>
(function(){
  window.APP_VERSION='20260824-noventia-cmpfix2';
  try{
    fetch('version.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(v){
        if(v && v.v && v.v!==window.APP_VERSION){
          console.log('[VersionCheck] Nueva versión detectada:',v.v,'actual:',window.APP_VERSION);
          location.replace(location.pathname+'?_r='+Date.now());
        }
      })
      .catch(function(){});
  }catch(e){}
})();
</script>
