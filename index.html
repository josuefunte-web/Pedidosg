<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Provea">
<link rel="manifest" id="pwa-manifest">
<title>Provea — Gestión de Pedidos</title>
<!-- Firebase -->
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.js"></script>
<!-- Charts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<!-- Excel export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --pri:#1e293b;--acc:#e11d48;--grn:#10b981;--grnd:#059669;
  --bg:#f8fafc;--card:#fff;--brd:#e2e8f0;
  --txt:#1e293b;--mut:#64748b;--r:14px;
  --sh:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.07);
  --srf:#f1f5f9;
}
body.dark{
  --pri:#e11d48;--acc:#fb7185;
  --bg:#0d1117;--card:#161b22;--brd:#21262d;
  --txt:#e6edf3;--mut:#7d8590;--sh:0 2px 14px rgba(0,0,0,.5);
  --srf:#1c2128;
}
body.dark .hdr{background:#010409;border-bottom-color:#21262d}
body.dark .tab.act{background:#21262d;color:#e6edf3}
body.dark .tabs{background:#0d1117}
body.dark input,body.dark select,body.dark textarea{background:#21262d;color:#e6edf3;border-color:#30363d}
body.dark .stab{background:#21262d;color:#e6edf3}
body.dark .stab.act{background:var(--pri);color:#fff}
body.dark .pi{background:#161b22;border-color:#21262d}
body.dark .pi.ic{border-color:var(--pri)}
body.dark .sidebar{background:#010409;border-color:#21262d}
body.dark .oc{background:#161b22;border-color:#21262d}
body.dark .stat{background:#161b22;border-color:#21262d}
body.dark .btn-ghost{border-color:#30363d;color:#e6edf3}
body.dark .banner{background:#21262d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
.hdr{background:var(--pri);color:#fff;height:58px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:90;box-shadow:0 1px 0 rgba(255,255,255,.05),0 2px 20px rgba(0,0,0,.18)}
.logo{font-size:17px;font-weight:800;letter-spacing:-.4px;cursor:pointer}
.logo span{color:var(--acc)}
.hdr-r{display:flex;align-items:center;gap:6px}
.hbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;padding:5px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.hbtn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
.hbtn.act{background:var(--acc);border-color:var(--acc)}
.ses-info{font-size:12px;opacity:.55;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-dot{width:7px;height:7px;border-radius:50%;background:#475569;display:inline-block;margin-right:4px;transition:.3s}
.fb-dot.on{background:#4ade80}
.main{max-width:900px;margin:0 auto;padding:20px 16px 100px}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:14px;border:1px solid var(--brd)}
.card-t{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin-bottom:14px}
.tabs{display:flex;gap:2px;background:var(--srf);padding:3px;border-radius:11px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--brd)}
.tab{flex:1;padding:7px 10px;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--mut);white-space:nowrap;min-width:fit-content;transition:all .2s}
.tab.act{background:var(--card);color:var(--pri);box-shadow:0 1px 4px rgba(15,23,42,.1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:12px;padding:16px 12px;text-align:center;border:1px solid var(--brd);box-shadow:var(--sh);transition:.2s}
.sv{font-size:24px;font-weight:800;color:var(--pri);letter-spacing:-.5px}
.sl{font-size:10px;color:var(--mut);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.btn{padding:9px 16px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:all .2s;white-space:nowrap}.btn:active{transform:scale(.97)}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:hover{background:#334155}
.btn-acc{background:var(--acc);color:#fff}.btn-acc:hover{background:#be123c}
.btn-ok{background:#dcfce7;color:#15803d}.btn-ok:hover{background:#bbf7d0}
.btn-no{background:#fee2e2;color:#dc2626}.btn-no:hover{background:#fecaca}
.btn-wa{background:var(--grn);color:#fff}.btn-wa:hover{background:var(--grnd)}
.btn-ghost{background:transparent;border:1.5px solid var(--brd);color:var(--txt)}.btn-ghost:hover{background:var(--srf)}
.btn-blue{background:#dbeafe;color:#1d4ed8}.btn-blue:hover{background:#bfdbfe}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:6px}
.oc{border:1px solid var(--brd);border-radius:12px;padding:16px;margin-bottom:10px;background:#fff;box-shadow:var(--sh);transition:box-shadow .2s}
.oc:hover{box-shadow:0 4px 20px rgba(15,23,42,.1)}
.oc-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.oc-rest{font-size:15px;font-weight:700;color:var(--pri)}
.oc-sub{font-size:12px;color:var(--mut);margin-top:2px}
.oc-acts{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.b-p{background:#fef9c3;color:#a16207}.b-a{background:#dcfce7;color:#15803d}.b-r{background:#fee2e2;color:#dc2626}.b-f{background:#dbeafe;color:#1d4ed8}.b-recv{background:#f3e8ff;color:#7c3aed}.b-urg{background:#dc2626;color:#fff;animation:urgpulse 1.2s ease-in-out infinite}
@keyframes urgpulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes spin{to{transform:rotate(360deg)}}
.pl{font-size:13px;border-top:1px solid var(--brd);padding-top:10px}
.pr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f1f5f9}
.pr:last-child{border:none}
.pn{flex:1;color:var(--txt)}.pq{font-weight:700;color:var(--pri);margin-left:10px}.pp{color:var(--mut);margin-left:8px;min-width:72px;text-align:right}
.ptot{display:flex;justify-content:flex-end;margin-top:8px;padding-top:8px;border-top:2px solid var(--brd);font-weight:800;font-size:15px;color:var(--pri)}
.fg{margin-bottom:14px}
label{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
select,input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date]{width:100%;padding:9px 13px;border:1.5px solid var(--brd);border-radius:9px;font-size:14px;background:#fff;color:var(--txt);outline:none;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(30,41,59,.08)}
.sup-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.stab{padding:7px 14px;border-radius:20px;border:1.5px solid var(--brd);background:#fff;font-size:13px;cursor:pointer;font-weight:600;transition:all .2s;color:var(--mut)}
.stab.act{background:var(--pri);color:#fff;border-color:var(--pri)}
.pgrid{display:grid;gap:8px}
.pi{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 14px;border:1.5px solid var(--brd);border-radius:10px;background:#fff;gap:10px;transition:border-color .2s,box-shadow .2s}
.pi.ic{border-color:var(--pri);background:#f8f9ff;box-shadow:0 0 0 3px rgba(30,41,59,.06)}
.pi-i{flex:1;min-width:0}.pi-n{font-size:14px;font-weight:500}.pi-p{font-size:12px;color:var(--mut);margin-top:2px}
.qc{display:flex;align-items:center;gap:8px}
.urow{width:100%;display:flex;gap:5px;margin-top:5px}
.ubt{padding:3px 9px;border-radius:6px;border:1.5px solid var(--brd);background:#fff;font-size:11px;font-weight:600;cursor:pointer;color:var(--mut);transition:.15s}
.ubt:hover{border-color:var(--pri);color:var(--pri)}
.ubt-on{border-color:var(--pri)!important;background:var(--pri)!important;color:#fff!important}
.qb{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--brd);background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--pri);transition:all .15s}
.qb:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
.qd{min-width:28px;text-align:center;font-weight:800;font-size:15px}
.cbar{position:fixed;bottom:0;left:0;right:0;background:var(--pri);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:200;box-shadow:0 -4px 24px rgba(0,0,0,.25)}
.cbar.up{transform:translateY(0)}
.cb-v{font-weight:800;font-size:17px}.cb-s{opacity:.65;font-size:12px;margin-top:1px}
.cc{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:12px;padding:16px;margin-bottom:10px}
.cc-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.cc-name{font-size:15px;font-weight:800;color:#15803d}
.ch-wrap{position:relative;height:260px}
.sh{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 10px}
.empty{text-align:center;padding:52px 20px;color:var(--mut)}
.ei{font-size:48px;margin-bottom:12px}.et{font-size:14px;line-height:1.5}
.toast{position:fixed;top:68px;right:16px;background:#1e293b;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .3s ease;max-width:300px}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.pin-box{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:320px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.25)}
.pin-title{font-size:18px;font-weight:800;color:var(--pri);margin-bottom:4px}
.pin-sub{font-size:13px;color:var(--mut);margin-bottom:22px}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:22px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--brd);transition:.2s}
.dot.fill{background:var(--pri);border-color:var(--pri)}
.pin-err{color:#dc2626;font-size:13px;margin-bottom:12px;font-weight:600;display:none}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nk{background:var(--srf);border:1px solid var(--brd);border-radius:12px;height:54px;font-size:20px;font-weight:700;cursor:pointer;color:var(--pri);transition:all .15s}
.nk:hover,.nk:active{background:#e2e8f0;transform:scale(.95)}
.nk.ok{background:var(--pri);color:#fff;border-color:var(--pri)}.nk.ok:hover{background:#334155}
.login-wrap{max-width:880px;margin:0 auto;padding:28px 16px}
.login-title{text-align:center;font-size:24px;font-weight:800;color:var(--pri);margin-bottom:6px;letter-spacing:-.3px}
.login-sub{text-align:center;font-size:14px;color:var(--mut);margin-bottom:28px}
.rest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.rest-card{background:#fff;border-radius:var(--r);padding:20px 16px;cursor:pointer;border:1.5px solid var(--brd);transition:all .2s;text-align:center;box-shadow:var(--sh)}
.rest-card:hover{border-color:var(--pri);transform:translateY(-3px);box-shadow:0 8px 24px rgba(15,23,42,.12)}
.rest-emoji{font-size:30px;margin-bottom:10px}
.rest-name{font-size:13px;font-weight:700;color:var(--pri);line-height:1.3}
.admin-row{display:flex;justify-content:center;margin-top:12px}
.admin-btn{background:transparent;border:2px solid var(--pri);color:var(--pri);padding:10px 30px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;transition:all .2s}
.admin-btn:hover{background:var(--pri);color:#fff}
.user-card,.sup-card{border:1px solid var(--brd);border-radius:12px;padding:16px;margin-bottom:10px;background:#fff;box-shadow:var(--sh)}
.uc-hd,.sc-hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.uc-name,.sc-name{font-size:15px;font-weight:700;color:var(--pri)}
.uc-info,.sc-info{font-size:12px;color:var(--mut);margin-top:2px}
.uc-acts,.sc-acts{display:flex;gap:6px}
.perm-editor{margin-top:12px;padding-top:12px;border-top:1px solid var(--brd)}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px;margin:10px 0}
.perm-check{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1.5px solid var(--brd);border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;user-select:none}
.perm-check input{width:15px;height:15px;accent-color:var(--pri);cursor:pointer;flex-shrink:0}
.perm-check:has(input:checked){border-color:var(--pri);background:#f8f9ff}
body.dark .user-card{background:var(--card)}
body.dark .perm-check:has(input:checked){background:#1a1a40}
.rest-pill{display:inline-block;background:var(--srf);border:1px solid var(--brd);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;margin:2px 2px 0 0}
.rest-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;background:var(--srf);border-radius:10px;border:1px solid var(--brd)}
.rest-picker-lbl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;width:100%;margin-bottom:4px}
.uc-body,.sc-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--brd)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three-col{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.prod-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid var(--brd);border-radius:8px;margin-bottom:6px;background:var(--srf)}
.prod-info{flex:1}.prod-name-t{font-size:13px;font-weight:600}.prod-meta{font-size:11px;color:var(--mut)}
.banner{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#92400e;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.banner.blue{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.banner.red{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.banner.green{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
.wa-ic{width:14px;height:14px;fill:currentColor;flex-shrink:0;margin-top:1px}
.wa-modal{background:#fff;border-radius:20px;padding:26px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.25)}
.wa-modal h3{font-size:17px;font-weight:800;color:var(--pri);margin-bottom:8px}
.wa-modal p{font-size:13px;color:var(--mut);margin-bottom:16px;line-height:1.5}
.wa-msg{background:var(--srf);border-radius:10px;padding:12px;font-size:12px;font-family:monospace;white-space:pre-wrap;margin-bottom:16px;max-height:200px;overflow-y:auto;color:var(--txt);border:1px solid var(--brd)}
.wa-modal-btns{display:flex;gap:8px;flex-wrap:wrap}
.alb-card{border:1px solid var(--brd);border-radius:12px;padding:16px;margin-bottom:10px;background:#fff;box-shadow:var(--sh)}
.alb-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.alb-rest{font-size:15px;font-weight:700;color:var(--pri)}
.alb-info{font-size:12px;color:var(--mut);margin-top:2px}
.alb-photo{width:100%;max-height:200px;object-fit:contain;border-radius:10px;margin-bottom:10px;border:1px solid var(--brd)}
.cmp-cell{padding:10px;border-radius:9px;font-size:12px;margin-bottom:6px}
.cmp-ok{background:#f0fdf4;border:1px solid #bbf7d0}
.cmp-warn{background:#fffbeb;border:1px solid #fde68a}
.cmp-err{background:#fef2f2;border:1px solid #fecaca}
.cmp-name{font-weight:600;color:var(--pri)}.cmp-val{color:var(--mut);margin-top:2px}
.img-preview{width:100%;border-radius:10px;margin-bottom:12px;display:none;border:1px solid var(--brd)}
.ocr-progress{font-size:13px;color:var(--mut);text-align:center;padding:10px;display:none}
.item-entry{border:1.5px solid var(--brd);border-radius:10px;padding:13px;margin-bottom:8px;background:var(--srf);position:relative}
.item-del{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;font-size:16px;color:var(--mut)}
.item-del:hover{color:#dc2626}
.spend-table{width:100%;border-collapse:collapse;font-size:13px}
.spend-table th{background:var(--pri);color:#fff;padding:10px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.spend-table th:first-child{border-radius:8px 0 0 0}.spend-table th:last-child{border-radius:0 8px 0 0}
.spend-table td{padding:9px 12px;border-bottom:1px solid var(--brd)}
.spend-table tr:hover td{background:var(--srf)}
.diff-ok{color:#15803d;font-weight:700}.diff-warn{color:#d97706;font-weight:700}.diff-err{color:#dc2626;font-weight:700}
.file-input-wrap{position:relative}
.file-input-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.file-input-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px;border:2px dashed var(--brd);border-radius:12px;color:var(--mut);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.file-input-btn:hover{border-color:var(--pri);color:var(--pri);background:#f8f9ff}
/* Live indicator */
.live-badge{display:inline-flex;align-items:center;gap:5px;background:#dcfce7;color:#15803d;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.pulse{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(max-width:480px){
  .two-col,.three-col{grid-template-columns:1fr}
  .ses-info{display:none}
}
/* ── SIDEBAR ADMIN LAYOUT ── */
.adm-layout{display:flex;height:calc(100vh - 60px);overflow:hidden}
.sidebar{width:210px;flex-shrink:0;background:#0f172a;color:#fff;overflow-y:auto;display:flex;flex-direction:column;z-index:88;border-right:1px solid rgba(255,255,255,.05)}
.sb-mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.sb-ms{padding:12px;text-align:center}
.sb-msv{font-size:19px;font-weight:800;line-height:1}
.sb-msl{font-size:10px;opacity:.55;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.sg-hd{padding:10px 14px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;opacity:.45;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;transition:.15s}
.sg-hd:hover,.sg-hd.has-act{opacity:.8;background:rgba(255,255,255,.04)}
.sg-arrow{font-size:9px;transition:.2s}
.sg-direct{padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;opacity:.65;transition:.15s;display:flex;align-items:center;gap:8px;border-radius:8px;margin:1px 6px}
.sg-direct:hover{opacity:1;background:rgba(255,255,255,.07)}

function supList(){ return Object.values(suppliers).sort((a,b)=>{const oa=a.orden??999,ob=b.orden??999;return oa!==ob?oa-ob:a.name.localeCompare(b.name,'es');}); }
function visibleSups(){
  const all=supList();
  if(!S.session||S.session.isAdmin) return all;
  return all.filter(s=>!(s.disabledFor||[]).includes(S.session.userId));
}

/* ═══════════════ FIREBASE LISTENERS ═══════════════ */
function initFirebaseListeners(){
  if(!fbDb) return;

  // Connection status
  fbDb.ref('.info/connected').on('value', snap => {
    fbConnected = snap.val() === true;
    const dot = document.getElementById('fb-dot');
    if(dot) dot.className = 'fb-dot' + (fbConnected ? ' on' : '');
  });

  // Orders — real-time sync
  let _lastOrderIds=null;
  fbDb.ref('orders').on('value', snap => {
    const val = snap.val();
    const newOrders = val ? Object.values(val).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)) : [];
    // Push notifications for new orders (admin) and status changes (restaurant)
    try{
      if(_lastOrderIds!==null){
        const oldIds=_lastOrderIds;
        newOrders.forEach(o=>{
          if(!oldIds.has(o.id)){
            if(S.session?.isAdmin) pushNotify(`Nuevo pedido — ${o.restaurant}`,`${(suppliers[o.supId]||{name:o.supId}).name} · ${fmt(total(o))}${o.urgent?' URGENTE':''}`,o.urgent?'':'');
          } else {
            const old=orders.find(x=>x.id===o.id);
            const myRests=S.session?.restaurants||[S.session?.restaurant];
            if(old&&old.status!==o.status&&S.session&&!S.session.isAdmin&&myRests.includes(o.restaurant)){
              if(o.status==='approved') pushNotify('Pedido aprobado ',`Tu pedido a ${(suppliers[o.supId]||{name:o.supId}).name} ha sido aprobado`,'');
              else if(o.status==='rejected') pushNotify('Pedido rechazado ✗',o.rejectReason||'Contacta con el administrador','');
            }
          }
        });
      }
    }catch(e){ console.warn('Push notify error:',e); }
    _lastOrderIds=new Set(newOrders.map(o=>o.id));
    orders = newOrders;
    if(S.view==='admin') renderAdminContent();
    if(S.view==='order' && S.orderTab==='history') render();
  });

  // Suppliers — real-time sync
  fbDb.ref('suppliers').on('value', snap => {
    const val = snap.val();
    if(val){
      // Firebase devuelve arrays como objetos {0:{...},1:{...}} — normalizar a array
      Object.values(val).forEach(sup=>{
        if(sup && sup.products && !Array.isArray(sup.products)){
          sup.products = Object.values(sup.products);
        }
        if(sup && !sup.products) sup.products = [];
      });
      suppliers = val;
      // Preservar productos recién añadidos que aún no han llegado a Firebase
      if(S._cartProds){
        Object.entries(S._cartProds).forEach(([sid,prods])=>{
          if(!suppliers[sid]) return;
          if(!Array.isArray(suppliers[sid].products)) suppliers[sid].products=[];
          Object.values(prods).forEach(p=>{
            if(!suppliers[sid].products.find(x=>x.id===p.id)) suppliers[sid].products.push(p);
          });
        });
      }
      localStorage.setItem('oc_suppliers', JSON.stringify(suppliers));
    }
    // Actualizar UI en TODAS las vistas cuando cambien los proveedores
    const _sv = window.scrollY;
    if(S.view==='order' || S.view==='albaran-new'){
      render();
    } else if(S.view==='admin'){
      // En admin: solo refrescar si no estamos editando un proveedor inline
      // (para no cerrar el formulario de edición al admin)
      if(S.openSupId === null){
        renderAdminContent();
      }
    }
    requestAnimationFrame(()=>window.scrollTo(0,_sv));
  });

  // Comentarios por pedido — chat interno
  fbDb.ref('orderComments').on('value', snap => {
    const val = snap.val();
    orderComments = {};
    if(val){ Object.keys(val).forEach(oid=>{ orderComments[oid]=Object.values(val[oid]).sort((a,b)=>a.ts-b.ts); }); }
    if(S.view==='admin') renderAdminContent();
    if(S.view==='order' && S.orderTab==='history') render();
  });

  // Config global (ntfyTopic, etc.) — sincronizado en Firebase para todos los dispositivos
  let _loadedAppVersion = null; // versión vista al abrir la app (null = aún no cargada)
  fbDb.ref('globalCfg').on('value', snap => {
    const val = snap.val();
    if(val){
      if(val.ntfyTopic !== undefined) cfg.ntfyTopic = val.ntfyTopic;
      if(val.approvalMinAmount !== undefined) cfg.approvalMinAmount = val.approvalMinAmount;
      if(val.alertThreshold !== undefined) cfg.alertThreshold = val.alertThreshold;
      if(val.priceAlertPct !== undefined) cfg.priceAlertPct = val.priceAlertPct;
      if(val.adminPhone !== undefined) cfg.adminPhone = val.adminPhone;
      localStorage.setItem('oc_cfg', JSON.stringify(cfg));

      // Forzar actualización remota
      if(val.appVersion !== undefined){
        if(_loadedAppVersion === null){
          // Primera lectura: guardamos la versión actual, no recargamos
          _loadedAppVersion = val.appVersion;
        } else if(val.appVersion !== _loadedAppVersion){
          // La versión cambió MIENTRAS el usuario tenía la app abierta → recargar
          const banner = document.createElement('div');
          banner.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.95);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:-apple-system,system-ui,sans-serif;text-align:center;padding:24px';
          banner.innerHTML = '<div style="font-size:18px;font-weight:700;margin-bottom:8px">Nueva versión disponible</div><div style="font-size:14px;opacity:.7;margin-bottom:24px">La aplicación se actualizará en unos segundos...</div><div style="width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:#e11d48;border-radius:50%;animation:spin .8s linear infinite"></div>';
          document.body.appendChild(banner);
          setTimeout(()=>{ window.location.reload(true); }, 2500);
        }
      }
    }
  });

  // Albaranes — real-time sync
  fbDb.ref('albaranes').on('value', snap => {
    const val = snap.val();
    albNotes = val ? Object.values(val).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)) : [];
    if(S.view==='admin' && S.adminTab==='albaranes') renderAdminContent();
  });

  // Push default suppliers if DB is empty
  fbDb.ref('suppliers').once('value', snap => {
    if(!snap.val()){
      fbDb.ref('suppliers').set(DEFAULT_SUPS);
    }
  });

  // Revenue — food cost
  fbDb.ref('revenue').on('value', snap => {
    revenue = snap.val() || {};
  });
  // Budgets
  fbDb.ref('budgets').on('value', snap => {
    budgets = snap.val() || {};
    if(S.view==='admin' && S.adminTab==='budgets') renderAdminContent();
  });
  // Extra expenses (gastos manuales)
  fbDb.ref('extraExpenses').on('value', snap => {
    extraExpenses = snap.val() || {};
  });
  // Price history
  fbDb.ref('priceHistory').on('value', snap => {
    const val = snap.val();
    priceHistory = val ? Object.values(val).sort((a,b)=>new Date(b.changedAt)-new Date(a.changedAt)) : [];
  });
  // Templates
  fbDb.ref('templates').on('value', snap => {
    templates = snap.val() || {};
    if(S.view==='order'){const _sv=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,_sv));}
  });

  // Inventory — real-time sync
  fbDb.ref('inventory').on('value', snap => {
    inventory = snap.val() || {};
    if(S.view==='admin' && S.adminTab==='inventario') renderAdminContent();
    if(S.view==='order' && S.orderTab==='inventario'){ const _sv=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,_sv)); }
  });
  fbDb.ref('inventoryMovements').on('value', snap => {
    inventoryMovements = snap.val() || {};
    if(S.view==='admin' && S.adminTab==='inventario') renderAdminContent();
    if(S.view==='order' && S.orderTab==='inventario'){ const _sv=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,_sv)); }
  });

  // Recetas — real-time sync
  fbDb.ref('recetas').on('value', snap => {
    _recAllData = snap.val() || {};
    if(S.view==='admin' && S.adminTab==='recetas'){
      // No re-renderizar si el modal de receta está abierto (evita destruirlo mid-save)
      const modalOpen=document.getElementById('rec-modal-ov')?.style.display==='flex';
      if(!modalOpen) renderAdminContent();
    }
  });

  // Auth users (registrations)
  fbDb.ref('authUsers').on('value', snap => {
    authUsers = snap.val() || {};
    if(S.view==='admin' && S.adminTab==='solicitudes') renderAdminContent();
    // Update sidebar badge
    const badge=document.getElementById('sb-sol-badge');
    if(badge){ const n=Object.values(authUsers).filter(u=>u.status==='pending').length; badge.textContent=n; badge.style.display=n?'':'none'; }
    // If current user just got approved/rejected, update their session
    if(S.session?.uid && !S.session?.isAdmin){
      const me=authUsers[S.session.uid];
      if(me && me.status==='approved' && S.view==='pending-approval'){
        const myRests=me.restaurants||[me.restaurant];
        S.session={uid:me.uid,email:me.email,name:me.name||me.restaurant,restaurant:myRests[0]||me.restaurant,restaurants:myRests,isAdmin:false,needsApproval:me.needsApproval!==false};
        goOrder();
        toast('Tu acceso ha sido aprobado. ¡Bienvenido!','#16a34a',5000);
      } else if(me && me.status==='approved' && S.view==='order'){
        // Actualización en tiempo real de permisos (admin cambió accesos)
        const myRests=me.restaurants||[me.restaurant];
        const changed=JSON.stringify(myRests)!==JSON.stringify(S.session.restaurants||[]);
        if(changed){
          S.session.restaurants=myRests;
          // Si el restaurante activo ya no está permitido, cambiar al primero
          if(!myRests.includes(S.session.restaurant)) S.session.restaurant=myRests[0];
          S.session.needsApproval=me.needsApproval!==false;
          render();
        }
      } else if(me && me.status==='rejected' && S.view!=='pending-approval'){
        S.session={...S.session,pendingStatus:'rejected'};
        S.view='pending-approval';
        document.getElementById('hdr').style.display='none';
        render();
      }
    }
  });
}

    try{ fbApp=fbApp||firebase.initializeApp(FB_CONFIG); fbAuth=firebase.auth(); fbDb=fbDb||firebase.database(); }catch(e){}
  }
  if(!fbAuth){
    toast('Sin conexión. Comprueba tu internet y recarga la página.','#dc2626',7000);return;
  }
  const email=(document.getElementById('login-email')?.value||'').trim();
  const pass=document.getElementById('login-pass')?.value||'';
  const errEl=document.getElementById('login-err');
  const showErr=msg=>{if(errEl){errEl.textContent=msg;errEl.style.display='block';}else toast(msg,'#dc2626');};
  if(!email||!pass){showErr('Introduce email y contraseña');return;}
  // Disable button to prevent double-click
  const btn=document.querySelector('#app .btn-pri');
  if(btn){btn.disabled=true;btn.textContent='Entrando...';}
  try{
    await fbAuth.signInWithEmailAndPassword(email,pass);
    // onAuthStateChanged handles navigation
  }catch(e){
    const msgs={'auth/user-not-found':'Usuario no encontrado','auth/wrong-password':'Contraseña incorrecta','auth/invalid-email':'Email no válido','auth/too-many-requests':'Demasiados intentos. Espera unos minutos.','auth/invalid-credential':'Email o contraseña incorrectos'};
    showErr(msgs[e.code]||e.message);
    if(btn){btn.disabled=false;btn.textContent='Entrar →';}
  }
}

async function registerUser(){
  if(!fbAuth && typeof firebase !== 'undefined'){
    try{ fbApp=fbApp||firebase.initializeApp(FB_CONFIG); fbAuth=firebase.auth(); fbDb=fbDb||firebase.database(); }catch(e){}
  }
  if(!fbAuth){toast('Sin conexión. Comprueba tu internet y recarga la página.','#dc2626',7000);return;}
  const email=(document.getElementById('reg-email')?.value||'').trim();
  const pass=document.getElementById('reg-pass')?.value||'';
  const pass2=document.getElementById('reg-pass2')?.value||'';
  const rest=document.getElementById('reg-rest')?.value||'';
  const name=(document.getElementById('reg-name')?.value||'').trim();
  const errEl=document.getElementById('reg-err');
  const showErr=msg=>{if(errEl){errEl.textContent=msg;errEl.style.display='block';}else toast(msg,'#dc2626');};
  if(errEl) errEl.style.display='none';
  if(!email||!pass){showErr('Rellena todos los campos obligatorios');return;}
  if(pass.length<6){showErr('La contraseña debe tener al menos 6 caracteres');return;}
  if(pass!==pass2){showErr('Las contraseñas no coinciden');return;}
  if(!rest){showErr('Selecciona tu restaurante');return;}
  const btn=document.querySelector('#app .btn-pri');
  if(btn){btn.disabled=true;btn.textContent='Enviando...';}
  try{
    const cred=await fbAuth.createUserWithEmailAndPassword(email,pass);
    await fbDb.ref('authUsers/'+cred.user.uid).set({
      uid:cred.user.uid,email,name:name||email,restaurant:rest,
      status:'pending',needsApproval:true,
      createdAt:new Date().toISOString()
    });
    toast('Solicitud enviada. '+cfg.adminName+' la revisará pronto.','#16a34a',6000);
    // onAuthStateChanged → pending-approval screen
  }catch(e){
    const msgs={'auth/email-already-in-use':'Este email ya está registrado','auth/invalid-email':'Email no válido','auth/weak-password':'Contraseña demasiado débil (mín. 6 caracteres)'};
    showErr(msgs[e.code]||e.message);
    if(btn){btn.disabled=false;btn.textContent='Solicitar acceso';}
  }
}

function doResetPassword(){
  const email=(document.getElementById('login-email')?.value||'').trim();
  if(!email){toast('Introduce tu email primero en el campo de arriba','#dc2626');return;}
  if(!fbAuth){toast('Sin conexión','#dc2626');return;}
  fbAuth.sendPasswordResetEmail(email)
    .then(()=>toast('Email de recuperación enviado a '+email,'#16a34a',5000))
    .catch(e=>toast('Error: '+e.message,'#dc2626'));
}

function vSolicitudes(){
  const all=Object.values(authUsers);
  const pending=all.filter(u=>u.status==='pending').sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  const approved=all.filter(u=>u.status==='approved').sort((a,b)=>(a.restaurant||'').localeCompare(b.restaurant||'','es'));
  const rejected=all.filter(u=>u.status==='rejected');
  const allRests=cfg.users.map(u=>u.restaurant);

  const pendHtml=pending.length?pending.map(u=>`
    <div class="user-card">
      <div class="uc-hd">
        <div>
          <div class="uc-name"> ${u.email}</div>
          <div class="uc-info">${u.restaurant}${u.name&&u.name!==u.email?' · '+u.name:''} · ${fmtD(u.createdAt)}</div>
        </div>
        <div class="uc-acts" style="flex-wrap:wrap;gap:4px">
          <button class="btn btn-ok btn-sm" onclick="approveRegistration('${u.uid}')">Aprobar</button>
          <button class="btn btn-no btn-sm" onclick="rejectRegistration('${u.uid}')">✗ Rechazar</button>
        </div>
      </div>
    </div>`).join('')
    :`<div class="empty" style="padding:28px 20px"><div class="ei"></div><div class="et">Sin solicitudes pendientes</div></div>`;

  function permEditor(u){
    const curRests=u.restaurants||[u.restaurant];
    const checks=allRests.map(r=>`
      <label class="perm-check">
        <input type="checkbox" class="perm-cb-${u.uid}" value="${r}" ${curRests.includes(r)?'checked':''}>
        ${r}
      </label>`).join('');
    return `<div class="perm-editor">
      <div style="font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Locales con acceso</div>
      <div class="perm-grid">${checks}</div>
      <div style="display:flex;gap:8px;margin-top:6px">
        <button class="btn btn-pri btn-sm" onclick="saveUserRestaurants('${u.uid}')">Guardar permisos</button>
        <button class="btn btn-ghost btn-sm" onclick="S.editingPermsUid=null;render()">Cancelar</button>
      </div>
    </div>`;
  }

  function restBadges(u){
    const rests=u.restaurants||[u.restaurant];
    return rests.map(r=>`<span class="rest-pill">${r}</span>`).join('');
  }

  const apprHtml=approved.length?`
    <div class="sh" style="margin-top:20px">Usuarios activos (${approved.length})</div>
    ${approved.map(u=>{
      const isEditing=S.editingPermsUid===u.uid;
      return `
      <div class="user-card" style="${isEditing?'border-color:var(--pri);box-shadow:0 0 0 2px rgba(26,26,46,.12)':''}">
        <div class="uc-hd">
          <div style="flex:1;min-width:0">
            <div class="uc-name"> ${u.email}${u.name&&u.name!==u.email?` <span style="font-weight:400;font-size:13px;color:var(--mut)">· ${u.name}</span>`:''}</div>
            <div class="uc-info" style="margin-top:4px">${restBadges(u)} · ${u.needsApproval?'Aprobación manual':'Auto-aprobado'}</div>
          </div>
          <div class="uc-acts" style="flex-wrap:wrap;gap:4px">
            <button class="btn btn-blue btn-sm" onclick="S.editingPermsUid='${isEditing?'':u.uid}';render()"> ${isEditing?'Cerrar':'Permisos'}</button>
            <button class="btn btn-ghost btn-sm" title="${u.needsApproval?'Cambiar a auto-aprobado':'Cambiar a requiere aprobación'}" onclick="toggleNeedsApprovalAuth('${u.uid}',${!u.needsApproval})">${u.needsApproval?'Auto':'Manual'}</button>
            <button class="btn btn-no btn-xs" title="Revocar acceso" onclick="revokeUser('${u.uid}')"></button>
          </div>
        </div>
        ${isEditing?permEditor(u):''}
      </div>`}).join('')}`:'';

  const rejHtml=rejected.length?`
    <div class="sh" style="margin-top:20px">Rechazados (${rejected.length})</div>
    ${rejected.map(u=>`
    <div class="user-card" style="opacity:.55">
      <div class="uc-hd">
        <div>
          <div class="uc-name" style="text-decoration:line-through"> ${u.email}</div>
          <div class="uc-info">${u.restaurant}</div>
        </div>
        <div class="uc-acts">
          <button class="btn btn-ok btn-xs" onclick="approveRegistration('${u.uid}')">↩ Re-aprobar</button>
        </div>
      </div>
    </div>`).join('')}`:'';

  const pendingBadge=pending.length?`<span style="background:var(--acc);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:800;margin-left:6px">${pending.length}</span>`:'';
  return `<div class="sh">Solicitudes de acceso${pendingBadge}</div>${pendHtml}${apprHtml}${rejHtml}`;
}

function approveRegistration(uid){
  const u=authUsers[uid]; if(!u)return;
  const updates={status:'approved',approvedAt:new Date().toISOString(),approvedBy:cfg.adminName};
  if(!u.restaurants||!u.restaurants.length) updates.restaurants=[u.restaurant];
  fbDb.ref('authUsers/'+uid).update(updates)
    .then(()=>toast('Acceso concedido: '+u.email,'#16a34a'));
}
function rejectRegistration(uid){
  const u=authUsers[uid]; if(!u)return;
  const reason=prompt('Motivo del rechazo (opcional):');
  if(reason===null)return;
  fbDb.ref('authUsers/'+uid).update({status:'rejected',rejectedAt:new Date().toISOString(),rejectReason:reason||''})
    .then(()=>toast('Usuario rechazado','#888'));
}
function toggleNeedsApprovalAuth(uid,val){
  fbDb.ref('authUsers/'+uid).update({needsApproval:val})
    .then(()=>toast(val?'Ahora requiere aprobación manual':'Ahora se aprueba automáticamente','#16a34a'));
}
function revokeUser(uid){
  const u=authUsers[uid]; if(!u)return;
  if(!confirm('¿Revocar acceso a '+u.email+'? El usuario no podrá entrar.'))return;
  fbDb.ref('authUsers/'+uid).update({status:'rejected',revokedAt:new Date().toISOString()})
    .then(()=>toast('Acceso revocado','#888'));
}
function saveUserRestaurants(uid){
  const boxes=document.querySelectorAll(`.perm-cb-${uid}`);
  const selected=[...boxes].filter(cb=>cb.checked).map(cb=>cb.value);
  if(!selected.length){toast('Selecciona al menos un local','#dc2626');return;}
  const u=authUsers[uid]; if(!u)return;
  // Primary restaurant = first checked (or keep original if still in list)
  const primary=selected.includes(u.restaurant)?u.restaurant:selected[0];
  fbDb.ref('authUsers/'+uid).update({restaurants:selected,restaurant:primary})
    .then(()=>{ S.editingPermsUid=null; toast('Permisos actualizados','#16a34a'); });
}

function saveOrder(o){
  if(fbDb) fbDb.ref('orders/'+o.id).set(o);
  else { orders.unshift(o); }
}
function updateOrder(id, data){
  if(fbDb) fbDb.ref('orders/'+id).update(data);
  else { const o=orders.find(x=>x.id===id); if(o) Object.assign(o,data); }
}

}

function fmt(n){ return (parseFloat(n)||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
// Muestra la cantidad con conversión si aplica: "2 Cajas (18 Kg)"
function convQtyStr(qty, unit, baseUnit, conversions){
  if(!conversions||!conversions.length||unit===baseUnit) return `${qty} ${unit}`;
  const conv=(conversions||[]).find(c=>c.fromUnit===unit);
  if(!conv) return `${qty} ${unit}`;
  const bq=parseFloat((qty*conv.factor).toFixed(3));
  const bqFmt=bq%1===0?bq:bq.toFixed(2);
  return `${qty} ${unit} (${bqFmt} ${baseUnit})`;
}
function pkgLabel(p){
  const price=parseFloat(p.price)||0;
  const unit=(p.unit||'KG').trim();
  if(unit==='KG'||unit==='L') return `${fmt(price)} / ${unit}`;
  if(unit==='g') return `${fmt(price*1000)} / KG`;
  if(p.pesoGr&&p.pesoGr>0){
    const kgPrice=(price/p.pesoGr)*1000;
    return `${fmt(kgPrice)} / KG <span style="font-size:11px;color:var(--mut);font-weight:400">(${fmt(price)} ${unit})</span>`;
  }
  return `${fmt(price)} / ${unit}`;
}
function fmtD(iso){ try{return new Date(iso).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return iso||'—';} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function total(o){ return (o.items||[]).reduce((s,it)=>s+(parseFloat(it.qty)||0)*(parseFloat(it.price)||0),0); }
function toast(msg,col='#222',dur=3500){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=col;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',dur);
}
function waURL(phone,text){ return `https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(text)}`; }

  } else {
    const u=cfg.users.find(u=>u.id===userId);
    if(u&&S.pinBuf===u.pin){closePIN();S.session={userId:u.id,name:u.name,restaurant:u.restaurant,isAdmin:false,needsApproval:u.needsApproval};goOrder();}
    else wrong();
  }
}
function wrong(){ S.pinBuf='';updateDots();const e=document.getElementById('pin-err');e.style.display='block';setTimeout(()=>e.style.display='none',2000); }
document.addEventListener('keydown',e=>{
  if(document.getElementById('pin-ov').style.display==='none') return;
  if(e.key>='0'&&e.key<='9') addPIN(e.key);
  else if(e.key==='Backspace') delPIN();
  else if(e.key==='Enter') confirmPIN();
});

/* ═══════════════ RENDER ═══════════════ */
function render(){
  const app=document.getElementById('app');
  if(S.view==='login')              app.innerHTML=vLogin();
  else if(S.view==='pending-approval') app.innerHTML=vPendingApproval();
  else if(S.view==='order')         app.innerHTML=vOrder();
  else if(S.view==='admin'){        app.innerHTML=vAdmin();
    if(S.adminTab==='escandallos') setTimeout(initEscandallos,50);
  }
  else if(S.view==='albaran-new') app.innerHTML=vAlbaranNew();
}

function renderAdminContent(){
  const tc=document.getElementById('tc');
  if(!tc) return;
  // No interrumpir modales abiertos
  if(S.adminTab==='escandallos' && document.getElementById('esc-modal-ov')?.style.display==='flex') return;
  if(S.adminTab==='recetas'     && document.getElementById('rec-modal-ov')?.style.display==='flex') return;
  if(S.adminTab==='inventario'  && S.invEditId) return; // formulario inline abierto
  const _sv=window.scrollY;
  let content='';
  if(S.adminTab==='pending')       content=vPending();
  else if(S.adminTab==='approved') content=vApproved();
  else if(S.adminTab==='consolidated') content=vConsolidated();
  else if(S.adminTab==='received') content=vReceived();
  else if(S.adminTab==='budgets')  content=vBudgets();
  else if(S.adminTab==='compare')  content=vCompare();
  else if(S.adminTab==='productos')  content=vProductos();
  else if(S.adminTab==='albaranes') content=vAlbaranes();
  else if(S.adminTab==='solicitudes') content=vSolicitudes();
  else if(S.adminTab==='suppliers') content=vSuppliers();
  else if(S.adminTab==='settings') content=vSettings();
  else if(S.adminTab==='escandallos') content=vEscandallos();
  else if(S.adminTab==='recetas') content=vRecetas();
  else if(S.adminTab==='sup-history') content=vSupHistory();
  else if(S.adminTab==='inventario') content=vInventario();
  tc.innerHTML=content;
  if(S.adminTab==='escandallos') initEscandallos();
  if(S.adminTab==='budgets') setTimeout(renderBudgetTrendChart,100);
  // Update sidebar stats
  const pend=orders.filter(o=>o.status==='pending');
  const appr=orders.filter(o=>o.status==='approved');
  const sbStatsEl=document.getElementById('sb-stats');
  if(sbStatsEl) sbStatsEl.innerHTML=buildSbStats(pend,appr);
  // Update pending badge in sidebar
  const sbBadge=document.getElementById('sb-pend-badge');
  if(sbBadge){sbBadge.textContent=pend.length;sbBadge.style.display=pend.length?'':'none';}
  requestAnimationFrame(()=>window.scrollTo(0,_sv));
}

function vOrder(){
  const myRests=S.session.restaurants||[S.session.restaurant];

  if(!myRests.includes(S.session.restaurant)) S.session.restaurant=myRests[0];
  const myPending=orders.filter(o=>o.restaurant===S.session.restaurant&&o.status==='pending').length;
  const histBadge=myPending?` <span style="background:var(--acc);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px">${myPending}</span>`:'';
  const adminBanner=S.session.isAdminOrder?`<div style="background:#fef3c7;border:1.5px solid #fde68a;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <span style="font-weight:600;color:#92400e">Admin — pedido para <strong>${S.session.restaurant}</strong></span>

  </div>`:'';

    <button class="tab ${S.orderTab==='new'?'act':''}" onclick="S.orderTab='new';render()">Hacer pedido</button>
    <button class="tab ${S.orderTab==='history'?'act':''}" onclick="S.orderTab='history';render()"> Mis pedidos${histBadge}</button>
    <button class="tab ${S.orderTab==='gastos'?'act':''}" onclick="S.orderTab='gastos';render()">Mi gasto</button>
    <button class="tab ${S.orderTab==='escandallos'?'act':''}" onclick="S.orderTab='escandallos';render()">Escandallos</button>
    <button class="tab ${S.orderTab==='inventario'?'act':''}" onclick="S.orderTab='inventario';render()">Inventario</button>
  </div>`;
  const restPickerHtml=myRests.length>1?`<div class="rest-picker">
    <div class="rest-picker-lbl">Pedido para</div>
    ${myRests.map(r=>`<button class="stab ${S.session.restaurant===r?'act':''}" onclick="S.session.restaurant='${r.replace(/'/g,"\\'")}';S.cart={};S.orderTab='new';render()">${r}</button>`).join('')}
  </div>`:'';

  if(S.orderTab==='history'){
    return `<div class="main">${adminBanner}${tabsHtml}${myRests.length>1?restPickerHtml:''}${vMyOrders()}</div>`;
  }
  if(S.orderTab==='gastos'){
    return `<div class="main">${adminBanner}${tabsHtml}${myRests.length>1?restPickerHtml:''}${vLocalGastos()}</div>`;
  }
  if(S.orderTab==='escandallos'){
    if(!_escInit&&fbDb) initEscandallos();
    return `<div class="main">${adminBanner}${tabsHtml}${myRests.length>1?restPickerHtml:''}${vLocalEscandallos()}</div>`;
  }
  if(S.orderTab==='inventario'){
    return `<div class="main">${adminBanner}${tabsHtml}${myRests.length>1?restPickerHtml:''}${vLocalInventario(S.session.restaurant)}</div>`;
  }

  const sups=visibleSups();
  if(!sups.length) return `<div class="main">${adminBanner}${tabsHtml}<div class="empty"><div class="ei"></div><div class="et">No hay proveedores activos para este local.</div></div></div>`;
  if(!suppliers[S.supId]||!(sups.find(s=>s.id===S.supId))) S.supId=sups[0].id;
  const sup=suppliers[S.supId];
  const cnt=Object.values(S.cart).reduce((s,sc2)=>s+Object.values(sc2).reduce((a,v)=>a+v,0),0);
  const tot=Object.entries(S.cart).reduce((s,[sid,sc2])=>{const sp=suppliers[sid];if(!sp)return s;return s+(sp.products||[]).reduce((a,p)=>a+(sc2[p.id]||0)*p.price,0);},0);
  const supCnt=Object.keys(S.cart).length;
  const _approvalMin=cfg.approvalMinAmount||0;
  const note=S.session.needsApproval
    ?(_approvalMin>0
      ?`<div class="banner"> Pedidos <strong>por encima de ${fmt(_approvalMin)}</strong> irán a <strong>${cfg.adminName}</strong> para aprobación. Los pedidos menores se aprueban automáticamente.</div>`
      :`<div class="banner"> Tu pedido irá a <strong>${cfg.adminName}</strong> para aprobación antes de enviarse al proveedor.</div>`)
    :`<div class="banner blue">Tus pedidos se aprueban automáticamente y van directo al proveedor.</div>`;
  const _vacUser=cfg.users.find(u=>u.restaurant===S.session.restaurant);
  const vacBanner=_vacUser&&_vacUser.vacaciones?'<div class="banner" style="background:#fef3c7;border-color:#f59e0b;color:#92400e">Modo vacaciones activo — los pedidos están desactivados temporalmente</div>':'';
  const stabs=sups.map(s=>{const sc2=S.cart[s.id]||{};const n=Object.values(sc2).reduce((a,v)=>a+v,0);return `<button class="stab ${S.supId===s.id?'act':''}" onclick="setSup('${s.id}')">${s.emoji} ${s.name}${n>0?` <span style="background:#3b82f6;color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;font-weight:700">${n}</span>`:''}</button>`;}).join('');
  const searchTerm=(S.prodSearch||'').toLowerCase().trim();
  const filteredProds=sup.products.filter(p=>!searchTerm||p.name.toLowerCase().includes(searchTerm));
  const _UNITS=['KG','L','UN','Caja'];
  function mkProdCard(p){
    const q=(S.cart[S.supId]||{})[p.id]||0;
    const selUnit=(S.cartUnits[S.supId]||{})[p.id]||p.unit;
    const unitBtns=_UNITS.map(u=>`<button class="ubt${selUnit===u?' ubt-on':''}" onclick="setUnit('${p.id}','${u}');event.stopPropagation()">${u}</button>`).join('');
    return `<div class="pi ${q>0?'ic':''}" id="pi-${p.id}">
      <div class="pi-i"><div class="pi-n">${p.name}</div><div class="pi-p">${pkgLabel(p)}</div></div>

        <button class="qb" onclick="chgQ('${p.id}',-1)">−</button>

    </div>`;
  }

    prods=`<div class="pgrid">${filteredProds.map(mkProdCard).join('')}</div>`;
  } else {
    const byCat={};
    filteredProds.forEach(p=>{ const c=p.category||'Otros'; if(!byCat[c])byCat[c]=[]; byCat[c].push(p); });

        </div>`).join('');
    }
  }
  const myTpls=Object.values(templates[S.session.userId]||{}).filter(t=>t.supId===S.supId);
  // Auto-suggest: most ordered products for this restaurant+supplier
  const myHistory=orders.filter(o=>o.restaurant===S.session.restaurant&&o.supId===S.supId&&o.status!=='rejected');
  const autoSuggest={};
  myHistory.forEach(o=>(o.items||[]).forEach(it=>{if(!autoSuggest[it.id])autoSuggest[it.id]={...it,count:0,totalQty:0};autoSuggest[it.id].count++;autoSuggest[it.id].totalQty+=it.qty;}));
  const topProds=Object.values(autoSuggest).sort((a,b)=>b.count-a.count).slice(0,5);
  const autoBtn=topProds.length&&!Object.keys(S.cart[S.supId]||{}).length?`<button class="btn btn-blue btn-sm" onclick="loadAutoSuggest()" style="white-space:nowrap">Pedido típico</button>`:'';
  // Recurring templates
  const _today=new Date();
  const _todayWD=_today.getDay();
  const _todayDOM=_today.getDate();
  const _todayKey=_today.toISOString().split('T')[0];
  const _myTplsAll=Object.values(templates[S.session.userId]||{});
  const _recurringDue=_myTplsAll.filter(t=>{
    if(!t.recurrence||t.recurrence.type==='none') return false;
    if(t.lastAutoDate===_todayKey) return false;
    if(t.recurrence.type==='weekly') return _todayWD===t.recurrence.weekday;
    if(t.recurrence.type==='monthly') return _todayDOM===t.recurrence.dayOfMonth;
    return false;
  });
  const recurringBanner=_recurringDue.length?`<div class="banner blue" style="margin-bottom:10px">
    <strong>Pedidos recurrentes pendientes:</strong>
    ${_recurringDue.map(t=>`<div style="margin-top:6px;display:flex;align-items:center;gap:8px">
      <span>${t.name} (${(suppliers[t.supId]||{name:t.supId}).name})</span>
      <button class="btn btn-blue btn-sm" onclick="loadRecurringTpl('${t.id}')">Cargar</button>
    </div>`).join('')}
  </div>`:'';
  const tplSection=`<div class="sh" style="margin-top:4px">Plantillas</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      ${autoBtn}
      ${myTpls.map(t=>`<div style="display:flex;gap:2px"><button class="btn btn-ghost btn-sm" onclick="loadTemplate('${t.id}')" style="border-radius:6px 0 0 6px">📥 ${t.name}</button><button class="btn btn-no btn-sm" onclick="deleteTpl('${t.id}')" style="border-radius:0 6px 6px 0;padding:0 8px">✕</button></div>`).join('')}
      ${Object.keys(S.cart[S.supId]||{}).length>0?`<button class="btn btn-ghost btn-sm" onclick="S.showSaveTemplate=!S.showSaveTemplate;render()">Guardar</button>`:''}
    </div>
    ${S.showSaveTemplate?`<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">
      <div style="display:flex;gap:6px"><input type="text" id="tpl-name" placeholder="Nombre de la plantilla..." style="flex:1;padding:6px 10px;border:1px solid var(--brd);border-radius:6px;font-size:13px"/></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <select id="tpl-recur" style="padding:6px;border:1px solid var(--brd);border-radius:6px;font-size:13px;background:var(--card);color:var(--txt)">
          <option value="none">Sin repetición</option>
          <option value="weekly">Semanal</option>
          <option value="monthly">Mensual</option>
        </select>
        <select id="tpl-recur-day" style="padding:6px;border:1px solid var(--brd);border-radius:6px;font-size:13px;background:var(--card);color:var(--txt)">
          <option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option>
          <option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option>
          ${Array.from({length:28},(_,i)=>`<option value="d${i+1}">${i+1} de cada mes</option>`).join('')}
        </select>
        <button class="btn btn-pri btn-sm" onclick="saveTpl()">Guardar</button>
      </div>
    </div>`:''}`;
  return `<div class="main">
    ${adminBanner}${tabsHtml}${restPickerHtml}${note}
    ${vacBanner}
    ${recurringBanner}
    ${tplSection}
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 0 6px">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 14px;border-radius:10px;border:2px solid ${S.orderUrgent?'#dc2626':'var(--brd)'};background:${S.orderUrgent?'#fff1f2':'var(--card)'};transition:.2s">
        <input type="checkbox" id="ord-urg" ${S.orderUrgent?'checked':''} onchange="S.orderUrgent=this.checked;render()" style="width:16px;height:16px;accent-color:#dc2626">
        <span style="font-weight:700;font-size:13px;color:${S.orderUrgent?'#dc2626':'var(--txt)'}">Urgente</span>
      </label>
      <div style="flex:1;min-width:160px">
        <label style="font-size:11px;color:var(--mut);display:block;margin-bottom:3px">Entrega deseada</label>
        <input type="date" value="${S.orderDeliveryDate||''}" onchange="S.orderDeliveryDate=this.value" style="padding:7px 10px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;width:100%;background:var(--card);color:var(--txt)">
      </div>
    </div>
    <div class="sh">Proveedor</div>
    <div class="sup-tabs">${stabs}</div>

function vMyOrders(){
  const myRests=S.session.restaurants||[S.session.restaurant];
  // When filtering history: show orders for the active restaurant (if picker used) or all allowed restaurants
  const filterRest=myRests.length>1?S.session.restaurant:S.session.restaurant;
  const mine=orders.filter(o=>o.restaurant===filterRest)
    .sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(!mine.length) return `<div class="empty"><div class="ei"></div><div class="et">Aún no has hecho ningún pedido</div></div>`;
  return mine.map(o=>{
    const sup=suppliers[o.supId]||{name:'?',emoji:'?'};
    const tot=total(o);
    const sMap={
      pending: {cls:'b-p', lbl:' Pendiente de aprobación'},
      approved:{cls:'b-a', lbl:'Aprobado'},
      rejected:{cls:'b-r', lbl:'✗ Rechazado'},
      received:{cls:'b-recv',lbl:' Recibido'}
    };
    const s=sMap[o.status]||{cls:'b-p',lbl:o.status};
    const modTag=o.modifiedByAdmin?`<span class="badge b-f" style="margin-left:6px"> Modificado</span>`:'';
    const urgTag=o.urgent?`<span class="badge b-urg" style="margin-left:6px">URGENTE</span>`:'';
    const delTag=o.deliveryDate?`<span style="font-size:11px;color:var(--mut);margin-left:6px"> Entrega: ${o.deliveryDate}</span>`:'';
    const rows=(o.items||[]).map(it=>`<div class="pr"><span class="pn">${it.name||'?'}</span><span class="pq">${convQtyStr(it.qty,it.unit,it.baseUnit||it.unit,it.conversions)}</span><span class="pp">${fmt((it.qty||0)*(it.price||0))}</span></div>`).join('');
    const rejNote=o.status==='rejected'&&o.rejectReason?`<div class="banner red" style="margin-top:8px">${o.rejectReason}</div>`:'';
    const recvBtn=o.status==='approved'?`<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="markReceived('${o.id}')">Confirmar recepción</button>`:'';
    return `<div class="oc" ${o.urgent?'style="border-color:#dc2626"':''}>
      <div class="oc-hd">
        <div>
          <div class="oc-rest">${sup.emoji} ${sup.name}${modTag}${urgTag}</div>
          <div class="oc-sub">${fmtD(o.createdAt||'')} · <span class="badge ${s.cls}">${s.lbl}</span>${delTag}</div>
        </div>
      </div>
      <div class="pl">${rows}<div class="ptot">Total: ${fmt(tot)}</div></div>
      ${rejNote}${recvBtn}
    </div>`;
  }).join('');
}

/* ═══════════════ LOCAL GASTOS ═══════════════ */
function vLocalGastos(){
  const rest=S.session.restaurant;
  const now=new Date();
  const curKey=now.toISOString().slice(0,7); // 'YYYY-MM'
  const monthName=now.toLocaleString('es-ES',{month:'long',year:'numeric'});

  // Pedidos del mes (aprobados + recibidos)
  const monthOrders=orders.filter(o=>o.restaurant===rest&&(o.status==='approved'||o.status==='received')&&(o.createdAt||'').startsWith(curKey));
  const monthTotal=monthOrders.reduce((s,o)=>s+total(o),0);

  // Desglose por proveedor con productos
  const bySupMap={};
  monthOrders.forEach(o=>{
    if(!bySupMap[o.supId]){const sup=suppliers[o.supId]||{};bySupMap[o.supId]={name:sup.name||o.supId,emoji:sup.emoji||'',total:0,orders:0,prods:{}};}
    bySupMap[o.supId].total+=total(o);
    bySupMap[o.supId].orders++;
    (o.items||[]).forEach(it=>{
      if(!bySupMap[o.supId].prods[it.id]) bySupMap[o.supId].prods[it.id]={name:it.name,unit:it.unit,price:it.price,qty:0,cost:0};
      bySupMap[o.supId].prods[it.id].qty+=it.qty;
      bySupMap[o.supId].prods[it.id].cost+=(it.qty||0)*(it.price||0);
    });
  });
  const bySupList=Object.values(bySupMap).sort((a,b)=>b.total-a.total);
  if(!S.gastoExpanded) S.gastoExpanded={};

  const gastoHtml=monthTotal>0?`
    <div style="background:linear-gradient(135deg,var(--pri),#3b82f6);color:#fff;border-radius:14px;padding:20px;margin-bottom:16px;text-align:center">
      <div style="font-size:13px;opacity:.85;margin-bottom:4px">Gasto en ${monthName}</div>
      <div style="font-size:32px;font-weight:800">${fmt(monthTotal)}</div>
      <div style="font-size:12px;opacity:.75;margin-top:4px">${monthOrders.length} pedido${monthOrders.length!==1?'s':''}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">
      ${bySupList.map(s=>{
        const pct=monthTotal>0?Math.round(s.total/monthTotal*100):0;
        const supId=Object.keys(bySupMap).find(k=>bySupMap[k]===s);
        const expanded=S.gastoExpanded[supId];
        const prodRows=Object.values(s.prods).sort((a,b)=>b.cost-a.cost).map(p=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--brd);font-size:12px">
            <span style="color:var(--txt)">${p.name} <span style="color:var(--mut)">(${p.qty} ${p.unit})</span></span>
            <span style="font-weight:600">${fmt(p.cost)}</span>
          </div>`).join('');
        return `<div style="background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px 14px;cursor:pointer" onclick="S.gastoExpanded['${supId}']=!S.gastoExpanded['${supId}'];render()">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-weight:600">${s.emoji} ${s.name}</span>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-weight:700;color:var(--pri)">${fmt(s.total)}</span>
              <span style="font-size:12px;color:var(--mut)">${expanded?'▲':'▼'}</span>
            </div>
          </div>
          <div style="background:var(--brd);border-radius:4px;height:6px">
            <div style="background:var(--pri);border-radius:4px;height:6px;width:${pct}%"></div>
          </div>
          <div style="font-size:11px;color:var(--mut);margin-top:4px">${pct}% del total · ${s.orders} pedido${s.orders!==1?'s':''}</div>
          ${expanded?`<div style="margin-top:8px">${prodRows}</div>`:''}
        </div>`;
      }).join('')}
    </div>`
  :`<div class="empty" style="margin-bottom:20px"><div class="ei" style="font-size:36px;font-weight:800;color:var(--brd)">—</div><div class="et">Sin pedidos aprobados en ${monthName}</div></div>`;

  // Comparador de precios
  const sups=visibleSups();
  const search=(S.precioSearch||'').toLowerCase().trim();

  // Colectar todos los productos de todos los proveedores visibles
  const prodMap={}; // normName -> [{supId, supName, supEmoji, price, unit, origName}]
  sups.forEach(s=>{
    (s.products||[]).forEach(p=>{
      const norm=p.name.toLowerCase().trim();
      if(!prodMap[norm]) prodMap[norm]=[];
      prodMap[norm].push({supId:s.id,supName:s.name,supEmoji:s.emoji,price:p.price,unit:p.unit,origName:p.name});
    });
  });

  // Solo mostrar productos que aparecen en >1 proveedor O que coincidan con búsqueda
  let entries=Object.entries(prodMap);
  if(search) entries=entries.filter(([norm])=>norm.includes(search));
  else entries=entries.filter(([,list])=>list.length>1);
  entries.sort(([a],[b])=>a.localeCompare(b,'es'));

  const comparadorHtml=`
    <div class="sh">Comparador de precios</div>
    <div style="font-size:12px;color:var(--mut);margin-bottom:10px">Productos disponibles en varios proveedores. El más barato aparece destacado.</div>
    <div style="position:relative;margin-bottom:12px">
      <input type="text" placeholder="Buscar producto..." value="${S.precioSearch||''}"
        oninput="S.precioSearch=this.value;render()"
        style="width:100%;padding:9px 12px;border:1.5px solid var(--brd);border-radius:8px;font-size:14px;background:var(--card);color:var(--txt);box-sizing:border-box"/>
    </div>
    ${entries.length?entries.map(([norm,list])=>{
      const sorted=[...list].sort((a,b)=>a.price-b.price);
      const minPrice=sorted[0].price;
      return `<div style="background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px 14px;margin-bottom:8px">
        <div style="font-weight:600;margin-bottom:8px;text-transform:capitalize">${sorted[0].origName}</div>
        ${sorted.map((p,i)=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;${i<sorted.length-1?'border-bottom:1px solid var(--brd)':''}">
            <span style="font-size:13px">${p.supEmoji} ${p.supName}</span>
            <span style="display:flex;align-items:center;gap:6px">
              <span style="font-weight:700;color:${p.price===minPrice?'#16a34a':'var(--txt)'}">${fmt(p.price)}<span style="font-size:11px;font-weight:400;color:var(--mut)"> / ${p.unit}</span></span>
              ${p.price===minPrice&&list.length>1?'<span style="background:#dcfce7;color:#15803d;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px">MEJOR PRECIO</span>':''}
            </span>
          </div>`).join('')}
      </div>`;
    }).join(''):`<div class="empty"><div class="ei"></div><div class="et">${search?'Sin resultados para "'+search+'"':'Sin productos en varios proveedores'}</div></div>`}`;

  return gastoHtml+comparadorHtml;
}

      ${o.urgent?`<span style="background:#fff;color:#dc2626;border-radius:8px;padding:1px 8px;font-size:11px;font-weight:800">URGENTE</span>`:''}
      ${issuesTag}
    </div>
    <div class="oc-hd">
      <div><div class="oc-rest" style="font-size:13px;color:var(--mut);font-weight:600">${sup.emoji} ${sup.name}${modTag}</div>
      <div class="oc-sub">${fmtD(o.createdAt)} · <span class="badge ${bc}">${bl}</span>${delTag}</div></div>
      ${acts}
    </div>
    ${largeAlert}${budgetAlert}
    ${o.approvalNote?`<div style="background:#f0fdf4;border-left:3px solid #16a34a;border-radius:0 6px 6px 0;padding:6px 10px;margin:4px 0 6px;font-size:12px;color:#166534">Admin: ${o.approvalNote}</div>`:''}
    ${o.notes?`<div style="background:var(--bg);border-left:3px solid var(--pri);border-radius:0 6px 6px 0;padding:6px 10px;margin:4px 0 6px;font-size:12px;color:var(--txt)"> <em>${o.notes}</em></div>`:''}

function chatHTML(o){
  const msgs = orderComments[o.id]||[];
  const isAdmin = S.session?.isAdmin;
  const author = isAdmin ? (cfg.adminName||'Admin') : (S.session?.name||S.session?.restaurant||'Local');
  const open = S.chatOpen===o.id;
  const unread = msgs.length;
  const badge = unread>0 ? `<span style="background:#e11d48;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:6px">${unread}</span>` : '';
  if(!open) return `<div style="margin-top:8px"><button class="btn btn-ghost btn-sm" style="font-size:12px" onclick="S.chatOpen='${o.id}';renderAdminContent&&renderAdminContent();render&&(S.view==='order'?render():null)">Chat interno${badge}</button></div>`;
  const msgsHtml = msgs.length ? msgs.map(m=>`
    <div style="display:flex;flex-direction:column;align-items:${m.isAdmin?'flex-end':'flex-start'};margin-bottom:6px">
      <div style="max-width:80%;background:${m.isAdmin?'var(--pri)':'var(--srf)'};color:${m.isAdmin?'#fff':'var(--txt)'};border-radius:${m.isAdmin?'12px 12px 2px 12px':'12px 12px 12px 2px'};padding:7px 12px;font-size:13px">${m.text}</div>
      <div style="font-size:10px;color:var(--mut);margin-top:2px">${m.author} · ${m.ts?new Date(m.ts).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}</div>
    </div>`).join('') : `<div style="color:var(--mut);font-size:12px;text-align:center;padding:8px 0">Sin mensajes aún</div>`;
  return `<div style="margin-top:10px;border-top:1px solid var(--brd);padding-top:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:13px;font-weight:600">Chat interno</span>
      <button class="btn btn-ghost btn-sm" style="font-size:11px" onclick="S.chatOpen=null;renderAdminContent&&renderAdminContent();render&&(S.view==='order'?render():null)">▲ Cerrar</button>
    </div>
    <div style="max-height:200px;overflow-y:auto;margin-bottom:8px;padding:4px 0">${msgsHtml}</div>
    <div style="display:flex;gap:6px">
      <input id="chat-input-${o.id}" type="text" placeholder="Escribe un mensaje..." style="flex:1;padding:7px 10px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;background:#fff;color:var(--txt)" onkeydown="if(event.key==='Enter')sendOrderChat('${o.id}','${author}',${isAdmin?'true':'false'})"/>
      <button class="btn btn-pri btn-sm" onclick="sendOrderChat('${o.id}','${author}',${isAdmin?'true':'false'})">Enviar</button>
    </div>
  </div>`;
}
function sendOrderChat(oid, author, isAdmin){
  const inp = document.getElementById('chat-input-'+oid);
  if(!inp) return;
  const text = inp.value.trim(); if(!text) return;
  if(!fbDb){toast('Sin conexión Firebase','#dc2626');return;}
  const msg = {id:uid(), author, isAdmin:!!isAdmin, text, ts:Date.now()};
  fbDb.ref('orderComments/'+oid+'/'+msg.id).set(msg);
  inp.value='';
}
function restFilterTabs(ordersForCount, stateKey){
  const allRests=[...new Set(ordersForCount.map(o=>o.restaurant||'').filter(Boolean))].sort();
  if(allRests.length<2) return '';
  const cur=S[stateKey]||null;
  const tabs=[`<button class="stab ${!cur?'act':''}" onclick="S.${stateKey}=null;render()">🏠 Todos (${ordersForCount.length})</button>`,
    ...allRests.map(r=>{const cnt=ordersForCount.filter(o=>o.restaurant===r).length;return`<button class="stab ${cur===r?'act':''}" onclick="S.${stateKey}='${r.replace(/'/g,"\\'")}';render()">${r} (${cnt})</button>`;})
  ].join('');
  return `<div class="sup-tabs" style="margin-bottom:14px;flex-wrap:wrap">${tabs}</div>`;
}

function vPending(){
  const all=orders.filter(o=>o.status==='pending');
  const tabs=restFilterTabs(all,'pendingRestFilter');
  const p=S.pendingRestFilter?all.filter(o=>o.restaurant===S.pendingRestFilter):all;
  return tabs+(p.length?p.map(o=>orderCard(o,true)).join(''):`<div class="empty"><div class="ei"></div><div class="et">Sin pedidos pendientes${S.pendingRestFilter?' en '+S.pendingRestFilter:''}</div></div>`);
}
function vApproved(){
  const all=orders.filter(o=>o.status==='approved');
  const tabs=restFilterTabs(all,'approvedRestFilter');
  const a=S.approvedRestFilter?all.filter(o=>o.restaurant===S.approvedRestFilter):all;
  return tabs+(a.length?a.map(o=>orderCard(o,false)).join(''):`<div class="empty"><div class="ei"></div><div class="et">Sin pedidos aprobados${S.approvedRestFilter?' en '+S.approvedRestFilter:''}</div></div>`);
}

function vConsolidated(){
  const pend=orders.filter(o=>o.status==='pending');
  if(!pend.length) return `<div class="empty"><div class="ei"></div><div class="et">No hay pedidos pendientes</div></div>`;
  const bySup={};
  pend.forEach(o=>{ if(!bySup[o.supId])bySup[o.supId]={}; (o.items||[]).forEach(it=>{ if(!bySup[o.supId][it.id])bySup[o.supId][it.id]={...it,qty:0,rests:[]}; bySup[o.supId][it.id].qty+=it.qty; bySup[o.supId][it.id].rests.push((o.restaurant||'').replace("",'')); }); });
  return Object.entries(bySup).map(([sid,items])=>{
    const sup=suppliers[sid]||{name:sid,emoji:'',phone:''};
    const arr=Object.values(items);
    const tot=arr.reduce((s,it)=>s+(parseFloat(it.qty)||0)*(parseFloat(it.price)||0),0);
    const co={supId:sid,restaurant:`Consolidado`,items:arr,createdAt:new Date().toISOString()};
    const rows=arr.map(it=>`<div class="pr"><span class="pn">${it.name} <small style="color:var(--mut)">(${[...new Set(it.rests)].length}r)</small></span><span class="pq">${it.qty} ${it.unit}</span><span class="pp">${fmt(it.qty*it.price)}</span></div>`).join('');
    return `<div class="cc"><div class="cc-hd"><div class="cc-name">${sup.emoji} ${sup.name}</div>
      <button class="btn btn-wa btn-sm" onclick="showWA('${sup.phone||''}',msgSupplier(${JSON.stringify(co).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}), 'Pedido consolidado')">${WA_SVG} Enviar</button>
    </div><div class="pl">${rows}<div class="ptot">Total: ${fmt(tot)}</div></div></div>`;
  }).join('');
}

/* ═══════════════ ALBARANES ═══════════════ */
function vAlbaranes(){
  const btn=`<button class="btn btn-pri btn-sm" onclick="goAlbaranAdmin()" style="margin-bottom:14px">+ Nuevo albarán</button>`;
  const byRest={};
  orders.filter(o=>o.status==='approved'||o.status==='received').forEach(o=>{ if(!byRest[o.restaurant])byRest[o.restaurant]={ordered:0,received:0}; byRest[o.restaurant].ordered+=total(o); });
  albNotes.forEach(a=>{ if(!byRest[a.restaurant])byRest[a.restaurant]={ordered:0,received:0}; const calcT=(a.items||[]).reduce((s,it)=>s+(parseFloat(it.qty)||0)*(parseFloat(it.price)||0),0); byRest[a.restaurant].received+=(a.totalManual!=null?a.totalManual:calcT); });
  const tableRows=Object.entries(byRest).map(([rest,d])=>{
    const diff=d.received-d.ordered;
    const pct=d.ordered>0?((diff/d.ordered)*100).toFixed(1):'-';
    const cls=Math.abs(diff)<1?'diff-ok':diff>0?'diff-err':'diff-warn';
    return `<tr><td>${(rest||'').replace("",'')}</td><td>${fmt(d.ordered)}</td><td>${fmt(d.received)}</td><td class="${cls}">${diff>=0?'+':''}${fmt(diff)}${pct!=='-'?' ('+pct+'%)':''}</td></tr>`;
  }).join('');
  const table=tableRows?`<div class="card"><div class="card-t">Pedido vs Recibido por local</div><div style="overflow-x:auto"><table class="spend-table"><tr><th>Local</th><th>Pedido</th><th>Recibido</th><th>Diferencia</th></tr>${tableRows}</table></div></div>`:'';
  const notes=albNotes.length?albNotes.map(a=>albCard(a)).join(''):`<div class="empty"><div class="ei"></div><div class="et">Sin albaranes registrados</div></div>`;
  return btn+table+`<div class="sh">Albaranes</div>`+notes;
}

function goAlbaranAdmin(){ S.view='albaran-new';S.albItems=[];S.albRestaurant='';S.albSupId=supList()[0]?.id||'';S.albPhoto=null;S.albFileType=null;S.albFileName=null;S.albDate=new Date().toISOString().split('T')[0];S.albTotalManual=null;render(); }

function albCard(a){
  const sup=suppliers[a.supId]||{name:'?',emoji:'?'};
  const totCalc=(a.items||[]).reduce((s,it)=>s+(parseFloat(it.qty)||0)*(parseFloat(it.price)||0),0);
  const tot=a.totalManual!=null?a.totalManual:totCalc;
  const matchOrder=orders.find(o=>o.restaurant===a.restaurant&&o.supId===a.supId&&o.status==='approved');
  const matchingOrders=orders.filter(o=>(o.status==='approved'||o.status==='received')&&o.restaurant===a.restaurant&&o.supId===a.supId);
  const linkedOrder=a.orderId?orders.find(o=>o.id===a.orderId):null;
  const linkSection=a.orderId
    ? `<div style="font-size:12px;color:#16a34a;margin-top:6px"> Vinculado a pedido del ${fmtD(linkedOrder?linkedOrder.createdAt:'')}</div>`
    : matchingOrders.length
      ? `<select onchange="linkAlbToOrder('${a.id}',this.value)" style="font-size:12px;padding:4px 6px;border:1px solid var(--brd);border-radius:6px;background:var(--card);color:var(--txt);margin-top:6px;width:100%"><option value=""> Vincular a pedido…</option>${matchingOrders.map(o=>`<option value="${o.id}">Pedido ${fmtD(o.createdAt)} — ${fmt(total(o))}</option>`).join('')}</select>`
      : '';
  const hasIncidents=(a.items||[]).some(it=>it.incident);
  const rows=(a.items||[]).map(it=>`<div class="pr" style="${it.incident?'background:#fff5f5;border-radius:6px;padding:4px 6px;margin-bottom:2px':''}"><span class="pn">${it.code?`<small style="color:var(--mut)">[${it.code}]</small> `:''} ${it.name}${it.incident?`<div style="font-size:11px;color:#dc2626;margin-top:2px">${it.incident}</div>`:''}</span><span class="pq">${it.qty} ${it.unit}</span><span class="pp">${fmt((parseFloat(it.qty)||0)*(parseFloat(it.price)||0))}</span></div>`).join('');
  let cmp='';
  if(matchOrder){
    const cmpRows=(a.items||[]).map(ai=>{
      const oi=(matchOrder.items||[]).find(x=>x.name.toLowerCase()===ai.name.toLowerCase());
      if(!oi) return `<div class="cmp-cell cmp-warn"><div class="cmp-name">${ai.name}</div><div class="cmp-val">No estaba en el pedido</div></div>`;
      const qDiff=ai.qty-oi.qty;
      const cls=qDiff===0?'cmp-ok':Math.abs(qDiff/oi.qty)<0.05?'cmp-warn':'cmp-err';
      return `<div class="cmp-cell ${cls}"><div class="cmp-name">${ai.name}</div><div class="cmp-val">Pedido: ${oi.qty} · Recibido: ${ai.qty}${qDiff!==0?` (${qDiff>0?'+':''}${qDiff})`:' ✓'}</div></div>`;
    }).join('');
    cmp=`<div class="sh" style="margin-top:12px">Comparativa con pedido</div>${cmpRows}`;
  }
  return `<div class="alb-card">
    <div class="alb-hd">
      <div><div class="alb-rest">${a.restaurant}</div><div class="alb-info">${sup.emoji} ${sup.name} · ${new Date(a.date+'T00:00:00').toLocaleDateString('es-ES')}</div></div>
      <div style="display:flex;gap:6px">${hasIncidents?`<span class="badge" style="background:#dc2626;color:#fff">Incid.</span>`:''}<button class="btn btn-no btn-xs" onclick="delAlbF('${a.id}')"></button></div>
    </div>
    ${a.photo?`<img src="${a.photo}" class="alb-photo"/>`:''}
    <div class="pl">${rows}<div class="ptot">Total: ${fmt(tot)}${a.totalManual!=null?` <span style="font-size:11px;color:var(--mut);font-weight:400">(manual)</span>`:''}</div></div>
    ${cmp}
    ${linkSection}
  </div>`;
}

function delAlbF(id){ if(!confirm('¿Eliminar?'))return;deleteAlb(id);if(!fbDb){albNotes=albNotes.filter(a=>a.id!==id);}render(); }
function linkAlbToOrder(albId,orderId){
  if(!orderId) return;
  if(fbDb) fbDb.ref('albaranes/'+albId+'/orderId').set(orderId);
  const a=albNotes.find(x=>x.id===albId);if(a) a.orderId=orderId;
  renderAdminContent();
  toast(' Albarán vinculado al pedido','#16a34a');
}
