function vLocalEscandallos(){
  const rest=S.session.restaurant||'';
  // El local ve: sus propios escandallos + los globales (si no tiene copia propia del mismo baseId)
  const myEscs=Object.entries(_escAllData).filter(([,e])=>{
    const r=e.restaurante||'global';
    return r==='global'||r===rest;
  });
  // Para globales, si hay una copia local, mostrar solo la copia
  const baseIds=new Set(myEscs.filter(([,e])=>e.baseId&&e.restaurante===rest).map(([,e])=>e.baseId));
  const visible=myEscs.filter(([id,e])=>!(e.restaurante==='global'&&baseIds.has(id)));

  const myMenus=Object.entries(_menAllData).filter(([,m])=>{
    const r=m.restaurante||'global';
    return r==='global'||r===rest;
  });

  let html='<div class="card"><div class="card-t">Mis escandallos</div>';
  if(!visible.length){
    html+='<div style="color:var(--mut);font-size:13px;text-align:center;padding:16px">Aún no tienes escandallos asignados</div>';
  } else {
    html+=visible.map(([id,e])=>{
      const coste=escCosteTotal(e);
      const pvp=parseFloat(e.precioVenta)||0;
      const fcReal=pvp>0?(coste/pvp*100):null;
      const margen=pvp>0?(pvp-coste):null;
      const fcCls=fcReal===null?'':fcReal>35?'color:#dc2626':fcReal>30?'color:#d97706':'color:#16a34a';
      const expanded=S._escLocalExpanded[id]||false;
      const ings=e.ingredientes||[];
      const ingRows=ings.map(ing=>{
        const liveP=escLivePrice(ing);
        const merma=parseFloat(ing.merma)||0;
        const factor=1+(merma/100);
        const costeIng=liveP*(parseFloat(ing.cantidad)||0)*factor;
        return `<tr>
          <td style="padding:4px 6px;font-size:12px">${ing.nombre||'—'}</td>
          <td style="padding:4px 6px;font-size:12px;text-align:right">${ing.cantidad} ${ing.unidad||'u.'}</td>
          <td style="padding:4px 6px;font-size:12px;text-align:right">${merma>0?merma+'%':'—'}</td>
          <td style="padding:4px 6px;font-size:12px;text-align:right;font-weight:600">${escFmt(costeIng)}</td>
        </tr>`;
      }).join('');
      const detailHtml=expanded&&ings.length?`
        <div style="margin-top:10px;border-top:1px solid var(--brd);padding-top:10px">
          <table style="width:100%;border-collapse:collapse">
            <thead><tr style="font-size:11px;color:var(--mut)">
              <th style="padding:2px 6px;text-align:left;font-weight:600">Ingrediente</th>
              <th style="padding:2px 6px;text-align:right;font-weight:600">Cantidad</th>
              <th style="padding:2px 6px;text-align:right;font-weight:600">Merma</th>
              <th style="padding:2px 6px;text-align:right;font-weight:600">Coste</th>
            </tr></thead>
            <tbody>${ingRows}</tbody>
          </table>
          ${e.elaboracion&&(e.elaboracion.texto||(e.elaboracion.pasos||[]).filter(p=>p).length)?`
            <div style="margin-top:8px;padding:8px;background:var(--srf);border-radius:6px;font-size:12px;color:var(--mut)">
              <strong style="color:var(--txt)"> Elaboración</strong><br>
              ${e.elaboracion.texto||''}
              ${(e.elaboracion.pasos||[]).filter(p=>p).map((p,i)=>`<div style="margin-top:4px">${i+1}. ${p}</div>`).join('')}
            </div>`:''}
        </div>`:'';
      return `<div style="border:1.5px solid var(--brd);border-radius:10px;padding:12px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="font-weight:700">${e.nombre||'Sin nombre'}</div>
          <span class="badge" style="background:#f3f4f6;color:var(--txt)">${e.categoria||'Otros'}</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;text-align:center">
          <div><div style="color:var(--mut)">Coste</div><div style="font-weight:700">${escFmt(coste)}</div></div>
          <div><div style="color:var(--mut)">PVP</div><div style="font-weight:700">${pvp>0?escFmt(pvp):'—'}</div></div>
          <div><div style="color:var(--mut)">Food cost</div><div style="font-weight:700;${fcCls}">${fcReal!==null?fcReal.toFixed(1)+'%':'—'}</div></div>
        </div>
        ${margen!==null?`<div style="text-align:right;font-size:12px;margin-top:6px;color:var(--mut)">Margen: <strong style="color:var(--txt)">${escFmt(margen)}</strong></div>`:''}
        ${e.notas?`<div style="margin-top:6px;font-size:12px;color:var(--mut)"> ${e.notas}</div>`:''}
        ${ings.length?`<div style="margin-top:8px;text-align:center">
          <button class="btn btn-ghost btn-sm" style="font-size:11px;width:100%" onclick="S._escLocalExpanded['${id}']=!S._escLocalExpanded['${id}'];render()">
            ${expanded?'▲ Ocultar ingredientes':'▼ Ver ingredientes ('+ings.length+')'}
          </button>
        </div>`:''}
        ${detailHtml}
      </div>`;
    }).join('');
  }
  html+='</div>';

  if(myMenus.length){
    html+='<div class="card"><div class="card-t">Mis menús</div>';
    html+=myMenus.map(([,m])=>{
      const escs=(m.escandallos||[]).map(eid=>_escAllData[eid]).filter(Boolean);
      const costeTotal=escs.reduce((s,e)=>s+escCosteTotal(e),0);
      const pvp=parseFloat(m.pvp)||0;
      const margen=pvp>0?(pvp-costeTotal):null;
      return `<div style="border:1.5px solid var(--brd);border-radius:10px;padding:12px;margin-bottom:8px">
        <div style="font-weight:700;margin-bottom:8px">${m.nombre}</div>
        <div style="font-size:12px;color:var(--mut);margin-bottom:6px">${escs.map(e=>e.nombre).join(' · ')}</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;text-align:center">
          <div><div style="color:var(--mut)">Coste</div><div style="font-weight:700">${escFmt(costeTotal)}</div></div>
          <div><div style="color:var(--mut)">PVP</div><div style="font-weight:700">${pvp>0?escFmt(pvp):'—'}</div></div>
          <div><div style="color:var(--mut)">Margen</div><div style="font-weight:700">${margen!==null?escFmt(margen):'—'}</div></div>
        </div>
        ${m.notas?`<div style="margin-top:6px;font-size:12px;color:var(--mut)"> ${m.notas}</div>`:''}
      </div>`;
    }).join('');
    html+='</div>';
  }
  return html;
}

function escFmt(v){ return parseFloat(v||0).toFixed(2).replace('.',',')+' €'; }



/* ═══════════════ RECETAS ═══════════════ */
const REC_MESES=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const REC_PARTIDAS=['Calientes','Fríos','Postres','Bebidas','Aperitivos','Fondos','Otros'];
const REC_TIPOS=['Principal','Entrante','Guarnición','Postre','Bebida','Otro'];

function vRecetas(){
  const recs=Object.entries(_recAllData).map(([id,r])=>({...r,id})).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  const cards=recs.length?recs.map(r=>{
    const meses=(r.temporada||[]).map(m=>`<span class="rec-mes on">${m}</span>`).join('');
    const secCount=(r.secciones||[]).length;
    return `<div class="rec-card" onclick="recOpenModal('${r.id}')">
      <h4>${r.nombre||'Sin nombre'}</h4>
      <span class="rec-partida">${r.partida||''} ${r.tipo?'· '+r.tipo:''}</span>
      <div style="font-size:12px;color:var(--mut)">${secCount} sección${secCount!==1?'es':''}</div>
      ${meses?`<div class="rec-meses">${meses}</div>`:''}
    </div>`;
  }).join(''):`<p style="color:var(--mut);grid-column:1/-1">Aún no hay recetas — crea la primera con el botón</p>`;
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div style="font-size:18px;font-weight:800;color:var(--pri)">Recetas</div>
    <button class="btn btn-pri btn-sm" onclick="recOpenModal()">+ Nueva receta</button>
  </div>
  <div class="rec-grid">${cards}</div>
  <div id="rec-modal-ov" class="rec-modal-ov" style="display:none" onclick="if(event.target===this)recCloseModal()">
    <div class="rec-modal-box">
      <div class="rec-modal-hd">
        <h3 id="rec-modal-title">Nueva receta</h3>
        <button class="btn btn-ghost btn-sm" onclick="recCloseModal()">✕</button>
      </div>
      <div class="rec-modal-body" id="rec-modal-body"></div>
      <div class="rec-modal-ft">
        <button class="btn btn-no btn-sm" id="rec-btn-del" style="display:none" onclick="recDelete()">Eliminar</button>
        <div class="rec-modal-ft-r">
          <button class="btn btn-ghost btn-sm" id="rec-btn-pdf" onclick="recExportPDF()">Exportar PDF</button>
          <button class="btn btn-ghost btn-sm" onclick="recCloseModal()">Cancelar</button>
          <button class="btn btn-pri btn-sm" onclick="recSave()">Guardar</button>
        </div>
      </div>
    </div>
  </div>`;
}

function recModalHTML(){
  const r=_recData;
  const mesesHTML=REC_MESES.map(m=>{
    const on=(r.temporada||[]).includes(m);
    return `<button type="button" class="rec-mes${on?' on':''}" style="cursor:pointer;border:1.5px solid ${on?'var(--pri)':'var(--brd)'};padding:3px 7px;border-radius:5px;font-size:11px;font-weight:700;background:${on?'var(--pri)':'var(--card)'};color:${on?'#fff':'var(--mut)'}" onclick="recToggleMes('${m}')">${m}</button>`;
  }).join('');
  const seccionesHTML=(r.secciones||[]).map((sec,si)=>recSeccionHTML(sec,si)).join('');
  const rend=r.rendimiento||1;
  const rendUnit=r.rendimientoUnidad||'porciones';
  return `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="fg" style="grid-column:1/3">
      <label>Nombre del plato</label>
      <input id="rec-nombre" type="text" value="${r.nombre||''}" placeholder="Ej: Escudella tradicional"/>
    </div>
    <div class="fg">
      <label>Partida</label>
      <select id="rec-partida">${REC_PARTIDAS.map(p=>`<option${r.partida===p?' selected':''}>${p}</option>`).join('')}</select>
    </div>
    <div class="fg">
      <label>Tipo</label>
      <select id="rec-tipo">${REC_TIPOS.map(t=>`<option${r.tipo===t?' selected':''}>${t}</option>`).join('')}</select>
    </div>
  </div>
  <div class="fg">
    <label>Temporada</label>
    <div style="display:flex;gap:5px;flex-wrap:wrap">${mesesHTML}</div>
  </div>
  <div style="background:var(--srf);border:1px solid var(--brd);border-radius:10px;padding:14px">
    <div style="font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Rendimiento — escala todos los ingredientes automáticamente</div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="recChangeRend(Math.max(0.1,(parseFloat(document.getElementById('rec-rend-input').value)||1)-1))" style="width:32px;height:32px;border-radius:8px;border:1.5px solid var(--brd);background:#fff;font-size:18px;font-weight:700;cursor:pointer;color:var(--pri);display:flex;align-items:center;justify-content:center;line-height:1">−</button>
        <input id="rec-rend-input" type="number" value="${rend}" min="0.1" step="1" style="width:70px;text-align:center;padding:6px 8px;border:1.5px solid var(--pri);border-radius:8px;font-size:16px;font-weight:800;color:var(--pri);background:#fff;outline:none" onfocus="_recRendPrev=parseFloat(this.value)||1" onchange="recChangeRend(parseFloat(this.value)||1)"/>
        <button onclick="recChangeRend((parseFloat(document.getElementById('rec-rend-input').value)||1)+1)" style="width:32px;height:32px;border-radius:8px;border:1.5px solid var(--brd);background:#fff;font-size:18px;font-weight:700;cursor:pointer;color:var(--pri);display:flex;align-items:center;justify-content:center;line-height:1">+</button>
      </div>
      <select id="rec-rend-unit" style="padding:6px 10px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;background:#fff;color:var(--txt)" onchange="_recData.rendimientoUnidad=this.value">
        <option${rendUnit==='porciones'?' selected':''}>porciones</option>
        <option${rendUnit==='kg'?' selected':''}>kg</option>
        <option${rendUnit==='L'?' selected':''}>L</option>
        <option${rendUnit==='raciones'?' selected':''}>raciones</option>
        <option${rendUnit==='unidades'?' selected':''}>unidades</option>
      </select>
      <span style="font-size:12px;color:var(--mut)" id="rec-rend-factor"></span>
    </div>
  </div>
  <div>
    <div style="font-size:13px;font-weight:700;color:var(--pri);margin-bottom:10px">Secciones de ingredientes</div>
    <div id="rec-secciones">${seccionesHTML}</div>
    <button class="btn btn-ghost btn-sm" onclick="recAddSeccion()" style="margin-top:8px">+ Añadir sección</button>
  </div>`;
}

function recSeccionHTML(sec,si){
  const ings=(sec.ingredientes||[]).map((ing,ii)=>`
    <div class="rec-ing-row" id="rec-ing-${si}-${ii}">
      <input type="number" value="${ing.cantidad||''}" placeholder="Cant." min="0" step="0.001" style="padding:5px 7px;border:1.5px solid var(--brd);border-radius:6px;font-size:12px;background:var(--card);color:var(--txt)" oninput="_recData.secciones[${si}].ingredientes[${ii}].cantidad=parseFloat(this.value)||0"/>
      <input type="text" value="${ing.unidad||''}" placeholder="Ud." style="padding:5px 7px;border:1.5px solid var(--brd);border-radius:6px;font-size:12px;background:var(--card);color:var(--txt)" oninput="_recData.secciones[${si}].ingredientes[${ii}].unidad=this.value"/>
      <input type="text" value="${ing.nombre||''}" placeholder="Ingrediente" style="padding:5px 7px;border:1.5px solid var(--brd);border-radius:6px;font-size:12px;background:var(--card);color:var(--txt);font-weight:600" oninput="_recData.secciones[${si}].ingredientes[${ii}].nombre=this.value"/>
      <input type="text" value="${ing.nota||''}" placeholder="Nota prep." style="padding:5px 7px;border:1.5px solid var(--brd);border-radius:6px;font-size:12px;background:var(--card);color:var(--txt);font-style:italic" oninput="_recData.secciones[${si}].ingredientes[${ii}].nota=this.value"/>
      <button onclick="recDelIng(${si},${ii})" style="border:none;background:none;color:#dc2626;cursor:pointer;font-size:14px;padding:4px">✕</button>
    </div>`).join('');
  const pasos=(sec.pasos||[]).map((p,pi)=>`
    <div style="display:flex;gap:6px;align-items:flex-start;margin-bottom:6px">
      <span class="rec-paso-num">${pi+1}</span>
      <input type="text" value="${p||''}" placeholder="Paso ${pi+1}..." style="flex:1;padding:6px 9px;border:1.5px solid var(--brd);border-radius:6px;font-size:13px;background:var(--card);color:var(--txt)" oninput="_recData.secciones[${si}].pasos[${pi}]=this.value"/>
      <button onclick="recDelPaso(${si},${pi})" style="border:none;background:none;color:#dc2626;cursor:pointer;font-size:14px;padding:4px;margin-top:4px">✕</button>
    </div>`).join('');
  return `<div class="rec-seccion" id="rec-sec-${si}">
    <div class="rec-seccion-hd">
      <input type="text" value="${sec.titulo||''}" placeholder="Título sección (ej: Para 15 Lt de ESCUDELLA)" style="flex:1;padding:5px 8px;border:1.5px solid var(--brd);border-radius:7px;font-size:13px;font-weight:700;background:var(--card);color:var(--pri)" oninput="_recData.secciones[${si}].titulo=this.value"/>
      <button onclick="recDelSeccion(${si})" style="border:none;background:none;color:#dc2626;cursor:pointer;font-size:14px;margin-left:8px">✕</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--mut);margin-bottom:6px;text-transform:uppercase">Ingredientes</div>
        <div id="rec-ings-${si}">${ings}</div>
        <div style="background:var(--srf);border:1px solid var(--brd);border-radius:9px;padding:9px;margin-top:8px">
          <div style="font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px"> Buscar en proveedor</div>
          <select id="rec-prov-${si}" style="width:100%;margin-bottom:5px;padding:5px 8px;border:1.5px solid var(--brd);border-radius:7px;font-size:12px;background:#fff;color:var(--txt)" onchange="recLoadProvProds(this.value,${si})">
            <option value="">-- Proveedor --</option>
            ${supList().map(s=>`<option value="${s.id}">${s.emoji} ${s.name}</option>`).join('')}
          </select>
          <input type="text" id="rec-prod-srch-${si}" placeholder="Buscar producto..." oninput="recFilterProd(${si},this.value)" style="display:none;width:100%;margin-bottom:5px;padding:5px 8px;border:1.5px solid var(--brd);border-radius:7px;font-size:12px;background:#fff;color:var(--txt);outline:none" onfocus="this.style.borderColor='var(--pri)'" onblur="this.style.borderColor='var(--brd)'"/>
          <div style="display:flex;gap:5px;margin-bottom:5px">
            <select id="rec-prod-sel-${si}" style="flex:2;padding:5px 8px;border:1.5px solid var(--brd);border-radius:7px;font-size:12px;background:#fff;color:var(--txt)"><option value="">-- Producto --</option></select>
            <input type="number" id="rec-prov-qty-${si}" placeholder="gr" step="0.001" min="0" style="width:65px;padding:5px 7px;border:1.5px solid var(--brd);border-radius:7px;font-size:12px;background:#fff;color:var(--txt)"/>
            <button class="btn btn-ok btn-xs" onclick="recAddFromProv(${si})">+</button>
          </div>
          <div style="display:flex;gap:5px">
            <button class="btn btn-ghost btn-xs" onclick="recAddIng(${si})" style="flex:1;font-size:11px">+ Libre</button>
            <button class="btn btn-ghost btn-xs" onclick="recToggleNewProd(${si})" style="flex:1;font-size:11px" id="rec-btn-np-${si}">+ Crear producto</button>
          </div>
          <div id="rec-np-${si}" style="display:none;margin-top:8px;padding:8px;background:#fff;border:1.5px solid var(--brd);border-radius:8px">
            <div style="font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;margin-bottom:6px">Nuevo producto en proveedor</div>
            <div style="display:grid;grid-template-columns:2fr 1fr 1fr 70px;gap:4px;margin-bottom:6px">
              <input type="text" id="rec-np-name-${si}" placeholder="Nombre"/>
              <select id="rec-np-unit-${si}"><option>g</option><option>KG</option><option>UN</option><option>L</option><option>Caja</option></select>
              <input type="number" id="rec-np-price-${si}" placeholder="€/u." step="0.01" min="0"/>
              <input type="number" id="rec-np-gr-${si}" placeholder="gr" step="1" min="0" title="Peso en gramos"/>
            </div>
            <div style="display:flex;gap:5px">
              <button class="btn btn-ok btn-xs" onclick="recCrearProd(${si})" style="flex:1">✓ Crear</button>
              <button class="btn btn-ghost btn-xs" onclick="recToggleNewProd(${si})" style="flex:1">Cancelar</button>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--mut);margin-bottom:6px;text-transform:uppercase">Elaboración</div>
        <div id="rec-pasos-${si}">${pasos}</div>
        <button class="btn btn-ghost btn-sm" onclick="recAddPaso(${si})" style="margin-top:4px;font-size:11px">+ Paso</button>
      </div>
    </div>
  </div>`;
}

function recOpenModal(id=null){
  _recEditId=id;
  if(id&&_recAllData[id]){
    _recData=JSON.parse(JSON.stringify(_recAllData[id]));
  } else {
    _recData={nombre:'',partida:'Calientes',tipo:'Principal',temporada:[],secciones:[{titulo:'',ingredientes:[],pasos:[]}]};
  }
  if(!_recData.rendimiento) _recData.rendimiento=1;
  if(!_recData.rendimientoUnidad) _recData.rendimientoUnidad='porciones';
  _recRendPrev=_recData.rendimiento;
  document.getElementById('rec-modal-title').textContent=id?'Editar receta':'Nueva receta';
  document.getElementById('rec-btn-del').style.display=id?'':'none';
  document.getElementById('rec-btn-pdf').style.display=id?'':'none';
  document.getElementById('rec-modal-body').innerHTML=recModalHTML();
  document.getElementById('rec-modal-ov').style.display='flex';
}

function recCloseModal(){
  document.getElementById('rec-modal-ov').style.display='none';
  _recEditId=null; _recData=null;
}

function recToggleMes(m){
  if(!_recData.temporada) _recData.temporada=[];
  const i=_recData.temporada.indexOf(m);
  if(i>=0) _recData.temporada.splice(i,1); else _recData.temporada.push(m);
  // Re-render solo los botones de mes
  document.getElementById('rec-modal-body').innerHTML=recModalHTML();
}

function recAddSeccion(){
  _recData.secciones.push({titulo:'',ingredientes:[],pasos:[]});
  document.getElementById('rec-secciones').innerHTML=(_recData.secciones||[]).map((s,i)=>recSeccionHTML(s,i)).join('');
}

function recDelSeccion(si){
  _recData.secciones.splice(si,1);
  document.getElementById('rec-secciones').innerHTML=(_recData.secciones||[]).map((s,i)=>recSeccionHTML(s,i)).join('');
}

function recAddIng(si){
  if(!_recData.secciones[si].ingredientes) _recData.secciones[si].ingredientes=[];
  _recData.secciones[si].ingredientes.push({cantidad:'',unidad:'gr',nombre:'',nota:''});
  document.getElementById('rec-secciones').innerHTML=(_recData.secciones||[]).map((s,i)=>recSeccionHTML(s,i)).join('');
}

function recDelIng(si,ii){
  _recData.secciones[si].ingredientes.splice(ii,1);
  document.getElementById('rec-secciones').innerHTML=(_recData.secciones||[]).map((s,i)=>recSeccionHTML(s,i)).join('');
}

function recAddPaso(si){
  if(!_recData.secciones[si].pasos) _recData.secciones[si].pasos=[];
  _recData.secciones[si].pasos.push('');
  document.getElementById('rec-secciones').innerHTML=(_recData.secciones||[]).map((s,i)=>recSeccionHTML(s,i)).join('');
}

let _recRendPrev=1;
function recChangeRend(newVal){
  newVal=Math.max(0.1,parseFloat(newVal)||1);
  const oldVal=parseFloat(_recData.rendimiento)||1;
  if(Math.abs(newVal-oldVal)<0.0001){_recData.rendimiento=newVal;return;}
  const factor=newVal/oldVal;
  // Escalar todas las cantidades
  (_recData.secciones||[]).forEach(sec=>{
    (sec.ingredientes||[]).forEach(ing=>{
      if(ing.cantidad&&!isNaN(parseFloat(ing.cantidad))){
        ing.cantidad=Math.round(parseFloat(ing.cantidad)*factor*10000)/10000;
      }
    });
  });
  _recData.rendimiento=newVal;
  _recData.rendimientoUnidad=document.getElementById('rec-rend-unit')?.value||_recData.rendimientoUnidad||'porciones';
  // Actualizar input y mostrar factor
  const inp=document.getElementById('rec-rend-input');
  if(inp) inp.value=newVal;
  const factorLbl=document.getElementById('rec-rend-factor');
  if(factorLbl){
    const pct=((factor-1)*100).toFixed(0);
    const sign=factor>=1?'+':'';
    factorLbl.textContent=factor!==1?`× ${factor.toFixed(2)} (${sign}${pct}%)` :'';
    factorLbl.style.color=factor>1?'#15803d':'#dc2626';
    setTimeout(()=>{if(factorLbl)factorLbl.textContent='';},2500);
  }
  // Re-renderizar ingredientes
  document.getElementById('rec-secciones').innerHTML=(_recData.secciones||[]).map((s,i)=>recSeccionHTML(s,i)).join('');
  _recRendPrev=newVal;
}

function recFilterProd(si,term){

/* ═══════════════ BUDGET TREND CHART ═══════════════ */
function renderBudgetTrendChart(){
  const canvas=document.getElementById('budget-trend-chart');
  if(!canvas) return;
  if(window._budgetTrendChart){window._budgetTrendChart.destroy();window._budgetTrendChart=null;}
  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push(d.toISOString().slice(0,7));
  }
  const labels=months.map(m=>{const[y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('es',{month:'short',year:'2-digit'});});
  const spendData=months.map(m=>{
    const fromOrders=orders.filter(o=>(o.status==='approved'||o.status==='received')&&(o.createdAt||'').startsWith(m)).reduce((s,o)=>s+total(o),0);
    const fromExtra=Object.values(extraExpenses).filter(ex=>(ex.date||ex.createdAt||'').startsWith(m)).reduce((s,ex)=>s+(parseFloat(ex.amount)||0),0);
    return fromOrders+fromExtra;
  });
  const budgetData=months.map(m=>{
    return cfg.users.reduce((s,u)=>s+(budgets[u.id+'_'+m]||0),0);
  });
  window._budgetTrendChart=new Chart(canvas,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Gasto real',data:spendData,backgroundColor:'#e9456099',borderColor:'#e94560',borderWidth:1.5,borderRadius:4},
        {label:'Presupuesto',data:budgetData,backgroundColor:'#1a1a2e33',borderColor:'#1a1a2e',borderWidth:1.5,borderRadius:4,type:'line',fill:false,tension:0.3,pointRadius:4}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}}},scales:{y:{ticks:{callback:v=>'€'+v.toLocaleString('es')},grid:{color:'#f0f0f0'}},x:{grid:{display:false}}}}
  });
}

function vProductos(){
  const allSups=supList();
  if(!allSups.length) return `<div class="empty"><div class="ei"></div><div class="et">Sin proveedores configurados</div></div>`;

  // Filtros de estado

  const catOpts=PROD_CATS.map(c=>`<option value="${c}"${S.prodCatFilter===c?' selected':''}>${c}</option>`).join('');

  const filtersBar=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center">
    <input type="text" placeholder="Buscar producto..." value="${S.prodSearch2||''}"

      style="padding:8px 10px;border:1.5px solid var(--brd);border-radius:9px;font-size:13px;background:var(--card);color:var(--txt)">
      <option value="">Todos los proveedores</option>${supOpts}
    </select>
    <select onchange="S.prodCatFilter=this.value;renderAdminContent()"
      style="padding:8px 10px;border:1.5px solid var(--brd);border-radius:9px;font-size:13px;background:var(--card);color:var(--txt)">
      <option value="">Todas las categorías</option>${catOpts}
    </select>
  </div>`;

  // Recopilar todos los productos con info de proveedor
  const term=(S.prodSearch2||'').toLowerCase().trim();
  const allProds=[];
  allSups.forEach(sup=>{
    if(S.prodSupFilter && sup.id!==S.prodSupFilter) return;

  const orderedCats=[...PROD_CATS,...Object.keys(byCat).filter(c=>!PROD_CATS.includes(c))].filter(c=>byCat[c]);

          <div style="font-size:13px;font-weight:600;color:var(--txt)">${p.name}</div>
          <div style="font-size:11px;color:var(--mut);margin-top:1px">${p.supEmoji} ${p.supName}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:14px;font-weight:700;color:var(--pri)">${fmt(p.price||0)}<span style="font-size:11px;font-weight:400;color:var(--mut)"> / ${p.unit||'u.'}</span></div>
          ${p.pesoGr?`<div style="font-size:11px;color:var(--mut)">${p.pesoGr} gr</div>`:''}
        </div>

    return `<div class="card" style="padding:0;overflow:hidden;margin-bottom:16px">
      <div style="padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--brd);background:${color}08">
        <div style="width:12px;height:12px;border-radius:50%;background:${color}"></div>

  const total=allProds.length;

/* ═══════════════ HISTORIAL POR PROVEEDOR ═══════════════ */
function vSupHistory(){
  const supIds=supList().map(s=>s.id);
  if(!supIds.length) return `<div class="empty"><div class="ei"></div><div class="et">Sin proveedores</div></div>`;
  const allOrd=orders.filter(o=>o.status==='approved'||o.status==='received');
  if(!allOrd.length) return `<div class="empty"><div class="ei" style="font-size:36px;font-weight:800;color:var(--brd)">—</div><div class="et">Sin pedidos aprobados aún</div></div>`;

  // Periodo selector
  if(!S.supHistPeriod) S.supHistPeriod='all';
  const now=new Date();
  const curMonth=now.toISOString().slice(0,7);
  const curYear=now.toISOString().slice(0,4);
  function inPeriod(o){
    const d=o.createdAt||'';
    if(S.supHistPeriod==='month') return d.startsWith(curMonth);
    if(S.supHistPeriod==='year')  return d.startsWith(curYear);
    return true;
  }
  const filtOrd=allOrd.filter(inPeriod);
  const periodLabel={'all':'Todo el historial','month':'Este mes','year':'Este año'}[S.supHistPeriod];
  const periodBar=`<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">
    ${['all','month','year'].map(p=>`<button class="stab${S.supHistPeriod===p?' act':''}" onclick="S.supHistPeriod='${p}';renderAdminContent()">${{'all':'Todo','month':'Este mes','year':'Este año'}[p]}</button>`).join('')}
  </div>`;

  // Obtener todos los restaurantes con pedidos
  const allRests=[...new Set(filtOrd.map(o=>o.restaurant).filter(Boolean))].sort();

  const rows=supIds.map(sid=>{
    const sup=suppliers[sid];
    const supOrders=filtOrd.filter(o=>o.supId===sid);
    if(!supOrders.length) return '';
    const totalSpend=supOrders.reduce((s,o)=>s+total(o),0);
    const lastOrder=supOrders.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0];

    // Gasto por local en este proveedor
    const byRest={};
    supOrders.forEach(o=>{
      if(!byRest[o.restaurant]) byRest[o.restaurant]=0;
      byRest[o.restaurant]+=total(o);
    });
    const restRows=Object.entries(byRest)
      .sort((a,b)=>b[1]-a[1])
      .map(([rest,amt])=>{
        const pct=totalSpend>0?Math.round(amt/totalSpend*100):0;
        return `<div style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
            <span style="font-weight:600">${rest}</span>
            <span style="font-weight:700;color:var(--pri)">${fmt(amt)}<span style="font-size:11px;color:var(--mut);font-weight:400"> (${pct}%)</span></span>
          </div>
          <div style="background:var(--brd);border-radius:4px;height:5px">
            <div style="background:var(--pri);border-radius:4px;height:5px;width:${pct}%;transition:width .3s"></div>
          </div>
        </div>`;
      }).join('');

    // Top productos
    const prodMap={};
    supOrders.forEach(o=>(o.items||[]).forEach(it=>{
      if(!prodMap[it.name]) prodMap[it.name]={name:it.name,unit:it.unit,qty:0,spend:0};
      prodMap[it.name].qty+=parseFloat(it.qty)||0;
      prodMap[it.name].spend+=(parseFloat(it.qty)||0)*(parseFloat(it.price)||0);
    }));
    const topProds=Object.values(prodMap).sort((a,b)=>b.spend-a.spend).slice(0,4);
    const prodRows=topProds.map(p=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--brd)">
      <span style="color:var(--txt)">${p.name} <span style="color:var(--mut)">${p.qty%1===0?p.qty:p.qty.toFixed(1)} ${p.unit}</span></span>
      <span style="font-weight:600">${fmt(p.spend)}</span>
    </div>`).join('');

    const open=S.supHistOpen===sid;
    return `<div class="card" style="margin-bottom:12px;padding:0;overflow:hidden">
      <div style="padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:12px" onclick="S.supHistOpen=S.supHistOpen==='${sid}'?null:'${sid}';renderAdminContent()">
        <div style="font-size:28px;min-width:36px;text-align:center">${sup.emoji||''}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:16px">${sup.name}</div>
          <div style="font-size:12px;color:var(--mut);margin-top:2px">${supOrders.length} pedidos · ${Object.keys(byRest).length} locales · Último ${fmtD(lastOrder.createdAt)}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:20px;font-weight:800;color:var(--pri)">${fmt(totalSpend)}</div>
          <div style="font-size:11px;color:var(--mut)">${periodLabel}</div>
        </div>
        <span style="color:var(--mut);font-size:16px;margin-left:4px">${open?'▲':'▼'}</span>
      </div>
      ${open?`<div style="border-top:1px solid var(--brd);padding:16px 18px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;flex-wrap:wrap">
          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:10px">Gasto por local</div>
            ${restRows}
          </div>
          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:10px">Top productos</div>
            ${prodRows||'<div style="font-size:12px;color:var(--mut)">Sin datos</div>'}
          </div>
        </div>
      </div>`:''}
    </div>`;
  }).filter(Boolean).join('');

  if(!rows) return periodBar+`<div class="empty"><div class="ei" style="font-size:36px;font-weight:800;color:var(--brd)">—</div><div class="et">Sin pedidos en este período</div></div>`;
  const totalAll=filtOrd.reduce((s,o)=>s+total(o),0);
  return periodBar+`<div style="font-size:13px;color:var(--mut);margin-bottom:14px">Total comprado ${periodLabel.toLowerCase()}: <strong style="color:var(--pri)">${fmt(totalAll)}</strong></div>`+rows;
}

function addMissingSuppliers(){
  if(!fbDb) return;
  fbDb.ref('suppliers').once('value', snap=>{
    const existing = snap.val() || {};
    const updates = {};
    Object.entries(NEW_SUPPLIERS).forEach(([id, sup])=>{
      if(!existing[id]) updates[id] = sup;
    });
    if(Object.keys(updates).length > 0){
      fbDb.ref('suppliers').update(updates).then(()=>{
        toast('Nuevos proveedores añadidos: '+Object.keys(updates).map(k=>NEW_SUPPLIERS[k].name).join(', '),'#16a34a');
      });
    }
  });
}

function updateCoreSuppliers(){
  if(!fbDb) return;
  fbDb.ref('suppliers').once('value', snap=>{
    const existing = snap.val() || {};
    const updates = {};
    // Always update bencar to latest Excel prices
    updates['bencar'] = DEFAULT_SUPS['bencar'];
    // Update ismael if products missing or wrong prefix
    const curIsmael = existing['ismael'];
    const defIsmael = DEFAULT_SUPS['ismael'];
    if(!curIsmael || !curIsmael.products || !curIsmael.products[0] || !String(curIsmael.products[0].id).startsWith('ix')){
      updates['ismael'] = defIsmael;
    }
    if(Object.keys(updates).length > 0){
      fbDb.ref('suppliers').update(updates).then(()=>{
        toast('Tarifas de Bencar e Ismael actualizadas','#16a34a');
      });
    }
  });
}

function initAdminAccount(){
  if(!fbAuth||!fbDb) return;
  // Si ya se creó en esta sesión, no repetir
  if(localStorage.getItem('oc_admin_init')==='1') return;
  const adminEmail=cfg.adminEmail||'josue.funte@gmail.com';
  fbAuth.createUserWithEmailAndPassword(adminEmail,'Josue1998')
    .then(cred=>{
      const uid=cred.user.uid;
      fbDb.ref('authUsers/'+uid).set({
        uid, email:adminEmail, name:cfg.adminName||'Josué',
        isAdmin:true, status:'approved', createdAt:new Date().toISOString()
      }).then(()=>{
        localStorage.setItem('oc_admin_init','1');
        // Cerrar sesión inmediatamente — el admin iniciará sesión de forma normal
        fbAuth.signOut().catch(()=>{});
      });
    })
    .catch(e=>{
      // Ya existe → simplemente marcar como inicializado
      // No hacemos signIn en segundo plano para evitar interferencias con la sesión
      if(e.code==='auth/email-already-in-use'){
        localStorage.setItem('oc_admin_init','1');
      }
    });
}

window.addEventListener('DOMContentLoaded',()=>{
  try {
    fbApp = firebase.initializeApp(FB_CONFIG);
    fbDb  = firebase.database();
    fbAuth= firebase.auth();
  } catch(e) {
    console.warn('Firebase init error:', e);
  }
  // Si Firebase no se cargó (CDN lenta/caída), reintentar en 3 s
  if(!fbAuth){
    setTimeout(()=>{
      if(!fbAuth && typeof firebase !== 'undefined'){
        try{ fbApp=firebase.initializeApp(FB_CONFIG); fbDb=firebase.database(); fbAuth=firebase.auth(); initFirebaseListeners(); initAdminAccount(); }catch(e){}
        // Re-renderizar para quitar el spinner de "Conectando"
        if(S.view==='login') render();
      }
    },3000);
  }
  if(S.darkMode) document.body.classList.add('dark');

  // ── PWA SETUP ────────────────────────────────────────────────────────────
  (function initPWA(){
    // 1. Generar icono con Canvas (PNG nativo, funciona en iOS y Android)
    function makeIcon(size){
      try{
        const c=document.createElement('canvas');
        c.width=c.height=size;
        const ctx=c.getContext('2d');
        const r=size*0.16;
        // Fondo redondeado
        ctx.beginPath();
        ctx.moveTo(r,0);ctx.lineTo(size-r,0);ctx.arcTo(size,0,size,r,r);
        ctx.lineTo(size,size-r);ctx.arcTo(size,size,size-r,size,r);
        ctx.lineTo(r,size);ctx.arcTo(0,size,0,size-r,r);
        ctx.lineTo(0,r);ctx.arcTo(0,0,r,0,r);
        ctx.closePath();
        ctx.fillStyle='#1e293b';ctx.fill();
        // Letra P
        ctx.fillStyle='#ffffff';
        ctx.font=`900 ${Math.round(size*0.6)}px -apple-system,system-ui,sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('P',size/2,size*0.45);
        // Barra roja
        ctx.fillStyle='#e11d48';
        ctx.beginPath();
        const bh=size*0.09,by=size*0.76,bx=size*0.15,bw=size*0.7,br=bh/2;
        ctx.roundRect(bx,by,bw,bh,br);
        ctx.fill();
        return c.toDataURL('image/png');
      }catch(e){return '';}
    }
    const icon192=makeIcon(192);
    const icon512=makeIcon(512);

    // 2. apple-touch-icon (necesario para iOS)
    if(icon192){
      const link=document.createElement('link');
      link.rel='apple-touch-icon';link.href=icon192;
      document.head.appendChild(link);
    }

    // 3. Manifest
    const manifest={
      name:'Provea — Gestión de Pedidos',
      short_name:'Provea',
      description:'Gestión de compras del grupo O\'Carro',
      start_url:'./',
      display:'standalone',
      orientation:'portrait',
      background_color:'#f8fafc',
      theme_color:'#1e293b',
      icons:[
        {src:icon192,sizes:'192x192',type:'image/png',purpose:'any maskable'},
        {src:icon512,sizes:'512x512',type:'image/png',purpose:'any maskable'},
      ]
    };
    const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
    document.getElementById('pwa-manifest').href=URL.createObjectURL(mBlob);

    // 4. Service Worker — cachea scripts CDN para uso sin conexión parcial
    if('serviceWorker' in navigator){
      const CDN=[
        'https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.js',
        'https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.js',
        'https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.js',
        'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
      ];
      const swCode=`
const CACHE='provea-v2';
const CDN=${JSON.stringify(CDN)};
self.addEventListener('install',e=>{
  e.waitUntil(caches.open(CACHE).then(c=>Promise.allSettled(CDN.map(u=>c.add(u)))));
  self.skipWaiting();
});
self.addEventListener('activate',e=>{ e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k))))); self.clients.claim(); });
self.addEventListener('fetch',e=>{
  const u=e.request.url;
  if(CDN.some(c=>u===c)){
    e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{caches.open(CACHE).then(c=>c.put(e.request,res.clone()));return res;})));
  }
});`;
      const swBlob=new Blob([swCode],{type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob),{type:'classic'}).catch(()=>{});
    }

    // 5. Banner de instalación
    let _installPrompt=null;
    const isIOS=/ipad|iphone|ipod/i.test(navigator.userAgent)&&!window.MSStream;
    const isStandalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;

    if(!isStandalone){
      // Android/Chrome: capturar evento de instalación nativo
      window.addEventListener('beforeinstallprompt',e=>{
        e.preventDefault(); _installPrompt=e;
        showInstallBanner('android');
      });
      // iOS: mostrar instrucciones manuales
      if(isIOS){
        // Solo si no se ha instalado ya (localStorage)
        if(!localStorage.getItem('pwa_banner_dismissed')){
          setTimeout(()=>showInstallBanner('ios'), 4000);
        }
      }
    }

    function showInstallBanner(type){
      if(document.getElementById('pwa-banner')) return;

      }
      document.body.appendChild(banner);
    }
  })();
  initFirebaseListeners();
  addMissingSuppliers();
  updateCoreSuppliers();
  initAdminAccount(); // Crea / verifica la cuenta de admin en Firebase Auth

  // ── Firebase Auth: siempre registrar onAuthStateChanged ──
  // (debe registrarse ANTES de restaurar sesión admin para capturar logins de restaurantes)
  if(fbAuth){
    fbAuth.onAuthStateChanged(user=>{
      if(S.session?.isAdmin) return; // admin activo vía localStorage, ignorar
      if(user){
        fbDb.ref('authUsers/'+user.uid).once('value',snap=>{
          const u=snap.val();
          const isAdminUser=(user.email && user.email.toLowerCase()===(cfg.adminEmail||'josue.funte@gmail.com').toLowerCase()) || (u && u.isAdmin===true);
          if(isAdminUser){ goAdmin(); return; }
          if(u && u.status==='approved'){
            const myRests=u.restaurants||[u.restaurant];
            S.session={uid:user.uid,email:user.email,name:u.name||u.restaurant,restaurant:myRests[0]||u.restaurant,restaurants:myRests,isAdmin:false,needsApproval:u.needsApproval!==false};
            showHdr(false);
            S.view='order';
            const sl=visibleSups(); if(sl.length) S.supId=sl[0].id;
            render();
          } else if(u && (u.status==='pending'||u.status==='rejected')){
            S.session={uid:user.uid,email:user.email,pendingStatus:u.status};
            document.getElementById('hdr').style.display='none';
            S.view='pending-approval';
            render();
          } else {
            S.view='login'; render();
          }
        });
      } else {
        if(!S.session){ S.view='login'; render(); }
      }
    });
  }

  // ── Restaurar sesión de administrador (localStorage) ──
  if(localStorage.getItem('oc_admin_session')==='1'){
    S.session={isAdmin:true,name:cfg.adminName};
    showHdr(true);
    S.view='admin';
    render();
  } else if(!fbAuth){
    render(); // Firebase no disponible → mostrar login
  }
});

function restKey(name){ return (name||'').replace(/[.#$\[\]/]/g,'_').replace(/\s+/g,'_'); }

function getInvItems(rest){
  const k=restKey(rest);
  return Object.values(inventory[k]||{}).sort((a,b)=>(a.category||'').localeCompare(b.category||'es')||(a.name||'').localeCompare(b.name||'es'));
}

function importSupplierProducts(rest){
  if(!fbDb){ toast('Sin conexión Firebase','#dc2626'); return; }
  const k=restKey(rest);
  const existing=inventory[k]||{};
  const existingNames=new Set(Object.values(existing).map(p=>(p.name||'').trim().toLowerCase()));
  let added=0;
  const batch={};
  supList().forEach(sup=>{
    (sup.products||[]).forEach(p=>{
      const nameNorm=(p.name||'').trim().toLowerCase();
      if(!nameNorm||existingNames.has(nameNorm)) return;
      const id='inv_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
      batch[id]={id,name:p.name,unit:p.unit||'ud',qty:0,minStock:0,price:parseFloat(p.price)||0,category:sup.emoji+' '+sup.name,updatedAt:new Date().toISOString(),updatedBy:'Importación catálogo'};
      existingNames.add(nameNorm); // evitar duplicados dentro del mismo lote
      added++;
    });
  });
  if(!added){ toast('Todos los productos ya están en el inventario','#7c3aed'); return; }
  fbDb.ref('inventory/'+k).update(batch)
    .then(()=>toast(`${added} producto${added>1?'s':''} importado${added>1?'s':''} del catálogo`,'#16a34a'))
    .catch(e=>toast('Error: '+e.message,'#dc2626'));
}

function saveInvItem(rest, item){
  if(!fbDb){ toast('Sin conexión Firebase','#dc2626'); return; }
  const k=restKey(rest);
  const id=item.id||('inv_'+Date.now());
  const data={...item, id, updatedAt:new Date().toISOString(), updatedBy: S.session?.isAdmin?'Admin':(S.session?.name||rest)};
  fbDb.ref('inventory/'+k+'/'+id).set(data);
  return id;
}

function deleteInvItem(rest, id){
  if(!fbDb){ toast('Sin conexión Firebase','#dc2626'); return; }
  if(!confirm('¿Eliminar este producto del inventario?')) return;
  fbDb.ref('inventory/'+restKey(rest)+'/'+id).remove();
  toast('Producto eliminado','#dc2626');
}

function addInvMovement(rest, productId, productName, type, qty, source, orderId, note){
  if(!fbDb) return;
  const k=restKey(rest);
  const id='mov_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  fbDb.ref('inventoryMovements/'+k+'/'+id).set({
    id, productId, productName, type, qty, source:source||'manual',
    ...(orderId?{orderId}:{}), ...(note?{note}:{}),
    date: new Date().toISOString()
  });
}

function updateStockFromOrder(order, receivedItems){
  if(!fbDb||!order) return;
  const rest=order.restaurant;
  const k=restKey(rest);
  const items=receivedItems||order.items||[];
  const invNow=inventory[k]||{};
  items.forEach(it=>{
    if(it.recvStatus==='missing') return; // no añadir si no llegó
    const qty=parseFloat(it.qty)||0;
    if(qty<=0) return;
    // Try to match by name
    const existing=Object.values(invNow).find(p=>p.name&&p.name.trim().toLowerCase()===((it.name||it.product||'').trim().toLowerCase()));
    if(existing){
      const newQty=(parseFloat(existing.qty)||0)+qty;
      fbDb.ref('inventory/'+k+'/'+existing.id+'/qty').set(newQty);
      fbDb.ref('inventory/'+k+'/'+existing.id+'/updatedAt').set(new Date().toISOString());
      addInvMovement(rest,existing.id,existing.name,'entrada',qty,'pedido',order.id);
    } else {
      // Create new product automatically
      const id='inv_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
      const sup=suppliers[order.supId];
      const supProd=(sup?.products||[]).find(p=>p.name&&p.name.trim().toLowerCase()===(it.name||it.product||'').trim().toLowerCase());
      const pData={id,name:it.name||it.product||'Producto',unit:it.unit||supProd?.unit||'ud',qty,minStock:0,price:parseFloat(supProd?.price||it.price)||0,category:sup?sup.name:'General',updatedAt:new Date().toISOString(),updatedBy:'Pedido automático'};
      fbDb.ref('inventory/'+k+'/'+id).set(pData);
      addInvMovement(rest,id,pData.name,'entrada',qty,'pedido',order.id);
    }
  });
}

function exportInventoryExcel(rest, catFilter){
  if(typeof XLSX==='undefined'){ toast('Librería Excel no cargada','#dc2626'); return; }
  let items=getInvItems(rest).filter(it=>(parseFloat(it.qty)||0)>0);
  if(catFilter) items=items.filter(it=>(it.category||'Sin categoría')===catFilter);
  const wb=XLSX.utils.book_new();
  if(catFilter){
    // Una sola hoja con la categoría filtrada
    const rows=[['Producto','Categoría','Cantidad','Unidad','Precio/ud (€)','Valor total (€)','Stock mínimo','Estado','Última actualización']];
    let total=0;
    items.forEach(it=>{
      const low=(parseFloat(it.qty)||0)<=(parseFloat(it.minStock)||0)&&(parseFloat(it.minStock)||0)>0;
      const qty=parseFloat(it.qty)||0; const price=parseFloat(it.price)||0; const valor=qty*price; total+=valor;
      rows.push([it.name,it.category||'',qty,it.unit||'',price,valor,parseFloat(it.minStock)||0,low?'Bajo stock':'OK',it.updatedAt?new Date(it.updatedAt).toLocaleDateString('es-ES'):'']);
    });
    rows.push(['','','','','TOTAL',total,'','','']);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),catFilter.slice(0,31));
  } else {
    // Una hoja por proveedor/categoría + hoja resumen
    const allCats=[...new Set(items.map(it=>it.category||'Sin categoría'))].sort();
    const summaryRows=[['Proveedor/Categoría','Productos','Valor total (€)','Productos con stock bajo']];
    allCats.forEach(cat=>{
      const catItems=items.filter(it=>(it.category||'Sin categoría')===cat);
      const rows=[['Producto','Categoría','Cantidad','Unidad','Precio/ud (€)','Valor total (€)','Stock mínimo','Estado','Última actualización']];
      let total=0;
      catItems.forEach(it=>{
        const low=(parseFloat(it.qty)||0)<=(parseFloat(it.minStock)||0)&&(parseFloat(it.minStock)||0)>0;
        const qty=parseFloat(it.qty)||0; const price=parseFloat(it.price)||0; const valor=qty*price; total+=valor;
        rows.push([it.name,it.category||'',qty,it.unit||'',price,valor,parseFloat(it.minStock)||0,low?'Bajo stock':'OK',it.updatedAt?new Date(it.updatedAt).toLocaleDateString('es-ES'):'']);
      });
      rows.push(['','','','','TOTAL',total,'','','']);
      const lowCount=catItems.filter(it=>(parseFloat(it.minStock)||0)>0&&(parseFloat(it.qty)||0)<=(parseFloat(it.minStock)||0)).length;
      summaryRows.push([cat,catItems.length,total,lowCount]);
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),cat.replace(/[:\\\/\?\*\[\]]/g,'').slice(0,31));
    });
    // Hoja resumen al principio
    const wsSummary=XLSX.utils.aoa_to_sheet(summaryRows);
    wb.SheetNames.unshift('Resumen');
    wb.Sheets['Resumen']=wsSummary;
  }
  const suffix=catFilter?'_'+catFilter.replace(/[^a-zA-Z0-9]/g,'_'):'_todos_proveedores';
  XLSX.writeFile(wb,'inventario_'+restKey(rest)+suffix+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

function openInvForm(rest, existingId){
  S.invEditId=existingId||null;
  if(existingId){
    const it=(inventory[restKey(rest)]||{})[existingId]||{};
    S.invForm={name:it.name||'',unit:it.unit||'',qty:it.qty??'',minStock:it.minStock??'',category:it.category||'',price:it.price??''};
  } else {
    S.invForm={name:'',unit:'',qty:'',minStock:'',category:'',price:''};
  }
  render();
  setTimeout(()=>document.getElementById('inv-form-name')?.focus(),80);
}

function submitInvForm(rest){
  const name=(document.getElementById('inv-form-name')?.value||'').trim();
  const unit=(document.getElementById('inv-form-unit')?.value||'').trim();
  const qty=parseFloat(document.getElementById('inv-form-qty')?.value)||0;
  const minStock=parseFloat(document.getElementById('inv-form-min')?.value)||0;
  const category=(document.getElementById('inv-form-cat')?.value||'').trim();
  const price=parseFloat(document.getElementById('inv-form-price')?.value)||0;
  if(!name){ toast('Introduce un nombre','#dc2626'); return; }
  const id=saveInvItem(rest,{...(S.invEditId?{id:S.invEditId}:{}),name,unit,qty,minStock,category,price});
  if(!S.invEditId&&id){
    addInvMovement(rest,id,name,'ajuste',qty,'manual',null,'Alta de producto');
  } else if(S.invEditId){
    const old=(inventory[restKey(rest)]||{})[S.invEditId]||{};
    const diff=qty-(parseFloat(old.qty)||0);
    if(diff!==0) addInvMovement(rest,S.invEditId,name,diff>0?'entrada':'salida',Math.abs(diff),'manual',null,'Ajuste manual');
  }
  S.invEditId=null;
  S.invForm={name:'',unit:'',qty:'',minStock:'',category:'',price:''};
  toast('Producto guardado','#7c3aed');
  // Preservar scroll al guardar
  const _sv=window.scrollY;
  if(S.view==='admin') renderAdminContent();
  else { render(); requestAnimationFrame(()=>window.scrollTo(0,_sv)); }
}

function cancelInvForm(){
  S.invEditId=null;
  S.invForm={name:'',unit:'',qty:'',minStock:'',category:'',price:''};
  const _sv=window.scrollY;
  if(S.view==='admin') renderAdminContent();
  else { render(); requestAnimationFrame(()=>window.scrollTo(0,_sv)); }
}

function ajusteRapido(rest, id, delta){
  const k=restKey(rest);
  const it=(inventory[k]||{})[id];
  if(!it){ return; }
  const newQty=Math.max(0,(parseFloat(it.qty)||0)+delta);
  if(!fbDb) return;
  fbDb.ref('inventory/'+k+'/'+id+'/qty').set(newQty);
  fbDb.ref('inventory/'+k+'/'+id+'/updatedAt').set(new Date().toISOString());
  addInvMovement(rest,id,it.name,delta>0?'entrada':'salida',Math.abs(delta),'manual');
}

        <div style="font-weight:700;margin-bottom:8px">Historial (últimos 50)</div>
        ${movRows?`<table class="spend-table"><thead><tr><th>Tipo</th><th>Producto</th><th>Cant.</th><th>Origen</th><th>Fecha</th></tr></thead><tbody>${movRows}</tbody></table>`
        :'<div class="empty" style="margin:0"><div class="et">Sin movimientos aún</div></div>'}
      </div>`:''}
    </div>
  </div>`;
}

// ── Vista restaurante ─────────────────────────────────────
function vLocalInventario(rest){
  const items=getInvItems(rest);
  const lowItems=items.filter(it=>(parseFloat(it.minStock)||0)>0&&(parseFloat(it.qty)||0)<=(parseFloat(it.minStock)||0));
  const alertBanner=lowItems.length?`<div class="banner" style="background:#fef3c7;border-color:#f59e0b;color:#92400e;margin-bottom:12px"><strong>${lowItems.length} producto${lowItems.length>1?'s':''} con stock bajo:</strong> ${lowItems.map(it=>`${it.name} (${parseFloat(it.qty)||0} ${it.unit||'ud'})`).join(', ')}</div>`:'';
  const isEditing=S.invEditId!==null;

  const formHtml=`<div class="card" style="margin-bottom:14px">
    <div style="font-weight:700;font-size:14px;margin-bottom:10px">${S.invEditId&&S.invEditId!=='new'?'Editar producto':' Añadir producto'}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <div><label style="font-size:12px;color:var(--mut)">Nombre</label><input id="inv-form-name" class="inp" value="${(S.invForm.name||'').replace(/"/g,'&quot;')}" placeholder="ej: Pechuga de pollo" /></div>
      <div><label style="font-size:12px;color:var(--mut)">Unidad</label><input id="inv-form-unit" class="inp" value="${S.invForm.unit||''}" placeholder="Kg, L, ud…" /></div>
      <div><label style="font-size:12px;color:var(--mut)">Cantidad actual</label><input id="inv-form-qty" class="inp" type="number" min="0" step="0.01" value="${S.invForm.qty??''}" placeholder="0" /></div>
      <div><label style="font-size:12px;color:var(--mut)">Precio / unidad (€)</label><input id="inv-form-price" class="inp" type="number" min="0" step="0.01" value="${S.invForm.price??''}" placeholder="0.00" /></div>
      <div style="grid-column:1/-1"><label style="font-size:12px;color:var(--mut)">Categoría</label><input id="inv-form-cat" class="inp" value="${S.invForm.category||''}" placeholder="ej: Carnes, Lácteos…" /></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-acc btn-sm" onclick="submitInvForm('${rest.replace(/'/g,"\\'")}')">Guardar</button>
      <button class="btn btn-ghost btn-sm" onclick="cancelInvForm()">Cancelar</button>
    </div>
  </div>`;

  const totalValorR=items.reduce((s,it)=>(parseFloat(it.qty)||0)*(parseFloat(it.price)||0)+s,0);
  const summaryRest=items.length?`<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
    <div class="card" style="flex:1;min-width:120px;padding:12px 16px;text-align:center">
      <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px">Productos</div>
      <div style="font-size:22px;font-weight:800;color:var(--pri)">${items.length}</div>
    </div>
    <div class="card" style="flex:1;min-width:120px;padding:12px 16px;text-align:center">
      <div style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px">Valor total stock</div>
      <div style="font-size:22px;font-weight:800;color:var(--pri)">${fmt(totalValorR)}</div>
    </div>
    ${lowItems.length?`<div class="card" style="flex:1;min-width:120px;padding:12px 16px;text-align:center;border-color:#f59e0b">
      <div style="font-size:11px;color:#92400e;text-transform:uppercase;letter-spacing:.5px">Stock bajo</div>
      <div style="font-size:22px;font-weight:800;color:#d97706">${lowItems.length}</div>
    </div>`:''}
  </div>`:'';

  const invQR=(S.invSearch||'').toLowerCase().trim();
  const filteredR=invQR?items.filter(it=>(it.name||'').toLowerCase().includes(invQR)||(it.category||'').toLowerCase().includes(invQR)):items;
  const searchBoxR=`<input type="text" value="${S.invSearch||''}" placeholder="Buscar producto o categoría..." oninput="S.invSearch=this.value;render()" style="width:100%;padding:9px 14px;border:1.5px solid var(--brd);border-radius:10px;font-size:14px;background:#fff;color:var(--txt);outline:none;margin-bottom:12px;box-sizing:border-box" onfocus="this.style.borderColor='var(--pri)'" onblur="this.style.borderColor='var(--brd)'"/>`;

  const table=filteredR.length?`${searchBoxR}<table class="spend-table">
    <thead><tr><th>Producto</th><th>Categoría</th><th>Cantidad</th><th>Precio/ud</th><th>Valor</th><th>Estado</th><th>Ajuste rápido</th><th></th></tr></thead>
    <tbody>${filteredR.map(it=>{
      const low=(parseFloat(it.minStock)||0)>0&&(parseFloat(it.qty)||0)<=(parseFloat(it.minStock)||0);
      const qty=parseFloat(it.qty)||0;
      const price=parseFloat(it.price)||0;
      const valor=qty*price;
      return `<tr style="${low?'background:#fef9c3':''}">
        <td style="font-weight:600">${it.name}</td>
        <td style="color:var(--mut)">${it.category||'—'}</td>
        <td><strong>${qty}</strong> ${it.unit||'ud'}</td>
        <td style="color:var(--mut)">${price>0?fmt(price):'—'}</td>
        <td style="font-weight:${valor>0?'700':'400'}">${valor>0?fmt(valor):'—'}</td>
        <td>${low?'<span style="color:#d97706;font-weight:700">Bajo</span>':'<span style="color:#16a34a">OK</span>'}</td>
        <td><span style="display:flex;gap:4px;align-items:center">
          <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:16px" onclick="ajusteRapido('${rest.replace(/'/g,"\\'")}','${it.id}',-1)">−</button>
          <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:16px" onclick="ajusteRapido('${rest.replace(/'/g,"\\'")}','${it.id}',1)">+</button>
        </span></td>
        <td><button class="btn btn-ghost btn-sm" onclick="openInvForm('${rest.replace(/'/g,"\\'")}','${it.id}')">Editar</button></td>
      </tr>`;
    }).join('')}
    ${totalValorR>0?`<tr style="background:var(--bg);font-weight:700"><td colspan="4" style="text-align:right;padding-right:8px">TOTAL</td><td>${fmt(totalValorR)}</td><td colspan="3"></td></tr>`:''}
    </tbody></table>`
    :(items.length&&invQR?`${searchBoxR}<div class="empty" style="margin:0"><div class="et">Sin resultados para "<strong>${invQR}</strong>"</div></div>`
    :`<div class="empty"><div class="ei"></div><div class="et">Sin productos en el inventario aún.<br><br><button class="btn btn-acc btn-sm" onclick="openInvForm('${rest.replace(/'/g,"\\'")}','new')"> Añadir primero</button></div></div>`);

  return `<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:16px;font-weight:700"> Mi inventario — ${rest}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="importSupplierProducts('${rest.replace(/'/g,"\\'")}')"> Importar catálogo</button>
        <button class="btn btn-acc btn-sm" onclick="openInvForm('${rest.replace(/'/g,"\\'")}','new')"> Añadir</button>
      </div>
    </div>
    ${alertBanner}
    ${summaryRest}
    ${isEditing?formHtml:''}
    <div class="card" style="overflow-x:auto">${table}</div>
  </div>`;
}
</script>
</body>
</html>
