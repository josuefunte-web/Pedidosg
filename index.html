function vAdmin(){
  const pend = data.orders.filter(o => o.status === 'pending');
  const appr = data.orders.filter(o => o.status === 'approved');
  const pendingSol = Object.values(data.authUsers).filter(u => u.status === 'pending').length;

  function sbItem(id, lbl, badgeId){
    const act = state.adminTab === id;
    let badge = '';
    if(badgeId === 'sb-pend-badge') badge = `<span class="sb-badge" id="sb-pend-badge" style="${pend.length?'':'display:none'}">${pend.length}</span>`;
    else if(badgeId === 'sb-sol-badge') badge = `<span class="sb-badge" id="sb-sol-badge" style="${pendingSol?'':'display:none'}">${pendingSol}</span>`;
    return `<div class="sg-item${act?' act':''}" onclick="setTabSb('${id}')"><span>${esc(lbl)}</span>${badge}</div>`;
  }

  function grpHd(g, emoji, lbl){
    const open = state.sbGroups[g];
    const childTabs = {
      pedidos: ['pending','approved','consolidated','received'],
      analisis: ['spending','monthly','foodcost','budgets','compare','prices','sup-history'],
      gestion: ['users','suppliers','settings','escandallos','solicitudes']
    };
    const hasAct = (childTabs[g]||[]).includes(state.adminTab);
    return `<div class="sg-hd${hasAct&&!open?' has-act':''}" onclick="toggleSbGroup('${g}')"><span>${esc(emoji)} ${esc(lbl)}</span><span class="sg-arrow">${open?'▲':'▼'}</span></div>`;
  }

  const sidebar = `<div class="sidebar${state.sidebarOpen?' sb-open':''}">
    <div class="sb-mini-stats" id="sb-stats">${buildSbStats(pend, appr)}</div>
    ${grpHd('pedidos','📦','Pedidos')}
    ${state.sbGroups.pedidos ? `
      ${sbItem('pending','Pendientes','sb-pend-badge')}
      ${sbItem('approved','Aprobados')}
      ${sbItem('consolidated','Consolidado')}
      ${sbItem('received','📦 Recibidos')}
    ` : ''}
    ${grpHd('analisis','📊','Análisis')}
    ${state.sbGroups.analisis ? `
      ${sbItem('spending','Gasto por local')}
      ${sbItem('monthly','Comparativa mensual')}
      ${sbItem('foodcost','Food Cost')}
      ${sbItem('budgets','Presupuestos')}
      ${sbItem('compare','Comparar precios')}
      ${sbItem('prices','Historial precios')}
      ${sbItem('sup-history','Por proveedor')}
    ` : ''}
    <div class="sg-direct${state.adminTab==='albaranes'?' act':''}" onclick="setTabSb('albaranes')">📋 Albaranes</div>
    ${grpHd('gestion','⚙️','Gestión')}
    ${state.sbGroups.gestion ? `
      ${sbItem('solicitudes','👥 Solicitudes','sb-sol-badge')}
      ${sbItem('users','Usuarios')}
      ${sbItem('suppliers','Proveedores')}
      ${sbItem('settings','Configuración')}
      ${sbItem('escandallos','🧮 Escandallos')}
    ` : ''}
  </div>`;

  let content = '';
  switch(state.adminTab){
    case 'pending': content = vPending(); break;
    case 'approved': content = vApproved(); break;
    case 'consolidated': content = vConsolidated(); break;
    case 'received': content = vReceived(); break;
    case 'spending': content = `<div class="card"><div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn btn-ghost btn-sm" onclick="window.print()">🖨️ Imprimir</button></div><div class="ch-wrap"><canvas id="chart"></canvas></div></div>` + vExtraExpenses(); break;
    case 'monthly': content = vMonthly(); break;
    case 'foodcost': content = vFoodCost(); break;
    case 'budgets': content = vBudgets(); break;
    case 'compare': content = vCompare(); break;
    case 'prices': content = vPriceHistory(); break;
    case 'albaranes': content = vAlbaranes(); break;
    case 'solicitudes': content = vSolicitudes(); break;
    case 'users': content = vUsers(); break;
    case 'suppliers': content = vSuppliers(); break;
    case 'settings': content = vSettings(); break;
    case 'escandallos': content = vEscandallos(); break;
    case 'sup-history': content = vSupHistory(); break;
    default: content = vPending();
  }

  const liveTag = data.fbConnected ? `<span class="live-badge"><span class="pulse"></span>EN VIVO</span>` : '';

  return `<div class="adm-layout">
    ${sidebar}
    <div class="sb-overlay${state.sidebarOpen?' sb-open':''}" onclick="state.sidebarOpen=false;render()"></div>
    <div class="adm-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:13px;font-weight:700;color:var(--pri)">Panel de compras</div>${liveTag}
      </div>
      <div id="tc">${content}</div>
    </div>
  </div>`;
}

/* ═══════════════ ORDER CARD ═══════════════ */
function orderCard(o, showActions){
  const sup = data.suppliers[o.supId] || { name:'?', emoji:'?', phone:'' };
  const isEditing = state.editOrderId === o.id;
  const editItems = isEditing ? state.editItems : (o.items||[]);
  const tot = (editItems||[]).reduce((s,it) => s + (parseFloat(it.qty)||0)*(parseFloat(it.price)||0), 0);
  const bc = { pending:'b-p', approved:'b-a', rejected:'b-r', received:'b-recv' }[o.status] || 'b-p';
  const bl = { pending:'Pendiente', approved:'Aprobado', rejected:'Rechazado', received:'✔ Recibido' }[o.status] || o.status;
  const modTag = o.modifiedByAdmin ? ` <span class="badge b-f">✏️ Modificado</span>` : '';
  const urgTag = o.urgent ? ` <span class="badge b-urg">🚨 URGENTE</span>` : '';
  const issuesTag = o.receivedIssues ? ` <span class="badge" style="background:#fef3c7;color:#92400e">⚠️ Con incidencias</span>` : '';
  const delTag = o.deliveryDate ? ` <span style="font-size:11px;color:var(--mut);font-weight:600">📅 Entrega: ${esc(o.deliveryDate)}</span>` : '';
  const recvBtn = showActions && o.status === 'approved' ? `<button class="btn btn-ghost btn-sm" onclick="markReceived('${esc(o.id)}')">📦 Marcar recibido</button>` : '';
  const restRecvBtn = !showActions && o.status === 'approved' && state.session ? `<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="markReceived('${esc(o.id)}')">📦 Confirmar recepción</button>` : '';

  let itemsHtml = '';
  if(isEditing){
    itemsHtml = state.editItems.map((it, i) => `
      <div class="pr" style="align-items:center;flex-wrap:nowrap">
        <span class="pn" style="flex:1">${esc(it.name)}</span>
        <div class="qc" style="margin-left:8px">
          <button class="qb" onclick="editItemQty(${i},-1)">−</button>
          <span class="qd" id="eiq-${i}" style="min-width:32px;text-align:center">${it.qty}</span>
          <button class="qb" onclick="editItemQty(${i},1)">+</button>
        </div>
        <span class="pp" id="eip-${i}" style="margin-left:8px">${fmt(it.qty*it.price)}</span>
      </div>`).join('');
  } else {
    itemsHtml = (o.items||[]).map(it =>
      `<div class="pr"><span class="pn">${esc(it.name||'?')}</span><span class="pq">${it.qty} ${esc(it.unit||'')}</span><span class="pp">${fmt((it.qty||0)*(it.price||0))}</span></div>`
    ).join('');
  }

  let acts = '';
  if(showActions && o.status === 'pending'){
    if(isEditing){
      acts = `<div style="width:100%">
        <textarea id="approve-note-${esc(o.id)}" maxlength="300" placeholder="Comentario al aprobar (opcional)..." rows="2" style="width:100%;padding:6px 8px;border:1px solid var(--brd);border-radius:6px;font-size:12px;background:var(--card);color:var(--txt);resize:none;box-sizing:border-box;margin-bottom:6px"></textarea>
        <div class="oc-acts" style="flex-wrap:wrap">
          <button class="btn btn-ok btn-sm" onclick="approveWithEdits('${esc(o.id)}')">✅ Aprobar</button>
          <button class="btn btn-ghost btn-sm" onclick="state.editOrderId=null;state.editItems=[];renderAdminContent()">✕ Cancelar</button>
        </div>
      </div>`;
    } else {
      acts = `<div style="width:100%">
        <textarea id="approve-note-${esc(o.id)}" maxlength="300" placeholder="Comentario al aprobar (opcional)..." rows="2" style="width:100%;padding:6px 8px;border:1px solid var(--brd);border-radius:6px;font-size:12px;background:var(--card);color:var(--txt);resize:none;box-sizing:border-box;margin-bottom:6px"></textarea>
        <div class="oc-acts">
          <button class="btn btn-ok btn-sm" onclick="approve('${esc(o.id)}')">✅ Aprobar</button>
          <button class="btn btn-blue btn-sm" onclick="startEditOrder('${esc(o.id)}')">✏️ Modificar</button>
          <button class="btn btn-no btn-sm" onclick="rejectWithReason('${esc(o.id)}')">✗ Rechazar</button>
        </div>
      </div>`;
    }
  } else if(o.status === 'approved'){
    acts = `<div class="oc-acts">
      <button class="btn btn-wa btn-sm" onclick="reopenWA('${esc(o.id)}')">📱 ${esc(sup.name)}</button>
    </div>`;
  }

  const totLabel = isEditing ? `<div class="ptot" id="edit-tot">Total: ${fmt(tot)}</div>` : `<div class="ptot">Total: ${fmt(tot)}</div>`;
  const threshold = config.alertThreshold || 300;
  const isLargeOrder = showActions && tot >= threshold;
  const largeAlert = isLargeOrder ? `<div class="banner red" style="margin:6px 0 2px">⚠️ Pedido grande — supera ${fmt(threshold)}</div>` : '';

  // Budget warning
  const oCreatedAt = o.createdAt || '';
  const oAuthUser = Object.values(data.authUsers).find(u => u.restaurant === o.restaurant || (u.restaurants||[]).includes(o.restaurant));
  const bKey = oAuthUser ? oAuthUser.uid + '_' + oCreatedAt.slice(0,7) : null;
  const bLimit = bKey ? (data.budgets[bKey]||0) : 0;
  const bSpent = bKey ? data.orders.filter(x => (x.status==='approved'||x.status==='received') && x.restaurant===o.restaurant && (x.createdAt||'').startsWith(oCreatedAt.slice(0,7))).reduce((s,x) => s+total(x), 0) : 0;
  const budgetAlert = bLimit > 0 && bSpent > bLimit ? `<div class="banner red" style="margin:4px 0 2px">💳 Presupuesto superado — ${fmt(bSpent)} de ${fmt(bLimit)}</div>` : '';

  return `<div class="oc" ${isEditing?'style="border-color:var(--pri);box-shadow:0 0 0 2px rgba(26,26,46,.15)"':o.urgent?'style="border-color:#dc2626"':''}>
    <div class="oc-hd">
      <div><div class="oc-rest">${esc(o.restaurant||'')}${o.autoApproved?` <span class="badge b-f">Auto</span>`:''}${modTag}${urgTag}${issuesTag}</div>
      <div class="oc-sub">${esc(sup.emoji||'')} ${esc(sup.name)} · ${fmtD(o.createdAt)} · <span class="badge ${bc}">${bl}</span>${delTag}</div></div>
      ${acts}
    </div>
    ${largeAlert}${budgetAlert}
    ${o.approvalNote?`<div style="background:#f0fdf4;border-left:3px solid #16a34a;border-radius:0 6px 6px 0;padding:6px 10px;margin:4px 0 6px;font-size:12px;color:#166534">💬 Admin: ${esc(o.approvalNote)}</div>`:''}
    ${o.notes?`<div style="background:var(--bg);border-left:3px solid var(--pri);border-radius:0 6px 6px 0;padding:6px 10px;margin:4px 0 6px;font-size:12px;color:var(--txt)">📝 <em>${esc(o.notes)}</em></div>`:''}
    ${isEditing?`<div class="banner blue" style="margin-bottom:10px">✏️ Modifica las cantidades y pulsa <strong>Aprobar</strong></div>`:''}
    <div class="pl">${itemsHtml}${totLabel}</div>
    ${recvBtn || restRecvBtn}
  </div>`;
}

function reopenWA(orderId){
  const o = data.orders.find(x => x.id === orderId);
  if(!o) return;
  const sup = data.suppliers[o.supId];
  if(!sup) return;
  Modal.showWA(sup.phone||'', msgSupplier(o), `Reenviar pedido a ${sup.name}`);
}

function vPending(){
  const p = data.orders.filter(o => o.status === 'pending');
  return p.length ? p.map(o => orderCard(o, true)).join('') : `<div class="empty"><div class="ei">🎉</div><div class="et">Sin pedidos pendientes</div></div>`;
}
function vApproved(){
  const a = data.orders.filter(o => o.status === 'approved');
  return a.length ? a.map(o => orderCard(o, false)).join('') : `<div class="empty"><div class="ei">📋</div><div class="et">Sin pedidos aprobados</div></div>`;
}
function vReceived(){
  const rec = data.orders.filter(o => o.status === 'received').sort((a,b) => new Date(b.receivedAt||b.createdAt) - new Date(a.receivedAt||a.createdAt));
  if(!rec.length) return `<div class="empty"><div class="ei">📦</div><div class="et">Sin pedidos recibidos aún</div></div>`;
  const tot = rec.reduce((s,o) => s + total(o), 0);
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <div style="font-size:13px;color:var(--mut)">${rec.length} pedidos confirmados · ${fmt(tot)} total</div>
    <button class="btn btn-ghost btn-sm" onclick="exportExcel('received')">📥 Exportar Excel</button>
  </div>` + rec.map(o => orderCard(o, false)).join('');
}

function vConsolidated(){
  const pend = data.orders.filter(o => o.status === 'pending');
  if(!pend.length) return `<div class="empty"><div class="ei">📦</div><div class="et">No hay pedidos pendientes</div></div>`;
  const bySup = {};
  pend.forEach(o => {
    if(!bySup[o.supId]) bySup[o.supId] = {};
    (o.items||[]).forEach(it => {
      if(!bySup[o.supId][it.id]) bySup[o.supId][it.id] = { ...it, qty: 0, rests: [] };
      bySup[o.supId][it.id].qty += it.qty;
      bySup[o.supId][it.id].rests.push((o.restaurant||'').replace("O'Carro ", ''));
    });
  });
  return Object.entries(bySup).map(([sid, items]) => {
    const sup = data.suppliers[sid] || { name: sid, emoji: '📦', phone: '' };
    const arr = Object.values(items);
    const tot = arr.reduce((s, it) => s + (parseFloat(it.qty)||0)*(parseFloat(it.price)||0), 0);
    const rows = arr.map(it => `<div class="pr"><span class="pn">${esc(it.name)} <small style="color:var(--mut)">(${[...new Set(it.rests)].length}r)</small></span><span class="pq">${it.qty} ${esc(it.unit||'')}</span><span class="pp">${fmt(it.qty*it.price)}</span></div>`).join('');
    return `<div class="cc">
      <div class="cc-hd">
        <div class="cc-name">${esc(sup.emoji||'')} ${esc(sup.name)}</div>
        <button class="btn btn-wa btn-sm" onclick="sendConsolidated('${esc(sid)}')">📱 Enviar</button>
      </div>
      <div class="pl">${rows}<div class="ptot">Total: ${fmt(tot)}</div></div>
    </div>`;
  }).join('');
}

function sendConsolidated(sid){
  const sup = data.suppliers[sid];
  if(!sup) return;
  const pend = data.orders.filter(o => o.status === 'pending' && o.supId === sid);
  const items = {};
  pend.forEach(o => (o.items||[]).forEach(it => {
    if(!items[it.id]) items[it.id] = { ...it, qty: 0 };
    items[it.id].qty += it.qty;
  }));
  const co = { supId: sid, restaurant: 'Consolidado', items: Object.values(items), createdAt: new Date().toISOString() };
  Modal.showWA(sup.phone||'', msgSupplier(co), 'Pedido consolidado');
}

/* ═══════════════ CHARTS — spending, monthly, budget trend ═══════════════ */
function renderSpendChart(){
  const byR = {};
  data.orders.filter(o => o.status === 'approved' || o.status === 'received').forEach(o => {
    const k = (o.restaurant||'Sin nombre').replace("O'Carro ", '');
    byR[k] = (byR[k]||0) + total(o);
  });
  Object.values(data.extraExpenses).forEach(e => {
    const k = (e.restaurant||'Sin nombre').replace("O'Carro ", '');
    byR[k] = (byR[k]||0) + (parseFloat(e.amount)||0);
  });
  const ent = Object.entries(byR).filter(([,v]) => v > 0).sort(([,a],[,b]) => b - a);
  const ctx = document.getElementById('chart');
  if(!ctx) return;
  if(!ent.length){
    ctx.parentNode.innerHTML = `<div class="empty" style="height:260px;display:flex;flex-direction:column;justify-content:center"><div class="ei">📊</div><div class="et">Aprueba pedidos para ver el gasto</div></div>`;
    return;
  }
  Charts.make('chart', {
    type: 'bar',
    data: { labels: ent.map(([k]) => k), datasets: [{ data: ent.map(([,v]) => v), backgroundColor: '#1a1a2e', borderRadius: 6, hoverBackgroundColor: '#e94560' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + fmt(c.raw) } } }, scales: { y: { ticks: { callback: v => v.toLocaleString('es-ES', { maximumFractionDigits: 0 }) + ' €' }, grid: { color: '#f0f0f0' } }, x: { grid: { display: false } } } }
  });
}

function renderMonthlyChart(){
  const now = new Date();
  const months = [];
  for(let i = 5; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(d.toISOString().slice(0,7));
  }
  const rests = [...new Set(data.orders.map(o => o.restaurant).filter(Boolean))].sort();
  const colors = ['#e94560','#1a1a2e','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#059669','#dc2626','#2563eb','#9333ea','#ea580c'];
  const datasets = rests.map((r, i) => ({
    label: r.replace("O'Carro ", ''),
    data: months.map(m => data.orders.filter(o => o.status !== 'rejected' && o.restaurant === r && (o.createdAt||'').startsWith(m)).reduce((s, o) => s + total(o), 0)),
    backgroundColor: colors[i%colors.length] + '99',
    borderColor: colors[i%colors.length],
    borderWidth: 1.5,
    borderRadius: 4,
  }));
  const labels = months.map(m => { const [y, mo] = m.split('-'); return new Date(y, mo-1).toLocaleDateString('es', { month: 'short', year: '2-digit' }); });
  Charts.make('monthly-chart', {
    type: 'bar',
    data: { labels, datasets },
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 }, boxWidth: 10 } } }, scales: { x: { stacked: false }, y: { ticks: { callback: v => '€' + v.toLocaleString('es') } } } }
  });
}

function renderBudgetTrendChart(){
  const now = new Date();
  const months = [];
  for(let i = 5; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(d.toISOString().slice(0,7));
  }
  const labels = months.map(m => { const [y, mo] = m.split('-'); return new Date(y, mo-1).toLocaleDateString('es', { month: 'short', year: '2-digit' }); });
  const spendData = months.map(m => {
    const fromOrders = data.orders.filter(o => (o.status==='approved'||o.status==='received') && (o.createdAt||'').startsWith(m)).reduce((s,o) => s+total(o), 0);

    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 12 } } }, scales: { y: { ticks: { callback: v => '€' + v.toLocaleString('es') }, grid: { color: '#f0f0f0' } }, x: { grid: { display: false } } } }
  });
}

/* ═══════════════ ORDER ACTIONS ═══════════════ */
function setSup(id){ state.supId = id; state.prodSearch = ''; render(); }

function chgQ(id, d){
  if(!state.cart[state.supId]) state.cart[state.supId] = {};
  const sc = state.cart[state.supId];
  const q = sc[id] || 0;
  const nq = Math.max(0, Math.min(MAX_QTY, q + d));
  if(nq === 0) delete sc[id];
  else sc[id] = nq;
  if(Object.keys(sc).length === 0) delete state.cart[state.supId];

  // Animate the qty button
  const el = document.getElementById('qd-'+id);
  if(el) el.textContent = nq;
  const pi = document.getElementById('pi-'+id);
  if(pi) pi.className = 'pi' + (nq > 0 ? ' ic' : '');
  if(d > 0){
    vibrate(15);
    if(el) { el.parentElement.querySelectorAll('.qb')[1].classList.add('added'); setTimeout(()=> el.parentElement.querySelectorAll('.qb')[1]?.classList.remove('added'), 350); }
  }

  // Update bottom bar
  const cnt = Object.values(state.cart).reduce((s, sc2) => s + Object.values(sc2).reduce((a,v) => a+v, 0), 0);
  const tot = Object.entries(state.cart).reduce((s, [sid, sc2]) => {
    const sp = data.suppliers[sid];
    if(!sp) return s;
    return s + sp.products.reduce((a, p) => a + (sc2[p.id]||0)*p.price, 0);
  }, 0);
  const bar = document.getElementById('cbar');
  if(bar) bar.className = 'cbar' + (cnt > 0 ? ' up' : '');
  const cv = document.getElementById('cb-v');
  if(cv) cv.textContent = `${cnt} art.${Object.keys(state.cart).length>1 ? ` · ${Object.keys(state.cart).length} prov.` : ''}`;
  const cs = document.getElementById('cb-s');
  if(cs) cs.textContent = fmt(tot);
}

async function submitOrder(){
  if(state.submitting) return;
  if(!state.session){ toast('Sin sesión', '#dc2626'); return; }
  const activeSups = Object.keys(state.cart).filter(sid => Object.keys(state.cart[sid]||{}).length > 0);
  if(!activeSups.length){ toast('Añade productos al pedido', '#dc2626'); return; }

  state.submitting = true;
  const btn = document.getElementById('submit-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Enviando…'; }

  try {
    const approvalMin = config.approvalMinAmount || 0;
    const orders2send = [];
    const notes = sanitizeInput(state.orderNotes, 500);

    activeSups.forEach(sid => {
      const sup = data.suppliers[sid];
      if(!sup) return;
      const sc = state.cart[sid] || {};
      const items = sup.products.filter(p => sc[p.id]).map(p => ({
        id: p.id, name: p.name, unit: p.unit, price: p.price, qty: sc[p.id]
      }));
      if(!items.length) return;
      const orderTotal = items.reduce((s, p) => s + p.qty*p.price, 0);
      const needApproval = state.session.needsApproval && (approvalMin <= 0 || orderTotal >= approvalMin);
      const o = {
        id: uid(),
        restaurant: state.session.restaurant,
        supId: sid,
        items,
        status: needApproval ? 'pending' : 'approved',
        autoApproved: !needApproval,
        createdAt: new Date().toISOString(),
        urgent: state.orderUrgent || false,
        deliveryDate: state.orderDeliveryDate || null,
        notes: notes || ''
      };
      orders2send.push(o);
    });

    if(!orders2send.length){ toast('Añade productos al pedido', '#dc2626'); return; }

    // Save all in parallel
    await Promise.all(orders2send.map(o => saveOrder(o)));

    state.cart = {};
    state.orderUrgent = false;
    state.orderDeliveryDate = '';
    state.prodSearch = '';
    state.orderNotes = '';

    const pendingOrders = orders2send.filter(o => o.status === 'pending');
    const autoOrders = orders2send.filter(o => o.status === 'approved');

    if(pendingOrders.length){
      const totalAmt = pendingOrders.reduce((s,o) => s + total(o), 0);
      const msgMulti = `🛒 Nuevo pedido de ${pendingOrders[0].restaurant}\n${pendingOrders.map(o => `• ${(data.suppliers[o.supId]||{name:o.supId}).name}: ${fmt(total(o))}`).join('\n')}\n💰 Total: ${fmt(totalAmt)}`;
      Modal.showWA(config.adminPhone||'', msgMulti, `${pendingOrders.length} pedido(s) — apruébalos`);
      toast(`✅ ${pendingOrders.length} pedido(s) enviado(s) para aprobación`, '#d97706');
    }
    if(autoOrders.length){
      autoOrders.forEach(o => {
        const sup = data.suppliers[o.supId];
        if(sup?.phone) Modal.showWA(sup.phone, msgSupplier(o), `Pedido aprobado — envíalo a ${sup.name}`);
      });
      toast(`⚡ ${autoOrders.length} pedido(s) aprobado(s) automáticamente`, '#16a34a');
    }
  } catch(e){
    console.error('submitOrder error:', e);
    toast('Error al enviar el pedido: ' + e.message, '#dc2626', 5000);
  } finally {
    state.submitting = false;
    setTimeout(render, 500);
  }
}

async function markReceived(id){
  const o = data.orders.find(x => x.id === id);
  if(!o){ toast('Pedido no encontrado', '#dc2626'); return; }

  return new Promise(resolve => {
    const itemsHtml = (o.items||[]).map((it, i) => `
      <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--brd)">
        <div style="flex:1;font-size:13px">${esc(it.name)} <span style="color:var(--mut)">${it.qty} ${esc(it.unit||'')}</span></div>
        <select id="recv-status-${i}" style="font-size:12px;padding:3px 6px;border:1px solid var(--brd);border-radius:6px;background:var(--card);color:var(--txt)">
          <option value="ok">✅ OK</option>
          <option value="partial">⚠️ Parcial</option>
          <option value="missing">❌ Faltó</option>
          <option value="bad">🔴 Mal estado</option>
        </select>
        <input id="recv-note-${i}" type="text" maxlength="80" placeholder="Nota..." style="width:100px;font-size:12px;padding:3px 6px;border:1px solid var(--brd);border-radius:6px;background:var(--card);color:var(--txt)">
      </div>`).join('');
    Modal.open(`
      <h3>📦 Confirmar entrega</h3>
      <div style="max-height:50vh;overflow-y:auto">${itemsHtml}</div>
      <textarea id="recv-general-note" maxlength="300" placeholder="Nota general (opcional)..." rows="2" style="width:100%;padding:8px;border:1px solid var(--brd);border-radius:8px;font-size:13px;background:var(--bg);color:var(--txt);resize:none;box-sizing:border-box;margin-top:10px"></textarea>
      <div class="modal-btns" style="margin-top:14px">
        <button class="btn btn-ghost btn-sm" onclick="Modal._closeRecv(false)">Cancelar</button>
        <button class="btn btn-ok btn-sm" onclick="Modal._closeRecv(true)">✅ Confirmar entrega</button>
      </div>
    `);
    Modal._closeRecv = async (confirm) => {
      if(!confirm){ Modal.close(); resolve(false); return; }
      const receivedItems = (o.items||[]).map((it, i) => {
        const status = document.getElementById('recv-status-'+i)?.value || 'ok';
        const note = sanitizeInput(document.getElementById('recv-note-'+i)?.value, 80).trim();
        return { ...it, recvStatus: status, ...(note ? { recvNote: note } : {}) };
      });
      const generalNote = sanitizeInput(document.getElementById('recv-general-note')?.value, 300).trim();
      const hasIssues = receivedItems.some(it => it.recvStatus !== 'ok');
      Modal.close();
      try {
        await updateOrder(id, {
          status: 'received',
          receivedAt: new Date().toISOString(),
          receivedItems,
          ...(generalNote ? { receivedNote: generalNote } : {}),
          ...(hasIssues ? { receivedIssues: true } : {})
        });
        toast(hasIssues ? '📦 Recibido con incidencias' : '📦 Pedido recibido correctamente', hasIssues ? '#d97706' : '#7c3aed');
      } catch(e){ toast('Error: ' + e.message, '#dc2626'); }
      resolve(true);
    };
  });
}

/* ═══════════════ TEMPLATES ═══════════════ */
function saveTpl(){
  const name = sanitizeInput(document.getElementById('tpl-name')?.value, 50).trim();
  if(!name){ toast('Pon un nombre', '#dc2626'); return; }
  if(!state.session?.uid){ toast('Sin sesión', '#dc2626'); return; }
  const sup = data.suppliers[state.supId];
  const sc = state.cart[state.supId] || {};
  const items = sup.products.filter(p => sc[p.id]).map(p => ({ prodId: p.id, prodName: p.name, qty: sc[p.id], unit: p.unit, price: p.price }));
  if(!items.length){ toast('Añade productos primero', '#dc2626'); return; }
  const recurType = document.getElementById('tpl-recur')?.value || 'none';
  const recurDayRaw = document.getElementById('tpl-recur-day')?.value || '1';
  const recurrence = recurType === 'none'
    ? { type: 'none' }
    : recurType === 'weekly'
      ? { type: 'weekly', weekday: parseInt(recurDayRaw)||1 }
      : { type: 'monthly', dayOfMonth: parseInt(recurDayRaw.replace('d',''))||1 };
  const tpl = { id: uid(), name, supId: state.supId, items, recurrence, createdAt: new Date().toISOString() };
  if(fbDb) fbDb.ref('templates/' + state.session.uid + '/' + tpl.id).set(tpl).then(()=> toast('Plantilla guardada', '#16a34a'));
  state.showSaveTemplate = false;
}

function loadTemplate(tplId){
  if(!state.session?.uid) return;
  const tpl = data.templates[state.session.uid]?.[tplId];
  if(!tpl) return;
  state.supId = tpl.supId;
  if(!state.cart[tpl.supId]) state.cart[tpl.supId] = {};
  tpl.items.forEach(it => { state.cart[tpl.supId][it.prodId] = it.qty; });
  render();
  toast('Plantilla cargada — revisa cantidades', '#16a34a');
}

async function deleteTpl(tplId){
  if(!state.session?.uid) return;
  if(!await Modal.confirm({ title: '¿Eliminar plantilla?', danger: true })) return;
  if(fbDb) fbDb.ref('templates/' + state.session.uid + '/' + tplId).remove();
}

function loadAutoSuggest(){
  if(!state.session) return;
  const myHistory = data.orders.filter(o => o.restaurant === state.session.restaurant && o.supId === state.supId && o.status !== 'rejected');
  const acc = {};
  myHistory.forEach(o => (o.items||[]).forEach(it => {
    if(!acc[it.id]) acc[it.id] = { prodId: it.id, totalQty: 0, count: 0 };
    acc[it.id].count++;
    acc[it.id].totalQty += it.qty;
  }));
  if(!state.cart[state.supId]) state.cart[state.supId] = {};
  Object.values(acc).sort((a,b) => b.count - a.count).slice(0,5).forEach(it => {
    state.cart[state.supId][it.prodId] = Math.round(it.totalQty/it.count) || 1;
  });
  render();
  toast('🤖 Pedido típico cargado — ajusta cantidades', '#7c3aed');
}

function loadRecurringTpl(tplId){
  if(!state.session?.uid) return;
  const tpl = Object.values(data.templates[state.session.uid]||{}).find(t => t.id === tplId);
  if(!tpl){ toast('Plantilla no encontrada', '#dc2626'); return; }
  state.supId = tpl.supId;
  if(!state.cart[tpl.supId]) state.cart[tpl.supId] = {};
  tpl.items.forEach(it => { state.cart[tpl.supId][it.prodId] = it.qty; });
  const todayKey = new Date().toISOString().split('T')[0];
  if(fbDb) fbDb.ref('templates/' + state.session.uid + '/' + tplId + '/lastAutoDate').set(todayKey);
  render();
  toast('✅ Plantilla recurrente cargada', '#16a34a');
}

function localAddProd(sid){
  const name = sanitizeInput(document.getElementById('lp-name')?.value, 80).trim();
  const unit = sanitizeInput(document.getElementById('lp-unit')?.value, 10) || 'KG';
  const price = parseFloat(document.getElementById('lp-price')?.value);

function approveRegistration(uid){
  const u = data.authUsers[uid];
  if(!u) return;
  const updates = { status: 'approved', approvedAt: new Date().toISOString(), approvedBy: config.adminName };
  if(!u.restaurants || !u.restaurants.length) updates.restaurants = [u.restaurant];
  fbDb.ref('authUsers/' + uid).update(updates).then(()=> toast('✅ Acceso concedido: ' + u.email, '#16a34a'));
}

async function rejectRegistration(uid){
  const u = data.authUsers[uid];
  if(!u) return;
  const reason = await Modal.prompt({ title: 'Rechazar solicitud', msg: 'Motivo del rechazo (opcional):', multiline: true, okText: 'Rechazar' });

function toggleNeedsApprovalAuth(uid, val){
  fbDb.ref('authUsers/' + uid).update({ needsApproval: val }).then(()=> toast(val ? 'Ahora requiere aprobación manual' : 'Ahora se aprueba automáticamente', '#16a34a'));

async function revokeUser(uid){
  const u = data.authUsers[uid];
  if(!u) return;
  if(!await Modal.confirm({ title: '¿Revocar acceso?', msg: 'El usuario ' + u.email + ' no podrá entrar.', danger: true, okText: 'Revocar' })) return;
  fbDb.ref('authUsers/' + uid).update({ status: 'rejected', revokedAt: new Date().toISOString() }).then(()=> toast('Acceso revocado', '#888'));
}

function saveUserRestaurants(uid){
  const boxes = document.querySelectorAll('.perm-cb-' + uid);
  const selected = [...boxes].filter(cb => cb.checked).map(cb => cb.value);
  if(!selected.length){ toast('⚠️ Selecciona al menos un local', '#dc2626'); return; }
  const u = data.authUsers[uid];
  if(!u) return;
  const primary = selected.includes(u.restaurant) ? u.restaurant : selected[0];
  fbDb.ref('authUsers/' + uid).update({ restaurants: selected, restaurant: primary }).then(()=> {
    state.editingPermsUid = null;
    toast('✅ Permisos actualizados', '#16a34a');
  });
}

function addRestToUser(uid){
  const inp = document.getElementById('add-rest-'+uid);
  if(!inp) return;
  const newRest = sanitizeInput(inp.value, 60).trim();
  if(!newRest){ toast('Escribe un nombre', '#dc2626'); return; }
  const u = data.authUsers[uid];
  if(!u) return;
  const current = u.restaurants || [u.restaurant];
  if(current.includes(newRest)){ toast('Ya tiene acceso a ese local', '#d97706'); return; }
  const updated = [...current, newRest];
  fbDb.ref('authUsers/' + uid).update({ restaurants: updated }).then(()=> {
    inp.value = '';
    toast('✅ Local añadido — recuerda guardar', '#16a34a');
    render();
  });
}

function saveSup2(id){
  const name = sanitizeInput(document.getElementById('sf-name-'+id)?.value, 60).trim();
  const emoji = sanitizeInput(document.getElementById('sf-emoji-'+id)?.value, 4).trim() || '🏭';
  const phone = (document.getElementById('sf-phone-'+id)?.value || '').replace(/\D/g, '').slice(0, 15);
  const ordenRaw = document.getElementById('sf-orden-'+id)?.value.trim();
  const orden = ordenRaw && !isNaN(ordenRaw) ? parseInt(ordenRaw) : undefined;
  if(!name){ toast('Introduce el nombre', '#dc2626'); return; }
  if(id === 'new'){
    const nid = 's' + uid();
    data.suppliers[nid] = { id: nid, name, emoji, phone, ...(orden !== undefined ? { orden } : {}), products: [] };
    saveSups().then(()=> { state.editSupId = null; state.openSupId = nid; render(); toast('Proveedor creado', '#16a34a'); });
  } else {
    if(!data.suppliers[id]) return;
    data.suppliers[id].name = name;
    data.suppliers[id].emoji = emoji;
    data.suppliers[id].phone = phone;
    if(orden !== undefined) data.suppliers[id].orden = orden; else delete data.suppliers[id].orden;
    saveSups().then(()=> { render(); toast('Proveedor guardado', '#16a34a'); });
  }
}

async function delSup(id){
  if(!await Modal.confirm({ title: '¿Eliminar proveedor?', msg: 'Se eliminarán también todos sus productos.', danger: true, okText: 'Eliminar' })) return;
  delete data.suppliers[id];
  saveSups();
}

function toggleSupVisibility(sid, uid, visible){
  if(!data.suppliers[sid]) return;
  if(!data.suppliers[sid].disabledFor) data.suppliers[sid].disabledFor = [];
  if(visible){
    data.suppliers[sid].disabledFor = data.suppliers[sid].disabledFor.filter(id => id !== uid);
  } else {
    if(!data.suppliers[sid].disabledFor.includes(uid)) data.suppliers[sid].disabledFor.push(uid);
  }
  saveSups();
  toast(visible ? 'Proveedor activado para este usuario' : 'Proveedor desactivado', '#16a34a');
}

function editProdPrice(sid, pid, val){
  const price = parseFloat(val);
  if(!data.suppliers[sid] || !validPrice(price)){ toast('Precio no válido', '#dc2626'); return; }
  const prod = data.suppliers[sid].products.find(p => p.id === pid);
  if(!prod) return;
  const oldPrice = parseFloat(prod.price) || 0;
  prod.price = price;
  saveSups().then(()=>{
    if(fbDb && Math.abs(oldPrice - price) > 0.001){
      const h = { id: uid(), supId: sid, supName: data.suppliers[sid].name, prodId: pid, prodName: prod.name, oldPrice, newPrice: price, changedAt: new Date().toISOString() };
      fbDb.ref('priceHistory/' + h.id).set(h);
    }
    const alertPct = config.priceAlertPct || 5;
    if(oldPrice > 0){
      const pct = ((price - oldPrice)/oldPrice) * 100;
      if(pct > alertPct) toast(`⚠️ ${prod.name}: precio subió un +${pct.toFixed(1)}%`, '#d97706', 4000);
      else if(pct < -alertPct) toast(`✅ ${prod.name}: precio bajó un ${pct.toFixed(1)}%`, '#16a34a', 4000);
      else toast('Precio actualizado', '#16a34a');
    } else { toast('Precio actualizado', '#16a34a'); }
  });
}

function addProd(sid){
  const name = sanitizeInput(document.getElementById('pf-name-'+sid)?.value, 80).trim();
  const unit = sanitizeInput(document.getElementById('pf-unit-'+sid)?.value, 10);
  const price = parseFloat(document.getElementById('pf-price-'+sid)?.value);
  if(!name || !validPrice(price)){ toast('Nombre y precio obligatorios', '#dc2626'); return; }
  if(!data.suppliers[sid].products) data.suppliers[sid].products = [];
  data.suppliers[sid].products.push({ id: 'p'+uid(), name, unit: unit||'KG', price });
  saveSups().then(()=> { render(); toast('Producto añadido', '#16a34a'); });
}

async function delProd(sid, pid){
  if(!await Modal.confirm({ title: '¿Eliminar producto?', danger: true })) return;
  if(!data.suppliers[sid]) return;
  data.suppliers[sid].products = data.suppliers[sid].products.filter(p => p.id !== pid);
  saveSups().then(render);
}

/* Food cost */
function fcKey(){
  const d = new Date(state.fcDate + 'T12:00:00');
  if(state.fcPeriod === 'day') return 'd_' + state.fcDate;
  if(state.fcPeriod === 'week'){
    const m = new Date(d); m.setDate(d.getDate() - ((d.getDay()+6)%7));
    return 'w_' + m.toISOString().split('T')[0];
  }
  return 'm_' + state.fcDate.slice(0,7);
}
function fcRange(){
  const d = new Date(state.fcDate + 'T12:00:00');
  if(state.fcPeriod === 'day') return { s: new Date(state.fcDate+'T00:00:00'), e: new Date(state.fcDate+'T23:59:59') };
  if(state.fcPeriod === 'week'){
    const s = new Date(d); s.setDate(d.getDate() - ((d.getDay()+6)%7)); s.setHours(0,0,0,0);
    const e = new Date(s); e.setDate(s.getDate() + 6); e.setHours(23,59,59,999);
    return { s, e };
  }
  return { s: new Date(d.getFullYear(), d.getMonth(), 1), e: new Date(d.getFullYear(), d.getMonth()+1, 0, 23, 59, 59, 999) };
}
function fcPeriodLabel(){
  const d = new Date(state.fcDate + 'T12:00:00');
  if(state.fcPeriod === 'day') return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  if(state.fcPeriod === 'week'){ const { s, e } = fcRange(); return s.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) + ' – ' + e.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }); }
  return d.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
}
function fcNavDate(dir){
  const d = new Date(state.fcDate + 'T12:00:00');
  if(state.fcPeriod === 'day') d.setDate(d.getDate() + dir);
  else if(state.fcPeriod === 'week') d.setDate(d.getDate() + dir*7);
  else d.setMonth(d.getMonth() + dir);
  state.fcDate = d.toISOString().split('T')[0];
  render();
}
function fcOrders(){
  const { s, e } = fcRange();
  return data.orders.filter(o => (o.status==='approved'||o.status==='received') && o.createdAt && new Date(o.createdAt) >= s && new Date(o.createdAt) <= e);
}
function saveRevenue(key, val){
  const v = parseFloat(val);
  if(isNaN(v) || v < 0 || v > 10000000){ toast('Valor no válido', '#dc2626'); return; }
  if(fbDb) fbDb.ref('revenue/' + key).set(v);
}

function vFoodCost(){
  const key = fcKey();
  const rev = data.revenue[key] || 0;
  const appr = fcOrders();
  const fcRng = fcRange();
  const extraCostTotal = Object.values(data.extraExpenses).filter(ex => { const d = new Date(ex.date||ex.createdAt); return d >= fcRng.s && d <= fcRng.e; }).reduce((s,ex) => s + (parseFloat(ex.amount)||0), 0);
  const totalCost = appr.reduce((s,o) => s + total(o), 0) + extraCostTotal;
  const pct = rev > 0 ? (totalCost/rev)*100 : null;
  const pctCol = pct === null ? 'var(--mut)' : pct < 28 ? '#16a34a' : pct < 33 ? '#ca8a04' : pct < 38 ? '#ea580c' : '#dc2626';
  const pctLbl = pct === null ? 'Sin facturación' : pct < 28 ? 'Excelente' : pct < 33 ? 'Bueno' : pct < 38 ? 'Atención' : 'Elevado';
  const pctIco = pct === null ? '' : pct < 28 ? '✅' : pct < 33 ? '👍' : pct < 38 ? '⚠️' : '🔴';

  const byRest = {};
  Object.values(data.authUsers).filter(u => u.status === 'approved' && !u.isAdmin).forEach(u => { byRest[u.uid] = { name: u.restaurant, id: u.uid, cost: 0 }; });
  appr.forEach(o => {
    const u = Object.values(data.authUsers).find(x => x.restaurant === o.restaurant);
    if(u && byRest[u.uid]) byRest[u.uid].cost += total(o);
  });
  Object.values(data.extraExpenses).forEach(ex => {
    const d = new Date(ex.date||ex.createdAt);
    if(d >= fcRng.s && d <= fcRng.e){
      const u = Object.values(data.authUsers).find(x => x.restaurant === ex.restaurant);
      if(u && byRest[u.uid]) byRest[u.uid].cost += (parseFloat(ex.amount)||0);
    }
  });
  const restRows = Object.values(byRest).filter(r => r.cost > 0).sort((a,b) => b.cost - a.cost).map(r => {
    const rKey = key + '_r_' + r.id;
    const rRev = data.revenue[rKey] || 0;
    const rPct = rRev > 0 ? (r.cost/rRev)*100 : null;
    const rCol = rPct === null ? 'var(--mut)' : rPct < 28 ? '#16a34a' : rPct < 33 ? '#ca8a04' : rPct < 38 ? '#ea580c' : '#dc2626';
    return `<tr style="border-top:1px solid var(--brd)">

function vCompare(){
  const sups = supList();
  if(sups.length < 2) return `<div class="empty"><div class="ei">🔍</div><div class="et">Necesitas al menos 2 proveedores para comparar</div></div>`;
  const groups = {};
  sups.forEach(sup => {
    (sup.products||[]).forEach(p => {
      const key = norm(p.name);
      if(!groups[key]) groups[key] = { name: p.name, entries: {} };
      groups[key].entries[sup.id] = { price: parseFloat(p.price)||0, unit: p.unit };
    });
  });
  const multi = Object.values(groups).filter(g => Object.keys(g.entries).length >= 2).sort((a,b) => a.name.localeCompare(b.name, 'es'));
  if(!multi.length) return `<div class="empty"><div class="ei">🔍</div><div class="et">No hay productos con el mismo nombre en varios proveedores</div></div>`;
  const headers = sups.map(s => `<th style="text-align:right;padding:4px 8px 10px;font-size:11px;color:var(--mut);white-space:nowrap">${esc(s.emoji||'')} ${esc(s.name)}</th>`).join('');
  const rows = multi.map(g => {
    const prices = Object.values(g.entries).map(e => e.price).filter(p => p > 0);
    const minP = prices.length ? Math.min(...prices) : 0;
    const cells = sups.map(sup => {
      const e = g.entries[sup.id];
      if(!e) return `<td style="padding:6px 8px;text-align:right;color:var(--brd)">—</td>`;
      const cheap = e.price > 0 && e.price === minP && prices.filter(p => p === minP).length < prices.length;
      return `<td style="padding:6px 8px;text-align:right;font-size:13px;${cheap?'color:#16a34a;font-weight:700':''}">${cheap?'✅ ':''}${fmt(e.price)}<span style="font-size:10px;color:var(--mut)">/${esc(e.unit||'')}</span></td>`;
    }).join('');
    return `<tr style="border-top:1px solid var(--brd)"><td style="padding:6px 4px 6px 0;font-size:13px">${esc(g.name)}</td>${cells}</tr>`;
  }).join('');
  return `<div class="card"><div class="card-t">Comparativa de precios entre proveedores</div>
    <div style="font-size:12px;color:var(--mut);margin-bottom:12px">✅ = precio más bajo. Solo aparecen productos presentes en 2+ proveedores.</div>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
      <thead><tr><th style="text-align:left;padding:4px 0 10px;font-size:11px;color:var(--mut)">Producto</th>${headers}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`;
}

        <th style="text-align:right;padding:4px 6px 8px">Antes</th>

function vSupHistory(){
  const supIds = Object.keys(data.suppliers);
  if(!supIds.length) return `<div class="empty"><div class="ei">📦</div><div class="et">Sin proveedores</div></div>`;
  const rows = supIds.map(sid => {
    const sup = data.suppliers[sid];
    const supOrders = data.orders.filter(o => (o.status==='approved'||o.status==='received') && o.supId === sid);
    if(!supOrders.length) return '';
    const totalSpend = supOrders.reduce((s,o) => s + total(o), 0);
    const lastOrder = supOrders.slice().sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
    const prodMap = {};
    supOrders.forEach(o => (o.items||[]).forEach(it => {
      if(!prodMap[it.id]) prodMap[it.id] = { name: it.name, unit: it.unit, qty: 0, spend: 0, count: 0 };
      prodMap[it.id].qty += it.qty;
      prodMap[it.id].spend += (it.qty||0)*(it.price||0);
      prodMap[it.id].count++;
    }));
    const topProds = Object.values(prodMap).sort((a,b) => b.spend - a.spend).slice(0, 5);
    const prodRows = topProds.map(p => `<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--brd)"><span>${esc(p.name)}</span><span style="color:var(--mut)">${p.qty.toFixed(1)} ${esc(p.unit||'')} · ${fmt(p.spend)}</span></div>`).join('');
    return `<div class="card" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div style="font-size:24px">${esc(sup.emoji||'📦')}</div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:15px">${esc(sup.name)}</div>
          <div style="font-size:12px;color:var(--mut)">${supOrders.length} pedidos · Último: ${fmtD(lastOrder.createdAt)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:700;color:var(--pri)">${fmt(totalSpend)}</div>
          <div style="font-size:11px;color:var(--mut)">total</div>
        </div>
      </div>
      <div class="sh" style="font-size:11px;margin-bottom:4px">TOP PRODUCTOS</div>
      ${prodRows || '<div style="font-size:12px;color:var(--mut)">Sin datos</div>'}
    </div>`;
  }).filter(Boolean).join('');
  if(!rows) return `<div class="empty"><div class="ei">📦</div><div class="et">Sin historial de compras aún</div></div>`;
  const totalAll = data.orders.filter(o => o.status==='approved'||o.status==='received').reduce((s,o) => s + total(o), 0);
  return `<div style="font-size:13px;color:var(--mut);margin-bottom:12px">Total comprado a todos los proveedores: <strong>${fmt(totalAll)}</strong></div>` + rows;
}

function vAlbaranes(){
  const btn = `<button class="btn btn-pri btn-sm" onclick="goAlbaran()" style="margin-bottom:14px">+ Nuevo albarán</button>`;
  const byRest = {};
  data.orders.filter(o => o.status === 'approved' || o.status === 'received').forEach(o => {
    if(!byRest[o.restaurant]) byRest[o.restaurant] = { ordered: 0, received: 0 };
    byRest[o.restaurant].ordered += total(o);
  });
  data.albNotes.forEach(a => {
    if(!byRest[a.restaurant]) byRest[a.restaurant] = { ordered: 0, received: 0 };
    byRest[a.restaurant].received += (a.items||[]).reduce((s,it) => s + (parseFloat(it.qty)||0)*(parseFloat(it.price)||0), 0);
  });
  const tableRows = Object.entries(byRest).map(([rest, d]) => {
    const diff = d.received - d.ordered;
    const pct = d.ordered > 0 ? ((diff/d.ordered)*100).toFixed(1) : '-';
    const cls = Math.abs(diff) < 1 ? 'diff-ok' : diff > 0 ? 'diff-err' : 'diff-warn';
    return `<tr><td>${esc(rest||'')}</td><td>${fmt(d.ordered)}</td><td>${fmt(d.received)}</td><td class="${cls}">${diff>=0?'+':''}${fmt(diff)}${pct!=='-'?' ('+pct+'%)':''}</td></tr>`;
  }).join('');
  const table = tableRows ? `<div class="card"><div class="card-t">📊 Pedido vs Recibido por local</div><div style="overflow-x:auto"><table class="spend-table"><tr><th>Local</th><th>Pedido</th><th>Recibido</th><th>Diferencia</th></tr>${tableRows}</table></div></div>` : '';
  const notes = data.albNotes.length ? data.albNotes.map(a => albCard(a)).join('') : `<div class="empty"><div class="ei">📋</div><div class="et">Sin albaranes registrados</div></div>`;
  return btn + table + `<div class="sh">Albaranes</div>` + notes;
}

function albCard(a){
  const sup = data.suppliers[a.supId] || { name: '?', emoji: '?' };
  const tot = (a.items||[]).reduce((s,it) => s + (parseFloat(it.qty)||0)*(parseFloat(it.price)||0), 0);
  const matchOrder = data.orders.find(o => o.restaurant === a.restaurant && o.supId === a.supId && o.status === 'approved');
  const hasIncidents = (a.items||[]).some(it => it.incident);
  const rows = (a.items||[]).map(it => `<div class="pr" style="${it.incident?'background:#fff5f5;border-radius:6px;padding:4px 6px;margin-bottom:2px':''}">
    <span class="pn">${it.code?`<small style="color:var(--mut)">[${esc(it.code)}]</small> `:''} ${esc(it.name||'')}${it.incident?`<div style="font-size:11px;color:#dc2626;margin-top:2px">⚠️ ${esc(it.incident)}</div>`:''}</span>
    <span class="pq">${it.qty} ${esc(it.unit||'')}</span>
    <span class="pp">${fmt((parseFloat(it.qty)||0)*(parseFloat(it.price)||0))}</span>
  </div>`).join('');
  let cmp = '';
  if(matchOrder){
    const cmpRows = (a.items||[]).map(ai => {
      const oi = (matchOrder.items||[]).find(x => norm(x.name) === norm(ai.name));
      if(!oi) return `<div class="cmp-cell cmp-warn"><div class="cmp-name">${esc(ai.name)}</div><div class="cmp-val">⚠️ No estaba en el pedido</div></div>`;
      const qDiff = ai.qty - oi.qty;
      const cls = qDiff === 0 ? 'cmp-ok' : Math.abs(qDiff/oi.qty) < 0.05 ? 'cmp-warn' : 'cmp-err';
      return `<div class="cmp-cell ${cls}"><div class="cmp-name">${esc(ai.name)}</div><div class="cmp-val">Pedido: ${oi.qty} · Recibido: ${ai.qty}${qDiff!==0?` (${qDiff>0?'+':''}${qDiff})`:' ✓'}</div></div>`;
    }).join('');
    cmp = `<div class="sh" style="margin-top:12px">Comparativa con pedido</div>${cmpRows}`;
  }
  return `<div class="alb-card">
    <div class="alb-hd">
      <div><div class="alb-rest">${esc(a.restaurant||'')}</div><div class="alb-info">${esc(sup.emoji||'')} ${esc(sup.name)} · ${esc(new Date(a.date+'T00:00:00').toLocaleDateString('es-ES'))}</div></div>
      <div style="display:flex;gap:6px">${hasIncidents?`<span class="badge" style="background:#dc2626;color:#fff">⚠️ Incid.</span>`:''}<button class="btn btn-no btn-xs" onclick="delAlbF('${esc(a.id)}')">🗑️</button></div>
    </div>
    ${a.photo?`<img src="${esc(a.photo)}" class="alb-photo" alt="Albarán"/>`:''}
    <div class="pl">${rows}<div class="ptot">Total: ${fmt(tot)}</div></div>
    ${cmp}
  </div>`;
}

function handleAlbPhoto(input){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 5 * 1024 * 1024){ toast('Imagen demasiado grande (máx 5MB)', '#dc2626'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    state.albPhoto = e.target.result;
    const img = document.getElementById('alb-img-preview');
    if(img){ img.src = state.albPhoto; img.style.display = 'block'; }
    render();
  };
  reader.readAsDataURL(file);
}

function albDelItem(i){ state.albItems.splice(i, 1); render(); }

async function runOCR(){
  if(!state.albPhoto){ toast('Añade una foto primero', '#dc2626'); return; }
  if(!config.geminiKey){ toast('Configura Gemini en ⚙️ Config', '#dc2626'); return; }
  const prog = document.getElementById('ocr-progress');
  if(prog){ prog.style.display = 'block'; prog.textContent = '🤖 Analizando con IA...'; }
  try {
    const base64 = state.albPhoto.split(',')[1];
    const mime = state.albPhoto.split(';')[0].split(':')[1] || 'image/jpeg';
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(config.geminiKey)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [
        { inline_data: { mime_type: mime, data: base64 } },
        { text: `Lee este albarán y extrae los productos. Responde ÚNICAMENTE con un JSON array:\n[{"name":"Entrecot de ternera","qty":5.5,"unit":"KG","price":28.50}]\nUnidades: KG, UN, L, Caja. Si no hay precio usa 0.` }
      ]}]})
    });
    const json = await resp.json();
    if(json.error){ toast('Error Gemini: ' + json.error.message, '#dc2626'); return; }
    const text = json.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const match = text.match(/\[[\s\S]*\]/);
    if(match){
      const parsed = JSON.parse(match[0]);
      if(Array.isArray(parsed) && parsed.length > 0){
        state.albItems = [
          ...state.albItems,
          ...parsed.map(p => ({
            code: '',
            name: sanitizeInput(p.name||'', 80),
            unit: ['KG','UN','L','Caja'].includes(p.unit) ? p.unit : 'KG',
            qty: validQty(p.qty) ? parseFloat(p.qty) : 1,
            price: validPrice(p.price) ? parseFloat(p.price) : 0
          }))
        ];
        toast(`🤖 Gemini reconoció ${parsed.length} productos`, '#16a34a');
        render();
        return;
      }
    }
    toast('Gemini no encontró productos. Añádelos manualmente.', '#d97706');
  } catch(e){
    console.error(e);
    toast('Error al analizar la imagen', '#dc2626');
  } finally {
    if(prog) prog.style.display = 'none';
  }
}

function saveAlbaran(){
  const isAdmin = state.session?.isAdmin;
  const myRests = state.session?.restaurants || [state.session?.restaurant];
  const rest = isAdmin
    ? sanitizeInput(document.getElementById('alb-rest')?.value || state.albRestaurant, 80)
    : (myRests.length > 1 ? sanitizeInput(document.getElementById('alb-rest')?.value || state.albRestaurant, 80) : myRests[0]);
  const supId = document.getElementById('alb-sup')?.value || state.albSupId;
  const date = document.getElementById('alb-date')?.value || state.albDate;
  if(!rest){ toast('Selecciona el restaurante', '#dc2626'); return; }
  if(!supId){ toast('Selecciona el proveedor', '#dc2626'); return; }
  const valid = state.albItems.filter(it => it.name && validQty(it.qty) && it.qty > 0);
  if(!valid.length){ toast('Añade al menos un producto válido', '#dc2626'); return; }
  const a = {
    id: uid(),
    restaurant: rest,
    supId,
    date,
    photo: state.albPhoto,
    items: valid.map(it => ({
      code: sanitizeInput(it.code||'', 20),
      name: sanitizeInput(it.name, 80),
      unit: it.unit||'KG',
      qty: parseFloat(it.qty)||0,
      price: parseFloat(it.price)||0,
      ...(it.incident ? { incident: sanitizeInput(it.incident, 200) } : {})
    })),
    createdAt: new Date().toISOString()
  };
  saveAlb(a);
  toast('✅ Albarán guardado', '#16a34a');
  if(state.session?.isAdmin){ state.adminTab = 'albaranes'; goAdmin(); }
  else goOrder();
}

/* ═══════════════ ESCANDALLOS ═══════════════ */
let _escEditId = null, _escIngs = [], _escAllData = {}, _escInit = false;

function vEscandallos(){
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:18px;font-weight:800;color:var(--pri)">🧮 Escandallos</div>
      <button class="btn btn-pri btn-sm" onclick="escOpenModal()">+ Nuevo</button>
    </div>
    <div class="esc-filtros">
      <input type="text" id="esc-search" maxlength="60" placeholder="Buscar plato..." oninput="escRender()" />
      <select id="esc-cat-filter" onchange="escRender()">
        <option value="">Todas las categorías</option>
        <option>Entrantes</option><option>Carnes</option><option>Pescados</option>
        <option>Postres</option><option>Bebidas</option><option>Otros</option>
      </select>
    </div>
    <div id="esc-grid" class="esc-grid"><p style="color:var(--mut)">Cargando...</p></div>`;
}

function initEscandallos(){
  if(_escInit || !fbDb){
    if(_escInit) escRender();
    return;
  }
  _escInit = true;
  trackListener(fbDb.ref('escandallos'), 'value', snap => {
    _escAllData = snap.val() || {};
    escRender();
  });
}

function escFmt(v){ return parseFloat(v||0).toFixed(2).replace('.', ',') + ' €'; }

function escRender(){
  const grid = document.getElementById('esc-grid');
  if(!grid) return;
  const txt = norm(document.getElementById('esc-search')?.value || '');
  const cat = document.getElementById('esc-cat-filter')?.value || '';
  const entries = Object.entries(_escAllData).filter(([,e]) => (!txt || norm(e.nombre||'').includes(txt)) && (!cat || e.categoria === cat));
  if(!entries.length){
    grid.innerHTML = '<p style="color:var(--mut)">No hay escandallos. Crea el primero con "+ Nuevo".</p>';
    return;
  }
  grid.innerHTML = entries.map(([id, e]) => {
    const coste = (e.ingredientes||[]).reduce((s,i) => s + (parseFloat(i.cantidad)||0)*(parseFloat(i.precioUnitario)||0), 0);
    const pvp = parseFloat(e.precioVenta) || 0;
    const fcObj = parseFloat(e.foodCostObjetivo) || 30;
    const fcReal = pvp > 0 ? (coste/pvp*100) : null;
    const margen = pvp > 0 ? (pvp - coste) : null;
    const margenPct = pvp > 0 && margen !== null ? (margen/pvp*100) : null;
    let cls = 'esc-ok';
    if(fcReal !== null){ if(fcReal > fcObj+5) cls = 'esc-bad'; else if(fcReal > fcObj) cls = 'esc-warn'; }
    return `<div class="esc-card" onclick="escOpenModal('${esc(id)}')">
      <div class="esc-fc-ind ${cls}">${fcReal!==null?fcReal.toFixed(0)+'%':'—'}</div>
      <span class="esc-badge">${esc(e.categoria||'Otros')}</span>
      <h4>${esc(e.nombre||'Sin nombre')}</h4>
      <div class="esc-stats">
        <div class="esc-stat"><span>Coste</span><strong>${escFmt(coste)}</strong></div>
        <div class="esc-stat"><span>PVP</span><strong>${pvp>0?escFmt(pvp):'—'}</strong></div>
        <div class="esc-stat"><span>Margen</span><strong>${margen!==null?escFmt(margen):'—'}</strong></div>
        <div class="esc-stat"><span>% Margen</span><strong>${margenPct!==null?margenPct.toFixed(1)+'%':'—'}</strong></div>
      </div>
      <div style="margin-top:10px;font-size:12px;color:var(--mut)">${(e.ingredientes||[]).length} ingredientes</div>
    </div>`;
  }).join('');
}

function escOpenModal(id=null){
  _escEditId = id;
  _escIngs = [];
  const isNew = !id;
  const e = id && _escAllData[id] ? _escAllData[id] : {};
  if(!isNew && _escAllData[id]) _escIngs = JSON.parse(JSON.stringify(e.ingredientes || []));

  const provOpts = Object.entries(data.suppliers).map(([pid, prov]) => `<option value="${esc(pid)}">${esc((prov.emoji||'')+(prov.name||pid))}</option>`).join('');

  Modal.open(`<div class="esc-modal-box">
    <div class="esc-modal-hd">
      <h3>${isNew?'Nuevo escandallo':'Editar escandallo'}</h3>
      <button class="btn btn-ghost btn-sm" onclick="Modal.close()">✕</button>
    </div>
    <div class="esc-modal-body">
      <div class="esc-left">
        <label>Nombre del plato</label>
        <input type="text" id="esc-nombre" maxlength="80" value="${esc(e.nombre||'')}" placeholder="Ej: Entrecot con patatas"/>
        <label>Categoría</label>
        <select id="esc-categoria">
          ${['Entrantes','Carnes','Pescados','Postres','Bebidas','Otros'].map(c => `<option ${e.categoria===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <label>Precio de venta (PVP) €</label>
        <input type="number" id="esc-pvp" min="0" max="${MAX_PRICE}" step="0.01" value="${e.precioVenta||''}" placeholder="0.00" oninput="escRecalc()"/>
        <label>Food cost objetivo (%)</label>
        <input type="number" id="esc-fcobj" min="1" max="100" value="${e.foodCostObjetivo||30}" oninput="escRecalc()"/>
        <label>Notas</label>
        <textarea id="esc-notas" rows="3" maxlength="500" placeholder="Alérgenos...">${esc(e.notas||'')}</textarea>
      </div>
      <div class="esc-right">
        <h4>Ingredientes</h4>
        <div class="esc-add-ing">
          <select id="esc-sel-prov" onchange="escLoadProds()">
            <option value="">-- Proveedor --</option>${provOpts}
          </select>
          <select id="esc-sel-prod"><option value="">-- Producto --</option></select>
          <input type="number" id="esc-sel-qty" placeholder="Cant." min="0" max="${MAX_QTY}" step="0.001"/>
          <button class="btn btn-ghost btn-sm" onclick="escAddIng()">+ Añadir</button>
        </div>
        <div id="esc-ing-list" class="esc-ing-list"></div>
        <div class="esc-calcs">
          <div class="esc-calc-r"><span>Coste total</span><strong id="ec-coste">0,00 €</strong></div>
          <div class="esc-calc-r"><span>Food cost real</span><strong id="ec-fc">— %</strong></div>
          <div class="esc-calc-r"><span>PVP sugerido</span><strong id="ec-pvpsug">— €</strong></div>
          <div class="esc-calc-r"><span>Margen bruto</span><strong id="ec-margen">— €</strong></div>
          <div class="esc-calc-r"><span>% Margen</span><strong id="ec-margenpct">— %</strong></div>
        </div>
      </div>
    </div>
    <div class="esc-modal-ft">
      <button class="btn btn-no btn-sm" style="${isNew?'visibility:hidden':''}" onclick="escDelete()">🗑 Eliminar</button>
      <div class="esc-modal-ft-r">
        <button class="btn btn-ghost btn-sm" onclick="Modal.close()">Cancelar</button>
        <button class="btn btn-pri btn-sm" onclick="escSave()">💾 Guardar</button>
      </div>
    </div>
  </div>`);

  // Replace standard modal-box with our wide version
  const wideBox = document.querySelector('.modal-box .esc-modal-box');
  if(wideBox){
    const parent = document.getElementById('modal-content');
    parent.innerHTML = '';
    parent.style.maxWidth = '880px';
    parent.style.padding = '0';
    parent.appendChild(wideBox);
  }

  escRenderIngs();
  escRecalc();
}

function escLoadProds(){
  const pid = document.getElementById('esc-sel-prov')?.value;
  const sel = document.getElementById('esc-sel-prod');
  if(!sel) return;
  sel.innerHTML = '<option value="">-- Producto --</option>';
  if(!pid || !data.suppliers[pid]) return;
  const prods = data.suppliers[pid].products || [];
  prods.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id || p.name;
    o.textContent = `${p.name} (${parseFloat(p.price||0).toFixed(2)}€/${p.unit||'u.'})`;
    o.dataset.price = p.price || 0;
    o.dataset.unit = p.unit || 'u.';
    o.dataset.name = p.name || '';
    sel.appendChild(o);
  });
}

function escAddIng(){
  const pid = document.getElementById('esc-sel-prov')?.value;
  const sel = document.getElementById('esc-sel-prod');
  const prodId = sel?.value;
  const qty = parseFloat(document.getElementById('esc-sel-qty')?.value);
  if(!pid){ toast('Selecciona un proveedor', '#dc2626'); return; }
  if(!prodId){ toast('Selecciona un producto', '#dc2626'); return; }
  if(!validQty(qty) || qty <= 0){ toast('Cantidad no válida', '#dc2626'); return; }
  const opt = sel.options[sel.selectedIndex];
  const prov = data.suppliers[pid];
  _escIngs.push({
    proveedorId: pid,
    proveedorNombre: (prov?.name||pid),
    productoId: prodId,
    nombre: opt.dataset.name || opt.textContent,
    cantidad: qty,
    unidad: opt.dataset.unit || 'u.',
    precioUnitario: parseFloat(opt.dataset.price) || 0
  });
  document.getElementById('esc-sel-prov').value = '';
  document.getElementById('esc-sel-prod').innerHTML = '<option value="">-- Producto --</option>';
  document.getElementById('esc-sel-qty').value = '';
  escRenderIngs();
  escRecalc();
}

function escQuitarIng(i){ _escIngs.splice(i, 1); escRenderIngs(); escRecalc(); }

function escLivePrice(ing){
  const sup = data.suppliers[ing.proveedorId];
  if(sup && sup.products){
    const prod = sup.products.find(p => p.id === ing.productoId);
    if(prod) return parseFloat(prod.price) || 0;
  }
  return parseFloat(ing.precioUnitario) || 0;
}

function escRenderIngs(){
  const cont = document.getElementById('esc-ing-list');
  if(!cont) return;
  if(!_escIngs.length){ cont.innerHTML = '<p style="color:var(--mut);font-size:13px">Sin ingredientes</p>'; return; }
  cont.innerHTML = _escIngs.map((ing, i) => {
    const liveP = escLivePrice(ing);
    const changed = Math.abs(liveP - (parseFloat(ing.precioUnitario)||0)) > 0.001;
    const priceTag = changed ? `<span style="color:#d97706;font-size:10px" title="Precio actualizado desde tarifa">🔄 ${escFmt(liveP)}</span>` : `${escFmt(liveP)}`;
    return `<div class="esc-ing-row">
      <span class="in">${esc(ing.nombre)}</span>
      <span class="id">${ing.cantidad} ${esc(ing.unidad)} × ${priceTag}</span>
      <span class="ic">${escFmt(ing.cantidad*liveP)}</span>
      <button onclick="escQuitarIng(${i})" title="Eliminar">✕</button>
    </div>`;
  }).join('');
}

function escRecalc(){
  const coste = _escIngs.reduce((s,i) => s + (parseFloat(i.cantidad)||0)*escLivePrice(i), 0);
  const pvp = parseFloat(document.getElementById('esc-pvp')?.value) || 0;
  const fcObj = parseFloat(document.getElementById('esc-fcobj')?.value) || 30;
  const fcReal = pvp > 0 ? (coste/pvp*100) : null;
  const pvpSug = coste > 0 ? (coste/(fcObj/100)) : null;
  const margen = pvp > 0 ? (pvp - coste) : null;
  const margenPct = pvp > 0 && margen !== null ? (margen/pvp*100) : null;
  if(document.getElementById('ec-coste')) document.getElementById('ec-coste').textContent = escFmt(coste);
  const fcEl = document.getElementById('ec-fc');
  if(fcEl){
    if(fcReal !== null){ fcEl.textContent = fcReal.toFixed(1)+'%'; fcEl.className = fcReal <= fcObj ? 'fc-ok' : fcReal <= fcObj+5 ? 'fc-warn' : 'fc-bad'; }
    else { fcEl.textContent = '— %'; fcEl.className = ''; }
  }
  if(document.getElementById('ec-pvpsug')) document.getElementById('ec-pvpsug').textContent = pvpSug !== null ? escFmt(pvpSug) : '— €';
  if(document.getElementById('ec-margen')) document.getElementById('ec-margen').textContent = margen !== null ? escFmt(margen) : '— €';
  if(document.getElementById('ec-margenpct')) document.getElementById('ec-margenpct').textContent = margenPct !== null ? margenPct.toFixed(1)+'%' : '— %';
}

function escSave(){
  if(!fbDb){ toast('Sin conexión', '#dc2626'); return; }
  const nombre = sanitizeInput(document.getElementById('esc-nombre')?.value, 80).trim();
  if(!nombre){ toast('Escribe el nombre del plato', '#dc2626'); return; }
  const ingsWithLivePrice = _escIngs.map(ing => ({ ...ing, precioUnitario: escLivePrice(ing) }));
  const dataObj = {
    nombre,
    categoria: document.getElementById('esc-categoria')?.value || 'Otros',
    precioVenta: parseFloat(document.getElementById('esc-pvp')?.value) || 0,
    foodCostObjetivo: parseFloat(document.getElementById('esc-fcobj')?.value) || 30,
    notas: sanitizeInput(document.getElementById('esc-notas')?.value, 500).trim(),
    ingredientes: ingsWithLivePrice,
    updatedAt: Date.now()
  };
  const ref = _escEditId ? fbDb.ref('escandallos/' + _escEditId) : fbDb.ref('escandallos').push();
  if(!_escEditId) dataObj.createdAt = Date.now();
  ref.set(dataObj).then(()=> { Modal.close(); toast('✅ Escandallo guardado', '#16a34a'); }).catch(e => toast('Error: ' + e.message, '#dc2626'));
}

async function escDelete(){
  if(!_escEditId) return;
  if(!await Modal.confirm({ title: '¿Eliminar este escandallo?', danger: true })) return;
  fbDb.ref('escandallos/' + _escEditId).remove().then(()=> { Modal.close(); toast('Escandallo eliminado', '#888'); });
}

/* ═══════════════ EXCEL EXPORT ═══════════════ */
function exportExcel(type){
  if(typeof XLSX === 'undefined'){ toast('Librería Excel no cargada', '#dc2626'); return; }
  let rows = [], filename = 'pedidos';
  if(type === 'received'){
    filename = 'pedidos_recibidos_' + new Date().toISOString().slice(0,10);
    const rec = data.orders.filter(o => o.status === 'received');
    rows = [['ID','Fecha pedido','Fecha recepción','Local','Proveedor','Total €'], ...rec.map(o => [o.id, (o.createdAt||'').slice(0,10), (o.receivedAt||'').slice(0,10), o.restaurant||'', (data.suppliers[o.supId]||{name:o.supId||'?'}).name, total(o).toFixed(2)])];
  } else {
    filename = 'pedidos_ocarro_' + new Date().toISOString().slice(0,10);
    rows = [['ID','Fecha','Local','Proveedor','Estado','Total €','Urgente','Entrega'], ...data.orders.map(o => [o.id, (o.createdAt||'').slice(0,10), o.restaurant||'', (data.suppliers[o.supId]||{name:o.supId||'?'}).name, o.status, total(o).toFixed(2), o.urgent?'Sí':'No', o.deliveryDate||''])];
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pedidos');
  XLSX.writeFile(wb, filename + '.xlsx');
  toast('📥 Excel descargado', '#16a34a');
}

window.onerror = function(msg, src, line, col, err){
  console.error('App error:', msg, 'at', src, line, col, err);
  // Log to Firebase for admin review (best-effort, ignore errors)
  try {
    if(fbDb && state.session?.uid){
      const errId = uid();
      fbDb.ref('errorLogs/' + errId).set({
        msg: String(msg).slice(0, 500),
        src: String(src).slice(0, 200),
        line, col,
        stack: err?.stack ? String(err.stack).slice(0, 1500) : '',
        uid: state.session.uid,
        timestamp: Date.now()
      }).catch(()=>{});
    }
  } catch(e){}
  return false;
};

window.addEventListener('unhandledrejection', e => {
  console.error('Unhandled promise rejection:', e.reason);
});

/* ═══════════════ INIT ═══════════════ */
window.addEventListener('DOMContentLoaded', () => {
  if(state.darkMode) document.body.classList.add('dark');

  // Inject PWA manifest
  const manifest = {
    name: "O'Carro Pedidos",
    short_name: "O'Carro",
    start_url: window.location.href,
    display: "standalone",
    background_color: "#f0f2f5",
    theme_color: "#1a1a2e",
    icons: [{ src: "https://raw.githubusercontent.com/twitter/twemoji/master/assets/svg/1f6d2.svg", sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
  };
  const mBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  document.getElementById('pwa-manifest').href = URL.createObjectURL(mBlob);

  // Service Worker — actually caches static resources
  if('serviceWorker' in navigator){
    const swCode = `
      const CACHE = 'ocarro-v2';
      const ASSETS = ['https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.js','https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.js','https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.js','https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];
      self.addEventListener('install', e => {
        self.skipWaiting();
        e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS).catch(()=>{})));
      });
      self.addEventListener('activate', e => {
        e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))));
        self.clients.claim();
      });
      self.addEventListener('fetch', e => {
        if(e.request.method !== 'GET') return;
        const url = e.request.url;
        // Cache-first for CDN assets, network-first for everything else
        if(ASSETS.some(a => url.startsWith(a))){
          e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).then(resp => { const clone = resp.clone(); caches.open(CACHE).then(c => c.put(e.request, clone)).catch(()=>{}); return resp; }).catch(()=> new Response('Offline', {status:503}))));
        }
      });
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }

  // Init Firebase
  if(!initFirebase()){
    setTimeout(() => {
      if(!fbAuth && typeof firebase !== 'undefined'){
        if(initFirebase()){
          attachFbListeners();
          if(state.view === 'login') render();
        }
      }
    }, 3000);
  }

  attachFbListeners();

  // Auth state listener
  if(fbAuth){
    fbAuth.onAuthStateChanged(user => {
      if(!user){
        if(!state.session){ state.view = 'login'; render(); }
        return;
      }
      // Lookup user data
      fbDb.ref('authUsers/' + user.uid).once('value').then(snap => {
        const u = snap.val();
        const isAdminUser = u?.isAdmin === true;
        if(isAdminUser){
          state.session = { uid: user.uid, email: user.email, name: u.name||config.adminName, isAdmin: true };
          // Reattach listeners with uid for templates
          clearListeners();
          attachFbListeners();
          goAdmin();
          return;
        }
        if(u && u.status === 'approved'){
          const myRests = u.restaurants || [u.restaurant];
          state.session = {
            uid: user.uid,
            email: user.email,
            name: u.name || u.restaurant,
            restaurant: myRests[0] || u.restaurant,
            restaurants: myRests,
            isAdmin: false,
            needsApproval: u.needsApproval !== false
          };
          clearListeners();
          attachFbListeners();
          showHdr(false);
          state.view = 'order';
          const sl = visibleSups();
          if(sl.length) state.supId = sl[0].id;
          render();
        } else if(u && (u.status === 'pending' || u.status === 'rejected')){
          state.session = { uid: user.uid, email: user.email, pendingStatus: u.status };
          document.getElementById('hdr').style.display = 'none';
          state.view = 'pending-approval';
          render();
        } else {
          // No record yet — could be a fresh registration in progress
          state.view = 'login';
          render();
        }
      }).catch(e => {
        console.error('Auth state lookup error:', e);
        state.view = 'login';
        render();
      });
    });
  }

  // Initial render if Firebase isn't ready yet
  if(!fbAuth) render();
});
</script>
</body>
</html>
