<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Provea">

<title>Provea — Gestión de Pedidos</title>
<!-- Firebase -->
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="toast" id="toast"></div>

<!-- PIN MODAL -->
<div class="overlay" id="pin-ov" style="display:none" onclick="if(event.target===this)closePIN()">
  <div class="pin-box">
    <div class="pin-title" id="pin-title">Introduce PIN</div>
    <div class="pin-sub" id="pin-sub"></div>
    <div class="pin-dots" id="pin-dots">
      <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
    </div>
    <div class="pin-err" id="pin-err">PIN incorrecto</div>
    <div class="numpad">
      <button class="nk" onclick="addPIN('1')">1</button><button class="nk" onclick="addPIN('2')">2</button><button class="nk" onclick="addPIN('3')">3</button>
      <button class="nk" onclick="addPIN('4')">4</button><button class="nk" onclick="addPIN('5')">5</button><button class="nk" onclick="addPIN('6')">6</button>
      <button class="nk" onclick="addPIN('7')">7</button><button class="nk" onclick="addPIN('8')">8</button><button class="nk" onclick="addPIN('9')">9</button>
      <button class="nk" onclick="delPIN()">⌫</button><button class="nk" onclick="addPIN('0')">0</button><button class="nk ok" onclick="confirmPIN()">✓</button>
    </div>
  </div>
</div>

<!-- WA MODAL -->
<div class="overlay" id="wa-ov" style="display:none" onclick="if(event.target===this)closeWA()">
  <div class="wa-modal">
    <h3> Enviar por WhatsApp</h3>
    <p id="wa-desc">Pulsa para abrir WhatsApp con el mensaje listo.</p>
    <div class="wa-msg" id="wa-msg-preview"></div>
    <div class="wa-modal-btns">
      <a id="wa-link-btn" href="#" target="_blank" class="btn btn-wa" onclick="closeWA()">
        <svg class="wa-ic" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Abrir WhatsApp
      </a>
      <button class="btn btn-ghost" onclick="copyWAMsg()"> Copiar</button>
      <button class="btn btn-ghost" onclick="closeWA()">Cerrar</button>
    </div>
  </div>
</div>

<!-- RECV MODAL -->
<div id="recv-ov" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center;padding:12px" onclick="if(event.target===this)closeRecvModal()">
  <div id="recv-modal" style="background:var(--card);border-radius:14px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto">
    <div style="font-weight:700;font-size:16px;margin-bottom:14px"> Confirmar entrega</div>
    <div id="recv-items"></div>
    <textarea id="recv-general-note" placeholder="Nota general (opcional)..." rows="2" style="width:100%;padding:8px;border:1px solid var(--brd);border-radius:8px;font-size:13px;background:var(--bg);color:var(--txt);resize:none;box-sizing:border-box;margin-top:10px"></textarea>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-ok btn-sm" onclick="confirmReceived()" style="flex:1">Confirmar entrega</button>
      <button class="btn btn-ghost btn-sm" onclick="closeRecvModal()">Cancelar</button>
    </div>
  </div>
</div>

<!-- HEADER -->
<header class="hdr" id="hdr" style="display:none">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="hbtn-menu" id="btn-menu" onclick="S.sidebarOpen=!S.sidebarOpen;render()">≡</button>
    <div class="logo" onclick="handleLogo()">O'<span>Carro</span> <span class="fb-dot" id="fb-dot"></span></div>
  </div>
  <div class="hdr-r">
    <span class="ses-info" id="ses-info"></span>
    <button class="hbtn" id="btn-np" style="display:none" onclick="goOrder()">+ Pedido</button>
    <button class="hbtn" id="btn-alb-r" style="display:none" onclick="goAlbaran()">📋 Albarán</button>
    <button class="hbtn act" id="btn-adm" style="display:none" onclick="goAdmin()"> Admin</button>
    <button class="hbtn" id="btn-dark" onclick="toggleDarkMode()" title="Modo oscuro" style="font-size:16px;padding:6px 10px">🌙</button>
    <button class="hbtn" onclick="logout()">↩</button>
  </div>
</header>

<div id="app"></div>
<!-- Aviso de pedidos pendientes de enviar (sin conexión) -->
<div id="pending-orders-badge" onclick="flushPendingOrders()" title="Toca para reintentar el envío" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:9000;background:#d97706;color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);align-items:center;gap:8px;cursor:pointer"></div>
