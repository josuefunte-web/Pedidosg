<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="O'Carro">
<link rel="manifest" id="pwa-manifest">
<title>O'Carro — Pedidos</title>
<!-- Firebase -->
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.js"></script>
<!-- Charts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<!-- Excel export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --pri:#1a1a2e;--acc:#e94560;--grn:#25D366;--grnd:#1da851;
  --bg:#f0f2f5;--card:#fff;--brd:#e0e0e0;
  --txt:#222;--mut:#888;--r:12px;--sh:0 2px 14px rgba(0,0,0,.08);
  --srf:#f8fafc;
}
body.dark{
  --pri:#e94560;--acc:#ff6b8a;
  --bg:#0f0f1a;--card:#1a1a2e;--brd:#2d2d4e;
  --txt:#e8e8f0;--mut:#8888aa;--sh:0 2px 14px rgba(0,0,0,.4);
  --srf:#242442;
}
body.dark .hdr{background:#0a0a14}
body.dark .tab.act{background:#2d2d4e;color:#e8e8f0}
body.dark .tabs{background:#0f0f1a}
body.dark input,body.dark select,body.dark textarea{background:#2d2d4e;color:#e8e8f0;border-color:#3d3d5e}
body.dark .stab{background:#2d2d4e;color:#e8e8f0}
body.dark .stab.act{background:var(--pri);color:#fff}
body.dark .pi{background:#1a1a2e;border-color:#2d2d4e}
body.dark .pi.ic{border-color:var(--pri)}
body.dark .sidebar{background:#0a0a14;border-color:#2d2d4e}
body.dark .oc{background:#1a1a2e;border-color:#2d2d4e}
body.dark .stat{background:#1a1a2e;border-color:#2d2d4e}
body.dark .btn-ghost{border-color:#2d2d4e;color:#e8e8f0}
body.dark .banner{background:#2d2d4e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.hdr{background:var(--pri);color:#fff;height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:90;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo{font-size:17px;font-weight:800;letter-spacing:.3px;cursor:pointer}
.logo span{color:var(--acc)}
.hdr-r{display:flex;align-items:center;gap:6px}
.hbtn{background:rgba(255,255,255,.1);border:none;color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.hbtn:hover{background:rgba(255,255,255,.22)}
.hbtn.act{background:var(--acc)}
.ses-info{font-size:12px;opacity:.7;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;margin-right:4px;transition:.3s}
.fb-dot.on{background:#4ade80}
.main{max-width:860px;margin:0 auto;padding:18px 14px 90px}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.card-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:14px}
.tabs{display:flex;gap:3px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{flex:1;padding:8px 10px;border:none;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--mut);white-space:nowrap;min-width:fit-content;transition:.2s}
.tab.act{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:10px;padding:14px 10px;text-align:center;border:1.5px solid var(--brd)}
.sv{font-size:24px;font-weight:800;color:var(--pri)}
.sl{font-size:10px;color:var(--mut);margin-top:3px;text-transform:uppercase;letter-spacing:.3px}
.btn{padding:9px 15px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:.2s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:hover:not(:disabled){background:#2d2d4e}
.btn-acc{background:var(--acc);color:#fff}.btn-acc:hover:not(:disabled){opacity:.9}
.btn-ok{background:#dcfce7;color:#16a34a}.btn-ok:hover:not(:disabled){background:#bbf7d0}
.btn-no{background:#fee2e2;color:#dc2626}.btn-no:hover:not(:disabled){background:#fecaca}
.btn-wa{background:var(--grn);color:#fff}.btn-wa:hover:not(:disabled){background:var(--grnd)}
.btn-ghost{background:transparent;border:1.5px solid var(--brd);color:var(--txt)}.btn-ghost:hover:not(:disabled){background:var(--bg)}
.btn-blue{background:#dbeafe;color:#1d4ed8}.btn-blue:hover:not(:disabled){background:#bfdbfe}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:6px}
.oc{border:1.5px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:10px}
.oc-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.oc-rest{font-size:15px;font-weight:700;color:var(--pri)}
.oc-sub{font-size:12px;color:var(--mut);margin-top:2px}
.oc-acts{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.b-p{background:#fef3c7;color:#d97706}.b-a{background:#dcfce7;color:#16a34a}.b-r{background:#fee2e2;color:#dc2626}.b-f{background:#dbeafe;color:#1d4ed8}.b-recv{background:#f3e8ff;color:#7c3aed}.b-urg{background:#dc2626;color:#fff;animation:urgpulse 1.2s ease-in-out infinite}
@keyframes urgpulse{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes addpulse{0%{transform:scale(1)}50%{transform:scale(1.15);background:var(--grn);color:#fff}100%{transform:scale(1)}}
.pl{font-size:13px;border-top:1px solid var(--brd);padding-top:8px}
.pr{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #f0f0f0}
.pr:last-child{border:none}
.pn{flex:1;color:var(--txt)}.pq{font-weight:700;color:var(--pri);margin-left:10px}.pp{color:var(--mut);margin-left:8px;min-width:72px;text-align:right}
.ptot{display:flex;justify-content:flex-end;margin-top:8px;padding-top:7px;border-top:1.5px solid var(--brd);font-weight:800;font-size:15px;color:var(--pri)}
.fg{margin-bottom:13px}
label{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
select,input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=email]{width:100%;padding:9px 12px;border:1.5px solid var(--brd);border-radius:8px;font-size:14px;background:#fff;color:var(--txt);outline:none;transition:border-color .2s}
select:focus,input:focus{border-color:var(--pri)}
.sup-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.stab{padding:7px 13px;border-radius:20px;border:1.5px solid var(--brd);background:#fff;font-size:13px;cursor:pointer;font-weight:600;transition:.2s}
.stab.act{background:var(--pri);color:#fff;border-color:var(--pri)}
.pgrid{display:grid;gap:7px}
.pi{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border:1.5px solid var(--brd);border-radius:8px;background:#fff;gap:10px;transition:border-color .2s}
.pi.ic{border-color:var(--pri);background:#f5f5ff}
.pi-i{flex:1;min-width:0}.pi-n{font-size:14px;font-weight:500}.pi-p{font-size:12px;color:var(--mut);margin-top:2px}
.qc{display:flex;align-items:center;gap:8px}
.qb{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--brd);background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--pri);transition:.2s;line-height:1}
.qb:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
.qb.added{animation:addpulse .35s ease}
.qd{min-width:28px;text-align:center;font-weight:800;font-size:15px}
.cbar{position:fixed;bottom:0;left:0;right:0;background:var(--pri);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;transform:translateY(100%);transition:transform .3s;z-index:200;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.cbar.up{transform:translateY(0)}
.cb-v{font-weight:700;font-size:16px}.cb-s{opacity:.7;font-size:12px;margin-top:1px}
.cc{border:1.5px solid #d1fae5;background:#f0fdf4;border-radius:10px;padding:14px;margin-bottom:10px}
.cc-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.cc-name{font-size:15px;font-weight:800;color:#166534}
.ch-wrap{position:relative;height:260px}
.sh{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
.empty{text-align:center;padding:48px 20px;color:var(--mut)}
.ei{font-size:44px;margin-bottom:10px}.et{font-size:14px}
.toast{position:fixed;top:62px;right:14px;background:#222;color:#fff;padding:10px 15px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:tin .3s ease;max-width:300px}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border-radius:14px;padding:22px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h3{font-size:17px;font-weight:800;color:var(--pri);margin-bottom:8px}
.modal-box p{font-size:13px;color:var(--mut);margin-bottom:14px;line-height:1.5}
.modal-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.login-wrap{max-width:860px;margin:0 auto;padding:24px 14px}
.login-title{text-align:center;font-size:22px;font-weight:800;color:var(--pri);margin-bottom:4px}
.login-sub{text-align:center;font-size:14px;color:var(--mut);margin-bottom:24px}
.user-card,.sup-card{border:1.5px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff}
.uc-hd,.sc-hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.uc-name,.sc-name{font-size:15px;font-weight:700;color:var(--pri)}
.uc-info,.sc-info{font-size:12px;color:var(--mut);margin-top:2px}
.uc-acts,.sc-acts{display:flex;gap:6px}
.perm-editor{margin-top:12px;padding-top:12px;border-top:1px solid var(--brd)}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px;margin:10px 0}
.perm-check{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1.5px solid var(--brd);border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;user-select:none}
.perm-check input{width:15px;height:15px;accent-color:var(--pri);cursor:pointer;flex-shrink:0}
.perm-check:has(input:checked){border-color:var(--pri);background:#f5f5ff}
body.dark .user-card,body.dark .sup-card{background:var(--card)}
body.dark .perm-check:has(input:checked){background:#1a1a40}
.rest-pill{display:inline-block;background:var(--bg);border:1px solid var(--brd);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;margin:2px 2px 0 0}
.rest-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--srf);border-radius:10px;border:1.5px solid var(--brd)}
.rest-picker-lbl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;width:100%;margin-bottom:4px}
.uc-body,.sc-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--brd)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three-col{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.prod-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--brd);border-radius:7px;margin-bottom:6px;background:var(--bg)}
.prod-info{flex:1}.prod-name-t{font-size:13px;font-weight:600}.prod-meta{font-size:11px;color:var(--mut)}
.banner{background:#fffbeb;border:1.5px solid #fcd34d;border-radius:10px;padding:11px 14px;margin-bottom:12px;font-size:13px;color:#92400e;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.banner.blue{background:#eff6ff;border-color:#93c5fd;color:#1e40af}
.banner.red{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
.banner.green{background:#f0fdf4;border-color:#86efac;color:#166534}
.wa-ic{width:14px;height:14px;fill:currentColor;flex-shrink:0;margin-top:1px}
.wa-msg{background:var(--bg);border-radius:8px;padding:12px;font-size:12px;font-family:monospace;white-space:pre-wrap;margin-bottom:16px;max-height:200px;overflow-y:auto;color:var(--txt)}
.alb-card{border:1.5px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff}
.alb-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.alb-rest{font-size:15px;font-weight:700;color:var(--pri)}
.alb-info{font-size:12px;color:var(--mut);margin-top:2px}
.alb-photo{width:100%;max-height:200px;object-fit:contain;border-radius:8px;margin-bottom:10px;border:1px solid var(--brd)}
.cmp-cell{padding:8px;border-radius:7px;font-size:12px;margin-bottom:6px}
.cmp-ok{background:#f0fdf4;border:1px solid #86efac}
.cmp-warn{background:#fef3c7;border:1px solid #fcd34d}
.cmp-err{background:#fef2f2;border:1px solid #fca5a5}
.cmp-name{font-weight:600;color:var(--pri)}.cmp-val{color:var(--mut);margin-top:2px}
.img-preview{width:100%;border-radius:10px;margin-bottom:12px;display:none;border:1px solid var(--brd)}
.ocr-progress{font-size:13px;color:var(--mut);text-align:center;padding:10px;display:none}
.item-entry{border:1.5px solid var(--brd);border-radius:8px;padding:12px;margin-bottom:8px;background:var(--bg);position:relative}
.item-del{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;font-size:16px;color:var(--mut)}
.item-del:hover{color:#dc2626}
.spend-table{width:100%;border-collapse:collapse;font-size:13px}
.spend-table th{background:var(--pri);color:#fff;padding:8px 10px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.spend-table td{padding:8px 10px;border-bottom:1px solid var(--brd)}
.spend-table tr:hover td{background:var(--bg)}
.diff-ok{color:#16a34a;font-weight:700}.diff-warn{color:#d97706;font-weight:700}.diff-err{color:#dc2626;font-weight:700}
.file-input-wrap{position:relative}
.file-input-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.file-input-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border:2px dashed var(--brd);border-radius:10px;color:var(--mut);font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.file-input-btn:hover{border-color:var(--pri);color:var(--pri);background:#f9f9ff}
.live-badge{display:inline-flex;align-items:center;gap:5px;background:#dcfce7;color:#16a34a;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.pulse{width:7px;height:7px;border-radius:50%;background:#16a34a;animation:pulse 1.5s infinite}
.saving-indicator{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-left:8px}
.saving-indicator::before{content:'';width:10px;height:10px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(max-width:480px){
  .two-col,.three-col{grid-template-columns:1fr}
  .ses-info{display:none}
}
.adm-layout{display:flex;height:calc(100vh - 56px);overflow:hidden}
.sidebar{width:210px;flex-shrink:0;background:var(--pri);color:#fff;overflow-y:auto;display:flex;flex-direction:column;z-index:88}
.sb-mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:6px}
.sb-ms{padding:10px 12px;text-align:center}
.sb-msv{font-size:18px;font-weight:800;line-height:1}
.sb-msl{font-size:10px;opacity:.6;text-transform:uppercase;letter-spacing:.3px;margin-top:3px}
.sg-hd{padding:10px 14px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;opacity:.55;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;transition:.15s}
.sg-hd:hover,.sg-hd.has-act{opacity:.9;background:rgba(255,255,255,.05)}
.sg-arrow{font-size:9px;transition:.2s}
.sg-direct{padding:11px 14px;font-size:13px;font-weight:600;cursor:pointer;opacity:.75;transition:.15s;display:flex;align-items:center;gap:8px}
.sg-direct:hover{opacity:1;background:rgba(255,255,255,.08)}
.sg-direct.act{opacity:1;background:rgba(255,255,255,.15);border-left:3px solid var(--acc);padding-left:11px}
.sg-item{padding:9px 14px 9px 32px;font-size:13px;cursor:pointer;opacity:.7;transition:.15s;display:flex;align-items:center;justify-content:space-between}
.sg-item:hover{opacity:1;background:rgba(255,255,255,.07)}
.sg-item.act{opacity:1;background:rgba(255,255,255,.15);font-weight:700;border-left:3px solid var(--acc);padding-left:29px}
.sb-badge{background:var(--acc);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800}
.adm-content{flex:1;overflow-y:auto;padding:16px;min-width:0;background:var(--bg)}
.sb-overlay{display:none;position:fixed;inset:0;top:56px;background:rgba(0,0,0,.45);z-index:87}
.hbtn-menu{display:none;background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:18px;align-items:center;justify-content:center}
@media(max-width:700px){
  .hbtn-menu{display:flex}
  .adm-layout{height:auto;min-height:calc(100vh - 56px)}
  .sidebar{position:fixed;left:0;top:56px;bottom:0;width:240px;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
  .sidebar.sb-open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.35)}
  .sb-overlay.sb-open{display:block}
  .adm-content{padding:12px 10px}
}
.esc-filtros{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.esc-filtros input,.esc-filtros select{padding:8px 12px;border-radius:8px;border:1.5px solid var(--brd);background:#fff;color:var(--txt);font-size:14px}
.esc-filtros input{flex:1;min-width:180px}
.esc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.esc-card{background:var(--card);border:1.5px solid var(--brd);border-radius:var(--r);padding:16px;cursor:pointer;transition:box-shadow .2s,transform .15s;position:relative}
.esc-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.12);transform:translateY(-2px)}
.esc-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--mut);margin-bottom:8px}
.esc-card h4{margin:0 0 10px;font-size:16px;color:var(--pri)}
.esc-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}
.esc-stat{display:flex;flex-direction:column}
.esc-stat span:first-child{color:var(--mut);font-size:11px}
.esc-stat strong{font-size:14px}
.esc-fc-ind{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:3px solid}

<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   O'CARRO PEDIDOS — App refactorizada
   Mejoras: seguridad, escape HTML, persistencia offline, validaciones,
   modales propios, paginación, charts centralizados, sin XSS.
   ═══════════════════════════════════════════════════════════════════ */
'use strict';

/* ═══════════════ CONFIG ═══════════════ */
const FB_CONFIG = {
  apiKey: "AIzaSyCJIF3BsWdWnB59idnxCRlYbWixTp1sGb8",
  authDomain: "pedidos-835a1.firebaseapp.com",
  databaseURL: "https://pedidos-835a1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "pedidos-835a1",
  storageBucket: "pedidos-835a1.firebasestorage.app",
  messagingSenderId: "236536249236",
  appId: "1:236536249236:web:6a2cad24995a1bc57cad81"
};

const ORDER_LIMIT = 500; // últimos N pedidos a cargar (paginación)
const MAX_PRICE = 100000;
const MAX_QTY = 10000;

let fbApp, fbDb, fbAuth;

/* ═══════════════ HELPERS — escape, format, validate ═══════════════ */
const esc = s => String(s == null ? '' : s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const fmt = n => (parseFloat(n)||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const fmtD = iso => { try{return new Date(iso).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return iso||'—';} };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const total = o => (o.items||[]).reduce((s,it)=>s+(parseFloat(it.qty)||0)*(parseFloat(it.price)||0),0);

const validPrice = v => { const n = parseFloat(v); return !isNaN(n) && n >= 0 && n <= MAX_PRICE; };
const validQty = v => { const n = parseFloat(v); return !isNaN(n) && n >= 0 && n <= MAX_QTY; };
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'').trim());
const validPhone = p => { const s = String(p||'').replace(/\D/g,''); return s.length >= 7 && s.length <= 15; };

const sanitizeInput = (s, max=200) => String(s||'').slice(0, max).replace(/[\u0000-\u001F\u007F]/g,'');

function toast(msg, col='#222', dur=3500){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = col;
  t.style.display = 'block';
  clearTimeout(t._t);
  t._t = setTimeout(()=> t.style.display='none', dur);
}

function vibrate(ms=20){
  if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){}
}

function waURL(phone, text){
  const p = String(phone||'').replace(/\D/g,'');
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}

/* ═══════════════ MODAL SYSTEM (replaces alert/prompt/confirm) ═══════════════ */
const Modal = {
  open(html){
    document.getElementById('modal-content').innerHTML = html;
    document.getElementById('modal-ov').style.display = 'flex';
  },
  close(){ document.getElementById('modal-ov').style.display = 'none'; },
  confirm(opts){
    return new Promise(resolve => {
      const { title='¿Confirmar?', msg='', okText='Aceptar', cancelText='Cancelar', danger=false } = opts;
      this.open(`
        <h3>${esc(title)}</h3>
        ${msg ? `<p>${esc(msg)}</p>` : ''}
        <div class="modal-btns">
          <button class="btn btn-ghost btn-sm" onclick="Modal._resolve(false)">${esc(cancelText)}</button>
          <button class="btn ${danger?'btn-no':'btn-pri'} btn-sm" onclick="Modal._resolve(true)">${esc(okText)}</button>
        </div>
      `);
      this._resolve = (val) => { this.close(); resolve(val); };
    });
  },
  prompt(opts){
    return new Promise(resolve => {
      const { title='Introduce un valor', msg='', placeholder='', defaultValue='', okText='Aceptar', cancelText='Cancelar', multiline=false } = opts;
      const inputEl = multiline
        ? `<textarea id="modal-input" rows="3" placeholder="${esc(placeholder)}" style="width:100%;padding:9px 12px;border:1.5px solid var(--brd);border-radius:8px;font-size:14px;background:var(--card);color:var(--txt);box-sizing:border-box;resize:vertical;font-family:inherit">${esc(defaultValue)}</textarea>`
        : `<input id="modal-input" type="text" placeholder="${esc(placeholder)}" value="${esc(defaultValue)}" style="margin-bottom:6px"/>`;
      this.open(`
        <h3>${esc(title)}</h3>
        ${msg ? `<p>${esc(msg)}</p>` : ''}
        ${inputEl}
        <div class="modal-btns" style="margin-top:14px">
          <button class="btn btn-ghost btn-sm" onclick="Modal._resolve(null)">${esc(cancelText)}</button>
          <button class="btn btn-pri btn-sm" onclick="Modal._resolveInput()">${esc(okText)}</button>
        </div>
      `);
      setTimeout(()=> { const el = document.getElementById('modal-input'); if(el) el.focus(); }, 50);
      this._resolve = (val) => { this.close(); resolve(val); };
      this._resolveInput = () => {
        const el = document.getElementById('modal-input');
        this._resolve(el ? el.value : null);
      };
      // Submit on Enter for text inputs
      setTimeout(() => {
        const el = document.getElementById('modal-input');
        if(el && !multiline) el.addEventListener('keydown', e => { if(e.key==='Enter') Modal._resolveInput(); });
      }, 60);
    });
  },
  alert(opts){
    return new Promise(resolve => {
      const { title='Aviso', msg='', okText='Entendido' } = typeof opts === 'string' ? { msg: opts } : opts;
      this.open(`
        <h3>${esc(title)}</h3>
        <p>${esc(msg)}</p>
        <div class="modal-btns">
          <button class="btn btn-pri btn-sm" onclick="Modal._resolve()">${esc(okText)}</button>
        </div>
      `);
      this._resolve = () => { this.close(); resolve(); };
    });
  },
  // WhatsApp share modal
  showWA(phone, msg, desc, next){
    const p = String(phone||'').replace(/\D/g,'');
    const ok = p.length > 7;
    const link = ok ? waURL(p, msg) : '#';
    this.open(`
      <h3>📱 Enviar por WhatsApp</h3>
      <p>${esc(ok ? (desc||'Pulsa para abrir WhatsApp.') : '⚠️ Configura el número en ⚙️ Config.')}</p>
      <div class="wa-msg">${esc(msg)}</div>
      <div class="modal-btns">
        <a href="${esc(link)}" target="_blank" rel="noopener" class="btn btn-wa" onclick="Modal._afterWA()" style="${!ok?'opacity:.4;pointer-events:none':''}">
          <svg class="wa-ic" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Abrir WhatsApp
        </a>
        <button class="btn btn-ghost btn-sm" onclick="Modal._copyWA()">📋 Copiar</button>
        <button class="btn btn-ghost btn-sm" onclick="Modal._afterWA()">Cerrar</button>
      </div>
    `);
    this._waMsg = msg;
    this._waNext = next || null;
    this._afterWA = () => {
      this.close();
      if(this._waNext){ const n = this._waNext; this._waNext = null; setTimeout(()=> this.showWA(n.phone, n.msg, n.desc), 150); }
    };
    this._copyWA = () => {
      navigator.clipboard.writeText(this._waMsg).then(()=> toast('Copiado','#16a34a'));
    };
  }
};

/* ═══════════════ STATE — separated from data ═══════════════ */
const state = {
  view: 'login',
  loginTab: 'login',
  adminTab: 'pending',
  orderTab: 'new',
  session: null,
  supId: null,
  cart: {},
  editUserId: null,
  editSupId: null,
  openSupId: null,
  editOrderId: null,
  editItems: [],
  albView: 'list',
  albItems: [],
  albRestaurant: '',
  albSupId: '',
  albDate: new Date().toISOString().split('T')[0],
  albPhoto: null,
  albCropping: false,
  fcPeriod: 'month',
  fcDate: new Date().toISOString().split('T')[0],
  showSaveTemplate: false,
  sidebarOpen: false,
  sbGroups: { pedidos:true, analisis:false, gestion:false },
  editingPermsUid: null,
  orderUrgent: false,
  orderDeliveryDate: '',
  orderNotes: '',
  prodSearch: '',
  precioSearch: '',
  showAddProd: false,
  gastoExpanded: {},
  darkMode: localStorage.getItem('oc_dark') === '1',
  submitting: false,
};

/* Local config (NO sensitive data here) */
const config = JSON.parse(localStorage.getItem('oc_cfg') || '{}');
if(!config.adminEmail) config.adminEmail = 'josue.funte@gmail.com';
if(!config.adminName) config.adminName = 'Josué';
if(!config.adminPhone) config.adminPhone = '';
if(!config.alertThreshold) config.alertThreshold = 300;
if(!config.priceAlertPct) config.priceAlertPct = 5;
if(!config.approvalMinAmount) config.approvalMinAmount = 0;
if(config.notifSound === undefined) config.notifSound = true;
if(!config.geminiKey) config.geminiKey = '';
function saveCfg(){ localStorage.setItem('oc_cfg', JSON.stringify(config)); }

/* Firebase data */
const data = {
  orders: [],
  suppliers: {},
  albNotes: [],
  revenue: {},
  budgets: {},
  priceHistory: [],
  templates: {},
  extraExpenses: {},
  authUsers: {},
  fbConnected: false,
};

/* Track listeners for cleanup on logout */
const fbListeners = [];
function trackListener(ref, event, cb){
  ref.on(event, cb);
  fbListeners.push({ref, event, cb});
}
function clearListeners(){
  fbListeners.forEach(({ref, event, cb}) => { try{ ref.off(event, cb); }catch(e){} });
  fbListeners.length = 0;
}

/* ═══════════════ DEFAULT SUPPLIERS — minimal seed ═══════════════ */
const DEFAULT_SUPS = {
  bencar:{id:'bencar',name:'Bencar',emoji:'🥩',phone:'',products:[
    {id:'benca1',name:'POLLO ENTERO',unit:'KG',price:3.61},
    {id:'benca2',name:'PECHUGA DE POLLO',unit:'KG',price:8.52},
    {id:'benca3',name:'CHULETON DE TERNERA',unit:'KG',price:20.89},
    {id:'benca4',name:'SOLOMILLO DE VACA',unit:'KG',price:27.49},
    {id:'benca5',name:'PANCETA DE CERDO',unit:'KG',price:7.77},
  ]},
};

/* ═══════════════ CHART MANAGER ═══════════════ */
const Charts = {
  instances: {},
  make(id, config){
    if(this.instances[id]){ try{ this.instances[id].destroy(); }catch(e){} }
    const el = document.getElementById(id);
    if(!el) return null;
    this.instances[id] = new Chart(el, config);
    return this.instances[id];
  },
  destroyAll(){
    Object.values(this.instances).forEach(c => { try{ c.destroy(); }catch(e){} });
    this.instances = {};
  }
};

/* ═══════════════ FIREBASE INIT ═══════════════ */
function initFirebase(){
  try {
    fbApp = firebase.initializeApp(FB_CONFIG);
    fbDb = firebase.database();
    fbAuth = firebase.auth();
    // Set persistence to LOCAL so user stays logged in
    fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
    return true;
  } catch(e){
    console.error('Firebase init error:', e);
    return false;
  }
}

function attachFbListeners(){
  if(!fbDb) return;

  // Connection status
  trackListener(fbDb.ref('.info/connected'), 'value', snap => {
    data.fbConnected = snap.val() === true;
    const dot = document.getElementById('fb-dot');
    if(dot) dot.className = 'fb-dot' + (data.fbConnected ? ' on' : '');
  });

  // Orders — limited to last N for performance
  let lastOrderIds = null;
  const ordersRef = fbDb.ref('orders').orderByChild('createdAt').limitToLast(ORDER_LIMIT);
  trackListener(ordersRef, 'value', snap => {
    const val = snap.val();
    const newOrders = val ? Object.values(val).sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt)) : [];
    // Notify on changes
    try{
      if(lastOrderIds !== null){
        const oldIds = lastOrderIds;
        newOrders.forEach(o => {
          if(!oldIds.has(o.id)){
            if(state.session?.isAdmin){
              const sup = data.suppliers[o.supId];
              pushNotify(`Nuevo pedido — ${o.restaurant}`, `${(sup||{name:o.supId}).name} · ${fmt(total(o))}${o.urgent?' 🚨 URGENTE':''}`, o.urgent?'🚨':'🛒');
            }
          } else {
            const old = data.orders.find(x => x.id === o.id);
            const myRests = state.session?.restaurants || [state.session?.restaurant];
            if(old && old.status !== o.status && state.session && !state.session.isAdmin && myRests.includes(o.restaurant)){
              if(o.status === 'approved') pushNotify('Pedido aprobado ✅', `Tu pedido a ${(data.suppliers[o.supId]||{name:o.supId}).name} ha sido aprobado`, '✅');
              else if(o.status === 'rejected') pushNotify('Pedido rechazado ✗', o.rejectReason || 'Contacta con el administrador', '❌');
            }
          }
        });
      }
    } catch(e){ console.warn('Notify error:', e); }
    lastOrderIds = new Set(newOrders.map(o => o.id));
    data.orders = newOrders;
    if(state.view === 'admin') renderAdminContent();
    if(state.view === 'order' && state.orderTab === 'history') render();
  });

  // Suppliers
  trackListener(fbDb.ref('suppliers'), 'value', snap => {
    const val = snap.val();
    if(val){
      data.suppliers = val;
    } else {
      // Seed defaults if empty
      fbDb.ref('suppliers').set(DEFAULT_SUPS).catch(e => console.warn('Seed suppliers error:', e));
    }
    if(state.view === 'order' || state.view === 'albaran-new'){
      const sv = window.scrollY;
      render();
      requestAnimationFrame(()=> window.scrollTo(0, sv));
    }
  });

  // Albaranes
  trackListener(fbDb.ref('albaranes'), 'value', snap => {
    const val = snap.val();
    data.albNotes = val ? Object.values(val).sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt)) : [];
    if(state.view === 'admin' && state.adminTab === 'albaranes') renderAdminContent();
  });

  // Revenue, budgets, extra expenses, price history
  trackListener(fbDb.ref('revenue'), 'value', snap => {
    data.revenue = snap.val() || {};
    if(state.view === 'admin' && state.adminTab === 'foodcost') renderAdminContent();
  });
  trackListener(fbDb.ref('budgets'), 'value', snap => {
    data.budgets = snap.val() || {};
    if(state.view === 'admin' && state.adminTab === 'budgets') renderAdminContent();
  });
  trackListener(fbDb.ref('extraExpenses'), 'value', snap => {
    data.extraExpenses = snap.val() || {};
    if(state.view === 'admin' && ['spending','monthly','foodcost','budgets'].includes(state.adminTab)) renderAdminContent();
  });
  trackListener(fbDb.ref('priceHistory').orderByChild('changedAt').limitToLast(200), 'value', snap => {
    const val = snap.val();
    data.priceHistory = val ? Object.values(val).sort((a,b)=> new Date(b.changedAt) - new Date(a.changedAt)) : [];
  });

  // Templates (only my user)
  if(state.session?.uid){
    trackListener(fbDb.ref('templates/' + state.session.uid), 'value', snap => {
      data.templates = { [state.session.uid]: snap.val() || {} };
      if(state.view === 'order'){
        const sv = window.scrollY;
        render();
        requestAnimationFrame(()=> window.scrollTo(0, sv));
      }
    });
  }

  // Auth users (visible to all authenticated users by rules; admin acts on changes)
  trackListener(fbDb.ref('authUsers'), 'value', snap => {
    data.authUsers = snap.val() || {};
    if(state.view === 'admin' && state.adminTab === 'solicitudes') renderAdminContent();
    const badge = document.getElementById('sb-sol-badge');
    if(badge){
      const n = Object.values(data.authUsers).filter(u => u.status === 'pending').length;
      badge.textContent = n;
      badge.style.display = n ? '' : 'none';
    }
    // Live status updates for current restaurant user
    if(state.session?.uid && !state.session?.isAdmin){
      const me = data.authUsers[state.session.uid];
      if(me){
        if(me.status === 'approved' && state.view === 'pending-approval'){
          const myRests = me.restaurants || [me.restaurant];
          state.session = {
            uid: me.uid, email: me.email, name: me.name || me.restaurant,
            restaurant: myRests[0] || me.restaurant, restaurants: myRests,
            isAdmin: false, needsApproval: me.needsApproval !== false
          };
          goOrder();
          toast('✅ Tu acceso ha sido aprobado. ¡Bienvenido!', '#16a34a', 5000);
        } else if(me.status === 'approved' && state.view === 'order'){
          const myRests = me.restaurants || [me.restaurant];
          if(JSON.stringify(myRests) !== JSON.stringify(state.session.restaurants||[])){
            state.session.restaurants = myRests;
            if(!myRests.includes(state.session.restaurant)) state.session.restaurant = myRests[0];
            state.session.needsApproval = me.needsApproval !== false;
            render();
          }
        } else if(me.status === 'rejected' && state.view !== 'pending-approval'){
          state.session = { ...state.session, pendingStatus: 'rejected' };
          state.view = 'pending-approval';
          document.getElementById('hdr').style.display = 'none';
          render();
        }
      }
    }
  });
}

/* ═══════════════ AUTH ═══════════════ */
async function loginWithEmail(){
  if(!fbAuth){ toast('Sin conexión. Recarga la página.', '#dc2626', 5000); return; }
  const email = sanitizeInput(document.getElementById('login-email')?.value, 100).trim();
  const pass = document.getElementById('login-pass')?.value || '';
  const errEl = document.getElementById('login-err');
  const showErr = msg => { if(errEl){ errEl.textContent = msg; errEl.style.display = 'block'; } else toast(msg, '#dc2626'); };
  if(!validEmail(email) || !pass){ showErr('Email y contraseña obligatorios'); return; }
  const btn = document.querySelector('#app .btn-pri');
  if(btn){ btn.disabled = true; btn.textContent = 'Entrando…'; }
  try {
    await fbAuth.signInWithEmailAndPassword(email, pass);
    // onAuthStateChanged handles navigation
  } catch(e){
    const msgs = {
      'auth/user-not-found':'Usuario no encontrado',
      'auth/wrong-password':'Contraseña incorrecta',
      'auth/invalid-email':'Email no válido',
      'auth/too-many-requests':'Demasiados intentos. Espera unos minutos.',
      'auth/invalid-credential':'Email o contraseña incorrectos',
      'auth/network-request-failed':'Sin conexión a internet'
    };
    showErr(msgs[e.code] || e.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Entrar →'; }
  }
}

async function registerUser(){
  if(!fbAuth){ toast('Sin conexión. Recarga la página.', '#dc2626'); return; }
  const email = sanitizeInput(document.getElementById('reg-email')?.value, 100).trim();
  const pass = document.getElementById('reg-pass')?.value || '';
  const pass2 = document.getElementById('reg-pass2')?.value || '';
  const rest = sanitizeInput(document.getElementById('reg-rest')?.value, 80);
  const name = sanitizeInput(document.getElementById('reg-name')?.value, 80).trim();
  const errEl = document.getElementById('reg-err');
  const showErr = msg => { if(errEl){ errEl.textContent = msg; errEl.style.display = 'block'; } };
  if(errEl) errEl.style.display = 'none';
  if(!validEmail(email)){ showErr('Email no válido'); return; }
  if(pass.length < 6){ showErr('La contraseña debe tener al menos 6 caracteres'); return; }
  if(pass !== pass2){ showErr('Las contraseñas no coinciden'); return; }
  if(!rest || rest.length < 2){ showErr('Indica el nombre de tu restaurante'); return; }
  const btn = document.querySelector('#app .btn-pri');
  if(btn){ btn.disabled = true; btn.textContent = 'Enviando…'; }
  try {
    const cred = await fbAuth.createUserWithEmailAndPassword(email, pass);
    await fbDb.ref('authUsers/' + cred.user.uid).set({
      uid: cred.user.uid,
      email,
      name: name || email,
      restaurant: rest,
      restaurants: [rest],
      status: 'pending',
      needsApproval: true,
      isAdmin: false,
      createdAt: new Date().toISOString()
    });
    toast('✅ Solicitud enviada. ' + esc(config.adminName) + ' la revisará pronto.', '#16a34a', 6000);
  } catch(e){
    const msgs = {
      'auth/email-already-in-use':'Este email ya está registrado',
      'auth/invalid-email':'Email no válido',
      'auth/weak-password':'Contraseña demasiado débil (mín. 6 caracteres)'
    };
    showErr(msgs[e.code] || e.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Solicitar acceso'; }
  }
}

function doResetPassword(){
  const email = sanitizeInput(document.getElementById('login-email')?.value, 100).trim();
  if(!validEmail(email)){ toast('Introduce tu email primero en el campo de arriba', '#dc2626'); return; }
  if(!fbAuth){ toast('Sin conexión', '#dc2626'); return; }

    .then(()=> toast('📧 Email de recuperación enviado a ' + email, '#16a34a', 5000))
    .catch(e => toast('Error: ' + e.message, '#dc2626'));
}

/* ═══════════════ NOTIFICATIONS ═══════════════ */
function playNotifSound(urgent=false){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = (freq, start, dur) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0, ctx.currentTime + start);
      g.gain.linearRampToValueAtTime(0.25, ctx.currentTime + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      o.start(ctx.currentTime + start);
      o.stop(ctx.currentTime + start + dur + 0.05);
    };
    if(urgent){ beep(880,0,0.15); beep(1100,0.2,0.15); beep(880,0.4,0.15); beep(1100,0.6,0.2); }
    else { beep(660,0,0.12); beep(880,0.18,0.18); }
  } catch(e){}
}

function pushNotify(title, body, icon='🛒'){
  if(config.notifSound !== false) playNotifSound(icon === '🚨');
  if(window.self === window.top && 'Notification' in window && Notification.permission === 'granted'){
    try { new Notification(`${icon} ${title}`, { body }); } catch(e){}
  }
}

function requestPushPermission(){
  if(window.self !== window.top){
    toast('Abre la app directamente en el navegador para activar notificaciones emergentes. El sonido sí funciona.', '#d97706', 5000);
    return;
  }
  if(!('Notification' in window)){
    toast('Tu navegador no soporta notificaciones emergentes. El sonido sí está disponible.', '#d97706', 4000);
    return;
  }
  Notification.requestPermission().then(perm => {
    const el = document.getElementById('push-status');
    if(perm === 'granted'){
      if(el) el.textContent = '✅ Notificaciones activas';
      toast('🔔 Notificaciones activadas', '#16a34a');
    } else {
      if(el) el.textContent = '❌ Bloqueadas — actívalas en los ajustes del navegador';
      toast('❌ Notificaciones bloqueadas', '#dc2626', 5000);
    }
  });
}

function vOrder(){
  const myRests = state.session.restaurants || [state.session.restaurant];
  if(!myRests.includes(state.session.restaurant)) state.session.restaurant = myRests[0];
  const myPending = data.orders.filter(o => o.restaurant === state.session.restaurant && o.status === 'pending').length;
  const histBadge = myPending ? ` <span style="background:var(--acc);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px">${myPending}</span>` : '';

  const tabsHtml = `<div class="tabs" style="margin-bottom:16px">

    <button class="tab ${state.orderTab==='history'?'act':''}" onclick="state.orderTab='history';render()">📋 Mis pedidos${histBadge}</button>
    <button class="tab ${state.orderTab==='gastos'?'act':''}" onclick="state.orderTab='gastos';render()">💶 Mi gasto</button>
  </div>`;

  const restPickerHtml = myRests.length > 1 ? `<div class="rest-picker">
    <div class="rest-picker-lbl">🏪 Pedido para</div>
    ${myRests.map(r => `<button class="stab ${state.session.restaurant===r?'act':''}" onclick="state.session.restaurant='${esc(r).replace(/'/g,'&#39;')}';state.cart={};state.orderTab='new';render()">${esc(r)}</button>`).join('')}
  </div>` : '';

  if(state.orderTab === 'history') return `<div class="main">${tabsHtml}${restPickerHtml}${vMyOrders()}</div>`;
  if(state.orderTab === 'gastos') return `<div class="main">${tabsHtml}${restPickerHtml}${vLocalGastos()}</div>`;

  const sups = visibleSups();
  if(!sups.length) return `<div class="main">${tabsHtml}<div class="empty"><div class="ei">🏭</div><div class="et">No hay proveedores activos para este local.</div></div></div>`;
  if(!data.suppliers[state.supId] || !sups.find(s => s.id === state.supId)) state.supId = sups[0].id;

  const sup = data.suppliers[state.supId];
  const cnt = Object.values(state.cart).reduce((s, sc) => s + Object.values(sc).reduce((a,v) => a+v, 0), 0);
  const tot = Object.entries(state.cart).reduce((s, [sid, sc]) => {
    const sp = data.suppliers[sid];
    if(!sp) return s;
    return s + sp.products.reduce((a, p) => a + (sc[p.id]||0) * p.price, 0);
  }, 0);
  const supCnt = Object.keys(state.cart).length;

  const approvalMin = config.approvalMinAmount || 0;
  const note = state.session.needsApproval
    ? (approvalMin > 0
      ? `<div class="banner">📋 Pedidos <strong>por encima de ${fmt(approvalMin)}</strong> irán a <strong>${esc(config.adminName)}</strong> para aprobación.</div>`
      : `<div class="banner">📋 Tu pedido irá a <strong>${esc(config.adminName)}</strong> para aprobación antes de enviarse al proveedor.</div>`)
    : `<div class="banner blue">⚡ Tus pedidos se aprueban automáticamente y van directo al proveedor.</div>`;

  const stabs = sups.map(s => {
    const sc = state.cart[s.id] || {};
    const n = Object.values(sc).reduce((a,v) => a+v, 0);
    return `<button class="stab ${state.supId===s.id?'act':''}" onclick="setSup('${esc(s.id)}')">${esc(s.emoji||'')} ${esc(s.name)}${n>0?` <span style="background:#3b82f6;color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;font-weight:700">${n}</span>`:''}</button>`;
  }).join('');

  const searchTerm = norm(state.prodSearch||'');
  const filteredProds = (sup.products||[]).filter(p => !searchTerm || norm(p.name).includes(searchTerm));
  const prods = filteredProds.map(p => {
    const q = (state.cart[state.supId]||{})[p.id] || 0;
    return `<div class="pi ${q>0?'ic':''}" id="pi-${esc(p.id)}">
      <div class="pi-i"><div class="pi-n">${esc(p.name)}</div><div class="pi-p">${fmt(p.price)} / ${esc(p.unit||'')}</div></div>
      <div class="qc">
        <button class="qb" onclick="chgQ('${esc(p.id)}',-1)">−</button>
        <div class="qd" id="qd-${esc(p.id)}">${q}</div>
        <button class="qb" onclick="chgQ('${esc(p.id)}',1)">+</button>
      </div>
    </div>`;
  }).join('');

  // Templates
  const myTpls = state.session.uid && data.templates[state.session.uid]
    ? Object.values(data.templates[state.session.uid]).filter(t => t.supId === state.supId)
    : [];

  // Auto-suggest most ordered
  const myHistory = data.orders.filter(o => o.restaurant === state.session.restaurant && o.supId === state.supId && o.status !== 'rejected');
  const autoSuggest = {};
  myHistory.forEach(o => (o.items||[]).forEach(it => {
    if(!autoSuggest[it.id]) autoSuggest[it.id] = { ...it, count: 0, totalQty: 0 };
    autoSuggest[it.id].count++;
    autoSuggest[it.id].totalQty += it.qty;
  }));
  const topProds = Object.values(autoSuggest).sort((a,b) => b.count - a.count).slice(0, 5);
  const autoBtn = topProds.length && !Object.keys(state.cart[state.supId]||{}).length
    ? `<button class="btn btn-blue btn-sm" onclick="loadAutoSuggest()" style="white-space:nowrap">🤖 Pedido típico</button>`
    : '';

  // Recurring templates due today
  const today = new Date();
  const todayWD = today.getDay();
  const todayDOM = today.getDate();
  const todayKey = today.toISOString().split('T')[0];
  const myTplsAll = state.session.uid && data.templates[state.session.uid] ? Object.values(data.templates[state.session.uid]) : [];
  const recurringDue = myTplsAll.filter(t => {
    if(!t.recurrence || t.recurrence.type === 'none') return false;
    if(t.lastAutoDate === todayKey) return false;
    if(t.recurrence.type === 'weekly') return todayWD === t.recurrence.weekday;
    if(t.recurrence.type === 'monthly') return todayDOM === t.recurrence.dayOfMonth;
    return false;
  });
  const recurringBanner = recurringDue.length ? `<div class="banner blue" style="margin-bottom:10px">
    🔄 <strong>Pedidos recurrentes pendientes:</strong>
    ${recurringDue.map(t => `<div style="margin-top:6px;display:flex;align-items:center;gap:8px"><span>${esc(t.name)} (${esc((data.suppliers[t.supId]||{name:t.supId}).name)})</span><button class="btn btn-blue btn-sm" onclick="loadRecurringTpl('${esc(t.id)}')">📥 Cargar</button></div>`).join('')}
  </div>` : '';

  const tplSection = `<div class="sh" style="margin-top:4px">Plantillas</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      ${autoBtn}
      ${myTpls.map(t => `<div style="display:flex;gap:2px"><button class="btn btn-ghost btn-sm" onclick="loadTemplate('${esc(t.id)}')" style="border-radius:6px 0 0 6px">📥 ${esc(t.name)}</button><button class="btn btn-no btn-sm" onclick="deleteTpl('${esc(t.id)}')" style="border-radius:0 6px 6px 0;padding:0 8px">✕</button></div>`).join('')}
      ${Object.keys(state.cart[state.supId]||{}).length > 0 ? `<button class="btn btn-ghost btn-sm" onclick="state.showSaveTemplate=!state.showSaveTemplate;render()">💾 Guardar</button>` : ''}
    </div>
    ${state.showSaveTemplate ? `<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">
      <div style="display:flex;gap:6px"><input type="text" id="tpl-name" placeholder="Nombre de la plantilla..." maxlength="50" style="flex:1;padding:6px 10px;border:1px solid var(--brd);border-radius:6px;font-size:13px"/></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <select id="tpl-recur" style="padding:6px;border:1px solid var(--brd);border-radius:6px;font-size:13px;background:var(--card);color:var(--txt)">
          <option value="none">Sin repetición</option>
          <option value="weekly">Semanal</option>
          <option value="monthly">Mensual</option>
        </select>
        <select id="tpl-recur-day" style="padding:6px;border:1px solid var(--brd);border-radius:6px;font-size:13px;background:var(--card);color:var(--txt)">
          <option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option>
          <option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option>
          ${Array.from({length:28}, (_,i) => `<option value="d${i+1}">${i+1} de cada mes</option>`).join('')}
        </select>
        <button class="btn btn-pri btn-sm" onclick="saveTpl()">Guardar</button>
      </div>
    </div>` : ''}`;

  return `<div class="main">
    ${tabsHtml}${restPickerHtml}${note}
    ${recurringBanner}
    ${tplSection}
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 0 6px">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 14px;border-radius:10px;border:2px solid ${state.orderUrgent?'#dc2626':'var(--brd)'};background:${state.orderUrgent?'#fff1f2':'var(--card)'};transition:.2s">
        <input type="checkbox" id="ord-urg" ${state.orderUrgent?'checked':''} onchange="state.orderUrgent=this.checked;render()" style="width:16px;height:16px;accent-color:#dc2626">
        <span style="font-weight:700;font-size:13px;color:${state.orderUrgent?'#dc2626':'var(--txt)'}">🚨 Urgente</span>
      </label>
      <div style="flex:1;min-width:160px">
        <label style="font-size:11px;color:var(--mut);display:block;margin-bottom:3px">📅 Entrega deseada</label>
        <input type="date" value="${esc(state.orderDeliveryDate||'')}" onchange="state.orderDeliveryDate=this.value" style="padding:7px 10px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;width:100%;background:var(--card);color:var(--txt)">
      </div>
    </div>
    <div class="sh">Proveedor</div>
    <div class="sup-tabs">${stabs}</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <div class="sh" style="margin:0;flex:1">Productos — ${esc(sup.emoji||'')} ${esc(sup.name)}</div>
      <input type="text" placeholder="🔍 Buscar producto..." value="${esc(state.prodSearch||'')}" oninput="state.prodSearch=this.value;render()" style="padding:6px 10px;border:1.5px solid var(--brd);border-radius:8px;font-size:12px;width:180px;background:var(--card);color:var(--txt)">
    </div>
    ${filteredProds.length ? `<div class="pgrid">${prods}</div>` : `<div class="empty"><div class="ei">🔍</div><div class="et">Sin resultados para "${esc(state.prodSearch)}"</div></div>`}
    <div style="margin-top:10px">
      <button class="btn btn-ghost btn-sm" onclick="state.showAddProd=!state.showAddProd;render()" style="width:100%;justify-content:center">${state.showAddProd?'✕ Cancelar':'➕ Añadir producto que falta'}</button>
      ${state.showAddProd ? `<div style="background:var(--srf);border:1.5px solid var(--brd);border-radius:10px;padding:14px;margin-top:8px">
        <div style="font-size:12px;font-weight:600;color:var(--mut);margin-bottom:10px">Nuevo producto para ${esc(sup.emoji||'')} ${esc(sup.name)}</div>
        <div style="display:grid;grid-template-columns:1fr 80px 90px;gap:8px;margin-bottom:10px">
          <div><label style="font-size:11px;color:var(--mut);display:block;margin-bottom:3px">Nombre</label><input type="text" id="lp-name" maxlength="80" placeholder="Ej: Lomo ibérico" style="width:100%;padding:7px 10px;border:1.5px solid var(--brd);border-radius:7px;font-size:13px;background:var(--card);color:var(--txt);box-sizing:border-box"/></div>
          <div><label style="font-size:11px;color:var(--mut);display:block;margin-bottom:3px">Unidad</label><select id="lp-unit" style="width:100%;padding:7px 6px;border:1.5px solid var(--brd);border-radius:7px;font-size:13px;background:var(--card);color:var(--txt)"><option>KG</option><option>UN</option><option>L</option><option>Caja</option><option>Bote</option><option>Bolsa</option></select></div>
          <div><label style="font-size:11px;color:var(--mut);display:block;margin-bottom:3px">Precio €</label><input type="number" id="lp-price" placeholder="0.00" step="0.01" min="0" max="${MAX_PRICE}" style="width:100%;padding:7px 8px;border:1.5px solid var(--brd);border-radius:7px;font-size:13px;background:var(--card);color:var(--txt);box-sizing:border-box"/></div>
        </div>
        <button class="btn btn-ok btn-sm" onclick="localAddProd('${esc(state.supId)}')">✓ Añadir producto</button>
      </div>` : ''}
    </div>
    <div style="margin-top:12px">
      <label style="font-size:11px;color:var(--mut);display:block;margin-bottom:4px">📝 Anotación / Nota para el pedido (opcional)</label>
      <textarea id="order-notes" maxlength="500" placeholder="Ej: Traer antes de las 10h..." rows="2" style="width:100%;padding:8px 10px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;background:var(--card);color:var(--txt);resize:vertical;box-sizing:border-box" oninput="state.orderNotes=this.value">${esc(state.orderNotes||'')}</textarea>
    </div>
  </div>
  <div class="cbar ${cnt>0?'up':''}" id="cbar">
    <div><div class="cb-v" id="cb-v">${cnt} art.${supCnt>1?` · ${supCnt} prov.`:''}</div><div class="cb-s" id="cb-s">${fmt(tot)}</div></div>
    <button class="btn btn-acc" id="submit-btn" onclick="submitOrder()" ${state.submitting?'disabled':''}>${state.submitting?'Enviando…':`📤 Enviar${supCnt>1?` (${supCnt} pedidos)`:' pedido'}`}</button>
  </div>`;
}

function vMyOrders(){
  const filterRest = state.session.restaurant;
  const mine = data.orders.filter(o => o.restaurant === filterRest)
    .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  if(!mine.length) return `<div class="empty"><div class="ei">📋</div><div class="et">Aún no has hecho ningún pedido</div></div>`;
  return mine.map(o => {
    const sup = data.suppliers[o.supId] || { name: '?', emoji: '?' };
    const tot = total(o);
    const sMap = {
      pending: { cls: 'b-p', lbl: '⏳ Pendiente de aprobación' },
      approved: { cls: 'b-a', lbl: '✅ Aprobado' },
      rejected: { cls: 'b-r', lbl: '✗ Rechazado' },
      received: { cls: 'b-recv', lbl: '📦 Recibido' }
    };
    const s = sMap[o.status] || { cls: 'b-p', lbl: o.status };
    const modTag = o.modifiedByAdmin ? `<span class="badge b-f" style="margin-left:6px">✏️ Modificado</span>` : '';
    const urgTag = o.urgent ? `<span class="badge b-urg" style="margin-left:6px">🚨 URGENTE</span>` : '';
    const delTag = o.deliveryDate ? `<span style="font-size:11px;color:var(--mut);margin-left:6px">📅 Entrega: ${esc(o.deliveryDate)}</span>` : '';
    const rows = (o.items||[]).map(it => `<div class="pr"><span class="pn">${esc(it.name||'?')}</span><span class="pq">${it.qty} ${esc(it.unit||'')}</span><span class="pp">${fmt((it.qty||0)*(it.price||0))}</span></div>`).join('');
    const rejNote = o.status === 'rejected' && o.rejectReason ? `<div class="banner red" style="margin-top:8px">💬 ${esc(o.rejectReason)}</div>` : '';
    const recvBtn = o.status === 'approved' ? `<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="markReceived('${esc(o.id)}')">📦 Confirmar recepción</button>` : '';
    return `<div class="oc" ${o.urgent?'style="border-color:#dc2626"':''}>
      <div class="oc-hd">
        <div>
          <div class="oc-rest">${esc(sup.emoji||'')} ${esc(sup.name)}${modTag}${urgTag}</div>
          <div class="oc-sub">${fmtD(o.createdAt||'')} · <span class="badge ${s.cls}">${s.lbl}</span>${delTag}</div>
        </div>
      </div>
      <div class="pl">${rows}<div class="ptot">Total: ${fmt(tot)}</div></div>
      ${rejNote}${recvBtn}
    </div>`;
  }).join('');
}

function vLocalGastos(){
  const rest = state.session.restaurant;
  const now = new Date();
  const curKey = now.toISOString().slice(0, 7);
  const monthName = now.toLocaleString('es-ES', { month: 'long', year: 'numeric' });

  const monthOrders = data.orders.filter(o => o.restaurant === rest && (o.status === 'approved' || o.status === 'received') && (o.createdAt||'').startsWith(curKey));
  const monthTotal = monthOrders.reduce((s, o) => s + total(o), 0);

  const bySupMap = {};
  monthOrders.forEach(o => {
    if(!bySupMap[o.supId]){
      const sup = data.suppliers[o.supId] || {};
      bySupMap[o.supId] = { name: sup.name||o.supId, emoji: sup.emoji||'🏭', total: 0, orders: 0, prods: {} };
    }
    bySupMap[o.supId].total += total(o);
    bySupMap[o.supId].orders++;
    (o.items||[]).forEach(it => {
      if(!bySupMap[o.supId].prods[it.id]) bySupMap[o.supId].prods[it.id] = { name: it.name, unit: it.unit, price: it.price, qty: 0, cost: 0 };
      bySupMap[o.supId].prods[it.id].qty += it.qty;
      bySupMap[o.supId].prods[it.id].cost += (it.qty||0)*(it.price||0);
    });
  });
  const bySupList = Object.values(bySupMap).sort((a,b) => b.total - a.total);

  const gastoHtml = monthTotal > 0 ? `
    <div style="background:linear-gradient(135deg,var(--pri),#3b82f6);color:#fff;border-radius:14px;padding:20px;margin-bottom:16px;text-align:center">
      <div style="font-size:13px;opacity:.85;margin-bottom:4px">Gasto en ${esc(monthName)}</div>
      <div style="font-size:32px;font-weight:800">${fmt(monthTotal)}</div>
      <div style="font-size:12px;opacity:.75;margin-top:4px">${monthOrders.length} pedido${monthOrders.length!==1?'s':''}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">
      ${bySupList.map(s => {
        const pct = monthTotal > 0 ? Math.round(s.total/monthTotal*100) : 0;
        const supId = Object.keys(bySupMap).find(k => bySupMap[k] === s);
        const expanded = state.gastoExpanded[supId];
        const prodRows = Object.values(s.prods).sort((a,b) => b.cost - a.cost).map(p =>
          `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--brd);font-size:12px">
            <span style="color:var(--txt)">${esc(p.name)} <span style="color:var(--mut)">(${p.qty} ${esc(p.unit||'')})</span></span>
            <span style="font-weight:600">${fmt(p.cost)}</span>
          </div>`).join('');
        return `<div style="background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px 14px;cursor:pointer" onclick="state.gastoExpanded['${esc(supId)}']=!state.gastoExpanded['${esc(supId)}'];render()">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-weight:600">${esc(s.emoji)} ${esc(s.name)}</span>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-weight:700;color:var(--pri)">${fmt(s.total)}</span>
              <span style="font-size:12px;color:var(--mut)">${expanded?'▲':'▼'}</span>
            </div>
          </div>
          <div style="background:var(--brd);border-radius:4px;height:6px"><div style="background:var(--pri);border-radius:4px;height:6px;width:${pct}%"></div></div>
          <div style="font-size:11px;color:var(--mut);margin-top:4px">${pct}% del total · ${s.orders} pedido${s.orders!==1?'s':''}</div>
          ${expanded?`<div style="margin-top:8px">${prodRows}</div>`:''}
        </div>`;
      }).join('')}
    </div>`
    : `<div class="empty" style="margin-bottom:20px"><div class="ei">📊</div><div class="et">Sin pedidos aprobados en ${esc(monthName)}</div></div>`;

  // Comparador de precios
  const sups = visibleSups();
  const search = norm(state.precioSearch||'');
  const prodMap = {};
  sups.forEach(s => (s.products||[]).forEach(p => {
    const n = norm(p.name);
    if(!prodMap[n]) prodMap[n] = [];
    prodMap[n].push({ supId: s.id, supName: s.name, supEmoji: s.emoji, price: p.price, unit: p.unit, origName: p.name });
  }));

  let entries = Object.entries(prodMap);
  if(search) entries = entries.filter(([n]) => n.includes(search));
  else entries = entries.filter(([,list]) => list.length > 1);
  entries.sort(([a],[b]) => a.localeCompare(b, 'es'));

  const comparadorHtml = `
    <div class="sh">Comparador de precios</div>
    <div style="font-size:12px;color:var(--mut);margin-bottom:10px">Productos disponibles en varios proveedores. El más barato aparece destacado.</div>
    <div style="position:relative;margin-bottom:12px">
      <input type="text" placeholder="🔍 Buscar producto..." value="${esc(state.precioSearch||'')}" oninput="state.precioSearch=this.value;render()" style="width:100%;padding:9px 12px;border:1.5px solid var(--brd);border-radius:8px;font-size:14px;background:var(--card);color:var(--txt);box-sizing:border-box"/>
    </div>
    ${entries.length ? entries.map(([n, list]) => {
      const sorted = [...list].sort((a,b) => a.price - b.price);
      const minPrice = sorted[0].price;
      return `<div style="background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px 14px;margin-bottom:8px">
        <div style="font-weight:600;margin-bottom:8px;text-transform:capitalize">${esc(sorted[0].origName)}</div>
        ${sorted.map((p,i) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;${i<sorted.length-1?'border-bottom:1px solid var(--brd)':''}">
            <span style="font-size:13px">${esc(p.supEmoji||'')} ${esc(p.supName)}</span>
            <span style="display:flex;align-items:center;gap:6px">
              <span style="font-weight:700;color:${p.price===minPrice?'#16a34a':'var(--txt)'}">${fmt(p.price)}<span style="font-size:11px;font-weight:400;color:var(--mut)"> / ${esc(p.unit||'')}</span></span>
              ${p.price===minPrice && list.length>1 ? '<span style="background:#dcfce7;color:#15803d;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px">🏆 MEJOR PRECIO</span>' : ''}
            </span>
          </div>`).join('')}
      </div>`;
    }).join('') : `<div class="empty"><div class="ei">🔍</div><div class="et">${search?'Sin resultados para "'+esc(state.precioSearch)+'"':'Sin productos en varios proveedores'}</div></div>`}`;

  return gastoHtml + comparadorHtml;
}

function buildSbStats(pend, appr){
  return `
    <div class="sb-ms"><div class="sb-msv">${pend.length}</div><div class="sb-msl">Pendientes</div></div>

    <div class="sb-ms"><div class="sb-msv" style="font-size:13px">${fmt(pend.reduce((s,o)=>s+total(o),0))}</div><div class="sb-msl">Por aprobar</div></div>
    <div class="sb-ms"><div class="sb-msv" style="font-size:13px;color:#4ade80">${fmt(appr.reduce((s,o)=>s+total(o),0))}</div><div class="sb-msl">Gasto</div></div>`;
