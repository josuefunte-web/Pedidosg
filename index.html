    const mesActual=supOrders.filter(o=>(o.createdAt||'').startsWith(curMonth)).reduce((s,o)=>s+total(o),0);
    const anoActual=supOrders.filter(o=>(o.createdAt||'').startsWith(curYear)).reduce((s,o)=>s+total(o),0);
    const balanceHtml=`<div style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap">
      <span style="font-size:11px;background:#f0fdf4;color:#16a34a;padding:2px 8px;border-radius:6px;font-weight:600">Este mes: ${fmt(mesActual)}</span>
      <span style="font-size:11px;background:#eff6ff;color:#1d4ed8;padding:2px 8px;border-radius:6px;font-weight:600">Este año: ${fmt(anoActual)}</span>
    </div>`;
    return `<div class="sup-card"><div class="sc-hd"><div><div class="sc-name">${sup.emoji} ${sup.name}</div><div class="sc-info">${sup.products.length} productos · ${sup.phone||'Sin número'}</div>${balanceHtml}</div>

      ${open?`<div class="sc-body">${supDetailForm(sup)}</div>`:''}
    </div>`;
  }).join('');
  return newF+exportBtn+list;
}

function saveSup2(id){
  const name=document.getElementById('sf-name-'+id)?.value.trim();
  const emoji=document.getElementById('sf-emoji-'+id)?.value.trim()||'🏭';
  const phone=document.getElementById('sf-phone-'+id)?.value.trim().replace(/\D/g,'');
  const ordenRaw=document.getElementById('sf-orden-'+id)?.value.trim();
  const orden=ordenRaw&&!isNaN(ordenRaw)?parseInt(ordenRaw):undefined;
  if(!name){toast('Introduce el nombre','#dc2626');return;}
  if(id==='new'){const nid='s'+uid();suppliers[nid]={id:nid,name,emoji,phone,...(orden!==undefined?{orden}:{}),products:[]};saveSups();S.editSupId=null;S.openSupId=nid;render();toast('Proveedor creado — ya puedes añadir productos','#16a34a');}
  else{if(!suppliers[id])return;suppliers[id].name=name;suppliers[id].emoji=emoji;suppliers[id].phone=phone;if(orden!==undefined)suppliers[id].orden=orden;else delete suppliers[id].orden;saveSups();render();toast('Proveedor guardado','#16a34a');}
}
function delSup(id){ if(!confirm('¿Eliminar proveedor?'))return;delete suppliers[id];saveSups();render(); }
function toggleSupVisibility(sid,uid,visible){
  if(!suppliers[sid])return;
  if(!suppliers[sid].disabledFor)suppliers[sid].disabledFor=[];
  if(visible){suppliers[sid].disabledFor=suppliers[sid].disabledFor.filter(id=>id!==uid);}
  else{if(!suppliers[sid].disabledFor.includes(uid))suppliers[sid].disabledFor.push(uid);}
  saveSups();
  toast(visible?'Proveedor activado para este local':'Proveedor desactivado para este local','#16a34a');
}
function editProdUnit(sid,pid,val){
  if(!suppliers[sid])return;
  const prod=suppliers[sid].products.find(p=>p.id===pid);
  if(prod){prod.unit=val;saveSups();toast('Unidad actualizada','#16a34a');}
}
function editProdPrice(sid,pid,val){
  const price=parseFloat(val);
  if(!suppliers[sid]||isNaN(price)||price<0){toast('Precio no válido','#dc2626');return;}
  const prod=suppliers[sid].products.find(p=>p.id===pid);
  if(prod){
    const oldPrice=parseFloat(prod.price)||0;
    prod.price=price;
    saveSups();
    if(fbDb && Math.abs(oldPrice-price)>0.001){
      const h={id:uid(),supId:sid,supName:suppliers[sid].name,prodId:pid,prodName:prod.name,oldPrice,newPrice:price,changedAt:new Date().toISOString()};
      fbDb.ref('priceHistory/'+h.id).set(h);
    }
    const alertPct=cfg.priceAlertPct||5;
    if(oldPrice>0){
      const pct=((price-oldPrice)/oldPrice)*100;
      if(pct>alertPct) toast(`⚠️ ${prod.name}: precio subió un +${pct.toFixed(1)}%`,'#d97706',4000);
      else if(pct<-alertPct) toast(`✅ ${prod.name}: precio bajó un ${pct.toFixed(1)}%`,'#16a34a',4000);
      else toast('Precio actualizado','#16a34a');
    } else { toast('Precio actualizado','#16a34a'); }
  }
}
function addProd(sid){
  const name=document.getElementById('pf-name-'+sid)?.value.trim();
  const unit=document.getElementById('pf-unit-'+sid)?.value;
  const price=parseFloat(document.getElementById('pf-price-'+sid)?.value);
  if(!name||isNaN(price)||price<0){toast('Nombre y precio obligatorios','#dc2626');return;}
  suppliers[sid].products.push({id:'p'+uid(),name,unit:unit||'KG',price});
  saveSups();render();toast('Producto añadido','#16a34a');
}
function delProd(sid,pid){ if(!suppliers[sid])return;suppliers[sid].products=suppliers[sid].products.filter(p=>p.id!==pid);saveSups();render(); }
function localAddProd(sid){
  const name=document.getElementById('lp-name')?.value.trim();
  const unit=document.getElementById('lp-unit')?.value||'KG';
  const priceRaw=document.getElementById('lp-price')?.value;
  const price=(priceRaw===''||priceRaw==null)?0:parseFloat(priceRaw);
  if(!name){toast('Escribe el nombre del producto','#dc2626');return;}
  if(isNaN(price)||price<0){toast('Introduce un precio válido','#dc2626');return;}
  if(!suppliers[sid]){toast('Proveedor no encontrado','#dc2626');return;}
  const pid='p'+uid();
  const newProd={id:pid,name,unit,price};
  // Garantizar que products es array (Firebase puede devolver objeto con claves numéricas)
  if(!Array.isArray(suppliers[sid].products)) suppliers[sid].products=Object.values(suppliers[sid].products||{});
  suppliers[sid].products.push(newProd);
  // Escritura dirigida — solo actualiza los productos de este proveedor, no todo suppliers
  // Esto evita condiciones de carrera donde otro dispositivo pueda sobreescribir el producto
  if(fbDb) fbDb.ref('suppliers/'+sid+'/products').set(suppliers[sid].products);
  localStorage.setItem('oc_suppliers', JSON.stringify(suppliers));
  S.showAddProd=false;
  // Auto-añadir al carrito con cantidad 1
  if(!S.cart[sid]) S.cart[sid]={};
  S.cart[sid][pid]=1;
  render();
  toast(`✅ "${name}" guardado en el proveedor y añadido al pedido`,'#16a34a');
}

/* ═══════════════ PLANTILLAS ═══════════════ */
function saveTpl(){
  const name=document.getElementById('tpl-name')?.value.trim();
  if(!name){toast('Pon un nombre','#dc2626');return;}
  const uid2=S.session.userId;
  const sup=suppliers[S.supId];
  const sc=S.cart[S.supId]||{};
  const items=sup.products.filter(p=>sc[p.id]).map(p=>({prodId:p.id,prodName:p.name,qty:sc[p.id],unit:p.unit,price:p.price}));
  if(!items.length){toast('Añade productos primero','#dc2626');return;}
  const recurType=document.getElementById('tpl-recur')?.value||'none';
  const recurDayRaw=document.getElementById('tpl-recur-day')?.value||'1';
  const recurrence=recurType==='none'?{type:'none'}:recurType==='weekly'?{type:'weekly',weekday:parseInt(recurDayRaw)||1}:{type:'monthly',dayOfMonth:parseInt(recurDayRaw.replace('d',''))||1};
  const tpl={id:uid(),name,supId:S.supId,items,recurrence,createdAt:new Date().toISOString()};
  if(!templates[uid2])templates[uid2]={};
  templates[uid2][tpl.id]=tpl;
  if(fbDb)fbDb.ref('templates/'+uid2+'/'+tpl.id).set(tpl);
  S.showSaveTemplate=false;
  toast('Plantilla guardada','#16a34a');render();
}
function loadTemplate(tplId){
  const uid2=S.session.userId;
  const tpl=templates[uid2]?.[tplId];if(!tpl)return;
  S.supId=tpl.supId;
  if(!S.cart[tpl.supId])S.cart[tpl.supId]={};
  tpl.items.forEach(it=>{S.cart[tpl.supId][it.prodId]=it.qty;});
  render();toast('Plantilla cargada — revisa cantidades','#16a34a');
}
function deleteTpl(tplId){
  const uid2=S.session.userId;
  if(!confirm('¿Eliminar plantilla?'))return;
  if(templates[uid2])delete templates[uid2][tplId];
  if(fbDb)fbDb.ref('templates/'+uid2+'/'+tplId).remove();
  render();
}
function loadAutoSuggest(){
  if(!S.session) return;
  const myHistory=orders.filter(o=>o.restaurant===S.session.restaurant&&o.supId===S.supId&&o.status!=='rejected');
  const acc={};
  myHistory.forEach(o=>(o.items||[]).forEach(it=>{if(!acc[it.id])acc[it.id]={prodId:it.id,totalQty:0,count:0};acc[it.id].count++;acc[it.id].totalQty+=it.qty;}));
  if(!S.cart[S.supId])S.cart[S.supId]={};
  Object.values(acc).sort((a,b)=>b.count-a.count).slice(0,5).forEach(it=>{
    S.cart[S.supId][it.prodId]=Math.round(it.totalQty/it.count)||1;
  });
  render();toast('🤖 Pedido típico cargado — ajusta cantidades','#7c3aed');
}

/* ═══════════════ PEDIDOS RECURRENTES ═══════════════ */
function loadRecurringTpl(tplId){

function vBudgets(){
  const now=new Date();

  Object.values(extraExpenses).filter(ex=>(ex.date||ex.createdAt||'').startsWith(curKey)).forEach(ex=>{spendByRest[ex.restaurant]=(spendByRest[ex.restaurant]||0)+(parseFloat(ex.amount)||0);});
  const cards=cfg.users.map(u=>{

    const status=limit>0?(over?`<span style="color:#dc2626;font-weight:700">⚠️ +${fmt(spent-limit)}</span>`:`<span style="color:#16a34a">${Math.round(pct)}%</span>`):'';
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--brd)">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.restaurant}</div>
        <div style="font-size:12px;color:var(--mut);margin-top:2px">${fmt(spent)} gastado${limit>0?' de '+fmt(limit):''} ${status}</div>
        ${limit>0?`<div style="background:var(--brd);border-radius:3px;height:4px;margin-top:5px"><div style="background:${barCol};width:${pct}%;height:4px;border-radius:3px"></div></div>`:''}
      </div>
      <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
        <input type="number" value="${limit||''}" placeholder="—" step="50" min="0"
          style="width:80px;padding:4px 6px;border:1px solid var(--brd);border-radius:6px;font-size:13px;text-align:right"
          onchange="saveBudget('${bKey}',this.value)"/>

      </div>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="card-t">Presupuesto mensual — <span style="text-transform:capitalize">${curLabel}</span></div>
    <div style="font-size:12px;color:var(--mut);margin-bottom:8px">Introduce el límite de compras para cada local. Se avisa si se supera al aprobar pedidos.</div>
    ${cards}
  </div>
  <div class="card" style="margin-top:14px">
    <div class="card-t">📈 Gasto vs Presupuesto (últimos 6 meses)</div>
    <div class="ch-wrap"><canvas id="budget-trend-chart"></canvas></div>
  </div>`;
}

/* ═══════════════ COMPARATIVA PROVEEDORES ═══════════════ */
function vCompare(){
  const sups=supList();
  if(sups.length<2)return`<div class="empty"><div class="ei">🔍</div><div class="et">Necesitas al menos 2 proveedores para comparar</div></div>`;
  const groups={};
  sups.forEach(sup=>{
    (sup.products||[]).forEach(p=>{
      const key=p.name.toLowerCase().trim();
      if(!groups[key])groups[key]={name:p.name,entries:{}};
      groups[key].entries[sup.id]={price:parseFloat(p.price)||0,unit:p.unit};
    });
  });
  const multi=Object.values(groups).filter(g=>Object.keys(g.entries).length>=2).sort((a,b)=>a.name.localeCompare(b.name,'es'));
  if(!multi.length)return`<div class="empty"><div class="ei">🔍</div><div class="et">No hay productos con el mismo nombre en varios proveedores</div></div>`;
  const headers=sups.map(s=>`<th style="text-align:right;padding:4px 8px 10px;font-size:11px;color:var(--mut);white-space:nowrap">${s.emoji} ${s.name}</th>`).join('');
  const rows=multi.map(g=>{
    const prices=Object.values(g.entries).map(e=>e.price).filter(p=>p>0);
    const minP=prices.length?Math.min(...prices):0;
    const cells=sups.map(sup=>{
      const e=g.entries[sup.id];
      if(!e)return`<td style="padding:6px 8px;text-align:right;color:var(--brd)">—</td>`;
      const cheap=e.price>0&&e.price===minP&&prices.filter(p=>p===minP).length<prices.length;
      return`<td style="padding:6px 8px;text-align:right;font-size:13px;${cheap?'color:#16a34a;font-weight:700':''}">${cheap?'✅ ':''}${fmt(e.price)}<span style="font-size:10px;color:var(--mut)">/${e.unit}</span></td>`;
    }).join('');
    return`<tr style="border-top:1px solid var(--brd)"><td style="padding:6px 4px 6px 0;font-size:13px">${g.name}</td>${cells}</tr>`;
  }).join('');
  return`<div class="card"><div class="card-t">Comparativa de precios entre proveedores</div>
    <div style="font-size:12px;color:var(--mut);margin-bottom:12px">✅ = precio más bajo. Solo aparecen productos presentes en 2+ proveedores.</div>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
      <thead><tr><th style="text-align:left;padding:4px 0 10px;font-size:11px;color:var(--mut)">Producto</th>${headers}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`;
}

/* ═══════════════ HISTORIAL DE PRECIOS ═══════════════ */
function vPriceHistory(){
  if(!priceHistory.length)return`<div class="empty"><div class="ei">📈</div><div class="et">Aún no hay cambios de precios registrados</div></div>`;
  const rows=priceHistory.slice(0,80).map(h=>{
    const diff=h.newPrice-h.oldPrice;

    const ico=diff>0?'↑':'↓';
    return`<tr style="border-top:1px solid var(--brd)">

  }).join('');
  return`<div class="card"><div class="card-t">Historial de cambios de precios</div>

/* ═══════════════ FOOD COST ═══════════════ */
function fcKey(){
  const d=new Date(S.fcDate+'T12:00:00');
  if(S.fcPeriod==='day') return 'd_'+S.fcDate;
  if(S.fcPeriod==='week'){
    const m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7));
    return 'w_'+m.toISOString().split('T')[0];
  }
  return 'm_'+S.fcDate.slice(0,7);
}
function fcRange(){
  const d=new Date(S.fcDate+'T12:00:00');
  if(S.fcPeriod==='day'){ return {s:new Date(S.fcDate+'T00:00:00'),e:new Date(S.fcDate+'T23:59:59')}; }
  if(S.fcPeriod==='week'){
    const s=new Date(d); s.setDate(d.getDate()-((d.getDay()+6)%7)); s.setHours(0,0,0,0);
    const e=new Date(s); e.setDate(s.getDate()+6); e.setHours(23,59,59,999);
    return {s,e};
  }
  return {s:new Date(d.getFullYear(),d.getMonth(),1),e:new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59,999)};
}
function fcPeriodLabel(){
  const d=new Date(S.fcDate+'T12:00:00');
  if(S.fcPeriod==='day') return d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  if(S.fcPeriod==='week'){ const {s,e}=fcRange(); return s.toLocaleDateString('es-ES',{day:'numeric',month:'short'})+' – '+e.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}); }
  return d.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
}
function fcNavDate(dir){
  const d=new Date(S.fcDate+'T12:00:00');
  if(S.fcPeriod==='day') d.setDate(d.getDate()+dir);
  else if(S.fcPeriod==='week') d.setDate(d.getDate()+dir*7);
  else d.setMonth(d.getMonth()+dir);
  S.fcDate=d.toISOString().split('T')[0]; render();
}
function fcOrders(){
  const {s,e}=fcRange();
  return orders.filter(o=>(o.status==='approved'||o.status==='received')&&o.createdAt&&new Date(o.createdAt)>=s&&new Date(o.createdAt)<=e);
}
function saveRevenue(key,val){
  const v=parseFloat(val);
  if(isNaN(v)||v<0){toast('Valor no válido','#dc2626');return;}
  revenue[key]=v;
  if(fbDb) fbDb.ref('revenue/'+key).set(v);
  render();
}
function fcBadge(pct){
  if(pct===null||pct===undefined) return `<span style="color:var(--mut);font-size:12px">—</span>`;
  const col=pct<28?'#16a34a':pct<33?'#ca8a04':pct<38?'#ea580c':'#dc2626';
  const lbl=pct<28?'Excelente':pct<33?'Bueno':pct<38?'Atención':'Elevado';
  const ico=pct<28?'✅':pct<33?'👍':pct<38?'⚠️':'🔴';
  return `<span style="color:${col};font-weight:700">${ico} ${pct.toFixed(1)}%</span><div style="font-size:11px;color:${col};margin-top:2px">${lbl}</div>`;
}
function vFoodCost(){
  const key=fcKey();
  const rev=revenue[key]||0;
  const appr=fcOrders();
  const fcRng=fcRange();
  const extraCostTotal=Object.values(extraExpenses).filter(ex=>{const d=new Date(ex.date||ex.createdAt);return d>=fcRng.s&&d<=fcRng.e;}).reduce((s,ex)=>s+(parseFloat(ex.amount)||0),0);
  const totalCost=appr.reduce((s,o)=>s+total(o),0)+extraCostTotal;
  const pct=(rev>0)?((totalCost/rev)*100):null;
  const pctCol=pct===null?'var(--mut)':pct<28?'#16a34a':pct<33?'#ca8a04':pct<38?'#ea580c':'#dc2626';

  return `<div class="card" style="margin-bottom:12px">
    <div style="display:flex;gap:6px;margin-bottom:16px">
      ${['day','week','month'].map(p=>`<button class="btn ${S.fcPeriod===p?'btn-pri':'btn-ghost'} btn-sm" onclick="S.fcPeriod='${p}';render()">${p==='day'?'Día':p==='week'?'Semana':'Mes'}</button>`).join('')}
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button class="btn btn-ghost btn-sm" onclick="fcNavDate(-1)">◀</button>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center">

        <div style="font-size:20px;font-weight:800">${fmt(totalCost)}</div>
        <div style="font-size:11px;color:var(--mut);margin-top:4px">${appr.length} pedido${appr.length!==1?'s':''}</div>
      </div>
      <div style="padding:14px 10px;background:var(--srf);border-radius:10px">
        <div style="font-size:10px;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Facturación</div>
        <input type="number" value="${rev||''}" placeholder="0.00" step="0.01" min="0"
          style="width:100%;padding:6px 4px;border:1px solid var(--brd);border-radius:6px;font-size:18px;font-weight:700;text-align:center;background:var(--bg)"
          onchange="saveRevenue('${key}',this.value)"/>

          : `<div style="font-size:13px;color:var(--mut)">Introduce<br>facturación</div>`}
      </div>
    </div>
  </div>
  ${restRows
    ? `<div class="card"><div class="card-t">Desglose por local</div>
       <table style="width:100%;border-collapse:collapse">
         <thead><tr style="color:var(--mut);font-size:11px;text-transform:uppercase">

           <th style="text-align:center;padding:4px 0 8px">FC %</th>

    : `<div class="empty"><div class="ei">🧾</div><div class="et">Sin pedidos aprobados en este periodo</div></div>`}`;
}

/* ═══════════════ PUSH NOTIFICATIONS ═══════════════ */
function playNotifSound(urgent=false){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const beep=(freq,start,dur)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=freq;
      g.gain.setValueAtTime(0,ctx.currentTime+start);
      g.gain.linearRampToValueAtTime(0.25,ctx.currentTime+start+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+dur);
      o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur+0.05);
    };
    if(urgent){beep(880,0,0.15);beep(1100,0.2,0.15);beep(880,0.4,0.15);beep(1100,0.6,0.2);}
    else{beep(660,0,0.12);beep(880,0.18,0.18);}
  }catch(e){}
}
function testNotifSound(){ playNotifSound(false); toast('🔊 Sonido de prueba','#16a34a'); }
function requestPushPermission(){
  if(window.self!==window.top){
    toast('Abre la app directamente en el navegador para activar notificaciones emergentes. El sonido ya funciona.','#d97706',5000);
    return;
  }
  if(!('Notification' in window)){
    toast('Tu navegador no soporta notificaciones emergentes. El sonido sí está disponible.','#d97706',4000);
    return;
  }
  Notification.requestPermission().then(perm=>{
    const el=document.getElementById('push-status');
    if(perm==='granted'){
      if(el)el.textContent='✅ Notificaciones activas';
      toast('🔔 Notificaciones activadas','#16a34a');
    } else {
      if(el)el.textContent='❌ Bloqueadas — actívalas en los ajustes del navegador';
      toast('❌ Notificaciones bloqueadas — actívalas en los ajustes del navegador para este sitio','#dc2626',5000);
    }
  });
}
function pushNotify(title,body,icon='🛒'){
  // Sonido siempre (si está activado en config)
  if(cfg.notifSound!==false) playNotifSound(icon==='🚨');
  // Notificación emergente solo si hay permiso y no estamos en iframe
  if(window.self===window.top&&'Notification' in window&&Notification.permission==='granted'){
    try{ new Notification(`${icon} ${title}`,{body}); }catch(e){}
  }
}

function sendNtfy(title, body, {priority='default', tags='bell', urgent=false}={}){
  const topic=(cfg.ntfyTopic||'').trim();
  if(!topic) return Promise.resolve();
  return fetch(`https://ntfy.sh/${topic}`,{
    method:'POST',
    headers:{
      'Title': title,
      'Priority': urgent?'urgent':priority,
      'Tags': urgent?'rotating_light,'+tags:tags,
      'Content-Type':'text/plain'
    },
    body
  });
}

function testNtfy(){
  const topic=(cfg.ntfyTopic||'').trim();
  if(!topic){toast('Primero pon un nombre de canal','#dc2626');return;}
  toast('Enviando...','#6b7280',2000);
  sendNtfy('🧪 Prueba O\'Carro','Si ves esto, las notificaciones push funcionan ✅',{tags:'white_check_mark'})
    .then(r=>{
      if(r&&r.ok){
        toast(`✅ Enviado al canal "${topic}" — comprueba el móvil`,'#16a34a',6000);
      } else {
        toast(`❌ Error al enviar (${r?r.status:'sin respuesta'}) — comprueba el canal`,'#dc2626',6000);
        console.error('ntfy error:',r?.status,r?.statusText);
      }
    })
    .catch(e=>{
      toast(`❌ No se pudo conectar con ntfy.sh — ${e.message}`,'#dc2626',6000);
      console.error('ntfy fetch error:',e);
    });
}

function filterProds(val){
  S.prodSearch=val||'';

  const filtered=sup.products.filter(p=>!term||p.name.toLowerCase().includes(term));

    const selUnit=(S.cartUnits[S.supId]||{})[p.id]||p.unit;
    const unitBtns=_UNITS.map(u=>`<button class="ubt${selUnit===u?' ubt-on':''}" onclick="setUnit('${p.id}','${u}');event.stopPropagation()">${u}</button>`).join('');

    </div>`;
  }).join('');

}

function chgQ(id,d){
  if(!S.cart[S.supId])S.cart[S.supId]={};
  const sc=S.cart[S.supId];
  const q=sc[id]||0,nq=Math.max(0,q+d);
  if(nq===0)delete sc[id];else sc[id]=nq;
  if(Object.keys(sc).length===0)delete S.cart[S.supId];
  const el=document.getElementById('qd-'+id);if(el)el.textContent=nq;
  const pi=document.getElementById('pi-'+id);if(pi)pi.className='pi'+(nq>0?' ic':'');
  // Mostrar/ocultar fila de unidades
  const ur=document.getElementById('ur-'+id);
  if(ur){
    if(nq>0){
      ur.style.display='flex';
      if(!ur.innerHTML.trim()){
        const _UNITS=['KG','L','UN','Caja'];
        const sup=suppliers[S.supId];
        const prod=sup&&sup.products.find(p=>p.id===id);
        const selUnit=(S.cartUnits[S.supId]||{})[id]||(prod&&prod.unit)||'UN';
        ur.innerHTML=_UNITS.map(u=>`<button class="ubt${selUnit===u?' ubt-on':''}" onclick="setUnit('${id}','${u}');event.stopPropagation()">${u}</button>`).join('');
      }
    } else { ur.style.display='none'; }
  }
  // Grand total across all suppliers
  const cnt=Object.values(S.cart).reduce((s,sc2)=>s+Object.values(sc2).reduce((a,v)=>a+v,0),0);
  const tot=Object.entries(S.cart).reduce((s,[sid,sc2])=>{const sp=suppliers[sid];if(!sp)return s;return s+sp.products.reduce((a,p)=>a+(sc2[p.id]||0)*p.price,0);},0);
  const bar=document.getElementById('cbar');if(bar)bar.className='cbar'+(cnt>0?' up':'');
  const cv=document.getElementById('cb-v');if(cv)cv.textContent=`${cnt} art. · ${Object.keys(S.cart).length} prov.`;
  const cs=document.getElementById('cb-s');if(cs)cs.textContent=fmt(tot);
}

function submitOrder(){
  if(!S.session){toast('Sin sesión','#dc2626');return;}
  const activeSups=Object.keys(S.cart).filter(sid=>Object.keys(S.cart[sid]||{}).length>0);
  if(!activeSups.length){toast('Añade productos al pedido','#dc2626');return;}
  const approvalMinAmount=cfg.approvalMinAmount||0;
  const orders2send=[];
  activeSups.forEach(sid=>{
    const sup=suppliers[sid];if(!sup)return;
    const sc=S.cart[sid]||{};
    const items=sup.products.filter(p=>sc[p.id]).map(p=>({...p,qty:sc[p.id],unit:(S.cartUnits[sid]&&S.cartUnits[sid][p.id])||p.unit}));
    if(!items.length)return;
    const orderTotal=items.reduce((s,p)=>s+p.qty*p.price,0);
    const needApproval=S.session.needsApproval&&(approvalMinAmount<=0||orderTotal>=approvalMinAmount);
    const o={id:uid(),restaurant:S.session.restaurant,supId:sid,items,status:needApproval?'pending':'approved',autoApproved:!needApproval,createdAt:new Date().toISOString(),urgent:S.orderUrgent||false,deliveryDate:S.orderDeliveryDate||null,notes:S.orderNotes||''};
    saveOrder(o);
    orders2send.push(o);
  });
  if(!orders2send.length){toast('Añade productos al pedido','#dc2626');return;}
  S.cart={};S.cartUnits={};S.orderUrgent=false;S.orderDeliveryDate='';S.prodSearch='';S.orderNotes='';
  const pendingOrders=orders2send.filter(o=>o.status==='pending');
  const autoOrders=orders2send.filter(o=>o.status==='approved');
  if(pendingOrders.length){
    // Show WA for admin with summary of pending orders
    const totalAmt=pendingOrders.reduce((s,o)=>s+total(o),0);
    const msgMulti=`🛒 Nuevo pedido de ${pendingOrders[0].restaurant}\n${pendingOrders.map(o=>`• ${(suppliers[o.supId]||{name:o.supId}).name}: ${fmt(total(o))}`).join('\n')}\n💰 Total: ${fmt(totalAmt)}`;
    showWA(cfg.adminPhone||'',msgMulti,`${pendingOrders.length} pedido(s) de ${pendingOrders[0].restaurant} — apruébalos`);
    // Notificación push al móvil del admin
    const urgent=pendingOrders.some(o=>o.urgent);
    const ntfyLines=pendingOrders.map(o=>`• ${(suppliers[o.supId]||{name:o.supId}).name}: ${fmt(total(o))}${o.urgent?' 🚨 URGENTE':''}`).join('\n');
    sendNtfy(
      `${urgent?'🚨 URGENTE — ':''}Nuevo pedido de ${pendingOrders[0].restaurant}`,
      `${ntfyLines}\n💰 Total: ${fmt(totalAmt)}`,
      {priority:urgent?'urgent':'high', tags:urgent?'rotating_light':'shopping_cart', urgent}
    );
    toast(`✅ ${pendingOrders.length} pedido(s) enviado(s) para aprobación`,'#d97706');
  }
  if(autoOrders.length){
    // Auto-approved: one WA per supplier
    autoOrders.forEach(o=>{
      const sup=suppliers[o.supId];if(sup?.phone)showWA(sup.phone,msgSupplier(o),`Pedido aprobado — envíalo a ${sup.name}`);
    });
    // Notificación push también para auto-aprobados
    const totalAuto=autoOrders.reduce((s,o)=>s+total(o),0);
    sendNtfy(
      `⚡ Pedido auto-aprobado — ${autoOrders[0].restaurant}`,
      autoOrders.map(o=>`• ${(suppliers[o.supId]||{name:o.supId}).name}: ${fmt(total(o))}`).join('\n')+`\n💰 Total: ${fmt(totalAuto)}`,
      {priority:'default', tags:'white_check_mark'}
    );
    toast(`⚡ ${autoOrders.length} pedido(s) aprobado(s) automáticamente — envía a cada proveedor`,'#16a34a');
  }
  render();
}

function approve(id){
  const noteEl=document.getElementById('approve-note-'+id);
  const approvalNote=noteEl?noteEl.value.trim():'';
  const o=orders.find(x=>x.id===id);
  updateOrder(id,{status:'approved',...(approvalNote?{approvalNote}:{})});
  if(!fbDb){ if(o){o.status='approved';if(approvalNote)o.approvalNote=approvalNote;} render(); }
  toast('✅ Pedido aprobado','#16a34a');
  const sup=o?suppliers[o.supId]:null;
  const localUser=o?cfg.users.find(u=>u.restaurant===o.restaurant):null;
  const localPhone=localUser?.phone||'';
  const nextWA=localPhone?{phone:localPhone,msg:msgLocal(o,sup?.name||o.supId),desc:`Avisa a ${o.restaurant} que el pedido fue enviado`}:null;
  if(o&&sup?.phone) showWA(sup.phone,msgSupplier({...o,status:'approved'}),`Pedido aprobado — envía a ${sup.name}`,nextWA);
  else if(nextWA) showWA(nextWA.phone,nextWA.msg,nextWA.desc);
}

function closeRecvModal(){ document.getElementById('recv-ov').style.display='none'; _recvOrderId=null; }
function confirmReceived(){
  if(!_recvOrderId) return;
  const o=orders.find(x=>x.id===_recvOrderId);
  if(!o){ closeRecvModal(); return; }
  const receivedItems=(o.items||[]).map((it,i)=>{
    const status=document.getElementById('recv-status-'+i)?.value||'ok';
    const note=document.getElementById('recv-note-'+i)?.value.trim()||'';
    return {...it,recvStatus:status,...(note?{recvNote:note}:{})};
  });
  const generalNote=document.getElementById('recv-general-note')?.value.trim()||'';
  const hasIssues=receivedItems.some(it=>it.recvStatus!=='ok');
  updateOrder(_recvOrderId,{status:'received',receivedAt:new Date().toISOString(),receivedItems,...(generalNote?{receivedNote:generalNote}:{}),...(hasIssues?{receivedIssues:true}:{})});
  if(!fbDb){ const ord=orders.find(x=>x.id===_recvOrderId);if(ord){ord.status='received';ord.receivedAt=new Date().toISOString();ord.receivedItems=receivedItems;if(generalNote)ord.receivedNote=generalNote;if(hasIssues)ord.receivedIssues=true;}}
  closeRecvModal();
  toast(hasIssues?'📦 Recibido con incidencias':'📦 Pedido recibido correctamente',hasIssues?'#d97706':'#7c3aed');
  renderAdminContent();
}

let _monthlyChart=null;
function renderMonthlyChart(){
  const canvas=document.getElementById('monthly-chart');
  if(!canvas) return;
  if(_monthlyChart){_monthlyChart.destroy();_monthlyChart=null;}
  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push(d.toISOString().slice(0,7));
  }
  const rests=[...new Set(orders.map(o=>o.restaurant).filter(Boolean))].sort();
  const colors=['#e94560','#1a1a2e','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#059669','#dc2626','#2563eb','#9333ea','#ea580c'];
  const datasets=rests.map((r,i)=>({
    label:r.replace("O'Carro ",''),
    data:months.map(m=>orders.filter(o=>o.status!=='rejected'&&o.restaurant===r&&(o.createdAt||'').startsWith(m)).reduce((s,o)=>s+total(o),0)),
    backgroundColor:colors[i%colors.length]+'99',
    borderColor:colors[i%colors.length],
    borderWidth:1.5,
    borderRadius:4,
  }));
  const labels=months.map(m=>{const[y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('es',{month:'short',year:'2-digit'});});
  _monthlyChart=new Chart(canvas,{type:'bar',data:{labels,datasets},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:10}}},scales:{x:{stacked:false},y:{ticks:{callback:v=>'€'+v.toLocaleString('es')}}}}});
}

function exportExcel(type){
  if(typeof XLSX==='undefined'){toast('Librería Excel no cargada','#dc2626');return;}
  let rows=[];
  let filename='pedidos';
  if(type==='all'||type==='monthly'||!type){
    filename='pedidos_ocarro_'+new Date().toISOString().slice(0,10);
    rows=[['ID','Fecha','Local','Proveedor','Estado','Total €','Urgente','Entrega'],...orders.map(o=>[o.id,(o.createdAt||'').slice(0,10),o.restaurant||'',(suppliers[o.supId]||{name:o.supId||'?'}).name,o.status,total(o).toFixed(2),o.urgent?'Sí':'No',o.deliveryDate||''])];
  } else if(type==='received'){
    filename='pedidos_recibidos_'+new Date().toISOString().slice(0,10);
    const rec=orders.filter(o=>o.status==='received');
    rows=[['ID','Fecha pedido','Fecha recepción','Local','Proveedor','Total €'],...rec.map(o=>[o.id,(o.createdAt||'').slice(0,10),(o.receivedAt||'').slice(0,10),o.restaurant||'',(suppliers[o.supId]||{name:o.supId||'?'}).name,total(o).toFixed(2)])];
  }
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Pedidos');
  XLSX.writeFile(wb,filename+'.xlsx');
  toast('📥 Excel descargado','#16a34a');
}

            <div class="esc-calc-r"><span>Food cost real</span><strong id="ec-fc">— %</strong></div>
            <div class="esc-calc-r"><span>PVP sugerido</span><strong id="ec-pvpsug">— €</strong></div>
            <div class="esc-calc-r"><span>Margen bruto</span><strong id="ec-margen">— €</strong></div>
            <div class="esc-calc-r"><span>% Margen</span><strong id="ec-margenpct">— %</strong></div>
          </div>
        </div>
      </div>
      <div class="esc-modal-ft">
        <button class="btn btn-no btn-sm" id="esc-btn-del" style="display:none" onclick="escDelete()">🗑 Eliminar</button>
        <div class="esc-modal-ft-r">
          <button class="btn btn-ghost btn-sm" id="esc-btn-pdf" onclick="escExportPDF()" title="Exportar a PDF">📄 PDF</button>
          <button class="btn btn-ghost btn-sm" id="esc-btn-xlsx" onclick="escExportExcel()" title="Exportar a Excel">📊 Excel</button>
          <button class="btn btn-ghost btn-sm" onclick="escCloseModal()">Cancelar</button>
          <button class="btn btn-pri btn-sm" onclick="escSave()">💾 Guardar</button>
        </div>
      </div>
    </div>
  </div>`;
}

function initEscandallos(){
  _escSupsCache = suppliers;
  escRender();
  menRender();
  if(_escInit||!fbDb) return;
  _escInit=true;
  fbDb.ref('escandallos').on('value', snap=>{
    _escAllData = snap.val() || {};
    escRender();
    menRender();
    if(S.view==='order' && S.orderTab==='escandallos') render();
  });
  if(!_menInit){ _menInit=true;
    fbDb.ref('menus').on('value', snap=>{
      _menAllData = snap.val() || {};
      menRender();
      if(S.view==='order' && S.orderTab==='escandallos') render();
    });
  }
}

function escRender(){
  const grid = document.getElementById('esc-grid');
  if(!grid) return;
  const txt = (document.getElementById('esc-search')?.value||'').toLowerCase();
  const cat = document.getElementById('esc-cat-filter')?.value||'';
  const local = document.getElementById('esc-local-filter')?.value||'';
  const entries = Object.entries(_escAllData).filter(([,e])=>{
    const rest=e.restaurante||'global';
    return (!txt||e.nombre?.toLowerCase().includes(txt))
      &&(!cat||e.categoria===cat)
      &&(!local||(local==='global'?rest==='global':rest===local));
  });
  if(!entries.length){
    grid.innerHTML='<p style="color:var(--mut)">No hay escandallos con esos filtros. Crea uno con "+ Nuevo".</p>';
    return;
  }
  grid.innerHTML = entries.map(([id,e])=>{
    const coste = escCosteTotal(e);
    const pvp = parseFloat(e.precioVenta)||0;
    const fcObj = parseFloat(e.foodCostObjetivo)||30;
    const fcReal = pvp>0?(coste/pvp*100):null;
    const margen = pvp>0?(pvp-coste):null;
    const margenPct = pvp>0&&margen!==null?(margen/pvp*100):null;
    let cls='esc-ok';
    if(fcReal!==null){if(fcReal>fcObj+5)cls='esc-bad';else if(fcReal>fcObj)cls='esc-warn';}
    const rest=e.restaurante||'global';
    const restBadge=rest==='global'
      ?`<span style="font-size:10px;background:#dbeafe;color:#1d4ed8;border-radius:10px;padding:1px 7px;font-weight:700">🌐 Global</span>`
      :`<span style="font-size:10px;background:#f3e8ff;color:#7c3aed;border-radius:10px;padding:1px 7px;font-weight:700">🏪 ${rest}</span>`;
    const baseTag=e.baseId?`<span style="font-size:10px;color:var(--mut);margin-left:4px">copia</span>`:'';
    const copyBtn=`<button class="btn btn-ghost btn-xs" style="margin-top:8px;width:100%;justify-content:center" onclick="event.stopPropagation();escCopiarParaLocal('${id}')">📋 Copiar para local</button>`;
    return `<div class="esc-card" onclick="escOpenModal('${id}')">
      <div class="esc-fc-ind ${cls}">${fcReal!==null?fcReal.toFixed(0)+'%':'—'}</div>
      <span class="esc-badge">${e.categoria||'Otros'}</span>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px">${restBadge}${baseTag}</div>
      <h4>${e.nombre||'Sin nombre'}</h4>
      <div class="esc-stats">
        <div class="esc-stat"><span>Coste</span><strong>${escFmt(coste)}</strong></div>
        <div class="esc-stat"><span>PVP</span><strong>${pvp>0?escFmt(pvp):'—'}</strong></div>
        <div class="esc-stat"><span>Margen</span><strong>${margen!==null?escFmt(margen):'—'}</strong></div>
        <div class="esc-stat"><span>% Margen</span><strong>${margenPct!==null?margenPct.toFixed(1)+'%':'—'}</strong></div>
      </div>
      <div style="margin-top:8px;font-size:12px;color:var(--mut)">${(e.ingredientes||[]).length} ingredientes</div>
      ${copyBtn}
    </div>`;
  }).join('');
}

function escCosteTotal(e){
  return (e.ingredientes||[]).reduce((s,ing)=>{
    let p=parseFloat(ing.precioUnitario)||0;
    if(ing.proveedorId&&suppliers[ing.proveedorId]){
      const prod=(suppliers[ing.proveedorId].products||[]).find(x=>x.id===ing.productoId);
      if(prod) p=parseFloat(prod.price)||0;
    }
    const merma=parseFloat(ing.merma)||0;
    const factor=merma>0&&merma<100?1/(1-merma/100):1;
    return s+(parseFloat(ing.cantidad)||0)*p*factor;
  },0);
}

function escOpenModal(id=null){
  _escEditId=id; _escIngs=[];
  _escSupsCache=suppliers;
  document.getElementById('esc-modal-title').textContent=id?'Editar escandallo':'Nuevo escandallo';
  document.getElementById('esc-btn-del').style.display=id?'':'none';
  // Poblar select de local si existe
  const selLocal=document.getElementById('esc-local');
  if(selLocal){
    selLocal.innerHTML=`<option value="global">Global (todos los locales)</option>`+cfg.users.map(u=>`<option value="${u.restaurant}">${u.restaurant}</option>`).join('');
  }
  if(id&&_escAllData[id]){
    const e=_escAllData[id];
    document.getElementById('esc-nombre').value=e.nombre||'';
    document.getElementById('esc-categoria').value=e.categoria||'Carnes';
    document.getElementById('esc-pvp').value=e.precioVenta||'';
    document.getElementById('esc-fcobj').value=e.foodCostObjetivo||30;
    document.getElementById('esc-notas').value=e.notas||'';
    if(selLocal) selLocal.value=e.restaurante||'global';
    _escIngs=JSON.parse(JSON.stringify(e.ingredientes||[]));
  } else {
    document.getElementById('esc-nombre').value='';
    document.getElementById('esc-categoria').value='Carnes';
    document.getElementById('esc-pvp').value='';
    document.getElementById('esc-fcobj').value=30;
    document.getElementById('esc-notas').value='';
    if(selLocal) selLocal.value='global';
  }
  // Limpiar campos de añadir ingrediente
  ['esc-sel-qty','esc-sel-merma','esc-libre-nombre','esc-libre-precio'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  // Poblar proveedores
  const sel=document.getElementById('esc-sel-prov');
  sel.innerHTML='<option value="">-- Proveedor (opcional) --</option>';
  Object.entries(_escSupsCache).forEach(([pid,prov])=>{
    const o=document.createElement('option');
    o.value=pid; o.textContent=(prov.emoji||'')+(prov.name||pid);
    sel.appendChild(o);
  });
  escRenderIngs(); escRecalc();
  document.getElementById('esc-modal-ov').style.display='flex';
}
function escCloseModal(){ document.getElementById('esc-modal-ov').style.display='none'; _escEditId=null; _escIngs=[]; }

function escLoadProds(){
  const pid=document.getElementById('esc-sel-prov').value;
  const sel=document.getElementById('esc-sel-prod');
  sel.innerHTML='<option value="">-- Producto --</option>';
  if(!pid||!_escSupsCache[pid]) return;
  const prods=_escSupsCache[pid].products||[];
  (Array.isArray(prods)?prods:Object.values(prods)).forEach(p=>{
    const o=document.createElement('option');
    o.value=p.id||p.name;
    o.textContent=`${p.name} (${parseFloat(p.price||0).toFixed(2)}€/${p.unit||'u.'})`;
    o.dataset.price=p.price||0; o.dataset.unit=p.unit||'u.'; o.dataset.name=p.name||'';
    sel.appendChild(o);
  });
}

function escAddIng(){
  const pid=document.getElementById('esc-sel-prov').value;
  const sel=document.getElementById('esc-sel-prod');
  const prodId=sel.value;
  const qty=parseFloat(document.getElementById('esc-sel-qty').value);
  const merma=parseFloat(document.getElementById('esc-sel-merma').value)||0;
  const libreNombre=(document.getElementById('esc-libre-nombre').value||'').trim();
  const librePrice=parseFloat(document.getElementById('esc-libre-precio').value)||0;

  if(!qty||qty<=0){toast('Introduce una cantidad válida','#dc2626');return;}

  if(libreNombre){
    // Ingrediente libre (sin proveedor)
    _escIngs.push({proveedorId:null,proveedorNombre:'Libre',productoId:null,nombre:libreNombre,cantidad:qty,unidad:'u.',precioUnitario:librePrice,merma});
  } else {
    // Ingrediente de proveedor
    if(!pid){toast('Selecciona un proveedor o escribe un ingrediente libre','#dc2626');return;}
    if(!prodId){toast('Selecciona un producto','#dc2626');return;}
    const opt=sel.options[sel.selectedIndex];
    const prov=_escSupsCache[pid];
    _escIngs.push({proveedorId:pid,proveedorNombre:(prov?.name||pid),productoId:prodId,nombre:opt.dataset.name||opt.textContent,cantidad:qty,unidad:opt.dataset.unit||'u.',precioUnitario:parseFloat(opt.dataset.price)||0,merma});
  }
  document.getElementById('esc-sel-prov').value='';
  document.getElementById('esc-sel-prod').innerHTML='<option value="">-- Producto del proveedor --</option>';
  document.getElementById('esc-sel-qty').value='';
  document.getElementById('esc-sel-merma').value='';
  document.getElementById('esc-libre-nombre').value='';
  document.getElementById('esc-libre-precio').value='';
  escRenderIngs(); escRecalc();
}

function escQuitarIng(i){ _escIngs.splice(i,1); escRenderIngs(); escRecalc(); }

function escLivePrice(ing){
  if(ing.proveedorId===null) return parseFloat(ing.precioUnitario)||0; // ingrediente libre
  const sup=suppliers[ing.proveedorId];
  if(sup&&sup.products){
    const prod=sup.products.find(p=>p.id===ing.productoId);
    if(prod) return parseFloat(prod.price)||0;
  }
  return parseFloat(ing.precioUnitario)||0;
}

function escCosteFactor(ing){
  // Coste real = precio * cantidad / (1 - merma/100)
  const merma=parseFloat(ing.merma)||0;
  const factor=merma>0&&merma<100?1/(1-merma/100):1;
  return escLivePrice(ing)*(parseFloat(ing.cantidad)||0)*factor;
}

function escRenderIngs(){
  const cont=document.getElementById('esc-ing-list');
  if(!cont) return;
  if(!_escIngs.length){cont.innerHTML='<p style="color:var(--mut);font-size:13px">Sin ingredientes aún</p>';return;}
  cont.innerHTML=_escIngs.map((ing,i)=>{
    const liveP=escLivePrice(ing);
    const merma=parseFloat(ing.merma)||0;
    const costeReal=escCosteFactor(ing);
    const changed=ing.proveedorId!==null&&Math.abs(liveP-(parseFloat(ing.precioUnitario)||0))>0.001;
    const priceTag=changed?`<span style="color:#d97706;font-size:10px" title="Precio actualizado desde tarifa">🔄 ${escFmt(liveP)}</span>`:`${escFmt(liveP)}`;
    const mermaTag=merma>0?`<span style="color:#7c3aed;font-size:10px;margin-left:4px" title="Con merma del ${merma}%">⚠️ ${merma}%</span>`:'';
    const libre=ing.proveedorId===null?'<span style="font-size:10px;color:#6b7280;margin-left:4px">[libre]</span>':'';
    return `<div class="esc-ing-row">
      <span class="in">${ing.nombre}${libre}</span>
      <span class="id">${ing.cantidad} ${ing.unidad} × ${priceTag}${mermaTag}</span>
      <span class="ic">${escFmt(costeReal)}</span>
      <button onclick="escQuitarIng(${i})" title="Eliminar">✕</button>
    </div>`;
  }).join('');
}

function escRecalc(){
  const coste=_escIngs.reduce((s,ing)=>s+escCosteFactor(ing),0);
  const pvp=parseFloat(document.getElementById('esc-pvp')?.value)||0;
  const fcObj=parseFloat(document.getElementById('esc-fcobj')?.value)||30;
  const fcReal=pvp>0?(coste/pvp*100):null;
  const pvpSug=coste>0?(coste/(fcObj/100)):null;
  const margen=pvp>0?(pvp-coste):null;
  const margenPct=pvp>0&&margen!==null?(margen/pvp*100):null;
  document.getElementById('ec-coste').textContent=escFmt(coste);
  const fcEl=document.getElementById('ec-fc');
  if(fcReal!==null){fcEl.textContent=fcReal.toFixed(1)+'%';fcEl.className=fcReal<=fcObj?'fc-ok':fcReal<=fcObj+5?'fc-warn':'fc-bad';}
  else{fcEl.textContent='— %';fcEl.className='';}
  document.getElementById('ec-pvpsug').textContent=pvpSug!==null?escFmt(pvpSug):'— €';
  document.getElementById('ec-margen').textContent=margen!==null?escFmt(margen):'— €';
  document.getElementById('ec-margenpct').textContent=margenPct!==null?margenPct.toFixed(1)+'%':'— %';
}

function escSave(){
  if(!fbDb){toast('Sin conexión Firebase — espera un momento y vuelve a intentarlo','#dc2626');return;}
  const nombreEl=document.getElementById('esc-nombre');
  if(!nombreEl){toast('Error: recarga la página','#dc2626');return;}
  const nombre=nombreEl.value.trim();
  if(!nombre){toast('Escribe el nombre del plato','#dc2626');return;}
  try{
    const ingsWithLivePrice=_escIngs.map(ing=>({...ing,precioUnitario:escLivePrice(ing)}));
    const data={
      nombre,
      categoria:document.getElementById('esc-categoria')?.value||'Otros',
      restaurante:document.getElementById('esc-local')?.value||'global',
      precioVenta:parseFloat(document.getElementById('esc-pvp')?.value)||0,
      foodCostObjetivo:parseFloat(document.getElementById('esc-fcobj')?.value)||30,
      notas:document.getElementById('esc-notas')?.value.trim()||'',
      ingredientes:ingsWithLivePrice,
      updatedAt:Date.now()
    };
    const ref=_escEditId?fbDb.ref('escandallos/'+_escEditId):fbDb.ref('escandallos').push();
    if(!_escEditId) data.createdAt=Date.now();
    ref.set(data)
      .then(()=>{escCloseModal();toast('✅ Escandallo guardado','#16a34a');})
      .catch(e=>toast('Error al guardar: '+e.message,'#dc2626'));
  }catch(e){toast('Error: '+e.message,'#dc2626');console.error(e);}
}

function escExportExcel(){
  if(typeof XLSX==='undefined'){toast('Librería Excel no disponible','#dc2626');return;}
  const nombre=document.getElementById('esc-nombre')?.value.trim()||'Escandallo';
  const categoria=document.getElementById('esc-categoria')?.value||'';
  const pvp=parseFloat(document.getElementById('esc-pvp')?.value)||0;
  const fcObj=parseFloat(document.getElementById('esc-fcobj')?.value)||30;
  const coste=_escIngs.reduce((s,i)=>s+escCosteFactor(i),0);
  const fcReal=pvp>0?(coste/pvp*100):null;

  const rows=[['Ingrediente','Proveedor','Cantidad','Unidad','Merma %','Precio/u. €','Coste real €']];
  _escIngs.forEach(ing=>{
    rows.push([
      ing.nombre,
      ing.proveedorNombre||'Libre',
      ing.cantidad,
      ing.unidad,
      parseFloat(ing.merma)||0,
      escLivePrice(ing),
      +escCosteFactor(ing).toFixed(4)
    ]);
  });
  rows.push([]);
  rows.push(['','','','','Coste total',coste,'']);
  rows.push(['','','','','PVP',pvp,'']);
  rows.push(['','','','','Food cost %',fcReal!==null?+(fcReal.toFixed(2)):'','']);
  rows.push(['','','','','FC objetivo %',fcObj,'']);
  rows.push(['','','','','Margen €',pvp>0?+(pvp-coste).toFixed(4):0,'']);

  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Escandallo');
  XLSX.writeFile(wb,(nombre.replace(/[^a-zA-Z0-9áéíóúñÁÉÍÓÚÑ ]/g,'_'))+'.xlsx');
}

function escExportTodos(){
  if(typeof XLSX==='undefined'){toast('Librería Excel no disponible','#dc2626');return;}
  const todos=Object.values(_escAllData||{});
  if(!todos.length){toast('No hay escandallos guardados','#dc2626');return;}

  // Ordenar por nombre
  todos.sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));

  // Calcular coste con merma para cada escandallo
  function calcCoste(esc){
    return (esc.ingredientes||[]).reduce((s,ing)=>{
      // Precio vivo o guardado
      let p=parseFloat(ing.precioUnitario)||0;
      if(ing.proveedorId&&suppliers[ing.proveedorId]){
        const prod=(suppliers[ing.proveedorId].products||[]).find(x=>x.id===ing.productoId);
        if(prod) p=parseFloat(prod.price)||0;
      }
      const merma=parseFloat(ing.merma)||0;
      const factor=merma>0&&merma<100?1/(1-merma/100):1;
      return s+(parseFloat(ing.cantidad)||0)*p*factor;
    },0);
  }

  const ws_data=[
    ['PLATO','PRECIO COSTE + IVA','PRECIO VENTA OBJETIVO','%','PRECIO DE VENTA REAL','% REAL']
  ];
  todos.forEach((esc,i)=>{
    const row=i+2; // fila Excel (1 = cabecera)
    ws_data.push([
      esc.nombre||'',
      +calcCoste(esc).toFixed(4),
      {f:`B${row}*4`},       // precio objetivo (food cost 25%)
      {f:`B${row}/C${row}`}, // % food cost objetivo
      esc.precioVenta||0,
      {f:`IF(E${row}>0,B${row}/E${row},"")`} // % real
    ]);
  });

  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(ws_data);

  // Formato numérico para columnas %
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let r=1;r<=range.e.r;r++){
    const dCell=ws[XLSX.utils.encode_cell({r,c:3})]; // D
    const fCell=ws[XLSX.utils.encode_cell({r,c:5})]; // F
    if(dCell) dCell.z='0.00%';
    if(fCell) fCell.z='0.00%';
  }

  // Anchos de columna (en caracteres)
  ws['!cols']=[{wch:40},{wch:22},{wch:26},{wch:8},{wch:24},{wch:10}];

  XLSX.utils.book_append_sheet(wb,ws,'Escandallos');
  const fecha=new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb,`Escandallos_${fecha}.xlsx`);
  toast(`✅ ${todos.length} escandallos exportados`,'#16a34a');
}

function escDelete(){
  if(!_escEditId||!confirm('¿Eliminar este escandallo?')) return;
  fbDb.ref('escandallos/'+_escEditId).remove().then(()=>{escCloseModal();toast('Escandallo eliminado','#888');});
}

/* ── Copiar escandallo para un local específico ── */
function escCopiarParaLocal(id){
  if(!_escAllData[id]){toast('Escandallo no encontrado','#dc2626');return;}
  const e=_escAllData[id];
  // Mostrar selector de local
  const rests=cfg.users.map(u=>u.restaurant);
  const sel=prompt('¿Para qué local?\n'+rests.map((r,i)=>`${i+1}. ${r}`).join('\n')+'\n\nEscribe el número:');
  if(!sel) return;
  const idx=parseInt(sel)-1;
  if(isNaN(idx)||idx<0||idx>=rests.length){toast('Local no válido','#dc2626');return;}
  const rest=rests[idx];
  if(!confirm(`¿Crear una copia de "${e.nombre}" para ${rest}?\nPodrás editarla de forma independiente.`)) return;
  const copia={...JSON.parse(JSON.stringify(e)),restaurante:rest,baseId:id,nombre:e.nombre+' ('+rest+')',createdAt:Date.now(),updatedAt:Date.now()};
  delete copia.id;
  fbDb.ref('escandallos').push(copia).then(()=>toast(`✅ Copia creada para ${rest}`,'#16a34a')).catch(err=>toast('Error: '+err.message,'#dc2626'));
}

/* ═══════════════ MENÚS ═══════════════ */
function menRender(){
  const grid=document.getElementById('men-grid');
  if(!grid) return;
  const txt=(document.getElementById('men-search')?.value||'').toLowerCase();
  const local=document.getElementById('men-local-filter')?.value||'';
  const entries=Object.entries(_menAllData).filter(([,m])=>{
    return (!txt||m.nombre?.toLowerCase().includes(txt))&&(!local||m.restaurante===local||(m.restaurante||'global')==='global');
  }).sort((a,b)=>(a[1].nombre||'').localeCompare(b[1].nombre||'','es'));
  if(!entries.length){
    grid.innerHTML='<p style="color:var(--mut)">No hay menús. Crea el primero con "+ Nuevo menú".</p>';
    return;
  }
  grid.innerHTML=entries.map(([id,m])=>{
    const escs=(m.escandallos||[]).map(eid=>_escAllData[eid]).filter(Boolean);
    const costeTotal=escs.reduce((s,e)=>s+escCosteTotal(e),0);
    const pvp=parseFloat(m.pvp)||0;
    const fcReal=pvp>0?(costeTotal/pvp*100):null;
    const margen=pvp>0?(pvp-costeTotal):null;
    const rest=m.restaurante||'global';
    const restBadge=rest==='global'
      ?`<span style="font-size:10px;background:#dbeafe;color:#1d4ed8;border-radius:10px;padding:1px 7px;font-weight:700">🌐 Global</span>`
      :`<span style="font-size:10px;background:#f3e8ff;color:#7c3aed;border-radius:10px;padding:1px 7px;font-weight:700">🏪 ${rest}</span>`;
    const fcCls=fcReal===null?'esc-ok':fcReal>35?'esc-bad':fcReal>30?'esc-warn':'esc-ok';
    return `<div class="esc-card" onclick="menOpenModal('${id}')">
      <div class="esc-fc-ind ${fcCls}">${fcReal!==null?fcReal.toFixed(0)+'%':'—'}</div>
      <div style="margin-bottom:4px">${restBadge}</div>
      <h4>${m.nombre||'Sin nombre'}</h4>
      <div class="esc-stats">
        <div class="esc-stat"><span>Platos</span><strong>${escs.length}</strong></div>
        <div class="esc-stat"><span>Coste</span><strong>${escFmt(costeTotal)}</strong></div>
        <div class="esc-stat"><span>PVP</span><strong>${pvp>0?escFmt(pvp):'—'}</strong></div>
        <div class="esc-stat"><span>Margen</span><strong>${margen!==null?escFmt(margen):'—'}</strong></div>
      </div>
      ${m.notas?`<div style="margin-top:8px;font-size:12px;color:var(--mut)">${m.notas}</div>`:''}
    </div>`;
  }).join('');
}

function menOpenModal(id=null){
  _menEditId=id;
  document.getElementById('men-modal-title').textContent=id?'Editar menú':'Nuevo menú';
  document.getElementById('men-btn-del').style.display=id?'':'none';
  if(id&&_menAllData[id]){
    const m=_menAllData[id];
    document.getElementById('men-nombre').value=m.nombre||'';
    document.getElementById('men-local').value=m.restaurante||'global';
    document.getElementById('men-pvp').value=m.pvp||'';
    document.getElementById('men-notas').value=m.notas||'';
    _menEscIds=[...(m.escandallos||[])];
  } else {
    document.getElementById('men-nombre').value='';
    document.getElementById('men-local').value='global';
    document.getElementById('men-pvp').value='';
    document.getElementById('men-notas').value='';
    _menEscIds=[];
  }
  menRenderSelector();
  document.getElementById('men-modal-ov').style.display='flex';
}
function menCloseModal(){ document.getElementById('men-modal-ov').style.display='none'; _menEditId=null; _menEscIds=[]; }

function menRenderSelector(){
  const cont=document.getElementById('men-esc-selector');
  if(!cont) return;
  const escs=Object.entries(_escAllData).sort((a,b)=>(a[1].nombre||'').localeCompare(b[1].nombre||'','es'));
  if(!escs.length){cont.innerHTML='<p style="color:var(--mut);font-size:13px;grid-column:1/-1">No hay escandallos. Crea alguno primero.</p>';return;}
  cont.innerHTML=escs.map(([id,e])=>{
    const sel=_menEscIds.includes(id);
    const coste=escCosteTotal(e);
    const rest=e.restaurante||'global';
    const restTag=rest==='global'?'':`<span style="font-size:9px;color:#7c3aed">${rest}</span>`;
    return `<div style="display:flex;align-items:flex-start;gap:6px;padding:6px 8px;border:1.5px solid ${sel?'var(--pri)':'var(--brd)'};border-radius:7px;cursor:pointer;background:${sel?'rgba(26,26,46,.06)':'var(--card)'}" onclick="menToggleEsc('${id}')">
      <input type="checkbox" ${sel?'checked':''} style="margin-top:2px;pointer-events:none" readonly/>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:600">${e.nombre}</div>
        <div style="font-size:11px;color:var(--mut)">${escFmt(coste)} ${restTag}</div>
      </div>
    </div>`;
  }).join('');
  menUpdateCoste();
}
function menToggleEsc(id){
  const i=_menEscIds.indexOf(id);
  if(i>=0) _menEscIds.splice(i,1); else _menEscIds.push(id);
  menRenderSelector();
}
function menUpdateCoste(){
  const total=_menEscIds.reduce((s,id)=>{
    const e=_escAllData[id];
    return e?s+escCosteTotal(e):s;
  },0);
  const el=document.getElementById('men-coste-total');
  if(el) el.textContent=escFmt(total);
}
function menSave(){
  if(!fbDb){toast('Sin conexión Firebase','#dc2626');return;}
  const nombre=(document.getElementById('men-nombre')?.value||'').trim();
  if(!nombre){toast('Escribe el nombre del menú','#dc2626');return;}
  const data={
    nombre,
    restaurante:document.getElementById('men-local')?.value||'global',
    pvp:parseFloat(document.getElementById('men-pvp')?.value)||0,
    notas:document.getElementById('men-notas')?.value.trim()||'',
    escandallos:[..._menEscIds],
    updatedAt:Date.now()
  };
  const ref=_menEditId?fbDb.ref('menus/'+_menEditId):fbDb.ref('menus').push();
  if(!_menEditId) data.createdAt=Date.now();
  ref.set(data).then(()=>{menCloseModal();toast('✅ Menú guardado','#16a34a');}).catch(e=>toast('Error: '+e.message,'#dc2626'));
}
function menDelete(){
  if(!_menEditId||!confirm('¿Eliminar este menú?')) return;
  fbDb.ref('menus/'+_menEditId).remove().then(()=>{menCloseModal();toast('Menú eliminado','#888');});
}

/* ═══════════════ VISTA LOCAL — ESCANDALLOS (read-only) ═══════════════ */
function vLocalEscandallos(){
  const rest=S.session.restaurant||'';
  // El local ve: sus propios escandallos + los globales (si no tiene copia propia del mismo baseId)
  const myEscs=Object.entries(_escAllData).filter(([,e])=>{
    const r=e.restaurante||'global';
    return r==='global'||r===rest;
  });
  // Para globales, si hay una copia local, mostrar solo la copia
  const baseIds=new Set(myEscs.filter(([,e])=>e.baseId&&e.restaurante===rest).map(([,e])=>e.baseId));
  const visible=myEscs.filter(([id,e])=>!(e.restaurante==='global'&&baseIds.has(id)));

  const myMenus=Object.entries(_menAllData).filter(([,m])=>{
    const r=m.restaurante||'global';
    return r==='global'||r===rest;
  });

  let html='<div class="card"><div class="card-t">Mis escandallos</div>';
  if(!visible.length){
    html+='<div style="color:var(--mut);font-size:13px;text-align:center;padding:16px">Aún no tienes escandallos asignados</div>';
  } else {
    html+=visible.map(([,e])=>{
      const coste=escCosteTotal(e);
      const pvp=parseFloat(e.precioVenta)||0;
      const fcReal=pvp>0?(coste/pvp*100):null;
      const margen=pvp>0?(pvp-coste):null;
      const fcCls=fcReal===null?'':fcReal>35?'color:#dc2626':fcReal>30?'color:#d97706':'color:#16a34a';
      return `<div style="border:1.5px solid var(--brd);border-radius:10px;padding:12px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="font-weight:700">${e.nombre||'Sin nombre'}</div>
          <span class="badge" style="background:#f3f4f6;color:var(--txt)">${e.categoria||'Otros'}</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;text-align:center">
          <div><div style="color:var(--mut)">Coste</div><div style="font-weight:700">${escFmt(coste)}</div></div>
          <div><div style="color:var(--mut)">PVP</div><div style="font-weight:700">${pvp>0?escFmt(pvp):'—'}</div></div>
          <div><div style="color:var(--mut)">Food cost</div><div style="font-weight:700;${fcCls}">${fcReal!==null?fcReal.toFixed(1)+'%':'—'}</div></div>
        </div>
        ${margen!==null?`<div style="text-align:right;font-size:12px;margin-top:6px;color:var(--mut)">Margen: <strong style="color:var(--txt)">${escFmt(margen)}</strong></div>`:''}
        ${e.notas?`<div style="margin-top:6px;font-size:12px;color:var(--mut)">📝 ${e.notas}</div>`:''}
      </div>`;
    }).join('');
  }
  html+='</div>';

  if(myMenus.length){
    html+='<div class="card"><div class="card-t">Mis menús</div>';
    html+=myMenus.map(([,m])=>{
      const escs=(m.escandallos||[]).map(eid=>_escAllData[eid]).filter(Boolean);
      const costeTotal=escs.reduce((s,e)=>s+escCosteTotal(e),0);
      const pvp=parseFloat(m.pvp)||0;
      const margen=pvp>0?(pvp-costeTotal):null;
      return `<div style="border:1.5px solid var(--brd);border-radius:10px;padding:12px;margin-bottom:8px">
        <div style="font-weight:700;margin-bottom:8px">${m.nombre}</div>
        <div style="font-size:12px;color:var(--mut);margin-bottom:6px">${escs.map(e=>e.nombre).join(' · ')}</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;text-align:center">
          <div><div style="color:var(--mut)">Coste</div><div style="font-weight:700">${escFmt(costeTotal)}</div></div>
          <div><div style="color:var(--mut)">PVP</div><div style="font-weight:700">${pvp>0?escFmt(pvp):'—'}</div></div>
          <div><div style="color:var(--mut)">Margen</div><div style="font-weight:700">${margen!==null?escFmt(margen):'—'}</div></div>
        </div>
        ${m.notas?`<div style="margin-top:6px;font-size:12px;color:var(--mut)">📝 ${m.notas}</div>`:''}
      </div>`;
    }).join('');
    html+='</div>';
  }
  return html;
}

function escFmt(v){ return parseFloat(v||0).toFixed(2).replace('.',',')+' €'; }



/* ═══════════════ RECETAS ═══════════════ */

const REC_TIPOS=['Principal','Entrante','Guarnición','Postre','Bebida','Otro'];

function vRecetas(){
  const recs=Object.values(_recAllData).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  const cards=recs.length?recs.map(r=>{

      <h4>${r.nombre||'Sin nombre'}</h4>
      <span class="rec-partida">${r.partida||''} ${r.tipo?'· '+r.tipo:''}</span>
      <div style="font-size:12px;color:var(--mut)">${secCount} sección${secCount!==1?'es':''}</div>
      ${meses?`<div class="rec-meses">${meses}</div>`:''}
    </div>`;
  }).join(''):`<p style="color:var(--mut);grid-column:1/-1">Aún no hay recetas — crea la primera con el botón</p>`;
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div style="font-size:18px;font-weight:800;color:var(--pri)">📋 Recetas</div>

    <div class="rec-modal-box">
      <div class="rec-modal-hd">
        <h3 id="rec-modal-title">Nueva receta</h3>
        <button class="btn btn-ghost btn-sm" onclick="recCloseModal()">✕</button>
      </div>
      <div class="rec-modal-body" id="rec-modal-body"></div>
      <div class="rec-modal-ft">
        <button class="btn btn-no btn-sm" id="rec-btn-del" style="display:none" onclick="recDelete()">🗑 Eliminar</button>
        <div class="rec-modal-ft-r">
          <button class="btn btn-ghost btn-sm" id="rec-btn-pdf" onclick="recExportPDF()">📄 Exportar PDF</button>
          <button class="btn btn-ghost btn-sm" onclick="recCloseModal()">Cancelar</button>

}

function recModalHTML(){
  const r=_recData;
  const mesesHTML=REC_MESES.map(m=>{
    const on=(r.temporada||[]).includes(m);
    return `<button type="button" class="rec-mes${on?' on':''}" style="cursor:pointer;border:1.5px solid ${on?'var(--pri)':'var(--brd)'};padding:3px 7px;border-radius:5px;font-size:11px;font-weight:700;background:${on?'var(--pri)':'var(--card)'};color:${on?'#fff':'var(--mut)'}" onclick="recToggleMes('${m}')">${m}</button>`;
  }).join('');
  const seccionesHTML=(r.secciones||[]).map((sec,si)=>recSeccionHTML(sec,si)).join('');
  return `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="fg" style="grid-column:1/3">
      <label>Nombre del plato</label>
      <input id="rec-nombre" type="text" value="${r.nombre||''}" placeholder="Ej: Escudella tradicional"/>
    </div>
    <div class="fg">
      <label>Partida</label>
      <select id="rec-partida">${REC_PARTIDAS.map(p=>`<option${r.partida===p?' selected':''}>${p}</option>`).join('')}</select>
    </div>
    <div class="fg">
      <label>Tipo</label>
      <select id="rec-tipo">${REC_TIPOS.map(t=>`<option${r.tipo===t?' selected':''}>${t}</option>`).join('')}</select>
    </div>
  </div>
  <div class="fg">
    <label>Temporada</label>
    <div style="display:flex;gap:5px;flex-wrap:wrap">${mesesHTML}</div>
  </div>
  <div>
    <div style="font-size:13px;font-weight:700;color:var(--pri);margin-bottom:10px">Secciones de ingredientes</div>
    <div id="rec-secciones">${seccionesHTML}</div>
    <button class="btn btn-ghost btn-sm" onclick="recAddSeccion()" style="margin-top:8px">+ Añadir sección</button>
  </div>`;
}

function recSeccionHTML(sec,si){
  const ings=(sec.ingredientes||[]).map((ing,ii)=>`
    <div class="rec-ing-row" id="rec-ing-${si}-${ii}">
      <input type="number" value="${ing.cantidad||''}" placeholder="Cant." min="0" step="0.001" style="padding:5px 7px;border:1.5px solid var(--brd);border-radius:6px;font-size:12px;background:var(--card);color:var(--txt)" oninput="_recData.secciones[${si}].ingredientes[${ii}].cantidad=parseFloat(this.value)||0"/>
      <input type="text" value="${ing.unidad||''}" placeholder="Ud." style="padding:5px 7px;border:1.5px solid var(--brd);border-radius:6px;font-size:12px;background:var(--card);color:var(--txt)" oninput="_recData.secciones[${si}].ingredientes[${ii}].unidad=this.value"/>

      <input type="text" value="${ing.nota||''}" placeholder="Nota prep." style="padding:5px 7px;border:1.5px solid var(--brd);border-radius:6px;font-size:12px;background:var(--card);color:var(--txt);font-style:italic" oninput="_recData.secciones[${si}].ingredientes[${ii}].nota=this.value"/>
      <button onclick="recDelIng(${si},${ii})" style="border:none;background:none;color:#dc2626;cursor:pointer;font-size:14px;padding:4px">✕</button>
    </div>`).join('');
  const pasos=(sec.pasos||[]).map((p,pi)=>`

      <span class="rec-paso-num">${pi+1}</span>
      <input type="text" value="${p||''}" placeholder="Paso ${pi+1}..." style="flex:1;padding:6px 9px;border:1.5px solid var(--brd);border-radius:6px;font-size:13px;background:var(--card);color:var(--txt)" oninput="_recData.secciones[${si}].pasos[${pi}]=this.value"/>
      <button onclick="recDelPaso(${si},${pi})" style="border:none;background:none;color:#dc2626;cursor:pointer;font-size:14px;padding:4px;margin-top:4px">✕</button>
    </div>`).join('');
  return `<div class="rec-seccion" id="rec-sec-${si}">
    <div class="rec-seccion-hd">
      <input type="text" value="${sec.titulo||''}" placeholder="Título sección (ej: Para 15 Lt de ESCUDELLA)" style="flex:1;padding:5px 8px;border:1.5px solid var(--brd);border-radius:7px;font-size:13px;font-weight:700;background:var(--card);color:var(--pri)" oninput="_recData.secciones[${si}].titulo=this.value"/>
      <button onclick="recDelSeccion(${si})" style="border:none;background:none;color:#dc2626;cursor:pointer;font-size:14px;margin-left:8px">✕</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--mut);margin-bottom:6px;text-transform:uppercase">Ingredientes</div>
        <div id="rec-ings-${si}">${ings}</div>
        <button class="btn btn-ghost btn-sm" onclick="recAddIng(${si})" style="margin-top:4px;font-size:11px">+ Ingrediente</button>
      </div>
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--mut);margin-bottom:6px;text-transform:uppercase">Elaboración</div>
        <div id="rec-pasos-${si}">${pasos}</div>
        <button class="btn btn-ghost btn-sm" onclick="recAddPaso(${si})" style="margin-top:4px;font-size:11px">+ Paso</button>
      </div>
    </div>
  </div>`;
}

  _recEditId=id;

    _recData=JSON.parse(JSON.stringify(_recAllData[id]));
  } else {
    _recData={nombre:'',partida:'Calientes',tipo:'Principal',temporada:[],secciones:[{titulo:'',ingredientes:[],pasos:[]}]};

  document.getElementById('rec-modal-title').textContent=id?'Editar receta':'Nueva receta';

function recToggleMes(m){
  if(!_recData.temporada) _recData.temporada=[];
  const i=_recData.temporada.indexOf(m);

function recAddSeccion(){
  _recData.secciones.push({titulo:'',ingredientes:[],pasos:[]});
  document.getElementById('rec-secciones').innerHTML=(_recData.secciones||[]).map((s,i)=>recSeccionHTML(s,i)).join('');

function recDelSeccion(si){
  _recData.secciones.splice(si,1);
  document.getElementById('rec-secciones').innerHTML=(_recData.secciones||[]).map((s,i)=>recSeccionHTML(s,i)).join('');
}

function recAddIng(si){
  if(!_recData.secciones[si].ingredientes) _recData.secciones[si].ingredientes=[];
  _recData.secciones[si].ingredientes.push({cantidad:'',unidad:'gr',nombre:'',nota:''});
  document.getElementById('rec-secciones').innerHTML=(_recData.secciones||[]).map((s,i)=>recSeccionHTML(s,i)).join('');

function recDelIng(si,ii){

function recSave(){
  if(!fbDb){toast('Sin conexión Firebase','#dc2626');return;}
  const nombre=document.getElementById('rec-nombre')?.value.trim();
  if(!nombre){toast('Escribe el nombre del plato','#dc2626');return;}
  _recData.nombre=nombre;
  _recData.partida=document.getElementById('rec-partida')?.value||'Calientes';
  _recData.tipo=document.getElementById('rec-tipo')?.value||'Principal';
  _recData.updatedAt=Date.now();
  const ref=_recEditId?fbDb.ref('recetas/'+_recEditId):fbDb.ref('recetas').push();
  if(!_recEditId) _recData.createdAt=Date.now();
  ref.set(_recData)
    .then(()=>{recCloseModal();toast('✅ Receta guardada','#16a34a');})
    .catch(e=>toast('Error al guardar: '+e.message,'#dc2626'));
}

function recDelete(){
  if(!_recEditId||!confirm('¿Eliminar esta receta?')) return;
  fbDb.ref('recetas/'+_recEditId).remove().then(()=>{recCloseModal();toast('Receta eliminada','#888');});
}

/* ═══════════════ BUDGET TREND CHART ═══════════════ */
function renderBudgetTrendChart(){
  const canvas=document.getElementById('budget-trend-chart');
  if(!canvas) return;
  if(window._budgetTrendChart){window._budgetTrendChart.destroy();window._budgetTrendChart=null;}
  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push(d.toISOString().slice(0,7));
  }
  const labels=months.map(m=>{const[y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('es',{month:'short',year:'2-digit'});});
  const spendData=months.map(m=>{
    const fromOrders=orders.filter(o=>(o.status==='approved'||o.status==='received')&&(o.createdAt||'').startsWith(m)).reduce((s,o)=>s+total(o),0);
    const fromExtra=Object.values(extraExpenses).filter(ex=>(ex.date||ex.createdAt||'').startsWith(m)).reduce((s,ex)=>s+(parseFloat(ex.amount)||0),0);
    return fromOrders+fromExtra;
  });
  const budgetData=months.map(m=>{
    return cfg.users.reduce((s,u)=>s+(budgets[u.id+'_'+m]||0),0);
  });
  window._budgetTrendChart=new Chart(canvas,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Gasto real',data:spendData,backgroundColor:'#e9456099',borderColor:'#e94560',borderWidth:1.5,borderRadius:4},
        {label:'Presupuesto',data:budgetData,backgroundColor:'#1a1a2e33',borderColor:'#1a1a2e',borderWidth:1.5,borderRadius:4,type:'line',fill:false,tension:0.3,pointRadius:4}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}}},scales:{y:{ticks:{callback:v=>'€'+v.toLocaleString('es')},grid:{color:'#f0f0f0'}},x:{grid:{display:false}}}}
  });
}

/* ═══════════════ HISTORIAL POR PROVEEDOR ═══════════════ */
function vSupHistory(){
  const supIds=Object.keys(suppliers);
  if(!supIds.length) return `<div class="empty"><div class="ei">📦</div><div class="et">Sin proveedores</div></div>`;
  const rows=supIds.map(sid=>{
    const sup=suppliers[sid];
    const supOrders=orders.filter(o=>(o.status==='approved'||o.status==='received')&&o.supId===sid);
    if(!supOrders.length) return '';
    const totalSpend=supOrders.reduce((s,o)=>s+total(o),0);
    const lastOrder=supOrders.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0];
    const prodMap={};
    supOrders.forEach(o=>(o.items||[]).forEach(it=>{
      if(!prodMap[it.id])prodMap[it.id]={name:it.name,unit:it.unit,qty:0,spend:0,count:0};
      prodMap[it.id].qty+=it.qty;prodMap[it.id].spend+=(it.qty||0)*(it.price||0);prodMap[it.id].count++;
    }));
    const topProds=Object.values(prodMap).sort((a,b)=>b.spend-a.spend).slice(0,5);
    const prodRows=topProds.map(p=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--brd)"><span>${p.name}</span><span style="color:var(--mut)">${p.qty.toFixed(1)} ${p.unit} · ${fmt(p.spend)}</span></div>`).join('');
    return `<div class="card" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div style="font-size:24px">${sup.emoji||'📦'}</div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:15px">${sup.name}</div>
          <div style="font-size:12px;color:var(--mut)">${supOrders.length} pedidos · Último: ${fmtD(lastOrder.createdAt)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:700;color:var(--pri)">${fmt(totalSpend)}</div>
          <div style="font-size:11px;color:var(--mut)">total comprado</div>
        </div>
      </div>
      <div class="sh" style="font-size:11px;margin-bottom:4px">TOP PRODUCTOS</div>
      ${prodRows||'<div style="font-size:12px;color:var(--mut)">Sin datos</div>'}
    </div>`;
  }).filter(Boolean).join('');
  if(!rows) return `<div class="empty"><div class="ei">📦</div><div class="et">Sin historial de compras aún</div></div>`;
  const totalAll=orders.filter(o=>o.status==='approved'||o.status==='received').reduce((s,o)=>s+total(o),0);
  return `<div style="font-size:13px;color:var(--mut);margin-bottom:12px">Total comprado a todos los proveedores: <strong>${fmt(totalAll)}</strong></div>`+rows;
}

function addMissingSuppliers(){
  if(!fbDb) return;
  fbDb.ref('suppliers').once('value', snap=>{
    const existing = snap.val() || {};
    const updates = {};
    Object.entries(NEW_SUPPLIERS).forEach(([id, sup])=>{
      if(!existing[id]) updates[id] = sup;
    });
    if(Object.keys(updates).length > 0){
      fbDb.ref('suppliers').update(updates).then(()=>{
        toast('✅ Nuevos proveedores añadidos: '+Object.keys(updates).map(k=>NEW_SUPPLIERS[k].name).join(', '),'#16a34a');
      });
    }
  });
}

function updateCoreSuppliers(){
  if(!fbDb) return;
  fbDb.ref('suppliers').once('value', snap=>{
    const existing = snap.val() || {};
    const updates = {};
    // Always update bencar to latest Excel prices
    updates['bencar'] = DEFAULT_SUPS['bencar'];
    // Update ismael if products missing or wrong prefix
    const curIsmael = existing['ismael'];
    const defIsmael = DEFAULT_SUPS['ismael'];
    if(!curIsmael || !curIsmael.products || !curIsmael.products[0] || !String(curIsmael.products[0].id).startsWith('ix')){
      updates['ismael'] = defIsmael;
    }
    if(Object.keys(updates).length > 0){
      fbDb.ref('suppliers').update(updates).then(()=>{
        toast('✅ Tarifas de Bencar e Ismael actualizadas','#16a34a');
      });
    }
  });
}

/* ═══════════════ ADMIN ACCOUNT SETUP ═══════════════ */
function initAdminAccount(){
  if(!fbAuth||!fbDb) return;
  // Si ya se creó en esta sesión, no repetir
  if(localStorage.getItem('oc_admin_init')==='1') return;
  const adminEmail=cfg.adminEmail||'josue.funte@gmail.com';
  fbAuth.createUserWithEmailAndPassword(adminEmail,'Josue1998')
    .then(cred=>{
      const uid=cred.user.uid;
      fbDb.ref('authUsers/'+uid).set({
        uid, email:adminEmail, name:cfg.adminName||'Josué',
        isAdmin:true, status:'approved', createdAt:new Date().toISOString()
      }).then(()=>{
        localStorage.setItem('oc_admin_init','1');
        // Cerrar sesión inmediatamente — el admin iniciará sesión de forma normal
        fbAuth.signOut().catch(()=>{});
      });
    })
    .catch(e=>{
      // Ya existe → simplemente marcar como inicializado
      // No hacemos signIn en segundo plano para evitar interferencias con la sesión
      if(e.code==='auth/email-already-in-use'){
        localStorage.setItem('oc_admin_init','1');
      }
    });
}

/* ═══════════════ INIT ═══════════════ */
window.addEventListener('DOMContentLoaded',()=>{
  try {
    fbApp = firebase.initializeApp(FB_CONFIG);
    fbDb  = firebase.database();
    fbAuth= firebase.auth();
  } catch(e) {
    console.warn('Firebase init error:', e);
  }
  // Si Firebase no se cargó (CDN lenta/caída), reintentar en 3 s
  if(!fbAuth){
    setTimeout(()=>{
      if(!fbAuth && typeof firebase !== 'undefined'){
        try{ fbApp=firebase.initializeApp(FB_CONFIG); fbDb=firebase.database(); fbAuth=firebase.auth(); initFirebaseListeners(); initAdminAccount(); }catch(e){}
        // Re-renderizar para quitar el spinner de "Conectando"
        if(S.view==='login') render();
      }
    },3000);
  }
  if(S.darkMode) document.body.classList.add('dark');
  // PWA manifest injection
  const manifest={name:"O'Carro Pedidos",short_name:"O'Carro",start_url:window.location.href,display:"standalone",background_color:"#f0f2f5",theme_color:"#1a1a2e",icons:[{src:"https://raw.githubusercontent.com/twitter/twemoji/master/assets/svg/1f6d2.svg",sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const mUrl=URL.createObjectURL(mBlob);
  document.getElementById('pwa-manifest').href=mUrl;
  if('serviceWorker' in navigator){
    const sw=`self.addEventListener('fetch',e=>{});`;
    const swBlob=new Blob([sw],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob),{type:'classic'}).catch(()=>{});
  }
  initFirebaseListeners();
  addMissingSuppliers();
  updateCoreSuppliers();
  initAdminAccount(); // Crea / verifica la cuenta de admin en Firebase Auth

  // ── Firebase Auth: siempre registrar onAuthStateChanged ──
  // (debe registrarse ANTES de restaurar sesión admin para capturar logins de restaurantes)
  if(fbAuth){
    fbAuth.onAuthStateChanged(user=>{
      if(S.session?.isAdmin) return; // admin activo vía localStorage, ignorar
      if(user){
        fbDb.ref('authUsers/'+user.uid).once('value',snap=>{
          const u=snap.val();
          const isAdminUser=(user.email && user.email.toLowerCase()===(cfg.adminEmail||'josue.funte@gmail.com').toLowerCase()) || (u && u.isAdmin===true);
          if(isAdminUser){ goAdmin(); return; }
          if(u && u.status==='approved'){
            const myRests=u.restaurants||[u.restaurant];
            S.session={uid:user.uid,email:user.email,name:u.name||u.restaurant,restaurant:myRests[0]||u.restaurant,restaurants:myRests,isAdmin:false,needsApproval:u.needsApproval!==false};
            showHdr(false);
            S.view='order';
            const sl=visibleSups(); if(sl.length) S.supId=sl[0].id;
            render();
          } else if(u && (u.status==='pending'||u.status==='rejected')){
            S.session={uid:user.uid,email:user.email,pendingStatus:u.status};
            document.getElementById('hdr').style.display='none';
            S.view='pending-approval';
            render();
          } else {
            S.view='login'; render();
          }
        });
      } else {
        if(!S.session){ S.view='login'; render(); }
      }
    });
  }

  // ── Restaurar sesión de administrador (localStorage) ──
  if(localStorage.getItem('oc_admin_session')==='1'){
    S.session={isAdmin:true,name:cfg.adminName};
    showHdr(true);
    S.view='admin';
    render();
  } else if(!fbAuth){
    render(); // Firebase no disponible → mostrar login
  }
});
</script>
</body>
</html>
