function showCropUI(){
  S.albCropping=true;
  render();
  setTimeout(initCropCanvas,80);
}
function cancelCrop(){ S.albCropping=false; render(); }
function initCropCanvas(){
  const canvas=document.getElementById('crop-canvas');
  if(!canvas)return;
  const img=new Image();
  img.src=S.albPhoto;
  img.onload=()=>{
    const maxW=canvas.parentElement.clientWidth-4;
    const scale=Math.min(1,maxW/img.naturalWidth);
    canvas.width=img.naturalWidth*scale;
    canvas.height=img.naturalHeight*scale;
    canvas._scale=scale; canvas._img=img;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    cropState={dragging:false,startX:0,startY:0,endX:0,endY:0};
    const pos=(e)=>{
      const r=canvas.getBoundingClientRect();
      const t=e.touches?e.touches[0]:e;
      return{x:Math.max(0,Math.min(canvas.width,t.clientX-r.left)),y:Math.max(0,Math.min(canvas.height,t.clientY-r.top))};
    };
    canvas.onmousedown=canvas.ontouchstart=(e)=>{e.preventDefault();const p=pos(e);cropState={dragging:true,startX:p.x,startY:p.y,endX:p.x,endY:p.y};};
    canvas.onmousemove=canvas.ontouchmove=(e)=>{if(!cropState.dragging)return;e.preventDefault();const p=pos(e);cropState.endX=p.x;cropState.endY=p.y;drawOverlay(ctx,img,canvas.width,canvas.height);};
    canvas.onmouseup=canvas.ontouchend=()=>{cropState.dragging=false;};
  };
}
function drawOverlay(ctx,img,w,h){
  ctx.drawImage(img,0,0,w,h);
  const x1=Math.min(cropState.startX,cropState.endX),y1=Math.min(cropState.startY,cropState.endY);
  const x2=Math.max(cropState.startX,cropState.endX),y2=Math.max(cropState.startY,cropState.endY);
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillRect(0,0,w,h);
  if(x2>x1&&y2>y1){
    ctx.clearRect(x1,y1,x2-x1,y2-y1);
    ctx.drawImage(img,x1,y1,x2-x1,y2-y1,x1,y1,x2-x1,y2-y1);
    ctx.strokeStyle='#e94560';ctx.lineWidth=2;
    ctx.strokeRect(x1,y1,x2-x1,y2-y1);
  }
}
function applyCrop(){
  const canvas=document.getElementById('crop-canvas');
  if(!canvas){toast('Error al recortar','#dc2626');return;}
  const sc=canvas._scale||1;
  const x1=Math.min(cropState.startX,cropState.endX),y1=Math.min(cropState.startY,cropState.endY);
  const w=Math.abs(cropState.endX-cropState.startX),h=Math.abs(cropState.endY-cropState.startY);
  if(w<20||h<20){toast('Selecciona un área más grande arrastrando','#dc2626');return;}
  const out=document.createElement('canvas');
  out.width=Math.round(w/sc); out.height=Math.round(h/sc);
  out.getContext('2d').drawImage(canvas._img,x1/sc,y1/sc,w/sc,h/sc,0,0,out.width,out.height);
  S.albPhoto=out.toDataURL('image/jpeg',0.95);
  S.albCropping=false;
  render();
  toast(' Recorte aplicado — ahora pulsa Reconocer','#16a34a');
}

function handleAlbPhoto(input){
  const file=input.files[0];if(!file)return;
  const nameLow=file.name.toLowerCase();
  // Excel / CSV → parseo automático
  if(nameLow.endsWith('.xlsx')||nameLow.endsWith('.xls')||nameLow.endsWith('.csv')){
    handleAlbExcel(file);return;
  }
  // Imagen o PDF → base64 para Gemini/OCR
  const reader=new FileReader();
  reader.onload=e=>{
    S.albPhoto=e.target.result;
    S.albFileName=file.name;
    S.albFileType=file.type.startsWith('image')?'image':'pdf';
    render();
  };
  reader.readAsDataURL(file);
}

async function handleAlbExcel(file){
  try{
    if(!window.XLSX){
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        s.onload=res;s.onerror=rej;document.head.appendChild(s);
      });
    }
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(!rows.length){toast('El archivo está vacío o no tiene filas con datos','#d97706');return;}
    const sample=rows[0];
    const findKey=(candidates)=>{
      for(const c of candidates){
        const k=Object.keys(sample).find(k=>k.toLowerCase().includes(c));
        if(k)return k;
      }
      return null;
    };
    const nameKey=findKey(['nombre','name','product','producto','artículo','articulo','descripci']);
    const qtyKey=findKey(['cantidad','qty','quantity','unidades','bultos','cajas','cant']);
    const unitKey=findKey(['unidad','unit','ud.','ud ','tipo']);
    const priceKey=findKey(['precio','price','importe','pvp','coste','costo']);
    if(!nameKey){toast('No se encontró columna de nombre de producto. Comprueba los encabezados del Excel.','#dc2626');return;}
    const parsed=rows.map(r=>({
      code:'',
      name:String(r[nameKey]||'').trim(),
      unit:unitKey?String(r[unitKey]||'KG').trim():'KG',
      qty:parseFloat(String(r[qtyKey]||'1').replace(',','.'))||1,
      price:parseFloat(String(r[priceKey]||'0').replace(',','.'))||0
    })).filter(r=>r.name);
    if(parsed.length){
      S.albItems=[...S.albItems,...parsed];
      toast(`${parsed.length} productos importados desde Excel. Revisa y corrige si es necesario.`,'#16a34a');
      render();
    } else {
      toast('No se encontraron filas con nombre de producto.','#d97706');
    }
  }catch(e){
    console.error(e);
    toast('Error al leer el Excel: '+e.message,'#dc2626');
  }
}
function albAddItem(){ S.albItems.push({code:'',name:'',unit:'KG',qty:1,price:0});render(); }

async function runOCR(){
  if(!S.albPhoto){toast('Añade una foto primero','#dc2626');return;}
  const mistralKey=cfg.mistralKey||'';
  const prog=document.getElementById('ocr-progress');

  // --- Mistral OCR (principal) ---
  if(mistralKey){
    if(prog){prog.style.display='block';prog.textContent='Leyendo documento con Mistral OCR...';}
    try{
      // Paso 1: extraer texto con Mistral OCR
      const isPdf=S.albFileType==='pdf';
      const mediaType=isPdf?'application/pdf':(S.albPhoto.match(/data:([^;]+)/)||[])[1]||'image/jpeg';
      const base64=S.albPhoto.replace(/^data:[^;]+;base64,/,'');
      const ocrBody={
        model:'mistral-ocr-latest',
        document: isPdf
          ? {type:'document_url', document_url:`data:${mediaType};base64,${base64}`}
          : {type:'image_url',    image_url:`data:${mediaType};base64,${base64}`},
        table_format:'markdown'
      };
      if(prog) prog.textContent='Paso 1/2 — leyendo texto del albarán...';
      const ocrResp=await fetch('https://api.mistral.ai/v1/ocr',{
        method:'POST',
        headers:{'Authorization':'Bearer '+mistralKey,'Content-Type':'application/json'},
        body:JSON.stringify(ocrBody)
      });
      if(!ocrResp.ok){
        const err=await ocrResp.json().catch(()=>({}));
        throw new Error(err?.message||'Error Mistral OCR ('+ocrResp.status+')');
      }
      const ocrData=await ocrResp.json();
      const markdown=(ocrData.pages||[]).map(p=>p.markdown||'').join('\n');
      if(!markdown.trim()){toast('No se reconoció texto. Prueba con foto más clara.','#d97706');return;}

      // Paso 2: extraer productos estructurados con mistral-small
      if(prog) prog.textContent='Paso 2/2 — extrayendo productos...';
      const chatBody={
        model:'mistral-small-latest',
        messages:[{
          role:'user',
          content:`Eres un asistente que extrae líneas de productos de albaranes de proveedor.
Del siguiente texto OCR de un albarán, extrae TODOS los productos con su nombre, cantidad, unidad y precio unitario.
Responde ÚNICAMENTE con un JSON array, sin texto adicional:
[{"code":"12345","name":"Entrecot","qty":5,"unit":"KG","price":18.50}]
- code: código del artículo si aparece, si no ""
- name: nombre del producto (sin códigos ni referencias)
- qty: cantidad numérica
- unit: "KG", "UN", "L", "Caja" o "Bote" según corresponda
- price: precio unitario en €

Ignora líneas de totales, IVA, cabeceras, direcciones o textos que no sean productos.

TEXTO DEL ALBARÁN:
${markdown}`
        }],
        response_format:{type:'json_object'}
      };
      const chatResp=await fetch('https://api.mistral.ai/v1/chat/completions',{
        method:'POST',
        headers:{'Authorization':'Bearer '+mistralKey,'Content-Type':'application/json'},
        body:JSON.stringify(chatBody)
      });
      if(!chatResp.ok){
        const err=await chatResp.json().catch(()=>({}));
        throw new Error(err?.message||'Error Mistral chat ('+chatResp.status+')');
      }
      const chatData=await chatResp.json();
      let parsed=[];
      try{
        const raw=chatData.choices?.[0]?.message?.content||'[]';
        const obj=JSON.parse(raw);
        // El modelo puede devolver {items:[...]} o directamente [...]
        const arr=Array.isArray(obj)?obj:(obj.items||obj.products||obj.lineas||Object.values(obj).find(v=>Array.isArray(v))||[]);
        parsed=arr.filter(it=>it.name&&it.qty>0).map(it=>({
          code:String(it.code||''),
          name:String(it.name).slice(0,60),
          qty:Math.round(parseFloat(it.qty)*100)/100,
          unit:it.unit||'UN',
          price:Math.round(parseFloat(it.price||0)*100)/100
        }));
      }catch(e){ console.warn('Parse error:',e); }

      if(parsed.length>0){
        S.albItems=[...S.albItems,...parsed];
        toast(`${parsed.length} producto${parsed.length!==1?'s':''} reconocido${parsed.length!==1?'s':''}. Revisa y corrige.`,'#16a34a');
      } else {
        toast('No se identificaron productos. Revisa la foto o añade manualmente.','#d97706');
      }
    }catch(e){
      console.error(e);
      toast('Error Mistral OCR: '+e.message,'#dc2626',5000);
    }finally{
      if(prog)prog.style.display='none';render();
    }
    return;
  }

  // --- Fallback: OCR.space (si no hay clave Mistral) ---
  const apiKey=cfg.ocrSpaceKey||'helloworld';
  if(prog){prog.style.display='block';prog.textContent='Reconociendo texto...';}
  try{
    const formData=new FormData();
    formData.append('base64Image', S.albPhoto);
    formData.append('language','spa');
    formData.append('OCREngine','2');
    formData.append('isTable','true');
    formData.append('scale','true');
    formData.append('detectOrientation','true');
    if(S.albFileType==='pdf') formData.append('filetype','PDF');
    const resp=await fetch('https://api.ocr.space/parse/image',{
      method:'POST',
      headers:{'apikey': apiKey},
      body:formData
    });
    const data=await resp.json();
    if(data.IsErroredOnProcessing||data.OCRExitCode===99){
      const msg=data.ErrorMessage?.[0]||'Error OCR';
      if(msg.includes('Limit')||msg.includes('apikey')||apiKey==='helloworld'){
        toast('Configura tu API key de Mistral en Configuración para mejor OCR','#d97706',7000);
      } else {
        toast('Error OCR: '+msg,'#dc2626');
      }
      return;
    }
    const text=(data.ParsedResults||[]).map(r=>r.ParsedText||'').join('\n');
    if(!text.trim()){toast('No se reconoció texto. Prueba con foto más clara.','#d97706');return;}
    const parsed=parseOCRText(text);
    if(parsed.length>0){
      S.albItems=[...S.albItems,...parsed];
      toast(`${parsed.length} producto${parsed.length!==1?'s':''} reconocido${parsed.length!==1?'s':''}. Revisa y corrige.`,'#16a34a');
    } else {
      toast('No se identificaron productos. Revisa la foto o añade manualmente.','#d97706');
    }
  }catch(e){
    console.error(e);
    toast('Error de conexión con OCR. Comprueba tu internet.','#dc2626');
  }finally{
    if(prog)prog.style.display='none';render();
  }
}

function parseOCRText(text){
  // Patterns to skip: headers, footers, totals, addresses, legal text
  const SKIP=/base\s*impon|i\.v\.a|importe\s*(total|bruto)|telf[eé]?f?|fax\.?:|www\.|n\.i\.f|c\.i\.f|f\.pedido|f\.entrega|referencia\s*del|preparado|firma|ruta\s*\d|caixe|informaci[oó]n|responsable|alergen|legitimaci|finalidad|mercabarna|import.export|direcci[oó]n|albar[aá]n\s*n|art\.\s*ref|mercancia|n\.\s*cient|kg\.\s*\/?\s*ca|08[0-9]{3}|cliente|c\.i\.f|nif:|10,00\s*%|%\s*de\s*r|sidoro|cami\s*de|palamos|girona\s*\)|barcelona\s*\)|llogitud|francesc|longitud/i;

  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>3);
  const items=[];

  lines.forEach(line=>{
    if(SKIP.test(line)) return;

    // Extract all decimal numbers from line
    const nums=[...line.matchAll(/(\d+[,\.]\d{1,2})/g)].map(m=>parseFloat(m[1].replace(',','.')));
    if(!nums.length) return;

    // Look for article code (3-5 digit number at start of line or after pipe)
    const codeMatch=line.match(/(?:^|\|)\s*(\d{3,5})\b/);
    const code=codeMatch?codeMatch[1]:'';

    // Remove pipe chars, leading code, and scientific names (2+ consecutive ALL_CAPS words ≥4 chars each)
    let name=line
      .replace(/\|/g,' ')
      .replace(/^\s*\d{3,5}\s*/,'')
      .replace(/\b([A-ZÁÉÍÓÚ]{4,})(\s+[A-ZÁÉÍÓÚ]{3,}){1,}\b/g,'')
      .replace(/\d+[,\.]\d+/g,'')
      .replace(/\s+/g,' ')
      .trim();

    // Require meaningful text (at least 3 alpha chars)
    if(name.replace(/[^a-zA-ZáéíóúñÁÉÍÓÚÑ]/g,'').length < 3) return;

    // Determine qty and unit_price using qty*price=total relationship
    let qty=1, price=0, found=false;
    if(nums.length>=3){
      // Try all triplets: a*b≈c or a*c≈b or b*c≈a
      outer: for(let i=0;i<nums.length;i++){
        for(let j=i+1;j<nums.length;j++){
          const prod=nums[i]*nums[j];
          for(let k=0;k<nums.length;k++){
            if(k!==i&&k!==j&&Math.abs(nums[k]-prod)/Math.max(nums[k],0.01)<0.06){
              // nums[i]*nums[j]≈nums[k]: smallest of i,j is qty, other is price
              qty=Math.min(nums[i],nums[j]);
              price=Math.max(nums[i],nums[j]);
              // If qty looks like a price (>50) swap
              if(qty>50&&price<qty){[qty,price]=[price,qty];}
              found=true;
              break outer;
            }
          }
        }
      }
    }
    if(!found){
      if(nums.length>=2){ qty=nums[0]; price=nums[1]; }
      else { price=nums[0]; qty=1; }
    }

    // Sanity: skip totals/taxes (importe bruto etc)
    if(price<=0||price>5000||qty<=0||qty>2000) return;
    // Skip if name contains total-like words
    if(/importe|total|bruto|iva|i\.v\.a/i.test(name)) return;

    // Unit: decimal qty = KG, otherwise check line or default UN
    const unit=qty%1!==0?'KG':/\bkg\b|\bkgs\b|\bkilo/i.test(line)?'KG':'UN';

    items.push({
      code,
      name:name.slice(0,60),
      unit,
      qty:Math.round(qty*100)/100,
      price:Math.round(price*100)/100
    });
  });

  return items.slice(0,50);
}

function saveAlbaran(){
  const rest=S.session&&!S.session.isAdmin?S.session.restaurant:(document.getElementById('alb-rest')?.value||S.albRestaurant);
  const supId=document.getElementById('alb-sup')?.value||S.albSupId;
  const date=document.getElementById('alb-date')?.value||S.albDate;
  if(!rest){toast('Selecciona el restaurante','#dc2626');return;}
  const valid=S.albItems.filter(it=>it.name&&it.qty>0);
  if(!valid.length){toast('Añade al menos un producto con nombre y cantidad','#dc2626');return;}
  const a={id:uid(),restaurant:rest,supId,date,photo:S.albPhoto,items:valid,createdAt:new Date().toISOString(),...(S.albTotalManual!==null?{totalManual:S.albTotalManual}:{})};
  saveAlb(a);
  toast('Albarán guardado','#16a34a');
  if(S.session&&S.session.isAdmin){ S.adminTab='albaranes';goAdmin(); } else goOrder();
}

function vSuppliers(){

  const newF=S.editSupId==='new'?supForm(null):`<button class="btn btn-pri btn-sm" onclick="S.editSupId='new';render()" style="margin-bottom:14px">+ Añadir proveedor</button>`;

  const list=supList().map(sup=>{
    if(!sup.products) sup.products=[];
    const open=S.openSupId===sup.id;

    const mesActual=supOrders.filter(o=>(o.createdAt||'').startsWith(curMonth)).reduce((s,o)=>s+total(o),0);

    const balanceHtml=`<div style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap">
      <span style="font-size:11px;background:#f0fdf4;color:#16a34a;padding:2px 8px;border-radius:6px;font-weight:600">Este mes: ${fmt(mesActual)}</span>
      <span style="font-size:11px;background:#eff6ff;color:#1d4ed8;padding:2px 8px;border-radius:6px;font-weight:600">Este año: ${fmt(anoActual)}</span>
    </div>`;
    return `<div class="sup-card"><div class="sc-hd"><div><div class="sc-name">${sup.emoji} ${sup.name}</div><div class="sc-info">${sup.products.length} productos · ${sup.phone||'Sin número'}</div>${balanceHtml}</div>
      <div class="sc-acts"><button class="btn btn-ghost btn-sm" onclick="S.openSupId=S.openSupId==='${sup.id}'?null:'${sup.id}';render()">${open?'▲ Cerrar':'Editar'}</button>

      ${open?`<div class="sc-body">${supDetailForm(sup)}</div>`:''}

}
function supForm(sup){

function strToColor(str){
  // Genera un color oscuro consistente por nombre de restaurante
  let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))&0xffff;
  const hue=(h%360);
  return `hsl(${hue},55%,32%)`;
}
function cleanProdName(name){
  // Elimina info de formato/envase del final del nombre
  // ej: "Vino Tinto Cune 75cl x6" → "Vino Tinto Cune"
  return name
    .replace(/\s+(?:x|X)\s*\d+\s*$/,'')           // " x6", " X12" al final
    .replace(/\s+\d+[,.]?\d*\s*(?:cl|CL|ml|ML|L|l|g|kg|KG)\s+(?:x|X)\s*\d+\s*$/i,'') // "75cl x6"
    .replace(/\s+\d+[,.]?\d*\s*(?:cl|CL|ml|ML)\s*$/i,'') // "75cl", "37 cl"
    .replace(/\s+\d+[,.]?\d*\s*(?:L|l)\s*$/,'')   // "1L", "1,5L"
    .replace(/\s+(?:CAJ|BOT|UNI|CAN|TAR|PAQ|BOL)\s*$/i,'') // envases
    .replace(/\s+\d+[,.]?\d*\s*(?:L|l)t\s*$/i,'') // "1,5Lt"
    .replace(/\s+\d+[,.]?\d*\s*(?:cl|CL)[a-z]?\s*$/i,'') // "75c" truncado
    .replace(/\s+\d+u\s*$/i,'')                    // "12u"
    .trim();
}
function cleanSupProdNames(sid){
  const sup=suppliers[sid]; if(!sup||!sup.products) return;
  let changed=0;
  sup.products.forEach(p=>{
    const clean=cleanProdName(p.name||'');
    if(clean&&clean!==p.name){ p.name=clean; changed++; }
  });
  if(!changed){ document.getElementById('sup-clean-status-'+sid).textContent='Todos los nombres ya estaban limpios.'; return; }
  const _sy=window.scrollY;
  saveSups(sid);
  renderAdminContent();
  requestAnimationFrame(()=>window.scrollTo(0,_sy));
  toast(`${changed} nombres corregidos`,'#16a34a');
}
async function importSupTarifa(sid, input){
  const file = input.files[0]; if(!file) return;
  const statusEl = document.getElementById('sup-import-status-'+sid);
  const setStatus = (msg, color='var(--mut)') => { if(statusEl){ statusEl.style.color=color; statusEl.innerHTML=msg; } };
  setStatus(' Leyendo archivo...');
  const nameLow = file.name.toLowerCase();

  // ── EXCEL / CSV ──────────────────────────────────────────────
  if(nameLow.endsWith('.xlsx')||nameLow.endsWith('.xls')||nameLow.endsWith('.csv')){
    try{
      if(!window.XLSX){
        await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
      }
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(!rows.length){ setStatus('El archivo está vacío o sin datos.','#dc2626'); return; }

      const sample = rows[0];
      const findKey = (...candidates) => { for(const c of candidates){ const k=Object.keys(sample).find(k=>k.toLowerCase().includes(c)); if(k) return k; } return null; };
      const nameKey  = findKey('nombre','name','product','producto','artículo','articulo','descripci','desc');
      const qtyKey   = findKey('cantidad','qty','uds','uds/caja','unidades','bultos');
      const unitKey  = findKey('unidad','unit','ud.','envase','tipo');
      const priceKey = findKey('precio','price','p.unidad','p. unidad','importe','pvp','coste','costo','tarifa');
      const codeKey  = findKey('código','codigo','code','ref','referencia','art');

      if(!nameKey){ setStatus('No se encontró columna de nombre. Comprueba los encabezados del archivo.','#dc2626'); return; }

      setStatus(' Procesando productos...');
      const sup = suppliers[sid]; if(!sup.products) sup.products=[];
      let added=0, updated=0;

      rows.forEach(r=>{
        const name = cleanProdName(String(r[nameKey]||'').trim()); if(!name) return;
        const unit = unitKey ? String(r[unitKey]||'UN').trim() : 'UN';
        const price = parseFloat(String(r[priceKey]||'0').replace(',','.'))||0;
        const code  = codeKey ? String(r[codeKey]||'').trim() : '';
        const id    = code ? 'imp_'+code : 'imp_'+uid();
        const idx   = code ? sup.products.findIndex(p=>p.code===code||p.id==='imp_'+code) : -1;
        if(idx>=0){ sup.products[idx]={...sup.products[idx], name, unit, price, ...(code?{code}:{})}; updated++; }
        else { sup.products.push({id, name, unit, price, ...(code?{code}:{})}); added++; }
      });

      saveSups(sid);
      setStatus(`Tarifa importada: <strong>${added} nuevos</strong> + ${updated} actualizados (${added+updated} total)`, '#16a34a');
      toast(`${added+updated} productos importados en ${sup.name}`, '#16a34a', 4000);
      // Refrescar lista de productos sin cerrar el panel
      const listEl = document.getElementById('sdp-list-'+sid);
      if(listEl){
        const _U=['KG','L','UN','Caja','Bote','Bolsa','g'];
        listEl.innerHTML = (sup.products||[]).map(p=>{
          const unitOpts=_U.map(u=>`<option${(p.unit||'KG')===u?' selected':''}>${u}</option>`).join('');
          return `<div class="prod-row"><div class="prod-info" style="flex:1"><div class="prod-name-t">${p.name}</div><div style="display:flex;gap:5px;align-items:center;margin-top:5px;flex-wrap:wrap"><select style="padding:3px 6px;border:1px solid var(--brd);border-radius:6px;font-size:12px;background:var(--card);color:var(--txt)" onchange="editProdUnit('${sid}','${p.id}',this.value)">${unitOpts}</select><input type="number" value="${parseFloat(p.price||0).toFixed(2)}" step="0.01" min="0" title="Precio €" style="width:80px;padding:4px 8px;border:1px solid var(--brd);border-radius:6px;font-size:13px" onchange="editProdPrice('${sid}','${p.id}',this.value)"/><span style="font-size:12px;color:var(--mut)">€</span><input type="number" value="${p.pesoGr||''}" step="1" min="0" placeholder="gr" title="Peso en gramos" style="width:66px;padding:4px 8px;border:1px solid var(--brd);border-radius:6px;font-size:13px" onchange="editProdGr('${sid}','${p.id}',this.value)"/><span style="font-size:12px;color:var(--mut)">gr</span></div></div><button class="btn btn-no btn-xs" style="align-self:center" onclick="delProd('${sid}','${p.id}')">✕</button></div>`;
        }).join('');
      }
    } catch(e){ setStatus('Error al leer el Excel: '+e.message,'#dc2626'); console.error(e); }
    return;
  }

  // ── PDF ──────────────────────────────────────────────────────
  if(nameLow.endsWith('.pdf')){
    if(!cfg.geminiKey){ setStatus('Para leer PDFs necesitas configurar la API key de Gemini en Config (es gratuita).','#dc2626'); return; }
    setStatus('Analizando PDF con Gemini IA...');
    try{
      const base64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); });
      const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${cfg.geminiKey}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({contents:[{parts:[
          {inline_data:{mime_type:'application/pdf', data:base64}},
          {text:`Eres un asistente que extrae tarifas de proveedores. Extrae TODOS los productos con código (si existe), nombre, unidad de venta y precio unitario. Responde ÚNICAMENTE con un JSON array sin texto adicional:\n[{"code":"12345","name":"Aceite Oliva 5L","unit":"Caja","price":18.50}]\nUnidades posibles: KG, L, UN, Caja, Bote, Bolsa, g. Si no hay código usa "". Solo el JSON array.`}
        ]}]})
      });
      const data = await resp.json();
      if(data.error){ setStatus('Error Gemini: '+data.error.message,'#dc2626'); return; }
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text||'';
      const match = text.match(/\[[\s\S]*\]/);
      if(!match){ setStatus('Gemini no encontró productos. Prueba con un Excel o un PDF más claro.','#d97706'); return; }
      const parsed = JSON.parse(match[0]);
      if(!parsed.length){ setStatus('No se encontraron productos en el PDF.','#d97706'); return; }
      const sup = suppliers[sid]; if(!sup.products) sup.products=[];
      let added=0, updated=0;
      parsed.forEach(p=>{
        const name=cleanProdName(String(p.name||'').trim()); if(!name) return;
        const code=String(p.code||'').trim();
        const unit=String(p.unit||'UN').trim();
        const price=parseFloat(p.price)||0;
        const id=code?'imp_'+code:'imp_'+uid();
        const idx=code?sup.products.findIndex(x=>x.code===code||x.id==='imp_'+code):-1;
        if(idx>=0){ sup.products[idx]={...sup.products[idx],name,unit,price,...(code?{code}:{})}; updated++; }
        else { sup.products.push({id,name,unit,price,...(code?{code}:{})}); added++; }
      });
      saveSups(sid);
      setStatus(`PDF procesado: <strong>${added} nuevos</strong> + ${updated} actualizados (${added+updated} total)`, '#16a34a');
      toast(`${added+updated} productos importados en ${sup.name}`, '#16a34a', 4000);
    } catch(e){ setStatus('Error al procesar el PDF: '+e.message,'#dc2626'); console.error(e); }
    return;
  }

  setStatus('Formato no soportado. Usa .xlsx, .csv o .pdf','#dc2626');
}
function toggleSupVisibility(sid,uid,visible){
  if(!suppliers[sid])return;
  if(!suppliers[sid].disabledFor)suppliers[sid].disabledFor=[];
  if(visible){suppliers[sid].disabledFor=suppliers[sid].disabledFor.filter(id=>id!==uid);}
  else{if(!suppliers[sid].disabledFor.includes(uid))suppliers[sid].disabledFor.push(uid);}
  saveSups(sid);
  toast(visible?'Proveedor activado para este local':'Proveedor desactivado para este local','#16a34a');
}
function editProdUnit(sid,pid,val){
  if(!suppliers[sid])return;
  const prod=suppliers[sid].products.find(p=>p.id===pid);
  if(prod){prod.unit=val;saveSups(sid);toast('Unidad actualizada','#16a34a');}
}
function editProdPrice(sid,pid,val){
  const price=parseFloat(val);
  if(!suppliers[sid]||isNaN(price)||price<0){toast('Precio no válido','#dc2626');return;}
  const prod=suppliers[sid].products.find(p=>p.id===pid);
  if(prod){
    const oldPrice=parseFloat(prod.price)||0;
    prod.price=price;
    saveSups(sid);
    if(fbDb && Math.abs(oldPrice-price)>0.001){
      const h={id:uid(),supId:sid,supName:suppliers[sid].name,prodId:pid,prodName:prod.name,oldPrice,newPrice:price,changedAt:new Date().toISOString()};
      fbDb.ref('priceHistory/'+h.id).set(h);
    }
    const alertPct=cfg.priceAlertPct||5;
    if(oldPrice>0){
      const pct=((price-oldPrice)/oldPrice)*100;
      if(pct>alertPct) toast(`${prod.name}: precio subió un +${pct.toFixed(1)}%`,'#d97706',4000);
      else if(pct<-alertPct) toast(`${prod.name}: precio bajó un ${pct.toFixed(1)}%`,'#16a34a',4000);
      else toast('Precio actualizado','#16a34a');
    } else { toast('Precio actualizado','#16a34a'); }
  }
}
function addProd(sid){
  const name=document.getElementById('pf-name-'+sid)?.value.trim();
  const category=document.getElementById('pf-cat-'+sid)?.value||'Otros';

// --- Conversiones de unidad ---
// Devuelve las unidades disponibles para un producto: unidad base + fromUnits de conversiones
function _prodUnits(p){
  const base=p.unit||'KG';
  const extras=(p.conversions||[]).map(c=>c.fromUnit).filter(u=>u&&u!==base);
  return [base,...extras];
}
function renderConvRows(sid,p){
  const convs=p.conversions||[];
  if(!convs.length) return `<span style="font-size:12px;color:var(--mut)">Sin conversiones</span>`;
  const unitOpts=_U.map(u=>`<option>${u}</option>`).join('');
  return convs.map((c,i)=>`
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap">
      <span style="font-size:12px;color:var(--mut)">1</span>
      <select style="padding:3px 6px;border:1px solid var(--brd);border-radius:6px;font-size:12px;background:var(--card);color:var(--txt)" onchange="editConvUnit('${sid}','${p.id}',${i},this.value)">${_U.map(u=>`<option${(c.fromUnit||'Caja')===u?' selected':''}>${u}</option>`).join('')}</select>
      <span style="font-size:12px;color:var(--mut)">=</span>
      <input type="number" value="${c.factor||''}" step="0.001" min="0" placeholder="9" style="width:70px;padding:3px 7px;border:1px solid var(--brd);border-radius:6px;font-size:13px" onchange="editConvFactor('${sid}','${p.id}',${i},this.value)"/>
      <span style="font-size:12px;color:var(--mut)">${p.unit||'KG'}</span>
      <button class="btn btn-ghost btn-xs" onclick="invertProdConv('${sid}','${p.id}',${i})" title="Invertir conversión">⇄ Invertir</button>
      <button class="btn btn-no btn-xs" onclick="delProdConv('${sid}','${p.id}',${i})">✕</button>
    </div>`).join('');
}
function _refreshConvList(sid,pid){
  const prod=suppliers[sid]?.products.find(p=>p.id===pid);
  if(!prod)return;
  const el=document.getElementById(`conv-list-${sid}-${pid}`);
  if(el) el.innerHTML=renderConvRows(sid,prod);
}
function addProdConv(sid,pid){
  const prod=suppliers[sid]?.products.find(p=>p.id===pid);
  if(!prod)return;
  if(!prod.conversions) prod.conversions=[];
  prod.conversions.push({fromUnit:'Caja',factor:1});
  saveSups(sid);_refreshConvList(sid,pid);
}
function delProdConv(sid,pid,idx){
  const prod=suppliers[sid]?.products.find(p=>p.id===pid);
  if(!prod||!prod.conversions)return;
  prod.conversions.splice(idx,1);
  saveSups(sid);_refreshConvList(sid,pid);
}
function editConvUnit(sid,pid,idx,val){
  const prod=suppliers[sid]?.products.find(p=>p.id===pid);
  if(!prod||!prod.conversions||!prod.conversions[idx])return;
  prod.conversions[idx].fromUnit=val;saveSups(sid);
}
function editConvFactor(sid,pid,idx,val){
  const prod=suppliers[sid]?.products.find(p=>p.id===pid);
  if(!prod||!prod.conversions||!prod.conversions[idx])return;
  const f=parseFloat(val);if(isNaN(f)||f<=0){toast('Factor inválido','#dc2626');return;}
  prod.conversions[idx].factor=f;saveSups(sid);toast('Conversión guardada','#16a34a');
}
function invertProdConv(sid,pid,idx){
  const prod=suppliers[sid]?.products.find(p=>p.id===pid);
  if(!prod||!prod.conversions||!prod.conversions[idx])return;
  const c=prod.conversions[idx];
  const oldBase=prod.unit||'KG';
  const newBase=c.fromUnit;
  const newFactor=c.factor>0?parseFloat((1/c.factor).toFixed(6)):1;
  // Swap: new base unit = oldFromUnit, fromUnit = oldBase
  prod.unit=newBase;
  c.fromUnit=oldBase;
  c.factor=newFactor;
  saveSups(sid);_refreshConvList(sid,prod.id);
  const el=document.querySelector(`[onchange*="editProdUnit('${sid}','${pid}'"]`);
  if(el) el.value=newBase;
  toast('Conversión invertida','#16a34a');
}
function toggleProdAlergeno(sid,pid,aId,checked){
  if(!suppliers[sid])return;
  const prod=suppliers[sid].products.find(p=>p.id===pid);
  if(!prod) return;
  if(!prod.alergenos) prod.alergenos=[];
  if(checked){ if(!prod.alergenos.includes(aId)) prod.alergenos.push(aId); }
  else { prod.alergenos=prod.alergenos.filter(a=>a!==aId); }
  saveSups(sid);
}
function filterSupProds(term,containerId){
  const container=document.getElementById(containerId);
  if(!container)return;
  const rows=container.querySelectorAll('.prod-row');
  const q=term.toLowerCase().trim();
  rows.forEach(r=>{

}
function delProd(sid,pid){ if(!suppliers[sid])return;const _sy=window.scrollY;suppliers[sid].products=suppliers[sid].products.filter(p=>p.id!==pid);saveSups(sid);renderAdminContent();requestAnimationFrame(()=>window.scrollTo(0,_sy)); }
function localAddProd(sid){
  const name=document.getElementById('lp-name')?.value.trim();
  const unit=document.getElementById('lp-unit')?.value||'KG';
  const priceRaw=document.getElementById('lp-price')?.value;
  const price=(priceRaw===''||priceRaw==null)?0:parseFloat(priceRaw);
  if(!name){toast('Escribe el nombre del producto','#dc2626');return;}
  if(isNaN(price)||price<0){toast('Introduce un precio válido','#dc2626');return;}
  if(!suppliers[sid]){toast('Proveedor no encontrado','#dc2626');return;}
  const pid='p'+uid();
  const newProd={id:pid,name,unit,price};
  // Garantizar que products es array (Firebase puede devolver objeto con claves numéricas)
  if(!Array.isArray(suppliers[sid].products)) suppliers[sid].products=Object.values(suppliers[sid].products||{});
  suppliers[sid].products.push(newProd);
  // Escritura dirigida — solo actualiza los productos de este proveedor, no todo suppliers
  // Esto evita condiciones de carrera donde otro dispositivo pueda sobreescribir el producto
  if(fbDb) fbDb.ref('suppliers/'+sid+'/products').set(suppliers[sid].products);
  localStorage.setItem('oc_suppliers', JSON.stringify(suppliers));
  S.showAddProd=false;
  // Auto-añadir al carrito con cantidad 1
  if(!S.cart[sid]) S.cart[sid]={};
  S.cart[sid][pid]=1;
  // Guardar detalles del producto en _cartProds por si el listener de Firebase lo pisa antes de enviar el pedido
  if(!S._cartProds[sid]) S._cartProds[sid]={};
  S._cartProds[sid][pid]=newProd;
  render();
  toast(`"${name}" guardado en el proveedor y añadido al pedido`,'#16a34a');
}

function saveTpl(){

  const uid2=S.session.userId;

function loadAutoSuggest(){
  if(!S.session) return;
  const myHistory=orders.filter(o=>o.restaurant===S.session.restaurant&&o.supId===S.supId&&o.status!=='rejected');
  const acc={};
  myHistory.forEach(o=>(o.items||[]).forEach(it=>{if(!acc[it.id])acc[it.id]={prodId:it.id,totalQty:0,count:0};acc[it.id].count++;acc[it.id].totalQty+=it.qty;}));
  if(!S.cart[S.supId])S.cart[S.supId]={};

      </div>

    ${cards}
  </div>
  <div class="card" style="margin-top:14px">

  </div>`;
}

/* ═══════════════ COMPARATIVA PROVEEDORES ═══════════════ */
function vCompare(){
  const sups=supList();
  if(sups.length<2)return`<div class="empty"><div class="ei"></div><div class="et">Necesitas al menos 2 proveedores para comparar</div></div>`;
  const groups={};
  sups.forEach(sup=>{
    (sup.products||[]).forEach(p=>{
      const key=p.name.toLowerCase().trim();
      if(!groups[key])groups[key]={name:p.name,entries:{}};
      groups[key].entries[sup.id]={price:parseFloat(p.price)||0,unit:p.unit};
    });
  });
  const multi=Object.values(groups).filter(g=>Object.keys(g.entries).length>=2).sort((a,b)=>a.name.localeCompare(b.name,'es'));
  if(!multi.length)return`<div class="empty"><div class="ei"></div><div class="et">No hay productos con el mismo nombre en varios proveedores</div></div>`;
  const headers=sups.map(s=>`<th style="text-align:right;padding:4px 8px 10px;font-size:11px;color:var(--mut);white-space:nowrap">${s.emoji} ${s.name}</th>`).join('');
  const rows=multi.map(g=>{
    const prices=Object.values(g.entries).map(e=>e.price).filter(p=>p>0);
    const minP=prices.length?Math.min(...prices):0;
    const cells=sups.map(sup=>{
      const e=g.entries[sup.id];
      if(!e)return`<td style="padding:6px 8px;text-align:right;color:var(--brd)">—</td>`;
      const cheap=e.price>0&&e.price===minP&&prices.filter(p=>p===minP).length<prices.length;
      return`<td style="padding:6px 8px;text-align:right;font-size:13px;${cheap?'color:#16a34a;font-weight:700':''}">${cheap?'':''}${fmt(e.price)}<span style="font-size:10px;color:var(--mut)">/${e.unit}</span></td>`;
    }).join('');
    return`<tr style="border-top:1px solid var(--brd)"><td style="padding:6px 4px 6px 0;font-size:13px">${g.name}</td>${cells}</tr>`;
  }).join('');
  return`<div class="card"><div class="card-t">Comparativa de precios entre proveedores</div>
    <div style="font-size:12px;color:var(--mut);margin-bottom:12px">= precio más bajo. Solo aparecen productos presentes en 2+ proveedores.</div>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
      <thead><tr><th style="text-align:left;padding:4px 0 10px;font-size:11px;color:var(--mut)">Producto</th>${headers}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`;
}

let _audioCtx=null;
function _getAudioCtx(){
  if(!_audioCtx) _audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(_audioCtx.state==='suspended') _audioCtx.resume();
  return _audioCtx;
}
// Desbloquear AudioContext en el primer clic del usuario
document.addEventListener('click',()=>{ try{_getAudioCtx();}catch(e){} },{once:true});

function playNotifSound(urgent=false){
  try{
    const ctx=_getAudioCtx();
    const beep=(freq,start,dur)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=freq;
      g.gain.setValueAtTime(0,ctx.currentTime+start);
      g.gain.linearRampToValueAtTime(0.25,ctx.currentTime+start+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+dur);
      o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur+0.05);
    };
    if(urgent){beep(880,0,0.15);beep(1100,0.2,0.15);beep(880,0.4,0.15);beep(1100,0.6,0.2);}
    else{beep(660,0,0.12);beep(880,0.18,0.18);}
  }catch(e){}
}
function testNotifSound(){ playNotifSound(false); toast('Sonido de prueba','#16a34a'); }
function requestPushPermission(){
  if(window.self!==window.top){
    toast('Abre la app directamente en el navegador para activar notificaciones emergentes. El sonido ya funciona.','#d97706',5000);
    return;
  }
  if(!('Notification' in window)){
    toast('Tu navegador no soporta notificaciones emergentes. El sonido sí está disponible.','#d97706',4000);
    return;
  }
  Notification.requestPermission().then(perm=>{
    const el=document.getElementById('push-status');
    if(perm==='granted'){
      if(el)el.textContent='Notificaciones activas';
      toast(' Notificaciones activadas','#16a34a');
    } else {
      if(el)el.textContent='Bloqueadas — actívalas en los ajustes del navegador';
      toast('Notificaciones bloqueadas — actívalas en los ajustes del navegador para este sitio','#dc2626',5000);
    }
  });
}
function pushNotify(title,body,icon=''){
  // Sonido siempre (si está activado en config)
  if(cfg.notifSound!==false) playNotifSound(icon==='');
  // Notificación emergente solo si hay permiso y no estamos en iframe
  if(window.self===window.top&&'Notification' in window&&Notification.permission==='granted'){
    try{ new Notification(`${icon} ${title}`,{body}); }catch(e){}
  }
}

function sendNtfy(title, body, {priority='default', tags='bell', urgent=false}={}){
  const topic=(cfg.ntfyTopic||'').trim();
  if(!topic) return Promise.resolve();
  const p=urgent?'urgent':priority;
  const t=urgent?'rotating_light,'+tags:tags;
  const url=`https://ntfy.sh/${encodeURIComponent(topic)}?title=${encodeURIComponent(title)}&priority=${encodeURIComponent(p)}&tags=${encodeURIComponent(t)}`;
  return fetch(url,{method:'POST',body});
}

function forcePushUpdate(){
  if(!fbDb){toast('Sin conexión Firebase','#dc2626');return;}
  const newVersion=new Date().toISOString().slice(0,10)+'-'+Date.now().toString(36);
  if(!confirm(`¿Forzar actualización en todos los dispositivos conectados?\n\nSe recargará la app en todos los móviles y ordenadores abiertos en este momento.`)) return;
  fbDb.ref('globalCfg/appVersion').set(newVersion).then(()=>{
    const el=document.getElementById('force-update-status');
    if(el) el.textContent='Actualización enviada — los dispositivos se recargarán en unos segundos.';
    toast('Actualización enviada a todos los dispositivos','#16a34a',4000);
  }).catch(e=>toast('Error: '+e.message,'#dc2626'));
}

function testNtfy(){
  const topic=(cfg.ntfyTopic||'').trim();
  if(!topic){toast('Primero pon un nombre de canal','#dc2626');return;}
  toast('Enviando...','#6b7280',2000);
  sendNtfy('Prueba O\'Carro','Si ves esto, las notificaciones push funcionan ',{tags:'white_check_mark'})
    .then(r=>{
      if(r&&r.ok){
        toast(`Enviado al canal "${topic}" — comprueba el móvil`,'#16a34a',6000);
      } else {
        toast(`Error al enviar (${r?r.status:'sin respuesta'}) — comprueba el canal`,'#dc2626',6000);
        console.error('ntfy error:',r?.status,r?.statusText);
      }
    })
    .catch(e=>{
      toast(`No se pudo conectar con ntfy.sh — ${e.message}`,'#dc2626',6000);
      console.error('ntfy fetch error:',e);
    });
}

function setSup(id){ S.supId=id;S.prodSearch='';render(); }

function setUnit(pid,unit){
  if(!S.cartUnits[S.supId])S.cartUnits[S.supId]={};
  S.cartUnits[S.supId][pid]=unit;
  // Rerender unit buttons in-place
  const sup=suppliers[S.supId];if(!sup)return;
  const _UNITS=['KG','L','UN','Caja'];
  const el=document.getElementById('ur-'+pid);
  if(el) el.innerHTML=_UNITS.map(u=>`<button class="ubt${unit===u?' ubt-on':''}" onclick="setUnit('${pid}','${u}');event.stopPropagation()">${u}</button>`).join('');
}

function filterProds(val){
  S.prodSearch=val||'';
  const sup=suppliers[S.supId];if(!sup)return;
  const term=(val||'').toLowerCase().trim();
  const filtered=sup.products.filter(p=>!term||p.name.toLowerCase().includes(term));
  const _UNITS=['KG','L','UN','Caja'];
  function mkCard(p){
    const q=(S.cart[S.supId]||{})[p.id]||0;
    const selUnit=(S.cartUnits[S.supId]||{})[p.id]||p.unit;
    const prodUnits=_prodUnits(p);
    const unitBtns=prodUnits.map(u=>`<button class="ubt${selUnit===u?' ubt-on':''}" onclick="setUnit('${p.id}','${u}');event.stopPropagation()">${u}</button>`).join('');
    return `<div class="pi ${q>0?'ic':''}" id="pi-${p.id}">
      <div class="pi-i"><div class="pi-n">${p.name}</div><div class="pi-p">${pkgLabel(p)}</div></div>
      <div class="qc">
        <button class="qb" onclick="chgQ('${p.id}',-1)">−</button>
        <div class="qd" id="qd-${p.id}">${q}</div>
        <button class="qb" onclick="chgQ('${p.id}',1)">+</button>
      </div>
      ${q>0?`<div class="urow" id="ur-${p.id}">${unitBtns}</div>`:`<div class="urow" id="ur-${p.id}" style="display:none">${unitBtns}</div>`}
    </div>`;
  }
  let html='';
  if(term){
    html=filtered.length?`<div class="pgrid">${filtered.map(mkCard).join('')}</div>`:`<div class="empty"><div class="ei"></div><div class="et">Sin resultados para "${val}"</div></div>`;
  } else {
    const byCat={};
    filtered.forEach(p=>{ const c=p.category||'Otros'; if(!byCat[c])byCat[c]=[]; byCat[c].push(p); });
    const cats=[...PROD_CATS,...Object.keys(byCat).filter(c=>!PROD_CATS.includes(c))].filter(c=>byCat[c]);
    html=cats.length<=1
      ?`<div class="pgrid">${filtered.map(mkCard).join('')}</div>`
      :cats.map(cat=>`<div style="margin-bottom:14px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:6px 2px 6px;border-bottom:1px solid var(--brd);margin-bottom:8px">${cat}</div><div class="pgrid">${byCat[cat].map(mkCard).join('')}</div></div>`).join('');
  }
  const wrap=document.getElementById('prod-grid-wrap');
  if(wrap) wrap.innerHTML=html;
}

function chgQ(id,d){
  if(!S.cart[S.supId])S.cart[S.supId]={};
  const sc=S.cart[S.supId];
  const q=sc[id]||0,nq=Math.max(0,q+d);
  if(nq===0)delete sc[id];else sc[id]=nq;
  if(Object.keys(sc).length===0)delete S.cart[S.supId];
  const el=document.getElementById('qd-'+id);if(el)el.textContent=nq;
  const pi=document.getElementById('pi-'+id);if(pi)pi.className='pi'+(nq>0?' ic':'');
  // Mostrar/ocultar fila de unidades
  const ur=document.getElementById('ur-'+id);
  if(ur){
    if(nq>0){
      ur.style.display='flex';
      if(!ur.innerHTML.trim()){
        const sup=suppliers[S.supId];
        const prod=sup&&sup.products.find(p=>p.id===id);
        const selUnit=(S.cartUnits[S.supId]||{})[id]||(prod&&prod.unit)||'UN';
        const _pu=prod?_prodUnits(prod):['KG','L','UN','Caja'];
        ur.innerHTML=_pu.map(u=>`<button class="ubt${selUnit===u?' ubt-on':''}" onclick="setUnit('${id}','${u}');event.stopPropagation()">${u}</button>`).join('');
      }
    } else { ur.style.display='none'; }
  }
  // Grand total across all suppliers
  const cnt=Object.values(S.cart).reduce((s,sc2)=>s+Object.values(sc2).reduce((a,v)=>a+v,0),0);
  const tot=Object.entries(S.cart).reduce((s,[sid,sc2])=>{const sp=suppliers[sid];if(!sp)return s;return s+(sp.products||[]).reduce((a,p)=>a+(sc2[p.id]||0)*p.price,0);},0);
  const bar=document.getElementById('cbar');if(bar)bar.className='cbar'+(cnt>0?' up':'');
  const cv=document.getElementById('cb-v');if(cv)cv.textContent=`${cnt} art. · ${Object.keys(S.cart).length} prov.`;
  const cs=document.getElementById('cb-s');if(cs)cs.textContent=fmt(tot);
}

function submitOrder(){
  if(!S.session){toast('Sin sesión','#dc2626');return;}
  const activeSups=Object.keys(S.cart).filter(sid=>Object.keys(S.cart[sid]||{}).length>0);
  if(!activeSups.length){toast('Añade productos al pedido','#dc2626');return;}
  const approvalMinAmount=cfg.approvalMinAmount||0;
  const orders2send=[];
  activeSups.forEach(sid=>{
    const sup=suppliers[sid];if(!sup)return;
    const sc=S.cart[sid]||{};
    // Build product lookup: localStorage + _cartProds (recién añadidos) + Firebase (toma precedencia para los existentes)
    const _lsProds=(()=>{try{return(JSON.parse(localStorage.getItem('oc_suppliers')||'{}')[sid]?.products)||[];}catch(e){return[];}})();
    const _prodMap={};
    _lsProds.forEach(p=>{if(p&&p.id)_prodMap[p.id]=p;});
    Object.values(S._cartProds[sid]||{}).forEach(p=>{if(p&&p.id)_prodMap[p.id]=p;});
    (sup.products||[]).forEach(p=>{if(p&&p.id)_prodMap[p.id]=p;});
    const items=Object.keys(sc).filter(pid=>sc[pid]>0).map(pid=>{const p=_prodMap[pid];if(!p)return null;const selUnit=(S.cartUnits[sid]&&S.cartUnits[sid][pid])||p.unit;return{...p,qty:sc[pid],unit:selUnit,baseUnit:p.unit};}).filter(Boolean);
    if(!items.length)return;
    const orderTotal=items.reduce((s,p)=>s+p.qty*p.price,0);
    const needApproval=S.session.needsApproval&&(approvalMinAmount<=0||orderTotal>=approvalMinAmount);
    const o={id:uid(),restaurant:S.session.restaurant,supId:sid,items,status:needApproval?'pending':'approved',autoApproved:!needApproval,createdAt:new Date().toISOString(),urgent:S.orderUrgent||false,deliveryDate:S.orderDeliveryDate||null,notes:S.orderNotes||''};
    saveOrder(o);
    orders2send.push(o);
  });
  if(!orders2send.length){toast('Añade productos al pedido','#dc2626');return;}
  S.cart={};S.cartUnits={};S._cartProds={};S.orderUrgent=false;S.orderDeliveryDate='';S.prodSearch='';S.orderNotes='';
  const pendingOrders=orders2send.filter(o=>o.status==='pending');
  const autoOrders=orders2send.filter(o=>o.status==='approved');
  if(pendingOrders.length){
    // Show WA for admin with summary of pending orders
    const totalAmt=pendingOrders.reduce((s,o)=>s+total(o),0);
    const restName=(pendingOrders[0].restaurant||'').toUpperCase();
    const msgMulti=` *NUEVO PEDIDO*\n━━━━━━━━━━━━━━━━━━\n*LOCAL: ${restName}*\n━━━━━━━━━━━━━━━━━━\n${pendingOrders.map(o=>`• ${(suppliers[o.supId]||{name:o.supId}).name}: ${fmt(total(o))}${o.urgent?' ':''}`).join('\n')}\n *Total: ${fmt(totalAmt)}*\n\n_Entra en la app para aprobar_`;
    showWA(cfg.adminPhone||'',msgMulti,`${pendingOrders.length} pedido(s) de ${pendingOrders[0].restaurant} — apruébalos`);
    // Notificación push al móvil del admin
    const urgent=pendingOrders.some(o=>o.urgent);
    const ntfyLines=pendingOrders.map(o=>`• ${(suppliers[o.supId]||{name:o.supId}).name}: ${fmt(total(o))}${o.urgent?' URGENTE':''}`).join('\n');
    sendNtfy(
      `${urgent?'URGENTE — ':''}Nuevo pedido de ${pendingOrders[0].restaurant}`,
      `${ntfyLines}\n Total: ${fmt(totalAmt)}`,
      {priority:urgent?'urgent':'high', tags:urgent?'rotating_light':'shopping_cart', urgent}
    );
    toast(`${pendingOrders.length} pedido(s) enviado(s) para aprobación`,'#d97706');
  }
  if(autoOrders.length){
    // Auto-approved: one WA per supplier
    autoOrders.forEach(o=>{
      const sup=suppliers[o.supId];if(sup?.phone)showWA(sup.phone,msgSupplier(o),`Pedido aprobado — envíalo a ${sup.name}`);
    });
    // Notificación push también para auto-aprobados
    const totalAuto=autoOrders.reduce((s,o)=>s+total(o),0);
    sendNtfy(
      `Pedido auto-aprobado — ${autoOrders[0].restaurant}`,
      autoOrders.map(o=>`• ${(suppliers[o.supId]||{name:o.supId}).name}: ${fmt(total(o))}`).join('\n')+`\n Total: ${fmt(totalAuto)}`,
      {priority:'default', tags:'white_check_mark'}
    );
    toast(`${autoOrders.length} pedido(s) aprobado(s) automáticamente — envía a cada proveedor`,'#16a34a');
  }
  render();
}

  if(!o){toast('Pedido no encontrado','#dc2626');return;}
  const itemsHtml=(o.items||[]).map((it,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--brd)">
      <div style="flex:1;font-size:13px">${it.name} <span style="color:var(--mut)">${it.qty} ${it.unit}</span></div>
      <select id="recv-status-${i}" style="font-size:12px;padding:3px 6px;border:1px solid var(--brd);border-radius:6px;background:var(--card);color:var(--txt)">
        <option value="ok">OK</option>
        <option value="partial">Parcial</option>
        <option value="missing">Faltó</option>
        <option value="bad"> Mal estado</option>
      </select>
      <input id="recv-note-${i}" type="text" placeholder="Nota..." style="width:100px;font-size:12px;padding:3px 6px;border:1px solid var(--brd);border-radius:6px;background:var(--card);color:var(--txt)">
    </div>`).join('');
  document.getElementById('recv-items').innerHTML=itemsHtml;
  document.getElementById('recv-general-note').value='';
  document.getElementById('recv-ov').style.display='flex';
}
function closeRecvModal(){ document.getElementById('recv-ov').style.display='none'; _recvOrderId=null; }
function confirmReceived(){
  if(!_recvOrderId) return;
  const o=orders.find(x=>x.id===_recvOrderId);
  if(!o){ closeRecvModal(); return; }
  const receivedItems=(o.items||[]).map((it,i)=>{
    const status=document.getElementById('recv-status-'+i)?.value||'ok';
    const note=document.getElementById('recv-note-'+i)?.value.trim()||'';
    return {...it,recvStatus:status,...(note?{recvNote:note}:{})};
  });
  const generalNote=document.getElementById('recv-general-note')?.value.trim()||'';
  const hasIssues=receivedItems.some(it=>it.recvStatus!=='ok');
  updateOrder(_recvOrderId,{status:'received',receivedAt:new Date().toISOString(),receivedItems,...(generalNote?{receivedNote:generalNote}:{}),...(hasIssues?{receivedIssues:true}:{})});
  if(!fbDb){ const ord=orders.find(x=>x.id===_recvOrderId);if(ord){ord.status='received';ord.receivedAt=new Date().toISOString();ord.receivedItems=receivedItems;if(generalNote)ord.receivedNote=generalNote;if(hasIssues)ord.receivedIssues=true;}}
  // Auto-update inventory stock for received items
  try{ updateStockFromOrder(o, receivedItems); }catch(e){ console.warn('Inv update error:',e); }
  closeRecvModal();
  toast(hasIssues?' Recibido con incidencias':' Pedido recibido correctamente',hasIssues?'#d97706':'#7c3aed');
  renderAdminContent();
}

function vReceived(){
  const rec=orders.filter(o=>o.status==='received').sort((a,b)=>new Date(b.receivedAt||b.createdAt)-new Date(a.receivedAt||a.createdAt));
  if(!rec.length) return `<div class="empty"><div class="ei"></div><div class="et">Sin pedidos recibidos aún</div></div>`;
  const tot=rec.reduce((s,o)=>s+total(o),0);
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <div style="font-size:13px;color:var(--mut)">${rec.length} pedidos confirmados · ${fmt(tot)} total</div>
    <button class="btn btn-ghost btn-sm" onclick="exportExcel('received')">Exportar Excel</button>
  </div>`+rec.map(o=>orderCard(o,false)).join('');
}


function exportExcel(type){
  if(typeof XLSX==='undefined'){toast('Librería Excel no cargada','#dc2626');return;}
  let rows=[];
  let filename='pedidos';
  if(type==='all'||type==='monthly'||!type){
    filename='pedidos_provea_'+new Date().toISOString().slice(0,10);
    rows=[['ID','Fecha','Local','Proveedor','Estado','Total €','Urgente','Entrega'],...orders.map(o=>[o.id,(o.createdAt||'').slice(0,10),o.restaurant||'',(suppliers[o.supId]||{name:o.supId||'?'}).name,o.status,total(o).toFixed(2),o.urgent?'Sí':'No',o.deliveryDate||''])];
  } else if(type==='received'){
    filename='pedidos_recibidos_'+new Date().toISOString().slice(0,10);
    const rec=orders.filter(o=>o.status==='received');
    rows=[['ID','Fecha pedido','Fecha recepción','Local','Proveedor','Total €'],...rec.map(o=>[o.id,(o.createdAt||'').slice(0,10),(o.receivedAt||'').slice(0,10),o.restaurant||'',(suppliers[o.supId]||{name:o.supId||'?'}).name,total(o).toFixed(2)])];
  }
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Pedidos');
  XLSX.writeFile(wb,filename+'.xlsx');
  toast('Excel descargado','#16a34a');
}

function toggleDarkMode(){
  S.darkMode=!S.darkMode;
  localStorage.setItem('oc_dark',S.darkMode?'1':'0');
  document.body.classList.toggle('dark',S.darkMode);

}

function escRender(){
  const grid = document.getElementById('esc-grid');
  if(!grid) return;
  const txt = (document.getElementById('esc-search')?.value||'').toLowerCase();
  const cat = document.getElementById('esc-cat-filter')?.value||'';
  const local = document.getElementById('esc-local-filter')?.value||'';
  const entries = Object.entries(_escAllData).filter(([,e])=>{
    const rest=e.restaurante||'global';
    return (!txt||e.nombre?.toLowerCase().includes(txt))
      &&(!cat||e.categoria===cat)
      &&(!local||(local==='global'?rest==='global':rest===local));
  });
  if(!entries.length){
    grid.innerHTML='<p style="color:var(--mut)">No hay escandallos con esos filtros. Crea uno con "+ Nuevo".</p>';
    return;
  }
  function escCard([id,e]){
    const coste = escCosteTotal(e);
    const pvp = parseFloat(e.precioVenta)||0;
    const fcObj = parseFloat(e.foodCostObjetivo)||30;
    const fcReal = pvp>0?(coste/pvp*100):null;
    const margen = pvp>0?(pvp-coste):null;
    const margenPct = pvp>0&&margen!==null?(margen/pvp*100):null;
    let cls='esc-ok';
    if(fcReal!==null){if(fcReal>fcObj+5)cls='esc-bad';else if(fcReal>fcObj)cls='esc-warn';}
    const rest=e.restaurante||'global';
    const restBadge=rest==='global'
      ?`<span style="font-size:10px;background:#dbeafe;color:#1d4ed8;border-radius:10px;padding:1px 7px;font-weight:700">Global</span>`
      :`<span style="font-size:10px;background:#f3e8ff;color:#7c3aed;border-radius:10px;padding:1px 7px;font-weight:700">${rest}</span>`;
    const baseTag=e.baseId?`<span style="font-size:10px;color:var(--mut);margin-left:4px">copia</span>`:'';
    const copyBtn=`<button class="btn btn-ghost btn-xs" style="margin-top:8px;width:100%;justify-content:center" onclick="event.stopPropagation();escCopiarParaLocal('${id}')">Copiar para local</button>`;
    // Alérgenos de la ficha
    const alerList=(e.alergenos||[]).map(id=>{const a=ALERGENOS.find(x=>x.id===id);return a?a.label:id;});
    const alerHtml=alerList.length
      ?`<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:3px">${alerList.map(l=>`<span style="font-size:10px;background:#fff3cd;color:#856404;border:1px solid #ffc107;border-radius:3px;padding:1px 5px;font-weight:600">${l}</span>`).join('')}</div>`:'';
    // Tiempo y temperatura
    const metaHtml=[
      e.tiempoElaboracion?`${e.tiempoElaboracion} min`:'',
      e.temperatura||'',
    ].filter(Boolean).join(' · ');
    return `<div class="esc-card" onclick="escOpenModal('${id}')">
      <div class="esc-fc-ind ${cls}">${fcReal!==null?fcReal.toFixed(0)+'%':'—'}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">${restBadge}${baseTag}</div>
      <h4>${e.nombre||'Sin nombre'}</h4>
      ${metaHtml?`<div style="font-size:11px;color:var(--mut);margin-bottom:8px">${metaHtml}</div>`:''}
      <div class="esc-stats">
        <div class="esc-stat"><span>Coste</span><strong>${escFmt(coste)}</strong></div>
        <div class="esc-stat"><span>PVP</span><strong>${pvp>0?escFmt(pvp):'—'}</strong></div>
        <div class="esc-stat"><span>Margen</span><strong>${margen!==null?escFmt(margen):'—'}</strong></div>
        <div class="esc-stat"><span>% Margen</span><strong>${margenPct!==null?margenPct.toFixed(1)+'%':'—'}</strong></div>
      </div>
      <div style="margin-top:8px;font-size:12px;color:var(--mut)">${(e.ingredientes||[]).length} ingrediente${(e.ingredientes||[]).length!==1?'s':''}</div>
      ${alerHtml}
      ${copyBtn}
    </div>`;
  }
  // Agrupar por categoría si no hay filtro de categoría activo
  if(cat){
    grid.innerHTML=`<div class="esc-grid">${entries.map(escCard).join('')}</div>`;
  } else {
    const byCat={};
    entries.forEach(entry=>{ const c=entry[1].categoria||'Otros'; if(!byCat[c])byCat[c]=[]; byCat[c].push(entry); });
    // Ordenar: categorías de escandallos (Carnes, Fríos, Postres, Bebidas, Aperitivos, Fondos, Otros)
    const ESC_CATS=['Calientes','Fríos','Postres','Bebidas','Aperitivos','Fondos','Entrantes','Guarniciones','Otros'];
    const orderedCats=[...ESC_CATS,...Object.keys(byCat).filter(c=>!ESC_CATS.includes(c))].filter(c=>byCat[c]);
    grid.innerHTML=orderedCats.map(c=>`
      <div style="grid-column:1/-1;margin-top:${c===orderedCats[0]?'0':'8px'}">

          ${catDot(c,ESC_CAT_COLORS)} ${c} <span style="font-size:10px;font-weight:600;background:${(ESC_CAT_COLORS[c]||'#64748b')}15;border:1px solid ${(ESC_CAT_COLORS[c]||'#64748b')}30;border-radius:10px;padding:1px 8px;color:${ESC_CAT_COLORS[c]||'#64748b'}">${byCat[c].length}</span>
        </div>

    `).join('');

}

function escCosteTotal(e, depth=0){
  return (e.ingredientes||[]).reduce((s,ing)=>{
    const p=escLivePrice(ing, depth);
    const merma=parseFloat(ing.merma)||0;
    const factor=merma>0&&merma<100?1/(1-merma/100):1;
    return s+(parseFloat(ing.cantidad)||0)*p*factor;
  },0);
}

function escLivePrice(ing, depth=0){
  // Sub-escandallo con fracción: coste = fraccion * costeTotal
  if(ing.type==='fracsubesc' && ing.escId && depth<5){
    const subEsc=_escAllData[ing.escId];
    if(subEsc) return escCosteTotal(subEsc, depth+1); // cantidad ya es la fracción
  }
  // Sub-escandallo clásico: coste por unidad de rendimiento
  if(ing.type==='subesc' && ing.escId && depth<5){
    const subEsc=_escAllData[ing.escId];
    if(subEsc){
      const rend=parseFloat(subEsc.rendimiento)||1;
      return escCosteTotal(subEsc, depth+1)/rend;
    }
  }
  if(ing.proveedorId===null) return parseFloat(ing.precioUnitario)||0; // libre o sub-esc no encontrado
  const sup=suppliers[ing.proveedorId];
  if(sup&&sup.products){
    const prod=(Array.isArray(sup.products)?sup.products:Object.values(sup.products)).find(p=>p.id===ing.productoId);
    if(prod) return parseFloat(prod.price)||0;
  }
  return parseFloat(ing.precioUnitario)||0;
}

function escCosteFactor(ing){
  // Coste real = precio * cantidad / (1 - merma/100)
  const merma=parseFloat(ing.merma)||0;
  const factor=merma>0&&merma<100?1/(1-merma/100):1;
  return escLivePrice(ing)*(parseFloat(ing.cantidad)||0)*factor;
}

function escRenderIngs(){
  const cont=document.getElementById('esc-ing-list');
  if(!cont) return;
  if(!_escIngs.length){cont.innerHTML='<p style="color:var(--mut);font-size:13px">Sin ingredientes aún</p>';return;}
  const totalCoste=_escIngs.reduce((s,ing)=>s+escCosteFactor(ing),0);
  cont.innerHTML=_escIngs.map((ing,i)=>{
    const liveP=escLivePrice(ing);
    const merma=parseFloat(ing.merma)||0;
    const costeReal=escCosteFactor(ing);
    const pct=totalCoste>0?(costeReal/totalCoste*100):0;
    const pctColor=pct>=40?'#dc2626':pct>=20?'#d97706':'#64748b';
    const changed=ing.proveedorId!==null&&Math.abs(liveP-(parseFloat(ing.precioUnitario)||0))>0.001;
    const priceTag=changed?`<span style="color:#d97706;font-size:10px" title="Precio actualizado desde tarifa">${escFmt(liveP)}</span>`:`${escFmt(liveP)}`;
    const mermaTag=merma>0?`<span style="color:#7c3aed;font-size:10px;margin-left:4px" title="Con merma del ${merma}%">${merma}%</span>`:'';
    const fracTexto=ing.type==='fracsubesc'?escFraccionTexto(ing.fraccion||ing.cantidad):'';
    const subEscTag=ing.type==='subesc'?'<span style="font-size:10px;color:#7c3aed;margin-left:4px;font-weight:700">[sub-elaboración]</span>'
      :ing.type==='fracsubesc'?`<span style="font-size:10px;color:#6366f1;margin-left:4px;font-weight:700">[${fracTexto} del escandallo]</span>`
      :'';
    const libre=(!ing.type&&ing.proveedorId===null)?'<span style="font-size:10px;color:#6b7280;margin-left:4px">[libre]</span>':'';
    return `<div class="esc-ing-row">
      <span class="in">${ing.nombre}${subEscTag}${libre}</span>
      <span class="id">${ing.type==='fracsubesc'?`${fracTexto} × ${priceTag} total`:`${ing.cantidad} ${ing.unidad} × ${priceTag}`}${mermaTag}</span>
      <span class="ic">${escFmt(costeReal)}</span>
      <span style="font-size:11px;font-weight:700;min-width:38px;text-align:right;color:${pctColor}">${pct.toFixed(1)}%</span>
      <button onclick="escQuitarIng(${i})" title="Eliminar">✕</button>
    </div>`;
  }).join('');
}

function escRecalc(){
  const coste=_escIngs.reduce((s,ing)=>s+escCosteFactor(ing),0);
  const pvpConIva=parseFloat(document.getElementById('esc-pvp')?.value)||0;
  const ivaPct=parseFloat(document.getElementById('esc-iva')?.value)||0;
  const fcObj=parseFloat(document.getElementById('esc-fcobj')?.value)||30;
  // IVA desglose
  const ivaFactor=1+(ivaPct/100);
  const pvpSinIva=pvpConIva>0?pvpConIva/ivaFactor:0;
  const ivaAmt=pvpConIva>0?pvpConIva-pvpSinIva:0;
  // Food cost se calcula sobre precio sin IVA
  const fcReal=pvpSinIva>0?(coste/pvpSinIva*100):null;
  // PVP sugerido: precio sin IVA = coste / (fcObj/100), luego con IVA
  const pvpSugSinIva=coste>0?(coste/(fcObj/100)):null;
  const pvpSug=pvpSugSinIva!==null?pvpSugSinIva*ivaFactor:null;
  const margen=pvpSinIva>0?(pvpSinIva-coste):null;
  const margenPct=pvpSinIva>0&&margen!==null?(margen/pvpSinIva*100):null;

  document.getElementById('ec-coste').textContent=escFmt(coste);
  const fcEl=document.getElementById('ec-fc');
  if(fcReal!==null){fcEl.textContent=fcReal.toFixed(1)+'%';fcEl.className=fcReal<=fcObj?'fc-ok':fcReal<=fcObj+5?'fc-warn':'fc-bad';}
  else{fcEl.textContent='— %';fcEl.className='';}
  // IVA rows
  const ivaPctEl=document.getElementById('ec-iva-pct');
  if(ivaPctEl) ivaPctEl.textContent=ivaPct;
  document.getElementById('ec-pvp-coniva').textContent=pvpConIva>0?escFmt(pvpConIva):'— €';
  document.getElementById('ec-iva-amt').textContent=pvpConIva>0?escFmt(ivaAmt):'— €';
  document.getElementById('ec-pvp-noiva').textContent=pvpSinIva>0?escFmt(pvpSinIva):'— €';
  document.getElementById('ec-pvpsug').textContent=pvpSug!==null?escFmt(pvpSug):'— €';
  document.getElementById('ec-margen').textContent=margen!==null?escFmt(margen):'— €';
  document.getElementById('ec-margenpct').textContent=margenPct!==null?margenPct.toFixed(1)+'%':'— %';
  // Actualizar alérgenos en tiempo real
  const alerEl=document.getElementById('esc-alergenos-display');
  if(alerEl){
    const present=alergenosFromIngs(_escIngs);
    if(!present.length){
      alerEl.innerHTML='<span style="color:var(--mut)">Ninguno detectado en ingredientes vinculados</span>';
    } else {
      alerEl.innerHTML=present.map(id=>{
        const a=ALERGENOS.find(x=>x.id===id);
        return `<span style="display:inline-block;background:#fff3cd;color:#856404;border:1px solid #ffc107;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600;margin:2px 3px 2px 0">${a?a.label:id}</span>`;
      }).join('');
    }
  }
}

function escProcesarImport(input){
  const file=input.files[0];
  if(!file){return;}
  if(!fbDb){toast('Sin conexión Firebase','#dc2626');return;}
  const reader=new FileReader();
  reader.onload=async function(e){
    let datos;
    try{ datos=JSON.parse(e.target.result); }
    catch(err){ toast('El archivo no es un JSON válido','#dc2626'); return; }
    if(!Array.isArray(datos)||!datos.length){ toast('El archivo no contiene escandallos','#dc2626'); return; }

    const existentes=new Set(Object.values(_escAllData||{}).map(x=>(x.nombre||'').toLowerCase().trim()));
    const nuevos=datos.filter(d=>!existentes.has((d.nombre||'').toLowerCase().trim()));
    const duplicados=datos.length-nuevos.length;

    if(!nuevos.length){
      toast(`Todos los escandallos ya existen (${duplicados} duplicados omitidos)`,'#d97706');
      input.value=''; return;
    }

    const msg=duplicados>0
      ?`Se van a importar ${nuevos.length} escandallos (${duplicados} ya existían y se omiten). ¿Continuar?`
      :`Se van a importar ${nuevos.length} escandallos. ¿Continuar?`;
    if(!confirm(msg)){input.value='';return;}

    let ok=0,errors=0;
    toast(`Importando ${nuevos.length} escandallos...`,'#2563eb');
    for(const esc of nuevos){
      try{
        esc.updatedAt=Date.now();
        if(!esc.createdAt) esc.createdAt=Date.now();
        await fbDb.ref('escandallos').push().set(esc);
        ok++;
      }catch(err){ errors++; console.error('Error importando',esc.nombre,err); }
    }
    input.value='';
    if(errors) toast(`Importados ${ok} escandallos (${errors} errores)`,'#d97706');
    else toast(`${ok} escandallos importados correctamente`,'#16a34a');
  };
  reader.readAsText(file);
}

function escExportTodos(){
  if(typeof XLSX==='undefined'){toast('Librería Excel no disponible','#dc2626');return;}
  const localFiltro=document.getElementById('esc-local-filter')?.value||'';
  let todos=Object.values(_escAllData||{});
  if(!todos.length){toast('No hay escandallos guardados','#dc2626');return;}
  if(localFiltro) todos=todos.filter(e=>(e.restaurante||'global')===localFiltro);
  if(!todos.length){toast('No hay escandallos para este local','#f59e0b');return;}

  // Ordenar por nombre
  todos.sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));

  // Calcular coste con merma para cada escandallo
  function calcCoste(esc){
    return (esc.ingredientes||[]).reduce((s,ing)=>{
      // Precio vivo o guardado
      let p=parseFloat(ing.precioUnitario)||0;
      if(ing.proveedorId&&suppliers[ing.proveedorId]){
        const prod=(suppliers[ing.proveedorId].products||[]).find(x=>x.id===ing.productoId);
        if(prod) p=parseFloat(prod.price)||0;
      }
      const merma=parseFloat(ing.merma)||0;
      const factor=merma>0&&merma<100?1/(1-merma/100):1;
      return s+(parseFloat(ing.cantidad)||0)*p*factor;
    },0);
  }

  const ws_data=[
    ['PLATO','PRECIO COSTE + IVA','PRECIO VENTA OBJETIVO','%','PRECIO DE VENTA REAL','% REAL']
  ];
  todos.forEach((esc,i)=>{
    const row=i+2; // fila Excel (1 = cabecera)
    ws_data.push([
      esc.nombre||'',
      +calcCoste(esc).toFixed(4),
      {f:`B${row}*4`},       // precio objetivo (food cost 25%)
      {f:`B${row}/C${row}`}, // % food cost objetivo
      esc.precioVenta||0,
      {f:`IF(E${row}>0,B${row}/E${row},"")`} // % real
    ]);
  });

  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(ws_data);

  // Formato numérico para columnas %
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let r=1;r<=range.e.r;r++){
    const dCell=ws[XLSX.utils.encode_cell({r,c:3})]; // D
    const fCell=ws[XLSX.utils.encode_cell({r,c:5})]; // F
    if(dCell) dCell.z='0.00%';
    if(fCell) fCell.z='0.00%';
  }

  // Anchos de columna (en caracteres)
  ws['!cols']=[{wch:40},{wch:22},{wch:26},{wch:8},{wch:24},{wch:10}];

  XLSX.utils.book_append_sheet(wb,ws,'Escandallos');
  const fecha=new Date().toISOString().split('T')[0];
  const sufijo=localFiltro?'_'+localFiltro.replace(/[^a-zA-Z0-9]/g,'_'):'_todos';
  XLSX.writeFile(wb,`Escandallos${sufijo}_${fecha}.xlsx`);
  toast(`${todos.length} escandallos exportados`,'#16a34a');
}

/* ── Copiar escandallo para un local específico ── */
function escCopiarParaLocal(id){
  if(!_escAllData[id]){toast('Escandallo no encontrado','#dc2626');return;}
  const e=_escAllData[id];
  // Mostrar selector de local
  const rests=cfg.users.map(u=>u.restaurant);
  const sel=prompt('¿Para qué local?\n'+rests.map((r,i)=>`${i+1}. ${r}`).join('\n')+'\n\nEscribe el número:');
  if(!sel) return;
  const idx=parseInt(sel)-1;
  if(isNaN(idx)||idx<0||idx>=rests.length){toast('Local no válido','#dc2626');return;}
  const rest=rests[idx];
  if(!confirm(`¿Crear una copia de "${e.nombre}" para ${rest}?\nPodrás editarla de forma independiente.`)) return;
  const copia={...JSON.parse(JSON.stringify(e)),restaurante:rest,baseId:id,nombre:e.nombre+' ('+rest+')',createdAt:Date.now(),updatedAt:Date.now()};
  delete copia.id;
  fbDb.ref('escandallos').push(copia).then(()=>toast(`Copia creada para ${rest}`,'#16a34a')).catch(err=>toast('Error: '+err.message,'#dc2626'));
}

function menRender(){
  const grid=document.getElementById('men-grid');
  if(!grid) return;
  const txt=(document.getElementById('men-search')?.value||'').toLowerCase();
  const local=document.getElementById('men-local-filter')?.value||'';
  const entries=Object.entries(_menAllData).filter(([,m])=>{
    return (!txt||m.nombre?.toLowerCase().includes(txt))&&(!local||m.restaurante===local||(m.restaurante||'global')==='global');
  }).sort((a,b)=>(a[1].nombre||'').localeCompare(b[1].nombre||'','es'));
  if(!entries.length){
    grid.innerHTML='<p style="color:var(--mut)">No hay menús. Crea el primero con "+ Nuevo menú".</p>';
    return;
  }
  const CURSOS=[
    {key:'pri',label:'Primeros',cats:['Primeros'],cls:'c-pri'},
    {key:'seg',label:'Segundos',cats:['Segundos','Carnes','Pescados'],cls:'c-seg'},
    {key:'pos',label:'Postres',cats:['Postres'],cls:'c-pos'},
    {key:'otr',label:'Otros',cats:['Entrantes','Bebidas','Otros'],cls:'c-otr'},
  ];
  grid.innerHTML=entries.map(([id,m])=>{
    const escs=(m.escandallos||[]).map(eid=>({id:eid,...(_escAllData[eid]||{})})).filter(e=>e.nombre);
    const costeTotal=escs.reduce((s,e)=>s+escCosteTotal(e),0);

    const margen=pvp>0?(pvp-costeTotal):null;
    const margenPct=pvp>0&&margen!==null?(margen/pvp*100):null;
    const rest=m.restaurante||'global';
    const restBadge=rest==='global'
      ?`<span style="font-size:10px;background:#dbeafe;color:#1d4ed8;border-radius:10px;padding:1px 7px;font-weight:600">Global</span>`

    const fcCls=fcReal===null?'esc-ok':fcReal>35?'esc-bad':fcReal>30?'esc-warn':'esc-ok';
    // Cursos con platos
    const cursoCols=CURSOS.map(curso=>{
      const platos=escs.filter(e=>{
        const cat=e.categoria||'Otros';
        return curso.cats.includes(cat);
      });

        ?platos.map(e=>`<div class="men-dish"><span class="men-dish-name">${e.nombre}</span><span class="men-dish-cost">${escFmt(escCosteTotal(e))}</span></div>`).join('')

      return `<div class="men-course ${curso.cls}"><div class="men-course-title">${curso.label}</div>${dishRows}</div>`;
    }).join('');
    return `<div class="men-card" onclick="menOpenModal('${id}')">
      <div class="men-card-hd">
        <div>
          <div class="men-card-name">${m.nombre||'Sin nombre'}</div>

        </div>
        <div class="esc-fc-ind ${fcCls}" style="position:relative;top:0;right:0;flex-shrink:0">${fcReal!==null?fcReal.toFixed(0)+'%':'—'}</div>
      </div>
      <div class="men-courses">${cursoCols}</div>
      <div class="men-stats">
        <div class="men-stat"><div class="k">Coste</div><div class="v">${escFmt(costeTotal)}</div></div>
        <div class="men-stat"><div class="k">PVP</div><div class="v">${pvp>0?escFmt(pvp):'—'}</div></div>
        <div class="men-stat"><div class="k">Margen</div><div class="v">${margen!==null?escFmt(margen):'—'}</div></div>
        <div class="men-stat"><div class="k">% Margen</div><div class="v">${margenPct!==null?margenPct.toFixed(1)+'%':'—'}</div></div>

    </div>`;
  }).join('');

          const sel=_menEscIds.includes(id);
          const coste=escCosteTotal(e);

function menToggleEsc(id){

function menUpdateCoste(){
  const total=_menEscIds.reduce((s,id)=>{

function clasificarProductoAuto(name){
  if(!name) return 'Otros';
  const n=' '+name.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')  // quitar acentos para comparación
    +' ';
  // Prioridad: Bebidas > Lácteos > Carnes > Pescados > Panadería > Verduras > Pasta > Conservas > Condimentos > Limpieza
  const order=['Bebidas','Lácteos','Carnes','Pescados','Panadería','Verduras y Frutas','Pasta y Arroces','Conservas','Condimentos','Limpieza'];
  for(const cat of order){
    const keywords=PROD_CAT_KEYWORDS[cat]||[];
    for(const kw of keywords){
      // Normalizar keyword también
      const kwn=kw.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
      if(n.includes(kwn)) return cat;
    }
  }
  return 'Otros';
}

function autoClasificarProductos(){
  if(!fbDb){toast('Sin conexión Firebase','#dc2626');return;}
  let total=0, clasificados=0, sinCat=[];
  const updates={};
  Object.entries(suppliers).forEach(([sid,sup])=>{
    (sup.products||[]).forEach(p=>{
      total++;
      const cat=clasificarProductoAuto(p.name);
      if(cat!=='Otros' || !p.category){
        // Solo actualizar si mejora la clasificación o no tenía categoría
        if(!p.category || p.category==='Otros'||p.category==='📦 Otros'){
          if(cat!=='Otros'){
            updates[`suppliers/${sid}/products/${sup.products.indexOf(p)}/category`]=cat;
            clasificados++;
          }
        }
      }
      if(cat==='Otros') sinCat.push(p.name);
    });
  });

  if(!clasificados){
    toast(`Todos los productos ya tienen categoría (${total} revisados)`,'#16a34a');
    return;
  }

  // Actualizar en memoria y en Firebase
  Object.entries(suppliers).forEach(([sid,sup])=>{
    (sup.products||[]).forEach((p,idx)=>{
      const cat=clasificarProductoAuto(p.name);
      if(cat!=='Otros' && (!p.category || p.category==='Otros' || p.category==='📦 Otros')){
        p.category=cat;
      }
    });
  });
  saveSups();
  toast(`${clasificados} de ${total} productos clasificados automáticamente`,'#16a34a',5000);
  if(sinCat.length) console.info('Sin clasificar automáticamente (revisar a mano):', sinCat.slice(0,20));
  renderAdminContent();
}
